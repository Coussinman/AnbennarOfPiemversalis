 HUSSARS_DESC:1 "La Cavalerie Mythique représente des unités de guerriers montés sur des destriers magiques ou monstrueux, tels que des wyvernes ou des griffons. Capables de prouesses bien au-delà de celles d'une cavalerie ordinaire mais nécessitant souvent un entretien considérablement plus important, ils sont peu nombreux mais légendaires pour leur impact sur le champ de bataille.\n\nLe nombre de régiments de §YCavalerie Mythique§! est calculé en fonction du développement des provinces de cultures acceptées, à raison d'une unité pour 100 de développement."
