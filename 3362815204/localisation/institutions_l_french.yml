 desc_feudalism:0 "Au fil du temps, la plupart des sociétés développent le besoin d'une structure commune avec des institutions gouvernementales plus fortes et plus permanentes. Après la chute de la République Damérienne et de Castanor, ce besoin fut comblé par un ensemble d'institutions et de coutumes qui, prises ensemble, sont souvent considérées comme faisant partie du système féodal cannorien. Pour des raisons similaires, des systèmes gouvernementaux et sociétaux permanents se sont formés partout dans le monde, dont certains ont des racines bien plus anciennes que la Féodalité elle-même.\nContrairement aux autres Institutions, la « Féodalité » couvre une large gamme de systèmes différents et existe dès le départ dans toutes les parties du monde où une forte tradition d'Urbanisme, de Gouvernement Institutionnalisé et de Stratification Sociale a atteint un point critique. L'institution peut se répandre par contact avec l'une de ces cultures, ou dans certains cas commencer à croître d'elle-même dans une société qui remplit certains critères."
 desc_renaissance:0 "Depuis le XIVe siècle, les puissants et les fortunés de l'Empire d'Anbennar patronnent artistes et érudits désireux d'explorer les anciennes sociétés damériennes et castanoriennes de leurs ancêtres. En tant que mouvement culturel, la Renaissance englobe déjà la majeure partie de la région et a eu un impact profond sur la littérature, l'art, la philosophie et la musique. Des érudits éclairés analysent également la société dans laquelle ils vivent, la comparant aux idéaux des philosophes classiques. L'Humanisme de la Renaissance est devenu un mouvement plus mature, prêt à imprégner tous les aspects de la société. Un nouvel idéal pour les gouvernants comme pour les gouvernés se répand aussi vite que les premiers Imprimeurs peuvent distribuer des copies de ces nouvelles idées. Un véritable érudit de la Renaissance est expert en tout, de la politique et de la philosophie à l'art, l'analyse textuelle, la musique et l'architecture. La Renaissance est maintenant prête à remodeler le monde pour mieux correspondre à ses idéaux classiques."
 desc_new_world_i:0 "La découverte de l'Aelantir a annoncé une nouvelle ère non seulement pour les colonisateurs et les colonisés, mais a également conduit à la diffusion de matériaux et de techniques ainsi qu'à une prise de conscience de l'immensité du globe. Alors qu'animaux, types de cultures, argent et maladies se répandent à travers la Lamentation, les premiers pas ont été faits vers une économie véritablement mondiale. Avec les terres et les peuples étrangers cartographiés et documentés, les idées ainsi que les débats religieux et philosophiques sont de plus en plus colorés par ce que nous avons trouvé dans les sociétés d'outre-mer. Les grands esprits ressentent le besoin de questionner ce qui était autrefois la vérité, et de Lorentaine à Dhenijanraj, la nature du monde est désormais sujette à débat."
 desc_printing_press:1 "La capacité de produire en masse l'écrit allait révolutionner la diffusion de l'information et, à bien des égards, la société du début de l'ère moderne dans son ensemble. Initiée par des hommes de la Renaissance tels que l'imprimeur portnammerien Golkin Tournecosse, ce nouvel art contribua à alimenter la Renaissance en rendant les classiques traduits plus largement accessibles.\n\nMaintenant que l'Imprimerie s'est perfectionnée en tant que technique et s'est répandue à travers Cannor, des centaines de milliers d'exemplaires de tout, des pamphlets religieux et politiques aux traités scientifiques et aux instructions de savoir-vivre, circulent sur le continent. Avec les ateliers d'imprimerie devenant de plus en plus courants, les souverains ont du mal à contenir cette nouvelle technique car les moyens de production relativement simples permettent de contourner la censure en déplaçant l'activité de l'autre côté d'une frontière ou même simplement en changeant le nom sur une page de titre."
 desc_global_trade:0 "Les marchandises sont transportées à travers les continents depuis l'Antiquité. Mais là où cela était auparavant limité à un nombre défini de routes et de marchandises, comme les produits manufacturés du Rahen et du Yanshen trouvant leur chemin à travers le Golfe du Rahen et le long de la Route Dorée, tout le commerce fait désormais de plus en plus partie d'un réseau mondial plus vaste. Avec la découverte de l'Aelantir, les routes maritimes autour de Sarhal et la traversée de l'Océan des Perdus, les réseaux commerciaux locaux se connectent en une toile mondiale interconnectée.\n\nL'argent extrait en Amadie est maintenant emballé et transporté via Cannor jusqu'au Yanshen et au Rahen. Le fer extrait et forgé dans le Dwarovar est vendu en Sarhal occidental par des marchands éborthíli, et d'autres font fortune simplement en distribuant tissus et épices au sein de la sphère commerciale halessi. Des marchands locaux du Rahen investissent dans de futures entreprises commerciales cannoriennes. Il est peut-être encore trop tôt pour parler d'une Économie véritablement Mondiale, mais les premières graines ont assurément été semées."
 desc_manufactories:0 "Tandis qu'un certain nombre d'innovations techniques au cours des XVIe et XVIIe siècles ont augmenté la production de certains produits comme le fer ou le tissu dans une certaine mesure, la plus grande amélioration dans le domaine de la production est venue sous la forme de nouvelles formes d'organisation. En créant des manufactures, souvent hors des limites de la ville, les capitalistes marchands peuvent à la fois contourner les anciennes lois des guildes qui inhibent la production de masse et innover des moyens d'augmenter la production par l'organisation et la spécialisation du travail en un seul lieu. Les précurseurs de l'Industrialisation ultérieure sont capables d'augmenter la production en facilitant l'accès aux matières premières et l'organisation de masse du travail plutôt que par de coûteuses nouvelles machines. C'est en soi un changement énorme par rapport aux méthodes souvent fortement réglementées d'autrefois, et combiné aux avancées techniques ultérieures, ce nouveau mode de production viendra révolutionner la société."
 desc_enlightenment:0 "Le siècle dernier a vu le Rationalisme et l'Empirisme gagner une popularité toujours croissante parmi les grands esprits de l'époque. Dans les lettres, les publications et les cafés, rois, scientifiques, philosophes et littérateurs discutent des mérites de la tolérance, de la méthode scientifique et de la diffusion des idéaux des Lumières à toute l'humanité. Depuis les universités ou les cours de monarques éclairés, des expéditions sont envoyées pour mesurer, cataloguer, peser et cartographier le monde afin que nous puissions mieux comprendre les lois qui gouvernent les choses autour de nous. D'autres discutent des lois qui gouvernent la société et tentent de parvenir à une compréhension des Droits de l'Homme.\n\nDe grands projets tels que l'entreprise colossale de créer une encyclopédie complète de tout le savoir ou un index complet de toutes les plantes, animaux et champignons du monde sont poursuivis pour le plus grand bien de l'humanité. La Lumière de la Raison a été allumée et beaucoup ne se reposeront pas jusqu'à ce qu'elle ait été apportée à tous les coins de la terre."
