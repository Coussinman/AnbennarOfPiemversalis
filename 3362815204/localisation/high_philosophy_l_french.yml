l_french:
 high_philosophy_events.0.t:0 "Les Écoles de Haute Philosophie"
 high_philosophy_events.0.d:0 "Nous avons récemment découvert la sagesse des philosophes du Rahen. Leur compréhension de la meilleure façon de mener nos vies et notre société, afin que nous puissions nous élever jusqu'aux hauteurs des Hauts Dieux, revêt manifestement une importance capitale. Cependant, maintenant que nous avons rejoint leurs rangs de philosophes, il apparaît clairement que, parmi leurs modes de pensée, ils sont également fort divisés quant à la signification de certains reliefs et frises essentiels découverts dans les Hauts Temples. Plusieurs écoles de pensée différentes sont apparues à notre cour. Vers laquelle devons-nous nous tourner pour recevoir leur sagesse ?"
 high_philosophy_events.0.a:0 "L'École de l'Œil Étoilé"
 high_philosophy_events.0.b:0 "L'École du Soleil Radieux"
 high_philosophy_events.0.c:0 "L'École de l'Écharpe Orangée"
 high_philosophy_events.0.dd:0 "L'École du Palais Doré"
 high_philosophy_events.0.e:0 "L'École de la Griffe Indomptée"
 high_philosophy_events.0.f:0 "L'École du Turban de Soie"
 high_philosophy_events.0.g:0 "L'École de l'Âme Ascendante"
 high_philosophy_events.1.t:0 "Respect mutuel entre [Root.GetReligiousSchool] et [school_opinion_increase_country.GetReligiousSchool]"
 high_philosophy_events.1.d:0 "Il n'y a jamais eu de différences théologiques suffisantes pour justifier un véritable conflit entre les écoles [Root.GetReligiousSchool] et [school_opinion_increase_country.GetReligiousSchool], et les deux coutumes coexistent souvent côte à côte.\nLa coopération de longue date entre [Root.GetReligiousSchool] [Root.GetAdjective] et [school_opinion_increase_country.GetReligiousSchool] [school_opinion_increase_country.GetAdjective] a toutefois conduit à une nouvelle ère de compréhension et de respect mutuels."
 high_philosophy_events.1.a:0 "Ils sont sages."
 high_philosophy_events.2.t:0 "[Root.GetReligiousSchool] et [school_opinion_increase_country.GetReligiousSchool] normalisent leurs relations"
 high_philosophy_events.2.d:0 "Pendant quelque temps, les relations entre [Root.GetReligiousSchool] et [school_opinion_increase_country.GetReligiousSchool] ont été fortement marquées par la méfiance et le conflit. Certains érudits sont même allés jusqu'à dénoncer les théologiens de l'autre école ainsi que leurs adeptes.\nCependant, les tensions se sont considérablement apaisées ces dernières années, les érudits [Root.GetAdjective] de [Root.GetReligiousSchool] et [school_opinion_increase_country.GetAdjective] de [school_opinion_increase_country.GetReligiousSchool] montrant la voie vers la tolérance et la coexistence."
 high_philosophy_events.2.a:0 "Leur théorie possède quelque mérite."
 high_philosophy_events.3.t:0 "Les philosophes et la guerre [Root.GetAdjective] - [school_opinion_decrease_country.GetAdjective]"
 high_philosophy_events.3.d:0 "Le conflit prolongé entre [school_opinion_decrease_country.GetAdjective] et [Root.GetAdjective] commence à déborder dans le domaine philosophique. Le respect mutuel et la tolérance sont au plus bas, et la pensée [school_opinion_decrease_country.GetReligiousSchool] est marginalisée dans la société [Root.GetAdjective]."
 high_philosophy_events.3.a:0 "Scandaleux."
 high_philosophy_events.4.t:0 "L'Ascension de Soi"
 high_philosophy_events.4.d:0 "Après une longue journée de voyage, la caravane [Root.Monarch.GetTitle] atteignit enfin le Haut Temple. Jadis, [Root.Monarch.GetTitle] aurait laissé passer des années entre ses visites, mais depuis l'arrivée de l'érudit de l'école de l'Âme Ascendante à [Root.Monarch.GetHerHis] cour, ce périple était devenu régulier. [Root.Monarch.GetTitle] [Root.Monarch.GetName] descendit et pénétra dans le complexe du temple. Sa tour centrale s'élevait haut dans le ciel, entourée de solides murailles qui abritaient diverses structures plus modestes.\n\nL'érudit interrompit l'émerveillement [Root.Monarch.GetTitle] et lui souhaita la bienvenue. Il conduisit [Root.Monarch.GetName] à l'entrée de ce qui semblait être une petite cave de pierre. À l'intérieur, [Root.Monarch.GetName] découvrit une grande fosse construite comme un ancien puits à degrés. L'érudit alluma une lanterne et commença à descendre les marches tout en faisant signe à [Root.Monarch.GetName] de le suivre. Tandis qu'ils progressaient, l'érudit prit la parole.\n\n« Nous avons déjà longuement parlé de la nécessité d'améliorer tous les aspects de soi-même : le physique, le mental, le magique, et bien sûr le spirituel… mais je crains que vous n'ayez pas pleinement pris à cœur la nécessité de maîtriser le pouvoir et d'avoir la sagesse de l'utiliser à bon escient. Certes, vous commandez peut-être $COUNTRY$, mais vous ne vous contrôlez pas encore vous-même. Pour véritablement atteindre le Purtara, vous devez posséder le pouvoir de façonner le monde et la sagesse des Hauts Dieux. »\n\nL'érudit atteignit enfin le fond et déplaça la lanterne pour illuminer le mur sud. Une sculpture occupait l'intégralité du mur, représentant une scène de construction monumentale. Des montagnes furent aplanies, et le temple lui-même fut bâti à partir des vestiges de l'ancienne. Tout cela accompli par la Haute Déesse Pathim avec apparemment peu d'efforts, sous les acclamations grandioses de ceux qui se trouvaient en contrebas. L'érudit reprit la parole.\n\n« Asseyons-nous maintenant en ce lieu saint ancien, et méditons sur cette sagesse dont je vous parle. »"
 high_philosophy_events.4.a:0 "« Avec pouvoir et sagesse, j'atteindrai le Purtara. »"
 high_philosophy_events.5.t:0 "L'Ordre Doré"
 high_philosophy_events.5.d:0 "Des rayons de lumière orangée filtraient par les fenêtres orientales. Ils dansaient avec précision au rythme des rideaux, qui eux-mêmes ondulaient au gré de la brise. [Root.Monarch.GetName] dormait encore tandis que la lumière commençait à ramper vers son lit. Comme sur un signal, au moment même où la lumière atteignit le visage de [Root.Monarch.GetName], un coup retentit à la porte, et l'érudit l'entrouvrit tout en détournant le regard de la pièce.\n\nIl s'excusa : « Ah, je ne réalisais pas que vous dormiez encore. Cependant, c'est le moment mathématiquement parfait pour une autre de mes leçons. »\n\n[Root.Monarch.GetName] grogna, mais se ressaisit et revêtit une robe avant d'inviter l'érudit à entrer. Il pénétra dans la pièce et fit un geste vers les rideaux de soie à l'extrémité orientale qui séparaient la chambre de l'espace extérieur. Écartant les rideaux, tous deux sortirent sur le balcon circulaire et contemplèrent $CAPITAL_CITY$.\n\nL'érudit commença sa leçon : « En contrebas se trouve le peuple de votre cité. Ils se meuvent conformément à leur place, n'est-ce pas ? Le boulanger apporte ses marchandises aux marchés juste à leur ouverture. Les feux de la forge sont allumés par le forgeron dès que le soleil effleure son front. Même les marchands vont et viennent avec la mécanique du monde. Tous à leur place. Tous à leur plein potentiel. La cité elle-même reflète la géométrie précise des Hauts Temples à travers le tracé de ses rues et les angles de ses structures. »\n\nL'érudit fit une pause. « C'est cela que les temples célèbrent par-dessus tout : l'Ordre. Le perpétuer est la forme la plus pure de Kartya. » Il y eut une pause plus longue tandis que tous deux observaient la cité en mouvement. Enfin, l'érudit demanda : « Quelle est, selon vous, votre place dans le mécanisme du monde ? »"
 high_philosophy_events.5.a:0 "« Préserver et répandre l'ordre, et trouver un sens à ma place en son sein. »"
 golden_palace_scholar_meeting:0 "Le Sens par l'Ordre"
 high_philosophy_events.6.t:0 "L'Écharpe Familiale"
 high_philosophy_events.6.d:0 "C'était jour de pétitions à la cour de $COUNTRY$. Des gens de toutes conditions étaient autorisés à se présenter et à s'adresser au [Root.Monarch.GetTitle]. Cela signifiait souvent que [Root.Monarch.GetName] devait endurer de mesquines querelles concernant des bornes de terrain ou la propriété d'une chèvre particulière. Aujourd'hui ne différait guère. Le suivant dans la file était un homme de basse caste, les mains couvertes de callosités, ses vêtements tenant à peine ensemble. Il s'agenouilla devant [Root.Monarch.GetTitle] [Root.Monarch.GetName] et commença à parler d'une voix tremblante :\n\n« [Root.Monarch.GetTitle] [Root.Monarch.GetName], je ne demande guère à mes supérieurs, mais aujourd'hui je dois implorer les vôtres. Mon fils aîné est malade, mais je ne peux pas me permettre d'acheter ses remèdes. Je ne suis qu'un simple fermier, et mon épouse a depuis longtemps quitté ce monde. Je vous en prie, pouvez-vous trouver en votre cœur le moyen de m'aider ? »\n\n[Root.Monarch.GetName] songea à renvoyer l'homme d'un geste, mais se ravisa. Peut-être l'érudit de l'école de l'Écharpe Orangée avait-il vraiment une influence sur [Root.Monarch.GetHerHim]. [Root.Monarch.GetSheHeCap] se souvint que l'érudit parlait presque quotidiennement de l'importance de l'harmonie familiale, de la nécessité de refléter les Hauts Dieux et de respecter sa place dans la structure familiale. Les aînés doivent pourvoir aux besoins de leur descendance, qui à son tour doit obéissance à ses parents et grands-parents. Ce n'est qu'une fois qu'une famille a atteint l'harmonie interne qu'elle peut commencer à se connecter avec d'autres familles en harmonie externe, et atteindre le Purtara.\n\nUne tape sur l'épaule tira [Root.Monarch.GetTitle] [Root.Monarch.GetName] de [Root.Monarch.GetHerHis] rêverie. Un conseiller se pencha et murmura : « Souhaitez-vous que je me débarrasse de lui ? »"
 high_philosophy_events.6.a:0 "« Non. Cet homme se prosterne par amour pour sa famille. Donnez-lui ce dont il a besoin ! »"
 orange_sash_scholar_meeting:0 "La Famille avant tout"
 high_philosophy_events.7.t:0 "Doux comme la Soie"
 high_philosophy_events.7.d:0 "Une lettre fut déposée sur la table à côté de [Root.Monarch.GetTitle] [Root.Monarch.GetName] tandis que [Root.Monarch.GetSheHe] prenait un déjeuner solitaire. [Root.Monarch.GetHerHisCap] yeux parcoururent les lettres dorées sur la page et sautèrent d'une marginalia exquise à l'autre. [Root.Monarch.GetSheHeCap] termina sa lecture et, perplexe, demanda une escorte pour se rendre aux bains publics.\n\nTandis que [Root.Monarch.GetName] marchait, [Root.Monarch.GetSheHe] se remémorait les événements des derniers mois. [Root.Monarch.GetSheHeCap] avait invité un érudit de l'école du Turban de Soie à $COUNTRY$ et lui avait donné libre cours de parcourir les rues. En quelques semaines, cette décision sembla atteindre ses fins de manière exquise. Les marchés regorgeaient de marchandises jusqu'alors inconnues, apportées par des marchands venus de contrées lointaines (qui, bien entendu, étaient tenus de payer une taxe sur les importations). Ces nouveaux revenus résolurent rapidement les problèmes de [Root.Monarch.GetTitle] [Root.Monarch.GetName], et bientôt [Root.Monarch.GetSheHe] tourna son attention vers d'autres questions. [Root.Monarch.GetSheHeCap] pensait que l'affaire était close, mais en tournant au coin des bains, [Root.Monarch.GetSheHe] réalisa que cet érudit avait bien plus en tête que le simple désir de richesse.\n\nLes bains étaient ordinairement un lieu paisible, mais aujourd'hui une nuée d'ouvriers envahissait les lieux. Des maçons travaillaient à retirer des sections de vieux murs de brique crue pour les remplacer par du granit fraîchement taillé. Des artisans s'affairaient à restaurer des fresques et des mosaïques de carreaux, tandis que des drapiers apportaient de soyeux rideaux pour les suspendre aux fenêtres. Un orfèvre incrustait des pierres précieuses et des métaux fins dans le sol, tandis qu'un autre homme installait des candélabres dorés suspendus dans de nouvelles fixations au plafond. L'érudit émergea de l'agitation avec un marchand à ses côtés et s'approcha rapidement du [Root.Monarch.GetTitle]. L'érudit prit la parole :\n\n« Je vois que vous avez reçu la missive de mon compagnon. Excellent ! Bientôt les bains de $CAPITAL_CITY$ seront la plus magnifique émulation de l'esthétique du temple doré ! Cet homme a embrassé mes enseignements de tout cœur et a lui-même fait don d'une partie considérable des fonds pour ce projet ! Il semblerait que vos sujets commencent enfin à comprendre l'importance d'utiliser leur richesse pour enrichir et élever leur communauté. »\n\nL'érudit sourit : « Le Purtara est peut-être enfin à leur portée. »\n\nDans la jubilation, le marchand et l'érudit prirent congé. [Root.Monarch.GetTitle] [Root.Monarch.GetName] resta stupéfait. Les enseignements de l'érudit semblaient véritablement prendre racine. Qu'est-ce que cela signifierait ? Cela pourrait bien… Un page accourut aux côtés de [Root.Monarch.GetTitle] et produisit une lettre portant un sceau doré. [Root.Monarch.GetName] commença à lire."
 high_philosophy_events.7.a:0 "« ...et maintenant une école. Peut-être cette richesse nous rapprochera-t-elle vraiment tous du Purtara. »"
 silk_turban_scholar_meeting:0 "Par la Monnaie vient la Prospérité"
 high_philosophy_events.8.t:0 "Foi Radieuse"
 high_philosophy_events.8.d:0 "C'était un après-midi pluvieux dans $CAPITAL_CITY$ lorsque [Root.Monarch.GetTitle] [Root.Monarch.GetName] entra dans le temple pour rejoindre la session. [Root.Monarch.GetSheHeCap] fit face à la fenêtre occidentale, aligné avec les autres, et déroula [Root.Monarch.GetHerHis] tapis. Pendant quelques instants, le silence enveloppa [Root.Monarch.GetName]. Puis l'érudit du Soleil Radieux commença à guider le temple dans la pénitence rituelle.\n\n« Malheureusement, le soleil ne nous gratifie pas de sa présence cet après-midi. Pourtant, ne nous perdons pas dans les ténèbres, mais rendons plutôt hommage à Digatha afin qu'elle nous guide hors de la tempête. Car tandis que la pluie tombe autour de nous et que le tonnerre gronde au loin, chacun de nous est perdu dans sa propre tempête, une tempête de sa propre création. »\n\nL'érudit poursuivit tandis que le tonnerre se rapprochait de la cité.\n\n« Nous nous sommes tous égarés de notre Nitikamarja. La nature de la vie quotidienne le garantit. Pourtant, nous pouvons, comme toujours, y revenir une fois encore. Comme les Hauts Dieux adoraient jadis, ainsi adorerons-nous. Leurs cérémonies sont nos cérémonies, et par notre foi et notre ferveur, nous serons mis sur le véritable chemin du Purtara. Que la guidance des Hauts Dieux vous touche tous. »\n\nUn éclair s'abattit au loin tandis qu'il s'exclamait : « La proclamation achevée, il est temps de faire comme les Hauts Dieux firent jadis. Présentez votre offrande à la flamme, et purifiez-vous par sa destruction. »\n\nUn par un, les gens s'avancèrent vers l'autel et apportèrent des objets à dévorer par le brasier ardent. Une femme âgée présenta un fragment de poterie, et son mari apporta un marteau. Chaque personne ici présentait quelque chose dont elle souhaitait être absoute, une déviation erronée de son Nitikamarja qu'elle désirait corriger. [Root.Monarch.GetTitle] [Root.Monarch.GetName] fut le dernier à faire une offrande et présenta une pointe de lance, prise à un soldat tombé au combat contre [Root.Monarch.GetHerHis] armée. Au moment où [Root.Monarch.GetSheHe] la plaça dans la flamme, un formidable éclair s'abattit à quelques mètres de l'enceinte du temple. L'érudit sourit comme un enfant et parla une fois encore :\n\n« Les Hauts Dieux semblent fort satisfaits de votre offrande. »"
 high_philosophy_events.8.a:0 "« Par cela, puissé-je être pardonné d'avoir dévié du Nitikamarja. Louange aux Hauts Dieux ! »"
 radiant_sun_scholar_meeting:0 "Signe des Hauts Dieux"
 high_philosophy_events.9.t:0 "Les Yeux Ouverts"
 high_philosophy_events.9.d:0 "Quand le soleil se coucha, [Root.Monarch.GetTitle] [Root.Monarch.GetName] gravit enfin la colline pour rejoindre les autres autour des bougies allumées. Tous les échelons de la cour étaient présents, des serviteurs aux administrateurs, et certains membres de la propre famille de [Root.Monarch.GetTitle]. Une fois que [Root.Monarch.GetName] fut assis dans le cercle, l'érudit Aahan sortit plusieurs bandeaux de soie de sa cape et commença à les distribuer. L'érudit entra alors au centre de l'anneau et prit la parole :\n\n« Nous avons beaucoup progressé dans nos leçons. Nous avons observé les corps célestes, et j'ai partagé la connaissance de leurs vérités cachées. Nous avons participé à des thés aux herbes et débattu de nos vérités collectives à la lueur des lampes. Pourtant, ce ne sont que deux des trois chemins que vous devez parcourir... Je vais maintenant allumer l'encens. Je vous demande de le contempler, de vous perdre dans sa forme tourbillonnante, et quand vous serez prêts, de mettre votre bandeau. » Puis il y eut une pause. « Commençons. »\n\nDepuis l'arrivée de l'érudit de l'Œil Étoilé, des événements agnostiques de caste comme celui-ci avaient fleuri dans tout [Root.Country.GetName]. Des cités qui comptaient auparavant peu de dévots devinrent des foyers d'activité du jour au lendemain tandis que l'érudit enseignait à de nouveaux disciples les signes cachés au sein des corps célestes et soulignait le chemin triple vers l'illumination. Il encourageait le débat, la discussion et la méditation, afin que tous puissent trouver la connaissance intérieure, collective et extérieure qui forme le cœur du chemin triple.\n\nAlors que les dernières bougies commençaient à vaciller, les cônes d'encens s'éteignirent enfin. Un par un, les gens retirèrent leurs bandeaux, ayant achevé leur méditation, et attendirent que tous contemplent les mèches tamisées. Quand [Root.Monarch.GetName] ouvrit [Root.Monarch.GetHerHis] yeux, l'érudit circula autour de l'anneau et demanda à chacun de partager ce qu'il avait appris au cours de la semaine passée. Un page parla avec affection de la première leçon et d'une compréhension nouvellement acquise des étoiles et de leurs significations. Une diplomate décrivit avec enthousiasme son expérience de participation au débat et à la croissance collective durant la deuxième leçon. Puis un forgeron évoqua la nouvelle réalisation de soi qu'il avait découverte dans cette troisième leçon. D'autres parlèrent de diverses vérités, jusqu'à ce qu'enfin, l'érudit se tourne vers [Root.Monarch.GetName] et demande :\n\n« Qu'avez-vous appris ? »"
 high_philosophy_events.9.a:0 "« Les étoiles détiennent les secrets de notre destinée, mais cet avenir est un avenir auquel tous doivent participer. »"
 starry_eye_scholar_meeting:0 "Les Secrets des Étoiles"
 high_philosophy_events.10.t:0 "Des Idées Inébranlables"
 high_philosophy_events.10.d:0 "« Le véritable chemin vers le Purtara est d'imiter le penchant des Hauts Dieux pour la force et la domination. C'est par ces facettes que les Hauts Dieux firent la guerre, leur plus grand accomplissement, et assurèrent la paix, la prospérité et la monumentalité, leur second plus grand accomplissement. L'on doit s'efforcer d'être strict mais généreux avec ses clients, de protéger farouchement ses protégés, et de subsumer ses ennemis. Telle est la Kartya la plus véridiquement exprimée par les Hauts Dieux et leurs temples. » - Sarika Mrudaya de l'école de la Griffe Indomptée\n\nL'érudit de l'école de la Griffe Indomptée lut ce passage dans les appartements de [Root.Monarch.GetTitle] [Root.Monarch.GetName], mais il résonna dans les couloirs de [Root.Monarch.GetHerHis] demeure depuis lors. Les réverbérations atteignirent les campagnes, les petits seigneurs et les officiers de l'armée. Les gouverneurs provinciaux sévirent contre les détracteurs et recrutèrent les détenteurs de pouvoir locaux dans leurs relations de patron-client. Les maires encouragèrent les exercices réguliers des milices locales, et les cités et villes sous cette nouvelle règle plus stricte prospérèrent.\n\nAujourd'hui, un groupe de généraux et d'officiers de rang inférieur se présenta devant [Root.Monarch.GetTitle] [Root.Monarch.GetName]. Ils proclamèrent que les bannières gonflaient de nouvelles recrues et qu'il était temps de faire la guerre. Au début, [Root.Monarch.GetName] hésita, et la foule assemblée devint agitée. Certains soldats murmurèrent des plaintes. Certains dirent ouvertement que [Root.Monarch.GetTitle] se souciait peu de Pichka et ne faisait que rendre des hommages de pure forme. Un général furieux cria que [Root.Monarch.GetTitle] [Root.Monarch.GetName] souhaitait les empêcher d'atteindre le Nitikamarja. À cette affirmation, l'érudit de la Griffe Indomptée, qui se tenait à leurs côtés, leva une main et intervint :\n\n« C'est la volonté des Hauts Dieux que ces hommes démontrent leur prouesse des armes, leur discipline, et bien sûr leur force, par la bataille. Ils sont disposés et prêts à affronter vos ennemis et à en sortir victorieux. L'on ne devrait pas leur refuser l'opportunité d'atteindre le Purtara. Quel est votre commandement ? »\n\nLes conseillers militaires et les soldats de la cour regardèrent [Root.Monarch.GetTitle] [Root.Monarch.GetName] avec des visages sévères ; ils attendaient nerveusement [Root.Monarch.GetHerHis] proclamation."
 high_philosophy_events.10.a:0 "« Rassemblez vos bannières ! Il est temps d'employer notre force à l'image des Hauts Dieux ! »"
 unbroken_claw_scholar_meeting:0 "Volonté Indomptée"
 high_philosophy_events.11.t:0 "Un zélote [debate_province.Religion.GetName] humilié par les faits et la logique !"
 high_philosophy_events.11.d:0 "Un professeur [debate_province.Religion.GetName] tenait une conférence dans l'école de [debate_province.GetName] sur la folie de [Root.Religion.GetName]. Heure après heure, il se moquait des Hauts Dieux, les qualifiant d'impotents ou de fictifs, tournait en dérision leurs adeptes comme des hypocrites superstitieux, et affirmait la supériorité morale, intellectuelle et théologique des enseignements [debate_province.Religion.GetName]. Quand il eut terminé, il demanda à la salle si quelqu'un osait contester ses arguments. La salle était parfaitement silencieuse, mais alors un seul participant se leva et demanda sans crainte : « Si [debate_province.Religion.GetName] est si supérieur, pourquoi n'a-t-il rien produit d'aussi magnifique que les Hauts Temples ? » Le professeur ouvrit la bouche, mais ne trouva aucun mot pour répondre. Son visage devint pâle, ses mains commencèrent à trembler, et finalement il sortit en courant de la salle, le visage enfoui dans ses paumes dans une tentative désespérée de retenir ses larmes. Comme sur commande, toute la salle de conférence se mit à applaudir à l'unisson devant l'étonnante démonstration rhétorique dont ils venaient d'être témoins, et tous convinrent de suivre [Root.Religion.GetName] désormais."
 high_philosophy_events.11.a:0 "Le nom de ce participant ? [Root.Adm_Advisor.GetName]."
 euphoric_enlightenment:0 "Illumination Euphorique"
 high_philosophy_events.12.t:0 "Les Écoles de la Praxis de Suhan"
 high_philosophy_events.12.d:0 "Nous avons récemment découvert la sagesse du Guru Suhan. Sa compréhension de la meilleure façon de mener nos vies et notre société, afin que nous puissions nous élever jusqu'aux hauteurs des Hauts Dieux, revêt manifestement une importance capitale. Cependant, maintenant que nous avons rejoint leurs rangs de philosophes, il apparaît clairement que, parmi leurs modes de pensée, ils sont également fort divisés quant à la signification de certains reliefs et frises essentiels découverts dans les Hauts Temples. Plusieurs écoles de pensée différentes sont apparues à notre cour. Vers laquelle devons-nous nous tourner pour recevoir leur sagesse ?"
 high_philosophy_events.12.a:0 "L'École de la Vérité Synthétique"
 high_philosophy_events.12.b:0 "L'École du Paradigme Final"
 high_philosophy_events.13.t:0 "Une Rivalité Pressante"
 high_philosophy_events.13.d:0 "Les croyances de la Haute Philosophie découlent de l'interprétation des diverses œuvres d'art des Hauts Temples, ainsi, pouvoir contempler ces pièces est une exigence essentielle pour la pratique. Historiquement, les adeptes observaient les œuvres des temples lointains de tout Haless en s'appuyant sur des codex remplis de répliques peintes. Ces codex, appelés Brahmkalaas, ont souvent été le seul moyen pour les individus des castes moyennes et inférieures de voir les œuvres des Hauts Temples par eux-mêmes. Bien qu'à l'origine leur production fût fort laborieuse, l'avènement de l'impression par blocs de bois dans les années 800 AA réduisit considérablement les exigences de main-d'œuvre pour leur production, et la création de Brahmkalaas est restée depuis une activité commerciale significative, presque chaque école et foyer de caste supérieure en possédant un exemplaire.\n\nLà où la presse à blocs innova dans la copie des fresques des Hauts Temples, la presse à caractères mobiles a innové dans la copie de la parole écrite. Cela a conduit à son tour à une prolifération d'essais et d'interprétations concernant l'art des Brahmkalaas, et il devient de plus en plus courant pour les individus des castes inférieures et moyennes de posséder un exemplaire d'essais sur les diverses fresques et peintures murales des Hauts Temples. Bien que ce soit strictement positif pour ceux qui ne pourraient jamais s'offrir un Brahmkalaa, de nombreux philosophes s'inquiètent du fait qu'un grand nombre de personnes n'interprètent plus les œuvres elles-mêmes, mais font confiance au récit écrit de quelqu'un d'autre. De plus, de moins en moins de gens achètent les anciens Brahmkalaas imprimés sur blocs de bois, et l'industrie dans son ensemble commence à péricliter.\n\nDes artistes et philosophes des Hauts Temples voisins sont venus à la cour de [Root.Country.GetName], demandant de l'aide pour leur industrie en déclin et une répression de la prolifération de ces nouveaux essais et des presses qui permettent leur circulation. Que dit [Root.Monarch.GetName] ?"
 high_philosophy_events.13.a:0 "Les Brahmkalaas sont essentiels à la bonne pratique : nous assisterons le commerce."
 high_philosophy_events.13.b:0 "Les livrets d'essais sont plus accessibles : il n'y aura pas de traitement préférentiel."
 quick_spread_of_rahen_printing_press:0 "Prolifération encouragée des livrets d'essais"
 slow_spread_of_rahen_printing_press:0 "Livrets d'essais réglementés"
 subsidized_high_temple_artists:0 "Impression sur blocs subventionnée"
 high_philosophy_events.14.t:0 "Le Chemin de la Sagesse et du Pouvoir"
 high_philosophy_events.14.d:0 "Dans l'enseignement de l'école de l'Âme Ascendante, pour atteindre le Purtara, l'on doit se consacrer entièrement à l'amélioration de soi-même. Qu'il s'agisse de se concentrer sur le physique ou le mental, le magique ou le spirituel, l'on doit considérer tous les aspects pour se préparer à l'ascension. Notre souverain n'a qu'un temps limité dans cette vie, il est donc idéal de commencer à se concentrer sur ces entreprises immédiatement. Ainsi, [Root.Monarch.GetTitle] [Root.Monarch.GetName] a rassemblé des érudits expérimentés de l'école de l'Âme Ascendante pour tracer un chemin pour sa propre progression. Sur quoi va-t-il se concentrer ?"
 high_philosophy_events.14.a:0 "Faites venir les plus grands guerriers de notre terre dans notre capitale : je m'entraînerai."
 high_philosophy_events.14.b:0 "Envoyez des messagers dans des contrées lointaines afin que j'apprenne tout ce qui existe."
 high_philosophy_events.14.c:0 "Je souhaite explorer le spirituel, aller au-delà de ce que je perçois actuellement."
 high_philosophy_events.14.e:0 "Je veux explorer les mystères de la magie."
 high_philosophy_events.15.t:0 "Une Fausse Ascension"
 high_philosophy_events.15.d:0 "Récemment, un philosophe hétérodoxe mais populaire a prétendu avoir atteint le Purtara grâce à sa propre version des enseignements de l'école de l'Âme Ascendante. Cela est contesté par de nombreux philosophes éminents et gurus de l'école de l'Âme Ascendante, mais néanmoins ce philosophe non conventionnel s'avère fort populaire, et lui infliger une punition pour ses mensonges mettrait en fureur les gens qui affluent vers lui. Que ferons-nous ?"
 high_philosophy_events.15.a:0 "Débarrassez-vous de lui sur-le-champ."
 high_philosophy_events.15.b:0 "Recherchez-le : voyons si nous pouvons apprendre de ses méthodes inhabituelles."
 high_philosophy_events.15.c:0 "Je débattrai avec lui moi-même."
 high_philosophy_events.16.t:0 "Respecter nos Aînés"
 high_philosophy_events.16.d:0 "Notre vénérable monarque est considéré comme un parent pour la nation, et comme un parent bien-aimé, [Root.Monarch.GetHerHis] enfants accourent à [Root.Monarch.GetHerHis] aide tandis que [Root.Monarch.GetSheHe] se fatigue, conformément aux enseignements de l'Écharpe Orangée. Des nobles de tout le royaume sont prêts à aider à l'entretien de notre État. Où leur permettrons-nous d'aider ?"
 high_philosophy_events.16.a:0 "Nous avons besoin d'assistance dans notre administration."
 high_philosophy_events.16.b:0 "Notre corps diplomatique pourrait bénéficier de perspectives nouvelles."
 high_philosophy_events.16.c:0 "L'armée a besoin d'une nouvelle cohorte d'officiers."
 high_philosophy_events.17.t:0 "Sang Neuf"
 high_philosophy_events.17.d:0 "La jeunesse est gaspillée par les jeunes, dit-on. Les érudits renommés de l'école de l'Écharpe Orangée entendent cependant s'assurer que cela n'arrive pas à [Root.Monarch.GetTitle], ou du moins ils essaieront. Ils offrent leurs services et leurs conseils, mais notre jeune souverain se rebiffe contre leurs suggestions, qualifiant leurs propositions de dépassées pour les temps modernes. En effet, notre souverain questionne également pourquoi les érudits ne proposent jamais de réformes pour leurs propres institutions ancrées dans notre État, mais optent joyeusement pour diluer le pouvoir de [Root.Monarch.GetTitle]. Ces érudits rejettent les préoccupations de notre souverain, disant qu'elles découlent du jeune âge et de la naïveté de [Root.Monarch.GetName]. Comment [Root.Monarch.GetTitle] répondra-t-il ?"
 high_philosophy_events.17.a:0 "Ils me traitent de naïf, mais l'hypocrisie est assourdissante."
 high_philosophy_events.17.b:0 "Avec l'âge vient la sagesse : j'ai beaucoup à apprendre."
