 high_philosophy_events.18.t:0 "Tuer les Pauvres ?"
 high_philosophy_events.18.d:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName] est assis face à deux de [Root.Monarch.GetHerHis] conseillers les plus fiables : $TREASURER$ et $TRADER$.\n\n$TREASURER$ commence à parler : « Nous avons fait ce que vous avez demandé, [Root.Monarch.GetName]. Nous avons fait passer les données dans tous nos modèles, mais je crains qu'il n'y ait tout simplement pas de solution simple pour créer la prospérité pour tous les gens de notre société. »\n\n« Nous avons essayé d'augmenter les tarifs, de réduire les tarifs, d'augmenter les taux d'intérêt, d'augmenter les taux d'intérêt et les tarifs, de baisser les taux d'imposition et d'augmenter les tarifs… mais rien ne semble fonctionner », explique $TRADER$.\n\nSoudain, [Root.Monarch.GetName] intervient : « Avez-vous essayé de tuer les pauvres ? »\n\n$TREASURER$ est pris de court, mais $TRADER$, abattu, commence à expliquer : « Avec tout le respect que je vous dois, [Root.Monarch.GetTitle], nous avons déjà eu cette conversation. Nous n'allons pas le faire. »\n\n« Eh bien, je ne dis pas que nous devrions le faire ; simplement intégrez-le dans votre théorie et vérifiez. »\n\n« Non. » $TRADER$ semble rassembler son courage. « Je ne vais pas le faire, même dans un cadre théorique. C'est offensant et maléfique. »\n\n« Je ne vois pas l'objection ! La théorie ne va pas être offensée. »\n\n$TRADER$ lève les yeux au ciel et sort un boulier et du parchemin. Après quelques minutes de calculs furieux, il pointe un nombre sur une feuille de parchemin. « Voilà. Vous voyez ? » dit $TRADER$. « Ça ne marcherait pas, donc nous n'allons pas le faire. »\n\nStupéfait, [Root.Monarch.GetName] objecte : « C'est pour ça qu'on ne le fait pas ?! Je n'aurais jamais dû vous demander de vérifier ! Si le résultat s'était avéré positif, vous auriez déjà commencé à les mettre aux gibets. Je ne réalisais pas que seul un pragmatisme froid empêchait mes conseillers de boire le sang des orphelins. »\n\n$TREASURER$ et $TRADER$ commencent à protester, mais [Root.Monarch.GetName] les interrompt. « Écoutez, nous n'allons pas le faire. » [Root.Monarch.GetSheHeCap] fait une pause. « Je pense que c'est assez clair ce que nous devons faire... »"
 high_philosophy_events.18.a:0 "Réduire les taux d'intérêt, consolider les réserves d'or, maintenir les tarifs stables, et rassembler les nains."
 silk_turban_no_more_poor:0 "Nous ne tuons pas les pauvres."
 high_philosophy_events.19.t:0 "La Cour de Dipar"
 high_philosophy_events.19.d:0 "Affiché en évidence dans la plupart des palais de justice du Rahen se trouve le sceau judiciaire qui représente la main de Dipar tenant un bâton d'argent. Quand [Root.Monarch.GetName] entre dans le palais de justice, [Root.Monarch.GetSheHe] s'arrête pour réfléchir à l'origine du symbole.\n\nÀ la périphérie du Haut Temple de Bubhagama, il existe une petite structure de pierre en ruines contenant un puits immensément profond. Autour de son bord se trouve un ensemble élaboré de sculptures qui s'enroule autour du puits comme un serpent. Ces images dépeignent une histoire sur le grand Dipar aux yeux clairs, et comment il jugea l'ombre connue sous le nom de Tuunkiichaaya.\n\nTuunkiichaaya est amené devant un podium où il gesticule violemment, peut-être implorant un public invisible. Dipar contemple les paroles de Tuunkiichaaya, mais alors, dans le quatrième panneau, une grande commotion éclate. Jaghut, le Haut Dieu des artistes, entre en courant dans la salle portant plusieurs sculptures de pierre et commence à se disputer avec Dipar. Les 3 sculptures suivantes s'agrandissent en proportion de l'énergie de la dispute ; chaque nouvelle image plus grande que la précédente. Alors que le conflit est près d'en venir aux mains, Dipar lève la main droite, puis donne à Jaghut une petite tige métallique. Jaghut quitte alors la salle, pour ne jamais être revu dans le reste du récit.\n\nDans les deux derniers panneaux, Dipar prononce une sentence pour un crime inconnu. Tuunkiichaaya est alors envoyé dans des ténèbres dévorantes, comme s'il tombait dans l'obscurité sans fin du puits. [Root.Monarch.GetHerHis] mémoire rafraîchie, [Root.Monarch.GetName] considère l'œuvre d'art et sa signification."
 high_philosophy_events.19.a:0 "Tuunkiichaaya était un trompeur qui dupait Jaghut. Un homme juste doit voir au-delà de la tromperie."
 high_philosophy_events.19.b:0 "Tuunkiichaaya est une métaphore des ténèbres, celles que nous devons bannir de nous-mêmes."
 high_philosophy_events.19.c:0 "Il y a quelque chose qui cloche ici. Peut-être Dipar met-il en garde contre la corruption."
 high_philosophy_events.19.e:0 "Le bâton était une menace : l'ordre doit être maintenu par la menace de la violence."
 dipar_jaghut_tricked:0 "Dipar : Percevoir la Tromperie"
 dipar_metaphorical_darkness:0 "Dipar : Bannir les Ténèbres"
 dipar_corruption_warning:0 "Dipar : Le Pouvoir Corrompt"
 dipar_maintain_order:0 "Dipar : Ordre Coercitif"
 high_philosophy_events.20.t:0 "Prathim et le Mur des Dieux"
 high_philosophy_events.20.d:0 "Les conflits des siècles passés ont malheureusement bloqué l'accès à l'une des plus grandes merveilles de la tradition de Haute Philosophie : le Mur des Dieux. Bien que la plupart ne puissent plus s'y rendre en sécurité, il existe, heureusement pour eux, d'innombrables répliques peintes à la main dans plusieurs Brahmkalaas différents. La structure massive enjambe l'espace entre Maruvad et le Plateau de l'Ascension, et contient d'innombrables exemples d'architecture des Hauts Dieux et des anciennes civilisations humaines. Il est largement admis que l'essentiel de ce travail fut accompli par la Haute Déesse des Artistes, Pathim, grâce à un ensemble de trois dalles sculptées reposant en bas à droite du monument.\n\nLa première dalle de granit montre la falaise telle qu'elle était jadis, un magnifique paysage boisé défini par des affleurements rocheux escarpés. Dans la seconde, Pathim est montrée à plusieurs endroits différents, taillant la pierre et dégageant le feuillage, travaillant sur la paroi rocheuse comme si c'était un bloc de marbre. Enfin, la troisième sculpture montre le Mur des Dieux quand Pathim termina le projet. Des statues sculptées dans la terre bordent la falaise tandis que des escaliers abrupts serpentent entre leurs formes. Sous l'image de la structure, apparemment au sein de la terre elle-même, repose la Haute Déesse elle-même dans une posture méditative entourée de fleurs de lotus. Fait intéressant, par une comparaison rapide, on peut voir que beaucoup a été ajouté à la structure depuis que la Haute Déesse termina son projet : de nouveaux temples et sentiers parsèment le paysage, des jardins de lotus ornent désormais les diverses terrasses, et des statues de styles différents embellissent le sommet de la falaise.\n\nMéditer sur le Mur des Dieux est une tâche véritablement impossible, et beaucoup y ont consacré leur vie. Cependant, la construction du monument est une question différente, bien plus abordable à méditer. Que pense [Root.Monarch.GetName] du chef-d'œuvre de Pathim ?"
 high_philosophy_events.20.a:0 "Seuls les puissants peuvent bâtir une telle structure. Je devrais également démontrer ma force."
 high_philosophy_events.20.b:0 "Les dalles en bas sont un rappel : soyez fier du chemin parcouru."
 high_philosophy_events.20.c:0 "Si peu peuvent le voir, alors nous pouvons tirer profit de l'offre limitée de répliques."
 high_philosophy_events.20.e:0 "Le Mur des Dieux est, dans son ensemble, davantage apparenté à un voyage qu'à un monument."
 prathim_mighty_structures:0 "Prathim : Architecture Puissante"
 high_philosophy_events.21.t:0 "La Tragédie de Liilaamora"
 high_philosophy_events.21.d:0 "La pluie tinte sur les tuiles d'argile. [Root.Monarch.GetName] regarde par la fenêtre de l'abri de briques et observe la route de terre se couvrir peu à peu de flaques. Un garde suit le regard de [Root.Monarch.GetName] vers l'eau et élève la voix avec abattement : « C'est comme si Liilaamora elle-même versait des larmes aujourd'hui… » Un idiome parfaitement normal, mais aujourd'hui, coincé dans cet abri de bord de route, [Root.Monarch.GetName] choisit de méditer dessus.\n\nLa Tragédie de Liilaamora est un récit bien connu, disposé sur une série de petits cylindres de céramique au plus profond du Haut Temple de Sarilavhan. Le récit commence quand le Haut Dieu Jaghut approche d'un village où il distribue le contenu d'un petit panier de nourriture. Les gens, plus petits par rapport à Jaghut, participent avec hésitation, à une exception près : Liilaamora. Elle se tient défiante, lançant des regards assassins au Haut Dieu.\n\nDans une scène qui a depuis été taillée à coups de couteau grossier et fondue à plusieurs endroits, Jaghut semble s'agenouiller. Les deux parlent alors à travers plusieurs images, à chaque fois, l'expression de Liilaamora s'adoucit et se réchauffe. Finalement, ils partent, marchant sur un chemin de fleurs de lotus. Ils marquent leur voyage avec des guirlandes florales tandis qu'ils marchent en paix. Ils atteignent finalement le Haut Dieu Dipar, qui leur crie depuis le haut. Les deux restent défiants d'une manière normalement inconvenante pour le discret Jaghut, mais Dipar ne cède pas et pointe au loin du chemin.\n\nLiilaamora s'affaiblit de plus en plus à mesure qu'ils approchent d'un petit bosquet d'arbres, jusqu'à ce que finalement, sur un lit de fleurs de lotus, elle soit mise au repos. Jaghut pleure avec elle à l'unisson ; leurs larmes formant deux rivières qui serpentent à travers les vallées de Shamakhad. Caché dans la dernière sculpture, reposant délicatement sur la poitrine de Liilaamora, se trouve un petit bâton d'argent."
 high_philosophy_events.21.a:0 "Jaghut démontre la nécessité d'être bienveillant, tout en s'élevant contre l'injustice."
 high_philosophy_events.21.b:0 "La souffrance fait partie intégrante de la vie. Peut-être une partie essentielle du chemin."
 high_philosophy_events.21.c:0 "Dipar est le héros, rétablissant enfin l'ordre dans cette absurdité."
 high_philosophy_events.21.e:0 "Jaghut montre l'importance de l'art, afin que nous puissions nous souvenir et être émus."
 jaghut_stand_against_injustice:0 "Jaghut : Dénoncer l'Injustice"
 jaghut_suffering:0 "Jaghut : Endurer la Souffrance"
 jaghut_chad_dipar:0 "Jaghut : Un Faire-valoir pour Dipar"
 high_philosophy_events.22.t:0 "Le Temple Englouti"
 high_philosophy_events.22.d:0 "La plupart des apparitions de Gunjit dans les Hauts Temples voient le Haut Dieu des artisans jouer un rôle secondaire, forgeant les outils et armes nécessaires aux autres Hauts Dieux. Dans les niveaux supérieurs du Haut Temple partiellement englouti du lac Tamakhan, son effigie peut être vue en association avec Nermali et Dipar. Cependant, enfouie dans les chambres sombres et gorgées d'eau se trouve une petite salle portant les signes révélateurs de l'artisanat de Gunjit. Notre seul compte-rendu de la chambre nous vient d'une petite bande d'aventuriers qui, heureusement pour nous, enregistrèrent la disposition de la salle et firent un relevé de ses images centrales.\n\nSelon le compte-rendu : « ...Au début, la salle était baignée d'obscurité, seul un petit orbe bleu pouvait être vu à travers l'air moisi. En touchant l'orbe, l'obscurité de toute la salle fut attirée vers lui. Des volutes de suie et de cendre nous fouettèrent en gémissant comme les morts. Puis tout fut silencieux, et l'orbe de verre bleu luminescent bourdonna à basse fréquence. L'obscurité dissipée, la scène nous fut révélée. L'orbe reposait sur un podium de marbre blanc entouré de 4 images du Haut Dieu Gunjit, le représentant à diverses étapes du processus de fabrication des deux. Au-dessus de l'orbe se trouvait une fresque d'étoiles connectées comme des constellations, s'étendant sur la majeure partie du plafond. Cependant, il n'y avait rien d'autre dans la chambre, et l'étroitesse du passage précédent nous empêcha de ramener l'orbe. »\n\nQuand [Root.Monarch.GetName] termine la lecture du compte-rendu, [Root.Monarch.GetHerHis] yeux se portent sur le lac voisin. Alors que le soleil commence à se coucher et que l'eau se pare des teintes vibrantes du crépuscule, [Root.Monarch.GetName] médite sur l'histoire."
 high_philosophy_events.22.a:0 "Gunjit nous rappelle non pas simplement de donner, mais d'enseigner et d'autonomiser les autres."
 high_philosophy_events.22.b:0 "L'étalage symbolise la mort et le Purtara. Les étoiles détiennent la clé pour éviter la vraie mort."
 high_philosophy_events.22.c:0 "Un mécanisme fascinant. Peut-être Gunjit nous laisse-t-il un ensemble d'instructions… mais pour quoi ?"
 gunjit_empower_others:0 "Gunjit : Enseigner et Autonomiser"
 high_philosophy_events.23.t:0 "La Folie de Simral"
 high_philosophy_events.23.d:0 "Si l'on souhaite entrer dans la bibliothèque du Haut Temple de Khabtei Teleni, on est d'abord accueilli par l'effigie rayonnante du Haut Dieu de la Connaissance, Simral, sa forme ornant les doubles portes qui constituent l'entrée principale. À l'intérieur se trouve l'une des collections d'écrits anciens les mieux préservées de Haless. D'anciennes tablettes d'argile et des rouleaux de papyrus tapissent les murs de granit, de petites lanternes allumées par magie illuminent les écrits et les aires de lecture associées, et en évidence au fond du bâtiment se trouve la mosaïque communément appelée « la Folie de Simral ».\n\nConstruite de tesselles de verre peintes à la main, la mosaïque représente Simral flottant parmi les nuages par un jour ensoleillé tandis que des éclats d'or et d'argent rencontrent ses jambes croisées. De son perchoir céleste, il esquisse la progression de la scène à gauche. Là, dans la jungle en contrebas, une armée de points noirs, à peine perceptibles, déplacent des blocs vers une fondation massive où une tour à moitié achevée construite de blocs de pierre blanche s'élève vers le ciel. Plus important encore, Simral semble être effrayé par ce qui se trouvait jadis sur le côté droit de la mosaïque. À cet endroit se trouvent de grandes entailles et d'innombrables carreaux manquants qui ont rendu ce qui s'y trouvait autrefois indéchiffrable. Le débat sur ce qui s'y trouvait fait rage, mais quoi que ce fût, c'est depuis longtemps perdu dans l'histoire.\n\nContemplant la fresque répliquée et la bibliothèque associée, [Root.Monarch.GetName] considère la signification des œuvres."
 high_philosophy_events.23.a:0 "Le cycle de création et destruction doit être une clé vers le Purtara."
 high_philosophy_events.23.b:0 "L'orgueil démesuré est le tueur de l'esprit."
 high_philosophy_events.23.c:0 "La perte de connaissance est déchirante. Je me consacrerai à y remédier."
 high_philosophy_events.23.e:0 "Les yeux de Simral regardent vers le ciel. Une confirmation de notre dogme."
 simral_protec_knowledge:0 "Simral : Préserver et Protéger"
 simral_look_up:0 "Simral : Contemplateur d'Étoiles"
 high_philosophy_events.24.t:0 "Nouvelle Croissance"
 high_philosophy_events.24.d:0 "Il y a un étrange récit gravé sur le mur du jardin du Haut Temple de Sighajisbid. Contrairement à la plupart des histoires des Hauts Temples, celle-ci ne commence pas par une représentation de l'un des Hauts Dieux, ou de leurs nombreux enfants, mais plutôt par un petit écureuil roux. La créature fouille les feuilles et les débris autour des racines d'un chêne, mais malgré ses efforts, il revient les mains vides. Il lève les yeux et regarde une grande obscurité cendrée envelopper les cieux. Des braises tombent autour de lui jusqu'à ce que finalement, sans prix en main, il soit contraint de fuir.\n\nLe Haut Dieu Vadham arrive quelque temps plus tard. Le chêne est réduit à une carcasse fumante, et la terre autour de lui est en ruine. Pourtant, l'écureuil a survécu au désastre et s'approche de Vadham, qui répond en posant un sac sur le sol. L'image suivante représente le véritable festin qui en déborde : des graines de toutes sortes et variétés, la plupart encore protégées dans leurs coques. L'écureuil, bien sûr, prend autant de graines qu'il peut et s'enfuit dans la campagne environnante. À cela, Vadham sourit et part.\n\nL'image finale, étendue en dessous et à travers toutes les autres, représente une nouvelle forêt. Elle est couverte de pousses fraîches et d'une faune abondante. Au milieu de la scène, Vadham est assis sur la souche du chêne brûlé tandis qu'il contemple un petit potager, et semble en paix. [Root.Monarch.GetName] fixe la réplique de la fresque et considère sa signification."
 high_philosophy_events.24.a:0 "Avec une main directrice, la croissance émergera de la destruction."
 high_philosophy_events.24.b:0 "L'on ne doit pas combattre la nature, mais suivre son cours."
 high_philosophy_events.24.c:0 "Un souverain doit donner à [Root.Monarch.GetHerHis] peuple en bons comme en mauvais temps, dans une égale mesure."
 high_philosophy_events.24.e:0 "Pour qu'il y ait ordre, le foyer d'une famille doit être entretenu par son chef : le père."
 vadham_flow_w_nature:0 "Vadham : Suivre la Nature"
 vadham_give_to_ppl:0 "Vadham : Donner en Tout Temps"
 vadham_familial_order:0 "Vadham : Guidance du Père"
 high_philosophy_events.25.t:0 "La Descente d'Anjita dans les Ténèbres"
 high_philosophy_events.25.d:0 "Le conflit actuel pèse lourdement sur [Root.Monarch.GetName], et après de nombreuses insistances de ses conseillers, [Root.Monarch.GetSheHe] a décidé de prendre du recul pour la journée et d'essayer de se détendre. [Root.Monarch.GetSheHeCap] a choisi, sur les conseils d'un philosophe, de passer ce temps en méditation. Procurant un Brahmkalaas de [Root.Monarch.GetHerHis] collection privée, [Root.Monarch.GetName] s'assoit dans la lumière du matin et se tourne vers une collection de répliques peintes du Mur des Dieux.\n\nL'ensemble d'images répliquées représente le voyage du Haut Dieu Anjita pour sauver son fils-fille Tikhaaphula après sa capture par le dragon noir Hakataamadiihai (ce qui est une autre histoire en soi). Après nombre d'épreuves et de tribulations dans les collines environnantes, sa quête le mène dans les profondeurs d'une grande montagne. Entrant dans une grotte, la terre commence à descendre dans l'obscurité boueuse. Tandis que le char d'Anjita fonce en avant, le Haut Dieu combat ce qui semble être les ombres elles-mêmes, et ne parvient à l'emporter qu'avec l'aide d'une torche bleue. Après avoir échappé aux spectres, il atteint le fond et pénètre dans l'antre de la bête. Une grande bataille éclate entre les deux alors qu'Anjita lance son char dans des nuages de fumée verte qui étouffent toute vie qu'ils touchent. Le conflit s'étend sur trois peintures, ne se terminant que lorsqu'Anjita, après avoir patiemment attendu une ouverture, transperce le ventre du dragon avec une lance de pure lumière façonnée par le Haut Dieu Gunjit.\n\n[Root.Monarch.GetName] termine d'examiner les répliques peintes, puis, sirotant une tasse de thé, médite sur la signification de l'histoire en relation avec [Root.Monarch.GetHerHis] conflit actuel."
 high_philosophy_events.25.a:0 "L'on doit charger dans la mêlée et affronter ses peurs de front."
 high_philosophy_events.25.b:0 "Anjita ne put l'emporter que par sa patience, et grâce à l'aide des autres."
 high_philosophy_events.25.c:0 "La force d'Anjita réside à la fois dans le corps et dans la volonté."
 high_philosophy_events.25.e:0 "Pour rester invaincu, l'on doit frapper vite mais avec précision."
 anjita_charge:0 "Anjita : Intrépide"
 anjita_body_and_will:0 "Anjita : Corps et Volonté"
 anjita_strike_fast:0 "Anjita : Frapper Vite"
 high_philosophy_events.26.t:0 "Un Rivage Blanc et un Océan de Larmes"
 high_philosophy_events.26.d:0 "Le matin arrive sans grande splendeur ce matin, tandis que [Root.Monarch.GetTitle] [Root.Monarch.GetName] voyage sur un bac et regarde vers la mer. Une tapisserie de gris et d'argent s'étend devant [Root.Monarch.GetHerHim], occasionnellement striée de bandes de teintes jaunes ou orangées. Les vagues clapotent nonchalamment sur le flanc du vaisseau, et [Root.Monarch.GetName] soupire. Ce sera le troisième jour en mer, sans perspective d'avancer. [Root.Monarch.GetName] s'effondre sur un banc, sent l'air salé effleurer [Root.Monarch.GetHerHis] visage, et se souvient d'une histoire.\n\nSelon le Haut Temple de Keoaden, Daiia, enfant du Haut Dieu Dipar, voyagea un jour avec la Haute Déesse Digatha. Leur destination : une terre de sables blancs et d'eaux prismatiques. Chaque jour, les vents les repoussaient de leur proie. Digatha s'asseyait patiemment sur le pont et observait les vagues, mais Daiia tentait de ramener l'embarcation sur sa route. Le premier jour, elle essaya avec les voiles, puis le deuxième avec les rames, et enfin le troisième avec les deux simultanément. Pendant ces trois jours, Digatha observa, jusqu'à ce que le quatrième jour elle se lève et rejoigne Daiia. Digatha posa une main sur la rame et invita Daiia à venir s'asseoir. Les paroles prononcées ne sont pas écrites. Un panneau représente les deux assises, observant les vagues. Un second panneau montre Digatha sortant un filet de pêche. Puis les troisième, quatrième et cinquième panneaux les représentent tandis qu'elles attendaient : les vents et les vagues continuaient leur agitation. Pourtant, finalement, le sixième jour les cieux s'éclaircirent, l'embarcation atteignit la mer changeante et s'échoua sur ses rivages blancs. En sécurité sur ces sables, il est dit que Daiia demanda à Digatha : « Pourquoi n'as-tu pas arrêté les vents ? » À quoi Digatha répondit : « Je l'ai fait, mais pour ceux qui n'étaient pas nous, pour ceux qui avaient besoin d'une vraie aide, alors que nous n'avions besoin que de patience. » Cependant, tout le monde sait que c'est simplement ce que nous racontons aux enfants, car dans l'image finale Digatha et Daiia sont simplement assises là sur la plage et pleurent.\n\n[Root.Monarch.GetName] est réveillé par l'éclaboussure d'eau salée sur son visage tandis que le vent commence à forcir, et considère la signification du récit."
 high_philosophy_events.26.a:0 "Voyager, c'est se mouvoir, changer, et pleurer ce qui est perdu."
 high_philosophy_events.26.b:0 "L'on ne devrait pas essayer de combattre la nature elle-même, mais se mouvoir avec elle."
 high_philosophy_events.26.c:0 "Nous naviguons au sein d'une vaste sphère, dérivant sans cesse dans l'incertitude, poussés d'un bout à l'autre."
 digatha_move_change:0 "Digatha : Le Voyage"
 digatha_dont_fight_nature:0 "Digatha : Suivre les Courants"
 digatha_uncertainty:0 "Digatha : Dériver, Rêver"
 high_philosophy_events.27.t:0 "Nermali - Mort et Deuil"
 high_philosophy_events.27.d:0 "La mort est l'une des rares expériences humaines universelles, une qui, d'une manière ou d'une autre, nous touche tous. C'est vrai pour [Root.Monarch.GetName] alors qu'un de ses proches amis passe dans les ténèbres au-delà de la vie, et, espérons-le, vers le Purtara. En ce temps de perte, [Root.Monarch.GetSheHe] médite sur la dichotomie de la vie et de la mort.\n\nDans le Haut Temple de Lanjincun, une série de stèles sur le mur intérieur du temple représentent Nermali, la Haute Déesse des guérisseurs, soignant une variété de maladies différentes. Parfois, elle est montrée guérissant les malades d'un geste de la main, en d'autres occasions l'un des serpents de son collier descend vers les mourants et aspire des fluides de leurs veines, et dans bien d'autres elle s'agenouille au chevet des mourants et administre un baume ou une potion. La plupart de ces maladies et afflictions sont communément connues des peuples de Haless, tout comme certains de ses remèdes, mais il y a une stèle, perchée sur un cercueil de pierre bordé de métal argenté, qui représente quelque chose de différent.\n\nLe quartile supérieur est bordé d'images représentant Nermali essayant plusieurs méthodes de guérison différentes sans succès, jusqu'à ce que finalement, dans une grande image occupant le reste de la stèle, elle semble prier. Ses flacons bouchés gisent brisés sur le sol, sa main ne brille plus que faiblement, et ses serpents joignent les mains de leur maîtresse en défaite levées sur un corps en apparente exultation. Le corps lui-même est couvert de lignes noires maladives. De fines volutes de fumée s'élèvent des teintes orange brillantes qui l'entourent. [Root.Monarch.GetName] contemple cette image, répliquée dans un tome peint à la main, et considère sa signification."
 high_philosophy_events.27.a:0 "Il y a de la beauté dans la tristesse de la mort : je devrais exprimer ma peine par l'art."
 high_philosophy_events.27.b:0 "Fort pragmatique ! Il y a de la sagesse dans ces stèles qu'il vaut la peine de transmettre au peuple."
 high_philosophy_events.27.c:0 "Nous devrions vivre selon l'exemple de Nermali en essayant tout ce que nous pouvons pour alléger le fardeau de la mort."
 high_philosophy_events.27.e:0 "Il y a une peste de griffonnage noir qui vient pour nous tous ! Verrouillez les portes et jetez la clé !"
 nermali_wise_treatments:0 "Nermali : Sagesse Médicale"
 nermali_ease_death:0 "Nermali : Le Fardeau de la Mort"
 nermali_nier:0 "Nermali : Griffonnage Noir"
 high_philosophy_events.28.t:0 "Vachava - Retrouvailles"
 high_philosophy_events.28.d:0 "Aujourd'hui, [Root.Monarch.GetName] est confronté à un défi posé à de nombreux pratiquants de Haute Philosophie : interpréter l'histoire de Vachava et Sudarkha. Un récit gravé sur les côtés du puits à degrés du Haut Temple de Shanyutian.\n\nLa première sculpture de la série représente Vachava, la Haute Déesse des Marchands, au travail, se déplaçant de la mine à la forge, de la forge à la monnaie, et de la monnaie au chariot pour charger divers objets d'or et d'argent. Quand la nuit descendit enfin, une silhouette sauta du chariot et remit à Vachava un paquet. Elle monta alors sur son cheval et voyagea à travers le pays. Elle chevaucha à travers montagnes et vallées, rivières et marécages, jusqu'à ce qu'elle arrive finalement à sa destination : une petite chaumière nichée dans une clairière verdoyante. À cet instant, Vachava est représentée dans sa plus grande beauté, baignée par le soleil du matin, des fils d'argent traçant ses cheveux, et des contours dorés ornant ses pas tandis qu'elle approchait de la chaumière. Le paquet brun en main, elle actionna le heurtoir et attendit.\n\nL'image suivante est malheureusement perdue dans l'histoire ; cependant, nous possédons la sculpture qui suit. Elle représente Vachava face à face avec la déesse connue sous le nom de Sudarkha, enfant de Nermali. Elle est drapée dans une robe bleu-vert brodée de fils dorés, et des libellules ornent sa forme tandis qu'elles battent leurs ailes prismatiques. Vachava tenait Sudarkha près d'elle, leurs bras enlacés autour de leurs tailles. Le paquet gisait à leurs pieds, ouvert pour révéler un collier doré avec une pierre précieuse bleue dépassant de la boîte. Le récit s'arrête là abruptement. Aucune autre image ne survit. Qu'en pense [Root.Monarch.GetName] ?"
 high_philosophy_events.28.a:0 "Connaissez la valeur d'un objet, tant pour vous-même que pour les autres."
 high_philosophy_events.28.b:0 "La richesse est un moyen vers une fin. Donnez généreusement."
 high_philosophy_events.28.c:0 "Le récit lui-même n'est pas important, mais l'artisanat et le mécène derrière eux le sont."
 high_philosophy_events.28.e:0 "Un marchand doit être économe : un colocataire peut faire économiser beaucoup de couronnes."
 vachava_know_value:0 "Vachava : Valeur Relative"
 vachava_give_lavishly:0 "Vachava : Moyens et Fins"
 vachava_patron:0 "Vachava : Un Mécène"
 vachava_thrifter:0 "Vachava : Elles étaient Colocataires"
 high_philosophy_events.50.t:0 "Dekhana, Pichka"
 high_philosophy_events.50.d:0 "La dichotomie entre contempler, Dekhana, et poursuivre, Pichka, la Kartya, le but propre de l'existence morale, est parmi les tensions les plus centrales des enseignements de Haute Philosophie. L'on ne peut agir sans sagesse, mais agir est nécessaire pour parcourir le chemin vertueux. Les plus grands maîtres rappelleront à leurs élèves qu'il ne suffit pas de simplement savoir quoi faire : parfois, nous devons faire le choix conscient de réfléchir ou de nous consacrer à la route. Voici l'un de ces moments."
 high_philosophy_events.50.a:0 "Agir vertueusement est la voie à suivre."
 high_philosophy_events.50.b:0 "Nous manquons de la sagesse nécessaire pour poursuivre la Kartya."
 high_philosophy_events.51.t:0 "Purtara"
 high_philosophy_events.51.d:0 "Comme l'enseignent toutes les écoles de Darsanasara, une vie morale se termine de la même manière qu'une vie immorale. Mais, pour ceux qui ont parcouru le Nitikamarja jusqu'au bout et vécu en accord avec la Kartya, le but propre de l'existence morale, après la mort il y a le Purtara : l'union avec les Hauts Dieux, l'accomplissement spirituel qui permet d'échapper à l'enveloppe mortelle. Aussi fervents que soient les débats concernant la nature du Nitikamarja, sont les débats concernant le Purtara et si quelqu'un l'a atteint ou non, les particulièrement vertueux étant souvent identifiés comme Purtararam, celui qui a atteint les dieux.\n\nLe récent décès de [Root.Monarch.GetName], qui était renommé tant comme grand souverain que comme personne vertueuse, a vu beaucoup le proclamer Purtararam, et bien que nous pleurions son départ, nous nous rappelons le paradis qui nous attend si seulement nous vivons vertueusement."
 high_philosophy_events.51.a:0 "Qu'il veille sur nous aux côtés des Hauts Dieux."
 high_philosophy_events.52.t:0 "La Voie du Milieu"
 high_philosophy_events.52.d:0 "Le chemin est de nombreuses choses. Il est guerre, et il est paix. Il est amour, et il est perte. Il est méditation, et il est action. Être, et ne pas être. Faire, et ne pas faire. Penser, et ne pas penser. Contempler, poursuivre. Dekhana, Pichka. Le Nitikamarja s'étend devant nous et exige les deux de nous. Et nous sommes prêts à être l'un ou l'autre, selon les besoins."
 high_philosophy_events.52.a:0 "Parfaitement équilibré, comme toutes choses devraient l'être."
 high_philosophy_events.53.t:0 "Érudits de Retour"
 high_philosophy_events.53.d:0 "À la suite de la dissolution de l'Empire du Phénix et des conquêtes de Ramapalar, le fleuve Dhenbasana s'est réaffirmé comme le principal centre d'apprentissage savant de Haless, éclipsant Sir, Sarisung et Tianlou. Des érudits de toutes convictions affluèrent vers Rayavashapal et Dhenijansar pour apprendre des professeurs les plus renommés en science, théologie et droit. De nombreux étudiants de nos terres, ayant achevé leur pèlerinage éducatif, rentrent maintenant chez eux en espérant intégrer les idées qu'ils y ont apprises, aussi hétérodoxes soient-elles par rapport à celles de nos terres. Permettrons-nous à ces étudiants un lieu pour enseigner et débattre, ou leurs idées n'ont-elles pas leur place dans notre administration ?"
 high_philosophy_events.53.a:0 "Leur sagesse et connaissance nouvellement acquises guideront notre nation."
 high_philosophy_events.53.b:0 "Ils ne comprendraient pas la lutte qui afflige notre peuple."
 high_philosophy_events.54.t:0 "Mystiques et Conteurs"
 high_philosophy_events.54.d:0 "Les érudits questionnent souvent la grande influence que les conteurs exercent sur la vie des gens du commun. Bien que nul ne doute que les frises narratives des Hauts Dieux soient au cœur de notre foi et de nos vies, des millénaires de tradition littéraire ont produit toutes sortes d'histoires de héros qui n'ont rien à voir avec eux. Ces récits risquent de confondre le divin avec le mortel et de faire un culte des destins gravement déformés de personnages historiques. Un philosophe éminent dans [hp_mystics_target.GetAreaName] a pris fermement position contre les conteurs du royaume, mettant en garde que l'écoute obsessive d'histoires pourrait mener à une fausse compréhension des dieux et éloigner le peuple du Nitikamarja."
 high_philosophy_events.54.a:0 "Nous devons tirer fierté et inspiration des histoires des Hauts Dieux."
 high_philosophy_events.54.b:0 "Les fausses croyances sont nuisibles, surtout si elles sont trop belles pour être vraies."
 high_philosophy_events.55.t:0 "Kartya"
 high_philosophy_events.55.d:0 "Les enseignements centraux de la Haute Philosophie se préoccupent principalement de déterminer et de poursuivre le but propre de l'existence mortelle, ou Kartya. Bien qu'il y ait un large désaccord sur la Kartya à suivre pour atteindre le Purtara, le paradis de l'union spirituelle avec les Hauts Dieux, les croyances communes à la plupart des sectes incluent l'honnêteté, la modération, la patience, la non-violence et la compassion. Les définitions de ces idéaux comptent parmi les sujets les plus âprement débattus par les théologiens de Haute Philosophie."
 high_philosophy_events.55.a:0 "Il est important que toutes valeurs soient pratiquées, pas seulement prêchées."
 high_philosophy_events.55.b:0 "Il est insensé d'agir sans comprendre ce que l'on prêche réellement."
 high_philosophy_events.56.t:0 "La Nourriture des Dieux"
 high_philosophy_events.56.d:0 "Dans le canon des nombreux textes de Haute Philosophie, un sujet vivement débattu est la question des restrictions alimentaires sur les combinaisons de nourriture. Les Hauts Dieux, lorsqu'ils sont représentés à table, consomment ce qui semble être des viandes, des fromages, des céréales, des fruits, des légumes, mais seulement dans certaines combinaisons. Le blé n'est jamais montré sur la même table que le riz ; les légumes-racines ne sont jamais représentés avec les fruits. Cela a conduit à l'émergence de certaines traditions savantes qui prônent l'interdiction de servir toute combinaison de nourriture non vue dans les frises des Hauts Temples. Cela pourrait bien nous gagner le soutien des prêtres et des gurus, mais beaucoup préféreraient pouvoir cuisiner comme bon leur semble."
 high_philosophy_events.56.a:0 "Les Hauts Dieux ont donné l'exemple à suivre !"
 high_philosophy_events.56.b:0 "Suivre aveuglément la vie exquise des Hauts Dieux est une entreprise insensée !"
 high_philosophy_events.57.t:0 "Ambroisie d'Aelantir ?"
 high_philosophy_events.57.d:0 "Dans le canon des nombreux textes de Haute Philosophie, le débat sur les combinaisons de nourriture appropriées à la consommation occupe une place importante, mais il n'a jamais été aussi vif qu'aujourd'hui, avec l'arrivée de marchands cannoriens transportant de grandes quantités de denrées alimentaires jusqu'alors inconnues. Les échanges de plantes et d'animaux trouvés en Aelantir ont causé une explosion culinaire dans le lointain Cannor, et maintenant les marchands qui ont fait le commerce vers les continents occidentaux apportent sur nos rivages de nombreuses nouvelles additions intéressantes à notre palais.\n\nTraditionnellement, les philosophes ont dit que l'on ne doit pas combiner des aliments non montrés ensemble sur les frises des Hauts Temples, et contre ces restrictions, ces nouvelles denrées ont causé un certain émoi. Certains radicaux appellent à une interdiction complète de ces nouvelles importations, tandis que d'autres disent que chacune devrait être identifiée avec son équivalent le plus proche et autorisée comme substitut dans les recettes traditionnelles."
 high_philosophy_events.57.a:0 "Ces nouvelles nourritures n'ont jamais été consommées par notre peuple, et il doit en rester ainsi."
 high_philosophy_events.57.b:0 "Ce don culinaire devrait être utilisé de manière appropriée à notre avantage."
 high_philosophy_events.58.t:0 "Le Mandat de Dipar"
 high_philosophy_events.58.d:0 "Le Haut Juge du Monde, Dipar, était à bien des égards un premier parmi ses pairs au temps des Dieux. La sagesse de Dipar était la lumière directrice des nombreux dieux, et ce furent ses plans et conseils qui furent décisifs dans des dizaines de récits de vaillance et de gloire. Mais la sagesse n'est pas quelque chose qui se confine dans la méditation : c'est par un mot bien placé et une main ferme qu'un esprit vif sculpte le monde. Mais un vrai juge tranche les questions, et une demeure. Quand jouer sa main, et où ?"
 high_philosophy_events.58.a:0 "La justice prévaut par l'avancement du droit et du progrès !"
 high_philosophy_events.58.b:0 "La justice devrait se préoccuper de satisfaire les besoins du plus grand nombre !"
 high_philosophy_events.59.t:0 "Appels à l'Action"
 high_philosophy_events.59.d:0 "La grande emphase que notre gouvernement a placée sur Dekhana, le côté réflexif et intérieur du Nitikamarja, a eu pour effet d'aliéner de nombreux ministres, réformateurs et militants cherchant à laisser leur empreinte sur la société. N'étant plus satisfaits de la méditation et du débat savant, beaucoup à [Root.GetName] ont commencé à s'organiser autour de gurus et de prédicateurs, qui appellent à une implication mondaine accrue et à une fin du retrait spirituel qui, selon eux, domine [Root.GetName]. Alors que les tensions s'intensifient, plusieurs philosophes influents ont déclaré leur soutien à [Root.Monarch.GetTitle], calmant potentiellement la situation."
 high_philosophy_events.59.a:0 "Il est temps d'agir !"
 high_philosophy_events.59.b:0 "Nous n'avons pas fini de discerner la bonne philosophie !"
 high_philosophy_events.60.t:0 "Appels à la Réflexion"
 high_philosophy_events.60.d:0 "Se mouvoir, agir, faire : la force motrice par laquelle les Hauts Dieux sculptèrent le monde est une chose grande et puissante, mais demeurer éternellement dans ce pouvoir est dangereux. Ainsi en est-il, certains le prétendent maintenant, de l'état tel qu'il est aujourd'hui. De nombreux détracteurs ont commencé à s'organiser autour de gurus et de prédicateurs qui prônent une période de retrait spirituel et d'autoréflexion pour réorienter le cours de [Root.GetName], s'assurant que nos pas marchent sur le chemin vers le Purtara. Il y a cependant une résistance substantielle à une telle action. Beaucoup dans le gouvernement, sûrs de leur Kartya, voient ce mouvement comme rien d'autre que de l'atermoiement, bien que si nous les suivons, cela pourrait bien accroître la fatigue du peuple à long terme."
 high_philosophy_events.60.a:0 "Nous devons nous arrêter et réfléchir."
 high_philosophy_events.60.b:0 "La nation ne devrait pas être arrêtée juste pour que nous restions assis."
 high_philosophy_events.61.t:0 "Nitikamarja et Bhramada"
 high_philosophy_events.61.d:0 "Il est enseigné que les Hauts Dieux n'étaient pas tant les créateurs du monde que ses illuminateurs : contre les ténèbres primordiales, ils brandirent une torche et découvrirent un chemin vers l'illumination. Les leçons que les peuples de Haless ont glanées de leurs Hauts Temples imprègnent non seulement la Haute Philosophie mais aussi les nombreux enseignements de Vimdatrong et Yanshen. Il y a généralement eu une large coexistence de ces fois, les philosophes reformulant souvent les actions morales du peuple dans le concept du Nitikamarja. Cependant, certains de nos conseillers croient que nous devrions prosélytiser plus agressivement dans l'État de [hp_heathen_target.GetAreaName], où [hp_heathen_target.Religion.GetName] est dominant, malgré les troubles que cela causerait."
 high_philosophy_events.61.a:0 "Nous devons guider leur peuple vers la voie du Purtara."
 high_philosophy_events.61.b:0 "Il leur suffit de faire le bien sans avoir besoin de se convertir."
 high_philosophy_events.62.t:0 "Dana"
 high_philosophy_events.62.d:0 "C'est en des temps comme ceux-ci, quand notre pays est caractérisé par une tranquillité relative et l'autoréflexion, que nous devons nous rappeler de regarder ceux qui sont moins fortunés. Les récoltes récentes n'ont été ni des échecs ni de grands succès : en conséquence, bien que la plupart aient de la nourriture et que l'État dispose d'amples réserves de grain, il y a encore quelques malheureux qui ont faim. Nous pourrions bien agir pour les nourrir, mais notre retenue et notre considération ont jusqu'ici vu les affaires se gérer largement d'elles-mêmes vers un objectif positif pour la plupart des gens. N'est-ce pas la preuve que Dekhana est le bon chemin ?"
 high_philosophy_events.62.a:0 "Aider les gens devrait être la priorité de cette nation !"
 high_philosophy_events.62.b:0 "Nous ne devrions pas dévier du chemin qui nous a menés à ces bons temps."
 high_philosophy_events.63.t:0 "Arda"
 high_philosophy_events.63.d:0 "C'est en des temps comme ceux-ci, quand notre pays est fort dans l'action et vibrant d'esprit, que nous devons nous rappeler de regarder ceux qui ont été laissés pour compte par notre marche du progrès. La grande ardeur de l'État nous a propulsés le long de notre chemin à grande vitesse, mais cela ne nous a-t-il pas conduits à ignorer ceux qui questionneraient nos politiques ? Ceux qui seraient lésés par ce que nous voyons autrement comme le bien commun ? Beaucoup ont été dépossédés par notre marche le long du Nitikamarja. Peut-être serait-il préférable de s'asseoir avec ces communautés, d'entendre leurs doléances et de chercher à y répondre ? Même si cela impliquait une déviation de nos politiques ?"
 high_philosophy_events.63.a:0 "Nous tirerions davantage de gens vers le haut en poursuivant notre progrès."
 high_philosophy_events.63.b:0 "Il est temps de regarder en arrière et d'écouter ceux qui sont restés en retrait."
 high_philosophy_events.64.t:0 "Pariccaga"
 high_philosophy_events.64.d:0 "La volonté de [Root.Monarch.GetName] de risquer sa vie pour la protection de [Root.Monarch.GetHerHis] peuple est considérée comme hautement digne de respect. Des personnalités éminentes ont exprimé leur soutien à [Root.Monarch.GetHerHim], certains allant jusqu'à le proclamer souverain idéal pour ce sacrifice de soi. En effet, plonger tête la première dans le danger pour la défense d'un peuple est certainement conforme au Nitikamarja, et implique bien que le Tamatma, le chi du collectif, est fort, et la victoire certaine."
 high_philosophy_events.64.a:0 "Les Hauts Dieux ont béni son règne sur nous !"
 high_philosophy_events.64.b:0 "Nous le suivrons jusqu'à la fin des temps !"
 high_philosophy_events.65.t:0 "Svayatma"
 high_philosophy_events.65.d:0 "La cultivation de l'Atma, appelé chi par les Yansheni, est une partie centrale de la Haute Philosophie. Chaque individu, en discernant son propre Nitikamarja, son propre « chemin vers la vertu », et en le parcourant, met son âme en équilibre. Ainsi, il fait croître son Svayatma, l'atma du soi. En agissant avec habileté, sagesse et grâce, il avance vers le Purtara. Bien qu'il y ait débat parmi les érudits religieux sur les actions à entreprendre sur la voie de l'éternité, il n'y a aucun doute que parmi leur école religieuse, [Root.Monarch.GetTitle] [Root.Monarch.GetName] est un parangon. Par sa brillance et ses actions, il brille comme un phare pour tous à suivre, son propre Svayatma éclairant la voie pour que d'autres atteignent le Purtara."
 high_philosophy_events.65.a:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName] devrait être un exemple à suivre pour nous !"
 high_philosophy_events.66.t:0 "Visvatma"
 high_philosophy_events.66.d:0 "Quand les Hauts Dieux vinrent en cette terre et la refaçonnèrent à leur image, ils élevèrent les grands temples qui forment maintenant le fondement de notre foi. Ici ils inscrivirent leurs actes et leçons pour tous ceux qui viendraient après, une saga emplie de sagesse pour ceux qui sont disposés à apprendre. Et ainsi, alors que nous avons étudié ces grandes œuvres d'art et disséqué le sens qui y est laissé, nous aussi sommes devenus sages, et dans notre sagesse avons rendu la faveur.\n\nAujourd'hui le monde est en paix, les temples sont en ordre, et du Paravimvata à la mer, les reliques des Hauts Dieux sont honorées de manière appropriée. Voilà véritablement le sens du Visvatma : l'atma du monde lui-même en équilibre. Voilà véritablement la voie des dieux."
 high_philosophy_events.66.a:0 "L'ordre des Hauts Dieux se dresse par leurs temples resplendissants."
 high_philosophy_events.67.t:0 "Tamatma"
 high_philosophy_events.67.d:0 "Le royaume prospère : c'est évident pour tout observateur. L'angoisse et le dénuement ont été chassés, le peuple est prospère et heureux, l'État stable et bien gouverné. Tout cela découle comme conséquence de notre sage règne, preuve que la gouvernance du royaume est entièrement conforme aux enseignements des Hauts Dieux. En ce temps de paix, il y a de la joie. En ce temps de sécurité, le peuple bâtit, contribuant au monde ordonné des dieux. L'atma du collectif, le Tamatma, est en équilibre. Tout est comme il se doit."
 high_philosophy_events.67.a:0 "Puisse la paix à jamais grâcier cette belle terre."

 high_philosophy_events.100.t:0 "ÉVÉNEMENT CACHÉ"
 high_philosophy_events.100.d:0 "VOUS NE DEVRIEZ PAS VOIR CECI"
 high_philosophy_events.100.a:0 "MERCI DE SIGNALER :)"
 high_philosophy_events.101.t:0 "Le Schisme Dégénère en Conflit Violent"
 high_philosophy_events.101.d:0 "« L'histoire de notre tradition est marquée principalement par les cicatrices des conflits. Son tissu déchiré et lacéré, rapiécé avec les rêves des Rajas, avant d'être mis en pièces une fois de plus. D'innombrables fils ont été perdus à travers les sables du temps : les Niatkaiks, la Secte Jagdishka, l'École de la Porte Close, et tant d'autres. Tout cela pour dire que j'espère que Suhan finira simplement comme une autre déchirure dans l'étoffe, rapiécée par les actes d'hommes meilleurs. »\n-Philosophe Vasantbir Ghick\n\nL'écharpe a été arrachée. Le verre lié gît brisé sur le sol, et Suhan a réduit les fragments en poussière cristalline. Une œuvre exquise de mains soigneuses a été mise en pièces. Le vitrail transformé en simple sable ; notre art a été détruit.\n\nLa cour est divisée, les érudits du Palais Doré s'affrontent avec les érudits de l'Âme Ascendante, les mains sur les dagues. Pendant ce temps, les agents de Suhan parcourent la campagne retournant le petit peuple contre nous. La seule façon de reprendre le contrôle de la situation est de créer un front uni contre la tempête. La seule vraie question est comment traiterons-nous ceux qui ont rejoint Suhan."
 high_philosophy_events.101.a:0 "Ceux qui ont rejoint Suhan doivent abandonner leurs croyances."
 high_philosophy_events.101.b:0 "Peut-être pouvons-nous raisonner avec eux : refaire le verre à neuf."
 high_philosophy_events.102.t:0 "Le Schisme Dégénère en Conflit Violent"
 high_philosophy_events.102.d:0 "« Quand l'on parcourt le chemin vers le Purtara, l'on ne doit pas se concentrer sur un seul de ses constituants, de peur d'en être arraché. Car si l'on ne suit que les pavés, ou la terre, ou l'herbe piétinée, alors la totalité du voyage leur échappera, et ainsi, la destination également. »\n- Guru Suhan\n\nLe chemin jadis brisé a été reformé, et Suhan nous guide maintenant sur le sentier aux multiples facettes. Pourtant ces éclats, en partie fusionnés à nouveau, ne rejoindront pas la nouvelle harmonie pacifiquement. De la fumée s'élève des oreilles des érudits et des fondations des bâtiments. Les débats des philosophes éduqués ont quitté les Temples et sont entrés dans la campagne.\n\nD'innombrables détenteurs de pouvoir locaux s'accrochent encore aux anciennes voies, luttant vainement contre la marée. Pourtant leur conflit a porté fruit, et le spectre de la révolte ravage maintenant la campagne. Une action rapide doit être entreprise, sinon le chemin restera piétiné et ruiné."
 high_philosophy_events.102.a:0 "Ces dirigeants ne verront peut-être raison que par la force."
 high_philosophy_events.102.b:0 "Nous devons suivre l'exemple de Suhan, et aborder cela avec paix et tolérance."
 high_philosophy_events.103.t:0 "ÉVÉNEMENT CACHÉ"
 high_philosophy_events.103.d:0 "VOUS NE DEVRIEZ PAS VOIR CECI"
 high_philosophy_events.103.a:0 "MERCI DE SIGNALER :)"
 high_philosophy_events.104.t:0 "Fin des Troubles Philosophiques"
 high_philosophy_events.104.d:0 "« Il y a une obscurité qui brûle dans nos cœurs. Les maux de ce monde attisent ces flammes, essayant constamment de dresser frère contre frère. Pourtant le Visatma œuvre à contrer cette force et à ramener l'équilibre dans le monde. Par les actions des hommes de bien, et, plus crucialement, des bons souverains, nous pouvons éviter les temps de crise et de futilité, car par l'équilibre et par-dessus tout l'ordre, il y a la paix. »\n-Tarphenday du Manteau Chromatique\n\nLes combats ont enfin pris fin. Les taches de sang dans les Hauts Temples prendront des années à nettoyer de la pierre, et de nombreuses familles ne connaîtront jamais plus la paix, mais au moins le pire est passé, et la nation peut commencer à se remettre."
 high_philosophy_events.104.a:0 "Une étape cruciale vers la restauration du Visatma."
 high_philosophy_events.105.t:0 "Fin des Troubles Philosophiques"
 high_philosophy_events.105.d:0 "« Le Nitikamarja doit intrinsèquement impliquer la souffrance. Car atteindre le Purtara, c'est se séparer des liens qui vous attachent à ce plan ; ces besoins temporels doivent être brisés… Sur des pieds ensanglantés, avec des mains ensanglantées, nous parcourons le vertueux chemin septuple. Dekhana, Pichka. Tout n'est que souffrance jusqu'à ce moment fatidique de vraie liberté. »\n-Auteur inconnu, Brahmkalaa du Haut Temple de Tianlou\n\nLes combats ont enfin pris fin. Les taches de sang marquant le marbre blanc immaculé des Hauts Temples prendront des années à nettoyer de la pierre, et de nombreuses familles ne connaîtront jamais plus la paix, mais au moins le pire est passé. La nation peut commencer à se remettre dans la lumière d'un nouveau jour et affronter ses défis à nouveau."
 high_philosophy_events.105.a:0 "Nous foulons le long chemin, vers l'avenir."
 high_philosophy_events.110.t:0 "La Plume Bienveillante et le Gant de Velours"
 high_philosophy_events.110.d:0 "Le Visatma est un principe universel dans la pensée de Haute Philosophie ; l'Atma fluide qui circule entre les êtres et le monde en général. Pourtant les spécificités sont toujours sujettes à débat. La pensée du Palais Doré soutient qu'il doit être maintenu par les actions des empires et des bons souverains, tandis que l'école de l'Œil Étoilé soutient que tous les individus doivent le maintenir par la croissance de leur Atma personnel. Suhan s'oppose à ces deux écoles de pensée.\n\nSuhan croit que le Visatma est simplement. Il n'y a aucune raison pour que l'individu se préoccupe de son bien-être. Il fluctuera avec les saisons, les voies du monde, et les actes de l'homme, mais avec le temps il se rétablira une fois encore.\n\nRemonter le temps de la réformation est impossible, pourtant les dommages au Visatma peuvent être défaits ; quelle forme ce travail prendra-t-il ? Les paroles bienveillantes des philosophes locaux, chacun essayant de reconvertir ceux qu'il peut à notre doctrine ? Ou est-ce la force du $MONARCHTITLE$ qui, par la force, restaurera la stabilité ?"
 high_philosophy_events.110.a:0 "Réprimer les convertis de Suhan et restaurer l'ordre."
 high_philosophy_events.110.b:0 "Allouer des fonds de prosélytisme pour les Hauts Temples dans la campagne."
 high_philosophy_events.111.t:0 "Libération Illégale"
 high_philosophy_events.111.d:0 "L'esclavage est une constante au Rahen. Peu d'États s'en passent ; même Bhuvari, une république née des feux d'une révolte d'esclaves, échoua à se défaire de son emprise sinistre. Les pouvoirs en place bénéficient souvent bien trop, et changeront rarement de leur propre chef : sans un degré de force, il ne mourra jamais. Peut-être la Praxis de Suhan sera-t-elle cette force de changement.\n\nL'une des doctrines centrales de la Praxis exige le respect de tous les peuples vivants ; ainsi hommes, femmes, Harimari, Humains, esclaves et hommes libres sont tous égaux. Ne pas considérer la sagesse de ceux vus comme « inférieurs » revient à ignorer la moitié de la connaissance du monde. Beaucoup des adeptes de Suhan prennent cela à cœur, et mènent des mouvements pour la progression des femmes, et prennent parfois des actions violentes contre les propriétaires d'esclaves.\n\nAujourd'hui un tel incident s'est produit. Avec une demi-douzaine de gardes et le propriétaire de la plantation pendus pour leurs crimes perçus ; les esclaves de la plantation, libérés à la pointe de la lance, fuient maintenant dans la campagne. La réalité est que $COUNTRY$ est encore un endroit où l'esclavage est légal, et que le $MONARCHTITLE$ le veuille ou non, la loi exige justice. Le fils du propriétaire de plantation s'est présenté exigeant le retour des esclaves, et que les auteurs soient pendus pour leurs crimes. Que dit le $MONARCHTITLE$ ?"
 high_philosophy_events.111.a:0 "La violence engendre la violence. Indemniser le fils, mais rien de plus."
 high_philosophy_events.111.b:0 "Envoyer des équipes de recherche et traduire ces hommes en justice."
 high_philosophy_events.112.t:0 "La Conséquence de la Ferveur"
 high_philosophy_events.112.d:0 "La Praxis de Suhan enseigne de nombreuses croyances et pratiques qui semblent antithétiques aux écoles plus traditionnelles de Haute Philosophie. En particulier, la Praxis de Suhan dicte que le faste des Hauts Temples, leurs coussins de velours, chandeliers dorés et ornements luxueux, devrait être traité avec une ferveur presque iconoclaste. Pour eux, l'ajout de mortels à ces temples sous forme de biens de luxe est une profanation de ces lieux saints, souillés par les tentations de l'homme. Les philosophes qui suivent la Praxis de Suhan feront souvent un point d'honneur à retirer ces objets et à les fondre, ou à les vendre si possible. En pratique, ils devraient laisser tranquilles les fresques, statues et artefacts laissés par les Hauts Dieux, mais ce n'est pas toujours le cas.\n\nLe $MONARCHTITLE$ vient de recevoir des rapports troublants d'un groupe poussant ce principe doctrinal trop loin, et dans le processus de retrait des luxes a défiguré et enlevé les gemmes et métaux du mur d'un Haut Temple mineur. La population locale, en particulier les membres de l'école du Turban de Soie, est outrée et exige une action sévère. Pourtant, pour une raison quelconque, ces hommes se sont rendus et implorent le pardon ; un petit groupe de pratiquants de la Praxis de Suhan les suit, plaidant pour la clémence."
 high_philosophy_events.112.a:0 "Exécutez-les. La fresque est irremplaçable ; leurs actions impardonnables."
 high_philosophy_events.112.b:0 "Ils sont clairement juste égarés. Un peu de temps en prison leur fera du bien."
 high_philosophy_events.113.t:0 "Le Poids de nos Paroles"
 high_philosophy_events.113.d:0 "La Haute Philosophie a toujours été une énigme en matière de tolérance. Les peuples de Haless qui suivent la Voie Accréative, la Voie Transmutative et l'Accord Mystique sont souvent autorisés à suivre leurs fois sans être dérangés. Pourtant, les choses changent au sein des confins des diverses écoles de Haute Philosophie. Depuis ses humbles débuts comme forme syncrétisée de l'ancienne foi Devimarjan, schisme après schisme a déchiré la doctrine. Œil Étoilé et Palais Doré, Âme Ascendante et Griffe Indomptée, Soleil Radieux et toutes les autres ; fondamentalement opposées sur les questions de Visatma, Svayatma et émulation respectivement.\n\nBien que toutes les écoles ne soient pas à la gorge les unes des autres, l'effusion de sang d'aujourd'hui n'a fait qu'accroître les tensions supposément enterrées dans des conciles depuis longtemps passés. La conversation dans la Salle du Débat Éternel en est venue aux mains, et au sein de notre propre capitale un désaccord philosophique se termine par des lames, les sols du palais tachés de sang. La violence qui définit la réformation, du père de l'Écharpe Orangée contre le fils de la Praxis, se reflète dans nos cercles. Nous avons publié un édit de tolérance, pourtant si nous ne pouvons même pas nous tolérer nous-mêmes, alors à quoi bon notre parole ? Peut-être l'édit était-il une erreur…"
 high_philosophy_events.113.a:0 "Hélas, nous ne pouvons pas contrôler la violence d'un individu."
 high_philosophy_events.113.b:0 "Amenez les autres écoles dans la chambre : nous devons régler cela."
 high_philosophy_events.150.t:0 "Rouvrir d'Anciennes Blessures"
 high_philosophy_events.150.d:0 "En l'an 289, le Premier Concile Jagabharaata de Rayavashapal mena au deuxième grand schisme de la Haute Philosophie. La tradition jadis unie se scinda en trois sur la nature de l'atma. Les débats concernant sa compartimentation, sa distribution et sa transmutabilité menèrent les précurseurs de l'Âme Ascendante et de l'Œil Étoilé à se séparer des précurseurs de l'école du Palais Doré. La Praxis de Suhan souligne la vérité trouvée à travers les enseignements de toutes les écoles de Haute Philosophie. Une façon dont elle le fait est d'argumenter pour une voie du milieu : une nature mutable de l'atma dépendante de la nature et des croyances du soi. Plusieurs fonctionnaires locaux suivant les écoles du Palais Doré et de l'Œil Étoilé dans $PROVINCE$ voient le schisme récent comme une répétition de ce problème vieux de plusieurs siècles. Pour une fois unis contre un ennemi commun, et avec une fureur vertueuse, ils ont lancé des appels à la violence dans toute la province. Les deux partis lancent maintenant ouvertement boue et flèches, non seulement contre les agents du [Root.Monarch.GetTitle], mais aussi contre ceux au sein de leurs propres écoles qui refusent d'accepter leur position. La population a été prise entre deux feux."
 high_philosophy_events.150.a:0 "Dépouiller ces fonctionnaires de leurs titres et les bannir."
 high_philosophy_events.150.b:0 "Envoyer des troupes supplémentaires dans la région : maintenir la paix."
 high_philosophy_events.151.t:0 "Parcourir le Chemin"
 high_philosophy_events.151.d:0 "Un des volets du plan de [Root.Monarch.GetName] pour convertir la population était centré sur l'emploi de groupes mixtes de soldats et de philosophes appelés Jireedeehana. La structure spécifique et le nombre d'hommes variaient d'un État à l'autre, mais leur mission clé était la même. Répandre la parole de Suhan en parcourant le monde conformément à sa doctrine tout en tenant un compte détaillé de leurs allées et venues.\n\nL'espoir de [Root.Monarch.GetName] était toujours que ces Jireeraturadeehana aideraient à atteindre les groupes plus éloignés de convertis potentiels au fond des zones rurales de $COUNTRY$ ; cependant, ils n'ont pas encore atteint cet objectif. Beaucoup de nos sujets ruraux ne sont pas enclins à se convertir à la doctrine de Suhan. L'école de l'Écharpe Orangée en particulier maintient une mainmise sur ces groupes, les enracinant dans la tradition familiale. Certains sont même allés jusqu'à tendre des embuscades aux Jireeraturadeehana sur le sentier tandis qu'ils marchent. La question a été soulevée à la cour plusieurs fois maintenant, mais [Root.Monarch.GetName] a finalement été poussé à prendre une décision."
 high_philosophy_events.151.a:0 "Trésorier ! Allouez des fonds pour des soldats supplémentaires."
 high_philosophy_events.151.b:0 "Ils finiront par se rallier. Ignorez-les."
 high_philosophy_events.152.t:0 "Le Soleil Levant"
 high_philosophy_events.152.d:0 "Quand le soleil se lève, les pratiquants de l'école du Soleil Radieux sont là pour accueillir le nouveau jour. Ils prient les Hauts Dieux et les remercient pour le matin et pour tout le monde autour d'eux. Ils sont rejoints à leur tour par les quelques pratiquants du Culte du Soleil au Rahen, qui font à leur tour leurs propres prières. Les deux groupes ont, pendant les siècles après la conquête du Rahen par Jaher, prié ensemble en paix. Cependant, en cette ère de conflits, la paix a été rompue par l'arrivée de la Praxis de Suhan.\n\nComme les anciennes fois des déserts de Sarhal, et l'école du Soleil Radieux, les adeptes de la Praxis de Suhan prient également le matin. Les Hauts Dieux sont remerciés pour leur travail de bannissement des ténèbres primordiales dans les premiers jours du monde, et, plus important encore, pour avoir ouvert le chemin vers le Purtara à tous. Bien que beaucoup dans le cercle du Guru Suhan aient espéré que ce groupe commun les rapprocherait, cela n'a fait que déchirer davantage la tapisserie.\n\nAujourd'hui, un groupe de pratiquants de la Praxis a fait face au Haut Temple pour leur prière du matin et ont été accueillis par des pierres, des couteaux et une violence inexorable, une violence qui exige une réponse."
 high_philosophy_events.152.a:0 "Envoyer les troupes."
 high_philosophy_events.152.b:0 "Envoyer une délégation dans un esprit de réconciliation."
 high_philosophy_events.153.t:0 "Paroles Vides"
 high_philosophy_events.153.d:0 "Tolérer le différent, l'inconnu, est souvent plus facile à dire qu'à faire. Quand les hostilités commencèrent à éclater, [Root.Monarch.GetName] déclara un édit de tolérance religieuse, stipulant que tous les groupes religieux de la grande tradition rahenie devaient être considérés comme égaux. L'intendant et le héraut ont dispersé l'édit au loin, pourtant il semble de plus en plus que [Root.Monarch.GetTitle] se soucie peu de faire appliquer ses paroles.\n\nPlusieurs Jireedeehana renégats se sont mis à terroriser les pratiquants locaux des anciennes écoles de Haute Philosophie, et en conséquence de nombreuses exécutions extrajudiciaires et représailles ont eu lieu. Plusieurs villages et petites villes ont commencé à se déchirer alors que l'ancien et le nouveau se saisissent mutuellement à la gorge. Le gouffre doctrinal s'élargit de jour en jour, et à moins que [Root.Monarch.GetTitle] ne mette de la force derrière ses paroles, la violence ne fera que continuer à s'intensifier."
 high_philosophy_events.153.a:0 "Notre temps est mieux employé ailleurs."
 high_philosophy_events.153.b:0 "Publier un édit."
