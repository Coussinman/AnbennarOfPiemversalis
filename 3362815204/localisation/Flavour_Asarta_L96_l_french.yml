 #Estate
 estate_church_akhaxpa_mutation: "Akhaxpa"
 estate_church_akhaxpa_mutation_desc: "Akhaxpa est un type spécial de naga à trois yeux avec des capacités magiques au-delà de tout ce que les hommes-lézards ont jamais vu. Elle a la capacité de voir différents avenirs et de nous dire comment nous pouvons les changer. Une seule n'est jamais née et elle réside dans notre pays. Ses appartements sont emplis d'encens brûlant, car elle dit que cela aide à aiguiser ses sens."
 estate_church_akhaxazai_mutation: "Changelings"
 estate_church_akhaxazai_mutation_desc: "Les hommes-lézards ont changé. Ou plus précisément, ils ne cessent jamais de changer. Chaque génération a une apparence radicalement différente de la précédente. Même en grandissant, leur apparence change dramatiquement. Certains deviendront d'une taille extraordinaire avec des membres régénérants. Puis la génération suivante pondra 10 fois plus d'œufs par couvée avec chaque homme-lézard naissant comme avorton. Rien, semble-t-il, ne peut arrêter ce changement."

 #Rebels
 asarta_merfolk_rebels_name: "Ondins"
 asarta_merfolk_rebels_title: "Guerriers des Profondeurs"
 asarta_merfolk_rebels_army: "Armée des Ondins"
 asarta_merfolk_rebels_desc: "Les ondins vivent sous la mer et sont parfaitement capables de se battre pour leur territoire."
 asarta_merfolk_rebels_demands: "Laissez-nous tranquilles !"
 asarta_merfolk_rebels_demands_desc: "Les ondins ne voient pas d'un bon œil quiconque s'immisce dans le monde sous les vagues."