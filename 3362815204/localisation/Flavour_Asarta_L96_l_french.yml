l_french:

 #Missions
 L96_the_rival_city_title: "La Cité Rivale"
 L96_the_rival_city_desc: "« Les naga ont choisi Sykar pour être celui qui mènerait les hommes-lézards vers le 333ᵉ et dernier Empire prophétisé. Il n'avait que deux ans. Je n'étais même pas encore sorti de l'œuf. Toute ma vie, j'ai été contraint de jouer les seconds rôles ; de commander les forces auxiliaires et d'applaudir chaque conquête, chaque victoire de mon frère aîné, même lorsqu'elles lui étaient servies sur un plateau. Ce fut après sa conquête de Zerat, arrachée à ce pénultième empire affaibli, que je ne pus le supporter davantage. Si je devais prouver que j'étais capable de mener l'empire final, aux naga, à mon frère, à tous, je devais m'emparer de la capitale d'un ennemi bien plus redoutable. Bien que mon frère croie encore que j'agis pour servir son ambition, une fois que j'aurai pris la cité de Karassk, tous les hommes-lézards connaîtront MON nom. Katyradz Griffefluve : le VÉRITABLE héritier du trône de l'Empire Final ! »"

 L96_riverboats_on_the_sea_title: "Barques Fluviales sur l'Océan"
 L96_riverboats_on_the_sea_desc: "Les Hommes-Lézards Arraskay sont un peuple tribal qui a vécu dans les terres entre l'ancien empire de Zerat et les nombreuses grandes cités-États lézardes qui parsèment le littoral. Leur existence est plus humble, survivant dans les jungles denses du Taneyas. Ceux de la lignée Griffefluve perpétuent une longue tradition de commerce fluvial, acheminant des marchandises entre la côte et les montagnes, s'enrichissant bien au-delà de ce que leurs modestes origines laissaient présager. Pourtant, lorsque nous avons lancé nos pirogues fluviales sur cette vaste étendue d'eau nouvelle, nous avons découvert que ce qui suffisait pour la navigation fluviale ne se traduisait guère en navigabilité maritime."

 L96_the_besieged_tribe_title: "La Tribu Assiégée"
 L96_the_besieged_tribe_desc: "Nous ne questionnons point les ondins lorsqu'ils demandent de l'aide. Nous ignorons ce qui les attaque sous les vagues car ils ne veulent pas nous le dire, et c'est leur droit. Ils ont secouru nos nouveaux marins lorsque nos premières traversées maritimes se sont soldées par un désastre. Si nous tentions d'extorquer des informations maintenant, nous risquerions le courroux des esprits marins qui ont envoyé les ondins à notre secours. Alors, quand ils nous demandent d'établir une présence militaire sur une petite île au milieu de la mer, notre réponse naturelle est d'accepter, sans poser de questions. Ils ne nous diraient pas pourquoi de toute façon."

 L96_underwater_conflict_title: "Conflit Sous-Marin"
 L96_underwater_conflict_desc: "Les ondins ne nous disent pas grand-chose, et nous ne leur demandons pas de le faire, mais nous pouvons déduire beaucoup de ce qu'ils nous disent, et de ce qu'ils omettent stratégiquement. Nous savons que les populations d'ondins si loin au nord sont clairsemées, bien plus nombreuses étant celles du sud. Nous savons également que les ondins sont loin de former un empire uni. Les conflits territoriaux ne sont pas rares, et il peut même y avoir des guerres autour de la foi et de l'idéologie.\n\nD'après ce que nous avons pu rassembler, il apparaît que les ondins que nous avons aidés ont commis une sorte de grave péché, impliquant possiblement la magie. Nous ignorons quoi, et nous ne jugeons point. Ce que nous savons, grâce à l'avertissement d'Akhaxpa, c'est que nos protecteurs sous-marins vont être attaqués et anéantis si nous ne faisons rien. Postez des troupes dans la baie peu profonde de Cheneskad. Ces ondins apprendront bientôt qu'ils ne sont pas les seuls familiers du combat aquatique."

 L96_merfolk_magic_warfare_title: "Magie de Guerre des Ondins"
 L96_merfolk_magic_warfare_desc: "Il semble que la tribu d'ondins que nous avons assistée soit devenue bien plus puissante sous la mer. Bien que nous ignorions l'étendue complète de leurs conquêtes sous-marines, il apparaît qu'ils ont été bénis d'une génération de mages doués, qui à leur tour ont imprégné leurs tridents et autres armes de pouvoirs magiques supplémentaires. Bien que nous ayons eu quelques soupçons à ce sujet, ce ne fut que lorsque leur Reine, elle-même une puissante mage, remonta à la surface et nous offrit un trident magique, que nos soupçons furent confirmés. Nos mages sont fascinés par le trident, car ses décharges aquatiques peuvent détoner à l'impact, même sous l'eau. Mieux encore, il s'est révélé remarquablement facile à copier et pourrait être adapté comme arme pour nos propres navires."

 L96_eawuba_kayba_reef_title: "Le Récif d'Eawuba Kayba"
 L96_eawuba_kayba_reef_desc: "Les paroles d'Akhaxpa ébranlèrent $MONARCH$ jusqu'au plus profond de son être. Quelle guidance avons-nous suivie tout ce temps ? Qui, ou quoi, est le Héraut du Changement ? Qui que ce soit, nous ne pouvons pas lui laisser savoir que nous avons été avertis. Aucun homme-lézard ne doit le savoir. Heureusement, il y en avait une à qui nous pouvions nous confier : la Reine de notre tribu alliée d'ondins, bien qu'appeler cela une tribu à ce stade fasse un incroyable tort à son Royaume sous-marin en perpétuelle expansion. Peut-être leur savoir magique nous aiderait-il à démasquer ce héraut.\n\nLa rencontre fut brève. Sa connaissance de la langue des hommes-lézards était limitée, et cette conversation devait se faire sans traducteur, mais dès que le nom du Héraut du Changement fut prononcé, elle fit taire notre $MONARCHTITLE$ tandis qu'une expression sombre se répandait sur son visage. « Je connais ce Héraut, » dit-elle, « mais nous ne pouvons aider. Nous ne, comment vous dites, contrôlons pas Eawuba Kayba. C'est une… forêt. Magique. Féerique. Nous ne contrôlons pas. Mais si vous contrôlez terre, nous contrôlons mer. »"

 L96_the_herald_of_change_title: "Le Héraut du Changement"
 L96_the_herald_of_change_desc: "Les mers au-dessus du Récif d'Eawuba Kayba scintillent la nuit de milliers et de milliers de lumières éthérées. Ajoutez le reflet des étoiles, et cela brille presque aussi intensément qu'en plein jour. Le faible bruit de gloussements peut être entendu chevauchant le ressac tandis que la marée du récif vient lécher le rivage. Naviguez sur ces mers sans précaution et vous pourriez découvrir que votre coque a fait pousser un arbre entièrement nouveau, ses racines s'étendant jusque dans les quartiers des marins. Ce n'est pas un endroit où quiconque oserait normalement s'aventurer.\n\nPourtant, $MONARCH$ se tient ici, immergé jusqu'à la taille sur le rivage, flanqué de deux ondins. Nos alliés nous ont sécurisé un passage au plus profond du récif, bien qu'ils n'aient pu trouver aucun ondin disposé à entrer là où ils croient que se trouve le passage vers le royaume féerique. De surcroît, le bâton magique offert à notre $MONARCHTITLE$ ne peut créer une bulle d'air suffisante que pour une seule personne. Alors [Root.Monarch.GetSheHe] y va seul. Pour rencontrer le Héraut du Changement. Pour lui dire d'arrêter."

 L96_end_the_ikilshebe_title: "Mettre Fin aux Ikilshebe"
 L96_end_the_ikilshebe_desc: "Les humains. Répugnants, vils, sans écailles ; violents sans remords ni réflexion. Ce fut une erreur divine le jour où ils apprirent à frapper deux pierres l'une contre l'autre. S'ils avaient simplement compris leur place en-dessous de nous, peut-être auraient-ils pu être laissés en vie. Mais au lieu de cela, ils nous ont chassés. Les humains des terres à l'ouest n'ont pas seulement chassé l'ancienne culture des Hommes-Lézards Irikin, mais ils nous ont massacrés et ont porté nos écailles en trophées macabres. Encore aujourd'hui, ils s'enfoncent plus loin. Plus profondément dans nos jungles ils avancent. Nous ne pouvons continuer à les traiter comme des nuisibles. Ils sont une menace pour notre fière civilisation. Ils sont une menace pour tout ce qui est noble et juste en ce monde. Écrasez-les maintenant, et donnez leurs corps en pâture aux tchokens. Leur peau sans écailles ne ferait même pas un trophée convenable."

 L96_proper_lumber_title: "Du Bois Convenable"
 L96_proper_lumber_desc: "Nos premières tentatives de braver les mers furent embarrassantes. Mais qu'il ne soit jamais dit qu'Asarta perd courage face à l'échec. Cela ne nous a pas dissuadés lorsque les naga ont choisi Sykar pour mener les hommes-lézards vers l'Empire Éternel, et nous ne serions pas dissuadés parce que quelques bateaux avaient eu leur coque écrasée. Nous avons maintenant le savoir de comment construire des navires plus robustes. Nos pirogues fluviales renforcées de roseaux filandreux ne sont tout simplement pas adaptées à l'océan ouvert. Avec de multiples couches de bois épais, nous pouvons reprendre la mer, rassurés de savoir que les ondins nagent sous nous, nous protégeant du pire scénario."

 L96_scaled_seas_title: "Mers Écailleuses"
 L96_scaled_seas_desc: "Il semble pittoresque maintenant que notre premier voyage se soit soldé par un tel désastre. Les hommes-lézards sont des naturels sur la mer. Jetez un humain à la mer et riez tandis qu'il se noie. Jetez un homme-lézard par-dessus bord et il s'adaptera au changement d'environnement sans effort. Avec les ondins nous protégeant en-dessous, nous pouvons faire nôtre tout le Golfe d'Adzalaz. Accélérons la production, équipons nos navires des plus belles cordes et voiles que nos constructeurs puissent rassembler, et les mers appartiendront à Asarta !"

 L96_the_irikin_planes_title: "Les Plaines d'Irikin"
 L96_the_irikin_planes_desc: "Cela fait des siècles que les Araizary ont dansé pour la dernière fois à travers les plaines. Ils sont partis avec les hommes-lézards, sachant que les humains essaieraient de les écorcher eux aussi s'ils mettaient leurs mains sans écailles sur eux. Ces terres étaient jadis leur foyer autant que le nôtre. Avec les humains chassés, ils peuvent revenir. Araizarach, Demeure des Araizary, peut renaître."

 L96_retake_our_spire_title: "Reprendre Notre Flèche"
 L96_retake_our_spire_desc: "Les Zatsarya sont sacrées pour les hommes-lézards. Bâties par le tout premier empire d'hommes-lézards, elles sont le signe que nous sommes capables de prouesses incroyables et que notre peuple atteindra de nouveau ces sommets. Pourtant, la flèche d'Irikin a été souillée par la présence des humains. Ils grouillent à sa base comme des rats au fond d'un tonneau. Leur influence est une pourriture sur ces terres et sur la grande flèche elle-même. Nous devons la purifier de leur présence et remettre la Zatsarya entre nos mains."

 L96_revive_irikin_culture_title: "Raviver la Culture Irikin"
 L96_revive_irikin_culture_desc: "Bien que les hommes-lézards soient généralement chez eux dans la jungle, ce n'est pas universellement le cas. L'immense variété de mutations parmi les hommes-lézards signifie qu'au fil des années, nous nous sommes adaptés à tous les types d'environnements. Les anciens hommes-lézards Irikin étaient plus adaptés aux plaines ouvertes de ces prairies vallonnées, avec des écailles résistantes à la chaleur adaptées à l'absence de canopée de jungle.\n\nLes tribus Griffefluve dont Asarta a fait ses humbles débuts furent originellement formées par des hommes-lézards fuyant l'assaut des humains sur leurs terres, l'ancien Empire Karassien échouant à protéger la région de cette vermine. Mais les hommes-lézards sont remarquablement adaptables. Les nouveaux enfants nés sur les plaines sont plus à l'aise sous le soleil brûlant que dans les jungles humides de leurs grands-parents. L'ancienne culture Irikin est née à nouveau."

 L96_correct_the_naga_title: "Corriger les Naga"
 L96_correct_the_naga_desc: "Les naga ne sont pas une entité centralisée, mais plutôt un réseau qui partage idées et savoir. Même le naga solitaire qui guide une seule tribu doit voyager pour chercher la sagesse auprès des naga anciens dans les grandes cités afin de mieux soutenir son peuple. Bien que le consensus tende à se répandre graduellement parmi les naga, il n'est pas toujours absolu. Il y a des naga à Asarta, après tout, qui croient maintenant qu'il était prématuré de croire que Rayaz serait l'unificateur prophétisé de tous les hommes-lézards. Nous devons envoyer ces naga pour contrecarrer le précédent consensus selon lequel Taneyas serait unifié sous Sykar Griffefluve et ses fils.\n\nEt s'ils se rangent du côté de Rayaz, nous les écraserons eux aussi."

 L96_khateshala_answers_title: "Les Réponses de Khateshala"
 L96_khateshala_answers_desc: "Malgré l'incroyable déclaration de Katyradz, un malaise persiste parmi la cour d'Asarta. Pourquoi les naga ne nous ont-ils pas choisis ? Qu'ont-ils vu ou non vu en nous qui les a conduits à nous négliger ? Nous avons besoin de réponses. Interrogez les esprits, le divin, tout ce qui peut voir au-delà du monde mortel et percevoir notre destin.\n\nUn bon premier pas serait de parler aux hommes-lézards uniques des Îles Rankaty. Y réside un certain nombre d'hommes-lézards à trois yeux uniques dont la pupille supplémentaire confère d'incroyables pouvoirs magiques de prescience. Mieux encore, nous avons récemment reçu des nouvelles d'un nouveau naga à trois yeux tout juste éclos. La combinaison des pouvoirs magiques latents de tous les naga avec la prescience accordée par le troisième œil pourrait signifier que nous avons un être capable de voir le destin lui-même et de nous dire comment changer le nôtre. Le nom qui lui a été donné est Akhaxpa, signifiant Celle du Changement. Un bon présage s'il en fut."

 L96_the_court_of_change_title: "La Cour du Changement"
 L96_the_court_of_change_desc: "Les naga se sont révélés peu fiables. Nous les rallierons tous éventuellement, mais pour nos objectifs, nous nous tournons vers le naga à trois yeux, Akhaxpa, et ses guidances. Nous devons devenir l'incarnation du changement, car sans cela, l'Empire Éternel ne sera jamais atteint. Elle nous a conseillé de nous tourner vers les esprits pour guidance et de rassembler de l'encens pour ses besoins. Elle a appelé de tels esprits « fées » dans sa façon habituelle de parler par détours, mais nos mystiques ont compris à quoi elle faisait référence : les araizary.\n\nLes araizary sont les esprits bienveillants qui ont protégé les hommes-lézards depuis le 2ᵉ Empire. Ils sautillent sur les vagues et dansent le long des rivières, guident les hommes-lézards perdus dans les jungles denses, et nous montrent les significations dans les mouvements des étoiles. Au fil du temps, leur importance pour les hommes-lézards a décliné, et nous devons corriger cela. De tous les araizary que nous connaissons, les Sahra sont ceux qui incarnent peut-être le mieux les principes du « changement ». Trouvez les bosquets aux fleurs odorantes que les Sahra aiment fréquenter au plus profond des jungles du Taneyas et transformez-les en grands sanctuaires. Peut-être alors recevrons-nous leurs bénédictions."

 L96_claim_the_prophecy_title: "Revendiquer la Prophétie"
 L96_claim_the_prophecy_desc: "Lorsque Sykar Griffefluve prit la grande cité de Zerat, il le prit comme signe qu'il était véritablement l'élu qui annoncerait la venue du 333ᵉ Empire. Au lieu de cela, tout ce que cela accomplit fut l'ascension d'Asarta, poussant son jeune frère, Katyradz, à l'action. Maintenant nous voici, au sommet de tout le Taneyas, la grande cité entre nos griffes. Nous n'avons peut-être pas encore unifié tous les hommes-lézards, mais nous savons désormais que notre ascension est inévitable. Le Taneyas changera. La prophétie a changé. Les deux sont nôtres désormais."

 L96_inscribe_our_legend_title: "Graver Notre Légende"
 L96_inscribe_our_legend_desc: "Puisque notre empire sera éternel, chaque homme-lézard qui y naîtra devra savoir comment notre légende a commencé. Ils devront connaître Katyradz et comment sa fureur et son ambition l'ont poussé à renier son frère et à emprunter ce chemin vengeur. Ils devront savoir comment nous n'avons pas seulement unifié les hommes-lézards, mais fait renaître la culture Irikin défunte, car nous serons l'empire pour tous les hommes-lézards, passés et présents.\n\nEt enfin, ils doivent connaître le Héraut du Changement. Voilà pourquoi nous faisons cela en secret. Il ne doit pas savoir que nous sommes conscients de son existence. Nous ignorons ce qui se passera lorsque nous confronterons le Héraut. Son pouvoir pourrait dépasser tout ce que nous pouvons rassembler. Tant d'empires furent écrasés avant de commencer parce qu'ils se sont mêlés d'êtres aux pouvoirs de dieux. Seuls, nous pouvons admettre que nous ne bâtirons peut-être pas l'empire final. Si nous échouons, les véritables héritiers de l'empire final doivent savoir pourquoi nous sommes tombés. Nous avons défié le Héraut du Changement. Et si nous ne tombons pas, nous pourrons amender ce récit avec deux mots finaux :\n\nNous avons vaincu."

 L96_the_greater_riverclaw_title: "Le Plus Grand des Griffefluve"
 L96_the_greater_riverclaw_desc: "Le jour où nous avons proclamé Rayaz comme notre rival fut doux-amer. Les deux frères n'avaient pas à être ennemis. Si Sykar avait reconnu les talents naturels de son cadet, la capacité innée de régner, il aurait reconnu qu'il n'était pas destiné à unifier les hommes-lézards et aurait dû se retirer, comme tout véritable disciple des traditions Anzalkatsa devrait le faire. Au lieu de cela, nous serons enfermés dans un conflit sans fin, à travers nos enfants et à travers ses enfants, génération après génération, jusqu'à ce que l'un de nous cède le droit de régner."

 L96_quash_all_rayaz_loyalist_title: "Écraser Tous les Loyalistes de Rayaz"
 L96_quash_all_rayaz_loyalist_desc: "Dans la tradition Anzalkatsa, si vous vous tenez sur le chemin de quelqu'un qui peut accomplir une tâche mieux que vous, il est de votre obligation morale de vous écarter et de le laisser faire. Nous savions que nous pouvions unifier les hommes-lézards. Nous savions que Rayaz était le mauvais choix. Alors nous sommes partis et l'avons prouvé. Pourtant, il y a encore ceux qui croient à tort que Rayaz se relèvera. Des naga blasphématoires soutiennent des hommes-lézards rebelles sur notre territoire légitime.\n\nLa conclusion est simple : nous devons les exterminer. Si, lorsqu'on leur demande qui devrait régner sur Asarta, ils ne répondent pas la lignée de la famille Katyradz, alors ils doivent être traités dans leur ignorance comme tout autre intrus humain sauvage sur le Taneyas et massacrés sur-le-champ. Quiconque arbore les armoiries de la lignée défaillante de Sykar, qui professe sa loyauté à Rayaz, doit être éliminé. Chassez chacun d'entre eux de leurs terriers fétides et finissez-en une bonne fois pour toutes."

 #Events
 asarta.1.t: "Pirogues Chavirées"
 asarta.1.d: "Ce fut l'erreur de calcul du siècle. Ces simples pirogues n'étaient pas faites pour affronter de telles vagues. Si l'équipage avait été plus près du rivage, ils auraient pu nager ; un peu d'eau n'effraie point un homme-lézard. Mais le clan Griffefluve n'avait tout simplement jamais eu à gérer de telles conditions sur la rivière. La tempête n'était même pas si forte, pourtant en à peine une demi-heure, chaque navire avait chaviré ; leurs mâts brisés, leur cargaison dévastée, leurs coques en lambeaux.\n\nC'est à ce moment que des créatures émergèrent des eaux en-dessous. Des moitiés inférieures de poisson laissaient place à un corps supérieur presque humanoïde, quoique couvert d'écailles, de nageoires et de teintes de peau multicolores. D'abord, les nombreux marins naufragés paniquèrent en voyant les créatures saisir des hommes-lézards inconscients, croyant qu'elles emportaient leurs corps pour les dévorer sous les vagues. Mais à mesure que d'autres créatures apparaissaient, elles apportaient avec elles des cordes et d'étranges dispositifs flottants.\n\nUn par un, ils traînèrent autant de naufragés qu'ils purent vers diverses constructions de bois, les attachèrent fermement, puis commencèrent à lancer des cordes à diverses créatures marines qu'ils avaient amenées avec eux, principalement des dauphins. Le chef apparent du groupe, un gentilhomme à l'air sévère avec une nageoire rouge vif sur le sommet de la tête, pointa silencieusement vers le rivage, puis fit comprendre qu'ils devaient s'accrocher fermement. Avec un sifflement sonore, tout l'équipage commença à nager vers la terre, les hommes-lézards épuisés en remorque.\n\nMiraculeusement, il n'y eut aucun mort. Au moins quelques membres d'équipage jurèrent de ne plus jamais quitter les jungles, soignant des blessures psychologiques qui dureraient des années, mais rien de plus grave que cela. Les étranges créatures ne demandèrent jamais rien. Un observateur plus cynique pourrait dire que notre cargaison perdue au fond de la mer leur appartenait désormais et qu'ils n'avaient besoin d'aucun autre paiement. Pour la plupart cependant, ce fut l'acte de bravoure le plus désintéressé jamais vu par un homme-lézard. Il y avait des gens dans la mer qui nous protégeraient. Si quoi que ce soit, cela rendait la mer plus sûre."
 asarta.1.a: "Nous leur devons la vie"

 asarta.2.t: "Politique Sous-Marine"
 asarta.2.d: "Les étranges créatures sous la mer qui ont aidé nos frères naufragés continuent de fasciner les nombreux nouveaux marins d'Asarta. Nous avons depuis appris qu'ils s'appellent ondins, mais leur origine reste mystérieuse. Ils n'apparaissent dans les registres d'aucun empire historique d'hommes-lézards, et même le vieil empire falsifié de Karassk les considérait davantage comme des nuisibles que comme des amis.\n\nPour nous, ce sont des gardiens, bien qu'ils ignorent largement nos bateaux lorsque nous tentons d'envoyer des messages. Désormais, il est devenu pratique courante pour un nouveau bateau de d'abord laisser tomber une caisse de cargaison lestée contenant divers objets utiles dans la mer, dans l'espoir qu'elle sera utile aux ondins. Nous ne les dérangeons pas, car de toute évidence ils ne souhaitent pas être dérangés. Nous savons qu'ils veillent sur nous, et c'est tout ce dont nous avons besoin de leur part.\n\nC'est pourquoi ce fut si surprenant lorsque presque un millier d'ondins arrivèrent sur le rivage de Karassk. Par l'intermédiaire d'un traducteur ondin qui ne connaissait qu'une poignée de mots en langue lézarde, ils expliquèrent qu'ils avaient besoin d'un havre sûr pour bâtir une nouvelle demeure juste au large de notre cité, et qu'ils auraient besoin de fournitures pour accomplir cela. Ils ne voulurent pas expliquer pourquoi. Le maximum que nous obtînmes en guise d'explication fut qu'ils étaient attaqués, et en effet quelques-uns d'entre eux portaient des blessures visibles.\n\nMais nous n'avons pas besoin de savoir. Ils nous ont sauvés sans rien savoir de nous. Nous devons faire de même."
 asarta.2.a: "Construisons-leur leur établissement"

 asarta.3.t: "Relations avec les Ondins"
 asarta.3.d: "Depuis que nous avons donné aux ondins les matériaux dont ils avaient besoin pour bâtir leur établissement sous-marin, nous n'avons que très peu entendu parler d'eux. Au large de Karassk, vous verrez des lumières scintiller sous les vagues, et de jeunes ondins curieux s'approcheront de nos navires, replongeant timidement si quelqu'un à bord tente de leur parler.\n\nCertains s'inquiètent que nous les ayons offensés d'une façon ou d'une autre. Des recherches plus approfondies dans les archives historiques montrent que les ondins ont toujours été secrets. Peut-être est-ce dans leur nature, ou peut-être un mauvais traitement aux mains de l'ancien Empire Karassien signifie qu'on leur a appris à ne pas faire confiance aux hommes-lézards.\n\nQuelles que soient leurs raisons, nous respecterons leur intimité et ne nous enquérons point jusqu'à ce qu'ils soient prêts à s'ouvrir à nous. Ce serait malchanceux de faire autrement. Quels que soient les esprits qui ont béni nos bateaux pour qu'ils soient sauvés par les ondins, ils nous abandonneraient probablement si nous trahissions leur confiance. Les humains nous ont écorchés quand ils nous ont rencontrés. Les ondins nous ont sauvés. Nous rendons la pareille à chacun."
 asarta.3.a: "Nous les protégeons comme ils nous protègent"

 asarta.4.t: "Les Attaques des Profondeurs"
 asarta.4.d: "La baie de Cheneskad se transformait en lagune à marée basse lorsque le banc de sable s'élevait au-dessus de l'eau. Pour la baie elle-même, le niveau d'eau chutait, l'établissement des ondins reposant au fond. L'attaque allait arriver à marée haute, c'était évident. Seulement à ce moment les ondins rivaux pourraient attaquer.\n\nNos navires attendaient à l'extérieur de la baie, guettant les signes d'ondins nageant en-dessous. Une fois qu'ils donneraient le signal, les navires vireraient et cingeraient vers la baie, les hommes-lézards sautant dans les eaux peu profondes près du banc de sable pour combattre. En eau profonde, nous n'aurions aucune chance. Mais dans un mètre et demi d'eau, ils apprendraient que les Hommes-Lézards Arraskay sont plus que capables de combat aquatique.\n\nSur le bateau se tenait notre $MONARCHTITLE$. À [Root.Monarch.GetHerHis] côtés se tenait un hydromancien, prêt à donner le signal, et Akhaxpa, ses trois yeux fermés. C'était aussi silencieux que possible sur la mer. Le craquement du bateau alors que les vagues le léchaient était l'un des rares sons omniprésents, tout comme les cris des mouettes au-dessus. Puis une rumeur commença à se répandre. Les hommes-lézards se penchèrent par-dessus le bord du bateau, tout comme $MONARCH$. C'était difficile à distinguer, mais il y avait du mouvement. Les ondins étaient là.\n\n$MONARCH$ leva la main et l'équipage se tut, se plaçant en position. Quelques-uns saisirent des armes et prièrent pour que les araizary de la mer les protègent. L'hydromancien tenait son bâton en l'air et attendait. Puis, après que le dernier ondin fut passé sous le navire, [Root.Monarch.GetHerHis] $MONARCHTITLE$ abaissa [Root.Monarch.GetHerHis] bras et hurla."
 asarta.4.a: "À L'ATTAQUE !!!"

 asarta.5.t: "La Première Vague"
 asarta.5.d: "L'embuscade fut un succès retentissant ! Les navires avaient accosté dans la baie et une fête avait commencé, avec pas moins de 50 tchokens rôtis préparés pour les équipages. Aucun ondin ne se joignit à la fête, bien que beaucoup levèrent la tête au-dessus de l'eau pour observer. Ils avaient eux aussi participé à la bataille pour défendre leur village, résultant en une attaque en tenaille qui ne laissa aux ondins attaquants nulle part où se replier.\n\n« Ne devraient-ils pas faire la fête eux aussi ? » demanda l'un des généraux du $MONARCHTITLE$. « La menace sur leur village a pris fin. Si cela n'est pas digne d'une célébration, alors rien ne l'est. » Le $MONARCHTITLE$ claqua le dos du général et répondit entre deux bouchées de tchoken rôti : « Ne vous souciez pas d'eux. Nous ne devrions pas nous immiscer dans leur culture, car ils ne s'immiscent pas dans la nôtre. Ils peuvent ressentir le besoin de pleurer leurs morts avant toute célébra... »\n\nLes paroles du $MONARCHTITLE$ furent coupées par un cri perçant soudain d'Akhaxpa. Ses yeux s'ouvrirent d'un coup, une lumière jaillissant, plus brillante que les feux de cuisson à travers le camp. Elle se tourna vers $MONARCH$, l'extrémité de sa longue queue s'enroulant autour de sa jambe tandis qu'elle commençait à parler précipitamment. « Ils reviendront. Une force bien plus grande et plus puissante. Cette attaque n'était qu'une force de reconnaissance. La prochaine sera leur armée entière. C'est une mission d'extermination. Ils ne se reposeront pas tant que ce village ne sera pas anéanti. Ils croient qu'ils sont trop dangereux.\n\n« Ils arrivent. J'ignore quand. Un an, deux ans. Mais ils viendront. Et ils anéantiront tout le monde. » Sur cette déclaration finale, Akhaxpa ferma les yeux et s'effondra au sol."
 asarta.5.a: "Nous allons avoir besoin d'une plus grande armée stationnée sur cette île…"

 asarta.6.t: "L'Assaut"
 asarta.6.d: "Un homme-lézard paniqué se précipita dans la salle de guerre de Cheneskad. Les ondins étaient là ! Des milliers, peut-être des dizaines de milliers, avaient été repérés sous la mer. Un navire éclaireur s'était échappé de justesse. Ils se dirigeaient vers Cheneskad, et la marée haute serait dans quelques heures."
 asarta.6.a: "Chaque lézard à son poste !"

 asarta.7.t: "Un Établissement Libre"
 asarta.7.d: "Des milliers et des milliers d'hommes-lézards étaient arrivés à Cheneskad. Ils disaient que ce serait une fête dont on parlerait pendant des générations. Des entreprises entièrement nouvelles avaient surgi du jour au lendemain sur l'île autrefois peu peuplée. De nouveaux marchands arrivaient, les propriétaires terriens originaux vendant leurs humbles fermes pour d'énormes profits tandis que de riches commerçants voulaient utiliser l'île pour des plantations d'épices rares, le sol de l'île étant particulièrement adapté à cela.\n\nDe l'autre côté de l'île, loin de la cité grandissante et des festivités, se tenait une petite délégation : le $MONARCHTITLE$, ses gardes et conseillers, et Akhaxpa. Face à eux dans l'eau peu profonde se trouvait un groupe d'ondins. Les locaux connaissaient assez le village pour pouvoir identifier qu'il s'agissait de la famille royale. Pas de gardes, pas de conseillers. Juste le roi, la reine et leur fille cadette.\n\nLe Roi dressa son corps du mieux qu'il put dans l'eau peu profonde et parla dans une langue lézarde fortement accentuée et hésitante : « Merci pour aide. Nous sommes… reconnaissants... » Il hissa son corps plus haut en utilisant son bâton comme levier. À son sommet se trouvait ce qui semblait être une gemme de Damestear pure. « Nous ne plus besoin aide. Nous… sommes… » il se tourna et regarda maladroitement sa famille. La Reine et le Roi commencèrent à parler à voix basse dans leur langue ondin, s'énervant graduellement, avant que soudain la fille cadette ne les interrompe et ne pointe Akhaxpa.\n\n« Cette chose vous l'a dit. Elle savait. » Des halètements éclatèrent des deux côtés, les hommes-lézards remuant maladroitement dans l'eau peu profonde. Le Roi marmonna et se jeta en avant pour attraper sa fille, mais elle se hissa hors de l'eau entièrement là où il ne pouvait l'atteindre. « Comment savait-elle ? » $MONARCH$ s'agenouilla, face à face avec la jeune ondin. « Parce qu'elle peut voir des choses que nous ne pouvons voir. Elle peut voir l'avenir, ou un avenir qui se produira si nous ne le changeons pas. »\n\nLa jeune ondin, apparemment satisfaite de la réponse, se laissa glisser de nouveau dans l'eau et nagea vers ses parents à l'air furieux. Avec un dernier regard vers la délégation lézarde, elle leur fit un signe de la main, avant de disparaître sous la surface de l'eau une fois de plus."
 asarta.7.a: "Je me demande si nous la reverrons"

 asarta.8.t: "Rencontre avec le Héraut du Changement"
 asarta.8.d: "$MONARCH$ plongea sous l'eau, suivant les guides ondins tandis qu'ils repoussaient les nymphes aquatiques qui faisaient de ce récif féerique leur demeure. Mais alors qu'[Root.Monarch.GetSheHe] nageait dans une zone plus profonde de récifs et de coraux, eux aussi reculèrent. [Root.Monarch.GetSheHeCap] nagea plus profond, et plus profond, et plus profond, puis… moins profond ? Pourquoi nageait-[Root.Monarch.GetSheHe] maintenant vers le haut ? Quelque chose n'allait pas. [Root.Monarch.GetSheHeCap] paniqua, donnant des coups de jambes pour se remettre à l'endroit, jusqu'à ce que le sol semble s'élever sous [Root.Monarch.GetHerHis] jambes et qu'[Root.Monarch.GetSheHe] crève la surface de l'eau.\n\n[Root.Monarch.GetSheHeCap] recracha de l'eau, puis chercha [Root.Monarch.GetHerHis] bâton à tâtons, et commença lentement à prendre conscience de [Root.Monarch.GetHerHis] environnements. [Root.Monarch.GetSheHe] était sur la terre ferme pour une raison quelconque. Le corail avait laissé place à un fourré dense d'arbres tordus avec des lumières scintillant entre eux. Et au centre même de cette clairière, regardant de haut ce lézard presque noyé, se trouvait un papillon de nuit gigantesque avec un masque blanc là où son visage aurait dû être. Derrière ces yeux brillaient des lumières bleues aveuglantes.\n\n« Tu es tout à fait idiot, » dit une voix qui semblait émaner à la fois du papillon et de partout à la fois. « Tu as vraiment essayé de nager jusqu'au royaume féerique. Si je n'avais pas déjà su que tu venais, tu te serais simplement perdu et aurais été pris par les nymphes. J'ignore comment tu as appris mon existence… les ondins, peut-être. » $MONARCH$ se releva sur ses pieds. « Tu es le Héraut du Changement. Je viens avec une exigence. Laisse les hommes-lézards tranquilles. Nous n'avons plus besoin de ton aide. »\n\nDes rires résonnèrent à travers la clairière, des gloussements doux se mêlant aux éclats de rire bruyants du Héraut. « Besoin de moi ? Vous n'avez besoin d'aucune aide pour vous détruire vous-mêmes. Je l'ai vu encore et encore. Tu n'es pas différent. Ton espèce désire le changement, et il ne peut y avoir de changement dans votre empire éternel que vous désirez. Mais… » Le Héraut s'interrompit et les gloussements qui émanaient sans fin des arbres s'apaisèrent. « Tu pourrais devenir l'essence du changement toi-même. Ton espèce mute déjà au fil des générations, un trait des plus fascinants. Cela ne ferait qu'accélérer le processus.\n\n« Accepte mon offre. Prends le pacte et devenez des changelings. Car si ton empire doit être éternel, tous ceux qui s'y trouvent devraient être éternellement changeants. »"
 asarta.8.a: "Devenir des Changelings"
 asarta.8.b: "Frapper le Héraut du Changement au visage"

 asarta.9.t: "Changelings"
 asarta.9.d: "La lumière derrière le masque du Héraut brilla plus intensément que jamais auparavant, avant de s'évanouir dans les ténèbres. La lumière autour du fourré s'assombrit et le sol lui-même commença à trembler. $MONARCH$ tomba à genoux, agrippant [Root.Monarch.GetHerHis] poignet avec horreur. Devant [Root.Monarch.GetHerHis] yeux, [Root.Monarch.GetHerHis] griffe commença à muter, des poignards de douleur aiguë transperçant [Root.Monarch.GetHerHis] corps entier. Les écailles durcirent puis commencèrent à peler. Des plumes poussèrent sur les bras avant de se flétrir. Une griffe géante en forme de faucille poussa de [Root.Monarch.GetHerHis] paume. Un autre œil apparut sur [Root.Monarch.GetHerHis] visage, puis un second, puis une autre paire de chaque côté. La douleur était si aveuglante que $MONARCH$ s'effondra au sol, les yeux fermement clos, quel que soit leur nombre maintenant, et hurla simplement.\n\nGraduellement, soudainement, après une éternité et aucun temps du tout, cela s'arrêta simplement. Toute douleur cessa. Tremblant et se relevant, $MONARCH$ se sentait… différent. [Root.Monarch.GetHerHis] jambes étaient plus longues, les bras plus courts mais plus musclés. La coloration de [Root.Monarch.GetHerHis] écailles avait entièrement changé. [Root.Monarch.GetSheHe] leva les yeux vers le Héraut, dont le visage masqué ne montrait aucune émotion, mais la voix avec laquelle il parlait donnait quelques indices. Pas de la joie, mais peut-être de la fierté ?\n\n« Va, mon changeling. Toi et tous les tiens. Vous êtes maintenant des êtres de pur changement. Allez et devenez les agents du changement pour tout Halann, et peut-être même au-delà. »"
 asarta.9.a: "L'Avènement des Changelings"

 asarta.10.t: "Pourquoi les Naga Ont-Ils Nié Notre Destin"
 asarta.10.d: "« DEHORS ! »\n\n$MONARCH$ lança un javelot au-dessus de la tête du dernier messager, qui hurla, se baissa et détala rapidement hors des appartements de $MONARCH$. [Root.Monarch.GetHerHis] conseillers remuaient nerveusement là où ils se tenaient. Un naga individuel qui rejetait notre revendication à la prophétie pouvait être ignoré. Tout naga encore à Rayaz pouvait être compris aussi comme ne voulant pas changer de camp si rapidement. Mais que chaque conseil de naga auquel nous avons envoyé une délégation rejette notre offre…\n\nQuelque chose n'allait pas. Le Taneyas avait besoin de changement. Les hommes-lézards avaient besoin de changement. Par-dessus tout, les naga avaient besoin de changer. Les quelques naga qui se sont rangés du côté de Katyradz n'étaient pas suffisants pour convaincre tous les hommes-lézards que nous sommes ceux qui réclameront la prophétie. Si nous continuions ainsi, nous finirions comme Karassk : un vaste royaume mais néanmoins jamais reconnu comme un « empire » par les naga, et donc inéligible à la prophétie et rejeté par le reste des Hommes-Lézards. Nous avons peut-être pris la cité de Karassk mais nous ne voulons pas revendiquer leur héritage aussi.\n\nIl y a une piste que nous pouvons suivre, cependant. Nous avons réussi à faire rallier un naga à Asarta : un transfuge de Karshyr. Un naga ne fait pas bouger beaucoup l'aiguille, mais il nous a alertés sur un naga qui pourrait. Sur les Îles Rankaty, un naga à trois yeux a récemment éclos, béni de l'incroyable pouvoir de parler aux esprits au-delà de notre vision. En communion avec de tels esprits, ce nouveau-né peut accéder à tous les avenirs prophétisés, parler à ceux qui connaissent tous les passés, et peut nous guider vers le seul chemin où nous réclamons la prophétie pour nous-mêmes. Peut-être ce nouveau-né à trois yeux a-t-il les réponses que nous cherchons."
 asarta.10.a: "Cherchons ce naga mystique"

 asarta.11.t: "Le Héraut Mystique"
 asarta.11.d: "Notre $MONARCHTITLE$ fut conduit dans la hutte où vivait le jeune naga à trois yeux. La pièce était remplie d'un encens si étouffant qu'il rendait difficile de respirer ou même de voir. Là, sur un grand coussin brodé, était assise Akhaxpa, le naga. Elle n'avait pas de membres, comme tous les autres naga, mais avec ses yeux fermés, il était difficile de distinguer si elle avait le troisième œil. Alors que $MONARCH$ s'agenouillait face à elle, elle déroula son corps serpentin sans ouvrir les yeux et leva la tête jusqu'à être face à face avec $MONARCH$.\n\n« Tu n'apporteras pas le changement », déclara-t-elle, ouvrant ses trois yeux, chacun brillant comme un phare de pure lumière bleue depuis les orbites. Cela aveugla temporairement $MONARCH$, qui plissa les yeux pour essayer de regarder le naga en face de nouveau. [Root.Monarch.GetSheHe] avait rencontré certains des uniques hommes-lézards khateshala à trois yeux depuis son arrivée sur les Îles Rankaty, mais aucun d'eux n'avait des yeux qui brillaient ainsi.\n\n« Je peux apporter le changement », balbutia $MONARCH$, avant de prendre une profonde inspiration pour calmer [Root.Monarch.GetHerHis] nerfs. « J'ai déjà changé le cours de l'histoire par rapport à ce que les autres naga disaient devoir advenir. J'ai mis fin à l'Empire Karassien. Si cela ne suffit pas, alors dis-moi. Dis-moi comment je peux devenir quelqu'un capable d'apporter le changement au Taneyas. »\n\nAkhaxpa approcha son visage jusqu'à ce que ses yeux fixent directement le visage de $MONARCH$, l'aveuglant si complètement qu'[Root.Monarch.GetSheHe] ne pouvait voir que le pur éclat bleu clair. Le temps sembla s'arrêter tandis que des murmures et des gloussements jouaient dans [Root.Monarch.GetHerHis] tête. La pièce semblait s'éloigner, comme si [Root.Monarch.GetSheHe] entrait dans un plan entièrement différent. Puis lentement, tout redevint visible, et le naga recula, rétrécit ses yeux et sourit.\n\n« Tu as fait la première chose que tu devais faire. Tu as changé mon avis. »"
 asarta.11.a: "Qu'est-ce que c'était que ça ?!?"

 asarta.12.t: "Ajouter aux Mythes : La Prophétie"
 asarta.12.d: "$MONARCH$ était assis seul dans la chambre. La table d'écriture ornée devant laquelle [Root.Monarch.GetSheHe] était assis était sculptée dans du marbre, avec pas moins de 50 encriers différents tout autour. Bien que la plupart des bureaucrates et marchands utilisent la langue écrite à quatre couleurs plus moderne, et franchement simplifiée, [Root.Monarch.GetSheHe] estimait que tous les documents historiques devaient être écrits dans le style traditionnel des hommes-lézards avec son immense palette de couleurs. Comment autrement transmettre la complexité du langage ? Sans couleur, les mots de quelqu'un pourraient être pris pour du sarcasme ou de la colère alors que ce n'était jamais l'intention. Une telle chose rendrait la communication par le seul mot écrit périlleuse !\n\nMais quelles couleurs utiliser ? Qu'en est-il de la prophétie, et comment notre voyage a commencé lorsque Katyradz l'a défiée ? Comment voulons-nous que son héritage soit rappelé ?"
 asarta.12.a: "Rouge, la couleur de la vengeance"
 asarta.12.b: "Bleu marine, car c'était le destin"
 asarta.12.c: "Vert vif, car c'était une action avisée"

 asarta.13.t: "Ajouter aux Mythes : Irikin"
 asarta.13.d: "Et qu'en est-il d'Irikin ? Qu'en est-il de la purification de nos terres des humains ? Si nous n'écrivons pas cela correctement, on pourrait nous voir comme des monstres. Un mal qui a commis une atrocité. Parfois les hommes parlent de leurs cauchemars sur ce qu'ils ont commis, qu'aucun rappel de notre place naturelle au-dessus des humains ne semble effacer. Les bons mots pourraient justifier nos actions, surtout avec la bonne couleur."
 asarta.13.a: "Rouge, la couleur de la vengeance"
 asarta.13.b: "Bleu marine, car c'était le destin"
 asarta.13.c: "Vert vif, car c'était une action avisée"

 asarta.14.t: "Ajouter aux Mythes : La Cour du Changement"
 asarta.14.d: "Qu'en est-il de la cour du changement ? Le changement que nous avons apporté au Taneyas, et la guidance d'Akhaxpa que nous avons suivie ? Plus important encore, qu'en est-il du Héraut du Changement ? Comment en parlons-nous ? Osons-nous même mettre son nom par écrit ? S'il pouvait dire que le village des ondins allait être attaqué, sait-il que ceci sera écrit ? Pourquoi avons-nous suivi ses ordres ? Était-ce toujours destiné à se passer ainsi ? Ou était-ce le bon cours d'action depuis le début et il a simplement fallu ce Héraut pour nous aider à voir ?\n\nRegardant par-dessus son épaule, le $MONARCH$ prit la plume et sélectionna une couleur avec laquelle commencer à chroniqueur cette partie la plus délicate de notre récit."
 asarta.14.a: "Rouge, la couleur de la vengeance"
 asarta.14.b: "Bleu marine, car c'était le destin"
 asarta.14.c: "Vert vif, car c'était une action avisée"

 asarta.15.t: "Ajouter aux Mythes : Final"
 asarta.15.d: "Entreposer les archives des empires était un processus rituel, mais c'en était un né du désir de garder ces archives en sécurité. D'abord le parchemin était trempé dans la sève translucide d'un arbre natif du Taneyas, qui séchait l'encre et la préservait. Puis un nouveau conteneur de pierre lourd était déterré, le couvercle retiré, et les archives placées délicatement à l'intérieur. Avec une dernière poussée, la pierre glissait de nouveau en place, prête à être préservée.\n\nLe processus n'avait pas changé depuis des milliers et des milliers d'années. Le Héraut n'était pas là. Même le Héraut ne pouvait changer cela. $MONARCH$ voyait cela comme presque un dernier acte de résistance contre la tyrannie du voyant. Ici, les traditions des hommes-lézards ne changent pas.\n\n$MONARCH$ pouvait voir l'image du Héraut devant [Root.Monarch.GetHerHim] ; dans le silence des archives, [Root.Monarch.GetSheHe] lui parla. Tu ne peux empêcher cet acte de mémoire. Tu ne peux non plus empêcher notre éternité par ton désir de changement sans fin. Notre légende a été écrite. Tu ne peux plus changer cela maintenant."
 asarta.15.a: "Nous accomplirons la prophétie"

 asarta.16.t: "Frapper le Héraut"
 asarta.16.d: "Le Héraut poussa un cri strident et recula en arrière, ses ailes géantes battant frénétiquement tandis qu'il tombait au sol. « Comment oses-tu, comment oses-tu, comment oses-tu », cria-t-il encore et encore. Après quelques secondes de cris et de battements répétés, il fut capable de reprendre l'air et se retourna vers le seul homme-lézard qui venait de frapper une archifée au visage. Au milieu du masque du Héraut courait une fissure géante. « Quel était ton plan alors ? Es-tu venu ici simplement pour me frapper ? L'incompréhensible stupidité de ton espèce dépasse même ma prévoyance. Qu'est-ce que cela allait accomplir ? »\n\n$MONARCH$ serra [Root.Monarch.GetHerHis] poing, du sang coulant le long de [Root.Monarch.GetHerHis] paume. « Je veux que mon peuple s'élève au-dessus de tous. Je ne veux pas que notre destin dépende du caprice d'êtres d'un autre monde. Je veux que nous le prenions nous-mêmes. En bref, » $MONARCH$ sourit, regardant le papillon de nuit géant en face tandis que son masque se fendait lentement le long de la fissure, « je voulais le changement. »\n\nLa lumière derrière le masque du Héraut brilla plus intensément que jamais auparavant, emplissant entièrement la vision de $MONARCH$. Le sol céda sous [Root.Monarch.GetHerHim] et [Root.Monarch.GetSheHe] tomba. [Root.Monarch.GetSheHeCap] tomba et tomba si longtemps que [Root.Monarch.GetHerHis] conscience céda, la lumière si aveuglante qu'elle [Root.Monarch.GetHerHim] vida de toute conscience. Après… des heures ? Des jours ? Des semaines ? Quelque chose l'éveilla : une forte odeur d'encens.\n\n$MONARCH$ leva les yeux vers ceux d'Akhaxpa. Il n'y avait pas de lumière derrière eux. Juste trois pupilles fendues avec des teintes de jaune et de vert. Elle sourit et dit simplement…"
 asarta.16.a: "Merci"

 asarta.17.t: "Le Fils de Sykar"
 asarta.17.d: "Il n'a même pas bronché quand $MONARCH$ pointa [Root.Monarch.GetHerHis] lance à quelques centimètres de son visage. Le fils de Sykar. Celui qui a instigué ces rébellions. Celui que $MONARCH$ venait d'écraser dans son intégralité. Pourtant, il restait simplement assis là dans sa cellule de cachot, regardant calmement le long de la hampe de la lance de $MONARCH$, comme s'il n'y avait rien à craindre.\n\n« As-tu accepté que la prophétie a changé alors ? » $MONARCH$ baissa [Root.Monarch.GetHerHis] lance et s'agenouilla devant le fils déchu. « Que les naga avaient tort. Que ton père avait tort. As-tu accepté que tu dois te retirer pour accomplir la prophétie comme un vrai disciple de l'Anzalkatsa ? »\n\nLe fils sourit sombrement. « Je sais tout de toi et de tes objectifs déments au nom du changement. Des absurdités incompréhensibles, pourchassant des ombres à cause d'un héritage de rejet. Cette poursuite d'une force mythique du changement est folie, un mécanisme de défense pour gérer le fait que mon père ait été choisi plutôt que toi. Tu ne seras qu'un autre échec dans une liste de prétendants au trône. Tu n'apporteras pas le change... »\n\nSes derniers mots furent interrompus alors que $MONARCH$ enfonça [Root.Monarch.GetHerHis] lance à travers la gorge de son neveu, ses dernières paroles de défiance s'étouffant dans un gargouillis."
 asarta.17.a: "Nous verrons bien"

 asarta.100.t: "Relations avec les Ondins"
 asarta.100.d: "d"
 asarta.100.a: "a"

 asarta.101.t: "Monument du Changement"
 asarta.101.d: "Un épais brouillard d'encens emplissait la pièce où résidait la Cour du Changement. En son centre, étendue sur un ensemble de coussins, résidait Akhaxpa. Alors que le $MONARCHTITLE$ s'approchait d'elle et s'agenouillait, elle ouvrit ses trois yeux, emplissant la pièce d'une lumière bleue aveuglante.\n\n« Je vois que tu as apporté le changement aux grandes flèches de ces terres. Mais ce que tu as fait n'est pas suffisant. Tu dois changer ton attention de l'une à l'autre. Fixe tes yeux sur un seul monument et ton règne sera un monument à l'échec. »"
 asarta.101.a: "Comme tu le souhaites"
 asarta.101.b: "Je ne veux pas changer cela"

 asarta.102.t: "Intensifier la Production Ailleurs"
 asarta.102.d: "Un épais brouillard d'encens emplissait la pièce où résidait la Cour du Changement. En son centre, étendue sur un ensemble de coussins, résidait Akhaxpa. Alors que le $MONARCHTITLE$ s'approchait d'elle et s'agenouillait, elle ouvrit ses trois yeux, emplissant la pièce d'une lumière bleue aveuglante.\n\n« Si tu dois apporter le changement à ton peuple, tu dois changer ce que ton peuple utilise. Trop de dépendance aux mêmes matériaux des mêmes endroits mènera à la mort une fois que cela bougera. Ne sois pas comme la souris qui meurt quand son fromage est déplacé. Sois comme la souris qui se déplace là où est le fromage. »"
 asarta.102.a: "Comme tu le souhaites"
 asarta.102.b: "Je ne veux pas changer cela"

 asarta.103.t: "L'Anzalkatsa Aux Autres"
 asarta.103.d: "Un épais brouillard d'encens emplissait la pièce où résidait la Cour du Changement. En son centre, étendue sur un ensemble de coussins, résidait Akhaxpa. Alors que le $MONARCHTITLE$ s'approchait d'elle et s'agenouillait, elle ouvrit ses trois yeux, emplissant la pièce d'une lumière bleue aveuglante.\n\n« Ces églises que tu construis pour répandre ta foi. Pourquoi les gardes-tu quelque part où ils suivent déjà ? Elles ont servi leur but. Apporte le changement à plus de terres en apportant plus de temples à ces terres. Sinon la stagnation suivra. »"
 asarta.103.a: "Comme tu le souhaites"
 asarta.103.b: "Je ne veux pas changer cela"

 asarta.104.t: "Par-Dessus les Murs"
 asarta.104.d: "Un épais brouillard d'encens emplissait la pièce où résidait la Cour du Changement. En son centre, étendue sur un ensemble de coussins, résidait Akhaxpa. Alors que le $MONARCHTITLE$ s'approchait d'elle et s'agenouillait, elle ouvrit ses trois yeux, emplissant la pièce d'une lumière bleue aveuglante.\n\n« La magie est un grand outil de changement, n'es-tu pas d'accord ? J'ai un faible pour les mages. Mais rester trop longtemps dans la même tour, pratiquant les mêmes sorts, et ils deviennent complaisants et paresseux. Tu as les outils pour construire une tour. Tu devrais aussi avoir les outils pour la déplacer. »"
 asarta.104.a: "Comme tu le souhaites"
 asarta.104.b: "Je ne veux pas changer cela"

 asarta.105.t: "Irikin Au-Delà des Plaines"
 asarta.105.d: "Un épais brouillard d'encens emplissait la pièce où résidait la Cour du Changement. En son centre, étendue sur un ensemble de coussins, résidait Akhaxpa. Alors que le $MONARCHTITLE$ s'approchait d'elle et s'agenouillait, elle ouvrit ses trois yeux, emplissant la pièce d'une lumière bleue aveuglante.\n\n« Tu me plais, $MONARCHTITLE$. Tu as apporté le changement aux terres de l'ouest. Les hommes-lézards marchent maintenant là où marchaient jadis les humains. Mais il semble que tu aies négligé tes terres natales, où les mêmes gens vivent comme ils l'ont toujours fait. Les deux côtés pourraient profiter d'un changement d'environnement. »"
 asarta.105.a: "Comme tu le souhaites"
 asarta.105.b: "Je ne veux pas changer cela"

 asarta.106.t: "Une Nouvelle Voix"
 asarta.106.d: "Un épais brouillard d'encens emplissait la pièce où résidait la Cour du Changement. En son centre, étendue sur un ensemble de coussins, résidait Akhaxpa. Alors que le $MONARCHTITLE$ s'approchait d'elle et s'agenouillait, elle ouvrit ses trois yeux, emplissant la pièce d'une lumière bleue aveuglante.\n\n« Suivre les mêmes voix mènera aux mêmes résultats, même si ces résultats ne sont plus ceux que tu souhaites. Les voix qui murmurent à ton oreille ne sont pas celles du changement. Élimine-les. Fais entrer de nouvelles voix. Sinon tombe dans la ruine et sois oublié, comme tant avant toi le furent. »"
 asarta.106.a: "Comme tu le souhaites"
 asarta.106.b: "Je ne veux pas changer cela"

 asarta.107.t: "Succession"
 asarta.107.d: "Un épais brouillard d'encens emplissait la pièce où résidait la Cour du Changement. En son centre, étendue sur un ensemble de coussins, résidait Akhaxpa. Alors que le $MONARCHTITLE$ s'approchait d'elle et s'agenouillait, elle ouvrit ses trois yeux, emplissant la pièce d'une lumière bleue aveuglante.\n\n« Tu es peut-être un agent du changement, ou du moins tu fais l'effort. En cela je te félicite. Mais qu'en sera-t-il de ces terres quand tu passeras ? Crois-tu vraiment que tu laisses ta nation entre les mains du changement, ou ton héritier a-t-il simplement appris à imiter ce que tu fais ? Un héritier à l'aise dans sa position ne fera rien pour changer le chemin devant lui. »"
 asarta.107.a: "Comme tu le souhaites"
 asarta.107.b: "Je ne veux pas changer cela"

 asarta.108.t: "Changer le Marécage"
 asarta.108.d: "Un épais brouillard d'encens emplissait la pièce où résidait la Cour du Changement. En son centre, étendue sur un ensemble de coussins, résidait Akhaxpa. Alors que le $MONARCHTITLE$ s'approchait d'elle et s'agenouillait, elle bougea, mais contrairement à la plupart des autres fois, elle n'ouvrit que son œil du milieu. Il brûlait toujours d'un bleu vif comme toujours, mais il y avait des couleurs changeantes derrière cette fois.\n\n« Je vois que les Sorcières de la Nuit ont été en mouvement de nouveau. À un certain niveau, j'apprécie ce qu'elles font. Sans leurs avancées, ces terres ne changeront jamais. Elles détruisent, puis se retirent, et les royaumes sont reconstruits à neuf. C'est du changement, mais c'est un changement à court terme. Car je connais leurs objectifs. Je peux voir l'avenir qu'elles désirent. Une fusion du plan des ombres avec le nôtre. La fin de toute vie alors que les ombres absorbent tout. »\n\nAkhaxpa fixa $MONARCH$. « Tu dois les arrêter. Le changement qui est forgé au nom du néant éternel n'est pas du changement du tout. »"
 asarta.108.a: "Comme tu le souhaites"
 asarta.108.b: "Je ne veux pas changer cela"

 asarta.109.t: "Les Pieds Hors du Sol"
 asarta.109.d: "Un épais brouillard d'encens emplissait la pièce où résidait la Cour du Changement. En son centre, étendue sur un ensemble de coussins, résidait Akhaxpa. Alors que le $MONARCHTITLE$ s'approchait d'elle et s'agenouillait, elle ouvrit ses trois yeux, emplissant la pièce d'une lumière bleue aveuglante.\n\n« Les guerres apportent le changement. Mais la guerre elle-même ne change pas. Les mêmes mille hommes-lézards marchant au combat. Tu pourrais utiliser la cavalerie. Tu pourrais utiliser l'artillerie. Pourtant tu équipes toujours ton armée de rien d'autre qu'une lance et un rêve. »"
 asarta.109.a: "Comme tu le souhaites"
 asarta.109.b: "Je ne veux pas changer cela"

 asarta.110.t: "Se Concentrer sur le Changement"
 asarta.110.d: "Un épais brouillard d'encens emplissait la pièce où résidait la Cour du Changement. En son centre, étendue sur un ensemble de coussins, résidait Akhaxpa. Alors que le $MONARCHTITLE$ s'approchait d'elle et s'agenouillait, elle ouvrit ses trois yeux, emplissant la pièce d'une lumière bleue aveuglante.\n\n« Tu m'agaces. Depuis combien de temps te concentres-tu sur les mêmes objectifs ? Tu as sûrement dû les atteindre maintenant. Change de focus. Si tu n'as pas complété ces objectifs maintenant, tu ne le feras jamais. »"
 asarta.110.a: "Comme tu le souhaites"
 asarta.110.b: "Je ne veux pas changer cela"

 asarta.111.t: "Penser Différemment"
 asarta.111.d: "Un épais brouillard d'encens emplissait la pièce où résidait la Cour du Changement. En son centre, étendue sur un ensemble de coussins, résidait Akhaxpa. Alors que le $MONARCHTITLE$ s'approchait d'elle et s'agenouillait, elle ouvrit ses trois yeux, emplissant la pièce d'une lumière bleue aveuglante.\n\n« N'y a-t-il pas de nouvelles idées dans ta tête ? Ou celles de ton clergé ou de tes sages hommes-lézards ? Aucun d'eux ne peut apporter de nouvelles idées pour ton peuple ? Encore et encore, sans cesse, ils suivent les mêmes chemins, ne changeant jamais, ne faisant que des progrès incrémentaux. Tu as besoin de nouvelles idées. »"
 asarta.111.a: "Comme tu le souhaites"
 asarta.111.b: "Je ne veux pas changer cela"

 asarta.112.t: "Trouver Son Pied Marin"
 asarta.112.d: "Un épais brouillard d'encens emplissait la pièce où résidait la Cour du Changement. En son centre, étendue sur un ensemble de coussins, résidait Akhaxpa. Alors que le $MONARCHTITLE$ s'approchait d'elle et s'agenouillait, elle ouvrit ses trois yeux, emplissant la pièce d'une lumière bleue aveuglante.\n\n« Je pensais que les hommes-lézards étaient des naturels dans l'eau ? Pourquoi alors tant de ton peuple ne choisit-il pas une vie sur l'océan ? Je pensais que tu étais si fier du changement que ton peuple avait accompli en prenant la mer alors qu'autrefois il était un peuple de rivière. »"
 asarta.112.a: "Comme tu le souhaites"
 asarta.112.b: "Je ne veux pas changer cela"

 asarta.113.t: "Nouvelles Compétences"
 asarta.113.d: "Un épais brouillard d'encens emplissait la pièce où résidait la Cour du Changement. En son centre, étendue sur un ensemble de coussins, résidait Akhaxpa. Alors que le $MONARCHTITLE$ s'approchait d'elle et s'agenouillait, elle ouvrit ses trois yeux, emplissant la pièce d'une lumière bleue aveuglante.\n\n« Ne souhaite-t-on pas apprendre de nouvelles compétences ? N'imite pas ceux qui te disent de pratiquer un coup de pied mille fois, car on apprendra simplement à le parer. Apprends mille coups de pied et ils ne te pareront jamais. »"
 asarta.113.a: "Comme tu le souhaites"
 asarta.113.b: "Je ne veux pas changer cela"

 asarta.114.t: "Des Kobolds Parmi Nous"
 asarta.114.d: "Lors d'une de vos visites à un clan local, vous remarquez que malgré la température plutôt chaude, tous ses membres portent des vêtements épais. Intrigué par cela, vous prétendez saisir accidentellement la cape d'un guerrier voisin, la lui retirant. Ce que vous voyez vous stupéfie. Devant vous se trouvent deux kobolds, l'un sur le dos de l'autre. Le reste du clan les renie immédiatement, mais il est indéniable qu'ils sont tous des kobolds."
 asarta.114.a: "Ce sont des Hommes-Lézards, comme nous tous."
 asarta.114.b: "Bannissez-les."

 asarta.150.t: "Ils Sont en Danger"
 asarta.150.d: "Un épais brouillard d'encens emplissait la pièce où résidait la Cour du Changement. En son centre, étendue sur un ensemble de coussins, résidait Akhaxpa. Alors que le $MONARCHTITLE$ s'approchait d'elle et s'agenouillait, elle ouvrit ses trois yeux, emplissant la pièce d'une lumière bleue, quoique plus faible que d'habitude.\n\n« Ils sont en danger. » Akhaxpa parla d'un ton beaucoup plus doux cette fois. Derrière la lumière de ses yeux, des pupilles fendues sombres pouvaient être vues bouger. « D'autres ondins ne sont pas contents de leurs actions. Non pas pour avoir sauvé vos marins, mais pour autre chose. Une magie interdite. L'ostracisme ne suffit pas. »\n\n« Ceux de Karassk sont en sécurité, mais pas près de l'île de Cheneskad. Si vous n'agissez pas, ils mourront tous. Chacun d'eux sera massacré, leur village détruit, et les cadavres de leurs enfants laissés à pourrir sur le fond marin. » Akhaxpa s'interrompit, puis la lumière bleue vive derrière ses yeux devint plus brillante et sa voix changea subtilement. « Ils craignent le changement sous la mer. Ils n'attaqueront pas encore, car ils manquent d'alliés. Le temps est de votre côté. Avec votre aide, le changement au-dessus et en-dessous du niveau de la mer peut être accompli. »"
 asarta.150.a: "Nous pouvons les sauver"

 asarta.151.t: "Relations avec les Ondins"
 asarta.151.d: "$MONARCH$ entra dans la pièce où résidait la Cour du Changement, mais quelque chose était différent. Le brouillard d'encens habituel n'était pas là, bien que sa forte odeur demeure. Akhaxpa était à sa place habituelle, mais ses yeux étaient différents. Le troisième œil était fermé, et les deux restants n'avaient pas de lumière derrière eux. Au lieu de cela, il y avait des pupilles fendues, typiques de n'importe quel naga. Avant même que le $MONARCHTITLE$ puisse s'agenouiller, elle commença à parler d'un ton précipité.\n\n« Il ne s'arrêtera pas. Il ne veut pas que votre empire dure. Il veut le changement, et ce changement inclut vous détruire. Rien de ce que vous pouvez faire ne peut l'arrêter. Vous ne pouvez pas l'apaiser éternellement. Une fois qu'il sera lassé de vous, il se tournera vers d'autres méthodes pour vous détruire. Vous devez... » Elle ferma les yeux fermement et s'effondra au sol. La lumière commença à briller faiblement derrière ses orbites. Akhaxpa commença à se tordre, son corps serpentin se contorsionnant et s'enroulant sur lui-même, jusqu'à ce qu'enfin elle relève son corps et commence à parler d'un ton encore plus précipité.\n\n« Vous n'avez pas parlé avec moi. Vous avez parlé avec le Héraut du Changement ; un être puissant d'au-delà de ce plan. Il ne sait pas que je vous parle en ce moment. Écoutez-moi : il n'est pas un ami de vous ni des hommes-lézards. Il se délecte de la destruction des hommes-lézards encore et encore, car à ses yeux, chaque ascension et chute apporte le changement à nous, le chaos dont il se nourrit. » Elle s'effondra au sol, ses yeux se rétrécissant, tandis qu'un éclat bleu commençait à grandir derrière son troisième œil fermé.\n\n« Allez à Ardimya. Dans les océans au large de la côte, vous trouverez un endroit où vous pourrez traverser les plans et rencontrer le Héraut. J'ignore comment vous l'arrêterez. Il n'écoutera pas la rais... » Elle cria et se tordit sur le sol de nouveau. La lumière bleue commença à émaner de sous ses écailles. Avec les dernières forces qu'elle put rassembler, elle lâcha : « Quoi que vous fassiez, assurez-vous de le frapper au visage de ma part. Je ne peux pas le faire. Après tout, je n'ai pas de bras. »\n\nAvec un dernier sourire, elle s'effondra au sol. Il y eut un moment d'immobilité avant que ses trois yeux ne s'ouvrent d'un coup, la lumière bleue aveuglante en émanant, plus forte que jamais. Elle leva la tête et fixa le $MONARCHTITLE$. « Je vous prie de m'excuser, vous semblez m'avoir trouvée évanouie. Ma seule requête pour vous est d'envoyer l'un de mes aides pour remplir ces brûleurs. Il semble que mon encens soit épuisé. »"
 asarta.151.a: "Oui, je vous ai définitivement trouvée ici, évanouie, et rien d'autre"

 asarta.201.t: "Changelings"
 asarta.201.d: "Ressemblons-nous encore à des hommes-lézards ? Alors que les bras se déforment et se tordent, que les jambes grandissent et se renforcent, que les yeux s'affaiblissent tandis que l'ouïe s'intensifie, notre forme est à peine reconnaissable par rapport à celle des hommes-lézards d'il y a à peine 20 ans. Nous sommes des changelings, et dans chaque nouvelle forme réside notre pouvoir."
 asarta.201.a: "Une nouvelle forme a été adoptée"

 #Decisions
 asarta_akhaxpa_change_dec_title: "Requête d'Akhaxpa"
 asarta_akhaxpa_change_dec_desc: "La foi Anzalkatsa dit que nous devrions nous écarter, car nous ne sommes pas destinés à la grandeur. La prophétie est ailleurs. Nous devons changer cela. Si nous écoutons les requêtes d'Akhaxpa, le naga à trois yeux, nous pouvons devenir des agents du changement. En faisant cela, nous pouvons inverser la prophétie."
 asarta_akhaxazai_change_dec_title: "Changement"
 asarta_akhaxazai_change_dec_desc: "Le Héraut du Changement murmure à nos oreilles. Cela fait assez longtemps. Il est temps de changer de nouveau."

