 flavour_heroic_realm.1.t:0 "Recruter un Héros"
 flavour_heroic_realm.1.d:0 "Les lourdes portes de chêne ouvragé de la salle du trône s'ouvrirent dans un sourd fracas, annonçant l'arrivée d'un visiteur. Enveloppée d'une cape usée par les intempéries, la silhouette traversa d'un pas assuré le sol de marbre poli, ses bottes de cuir élimé murmurant le récit d'innombrables batailles. Ses mains, crispées, serraient un simple bout de parchemin, un décret royal en quête d'un Héros pour le royaume, arraché au panneau d'affichage poussiéreux d'une taverne locale. Le silence qui régnait à la cour était aussi pesant que l'armure du héros. Tous les regards convergeaient vers cette figure dont la seule présence imposait le respect. Ce n'était point un vulgaire soldat, mais un Héros destiné à mener notre royaume vers la gloire !"
 flavour_heroic_realm.1.a:0 "Levez-vous en héros, et chevauchez avec courage !"
 flavour_heroic_realm.1.b:0 "Cet avis a déjà expiré !"

 flavour_heroic_realm.2.t:0 "Le Prix de l'Héroïsme"
 flavour_heroic_realm.2.d:0 "En ces temps de disette, les plus démunis se retrouvent souvent sans les moyens de solliciter l'aide des aventuriers. Même les quêtes les plus modestes, telles que l'élimination d'une horde de goules répugnantes ou le bannissement d'un esprit mineur, demeurent sans réponse. Ces missions, jadis entreprises avec ardeur par des âmes vaillantes désireuses de prouver leur valeur, restent désormais négligées, témoignage poignant du sort de ceux qui ne peuvent s'offrir le luxe d'une protection.\n\nL'on raconte qu'à l'époque sombre de Jaher, les gouverneurs elfiques récompensaient les aventuriers de « deux sacs de riz ou leur équivalent », par-delà ce que les commanditaires pouvaient offrir, s'assurant ainsi que même les plus humbles appels à l'aide trouvaient réponse. Le rétablissement de cette pratique pourrait inspirer une résurgence de bravoure et de générosité, rappelant une ère où nul défi n'était trop modeste et nulle récompense trop humble pour ceux qui osaient affronter l'inconnu au nom du bien commun."
 flavour_heroic_realm.2.a:0 "Deux sacs de riz ou leur équivalent !"
 flavour_heroic_realm.2.b:0 "Deux sacs de riz et quelques vieilles armes dont nous n'avons plus l'usage !"
 flavour_heroic_realm.2.c:0 "Deux sacs de riz et un accès complet à l'armurerie !"

 flavour_heroic_realm.3.t:0 "L'Éveil des Héros"
 flavour_heroic_realm.3.d:0 "Des salles du pouvoir aux étals des marchés, des planchers des tavernes aux vastes plaines de Shamakhad, le même vent souffle. Un vent venu du nord, au goût de fer et de fumée. Le Vent de la Chimère.\n\nIl y a moins de quinze ans, les hobgobelins descendirent des montagnes, fondant sur une terre morcelée. Les querelles incessantes des royaumes septentrionaux les avaient laissés meurtris et divisés, incapables de s'unir face à la menace féroce que représentaient le Commandement et sa société vouée à la guerre. Ainsi le nord tomba-t-il, royaume après royaume, dans les ténèbres.\n\nLa marche des armées du Commandement semble inexorable à beaucoup, qui prédisent que la bannière aux trois têtes flottera bientôt sur tout Haless. Mais le combat du Rahen n'est pas encore terminé. Nous étions faibles lorsque le péril écarlate s'abattit sur nous, mais nous ne serons plus jamais faibles. Car si la première guerre contre les hobgobelins fut une guerre de princes, la prochaine sera une guerre de héros.\n\nLes royaumes du nord du Rahen sont souvent appelés les royaumes héroïques, une terre d'aventuriers et de mercenaires, de redresseurs de torts et de bandits. Pendant des siècles, ces héros servirent les princes de Shamakhad en temps de paix comme en temps de guerre, et notre société prospéra lorsque quiconque pouvait s'élancer épée ou arc en main pour devenir un héros.\n\nEt maintenant, en cette heure la plus sombre des royaumes héroïques, les princes lancent l'appel aux armes. La bataille finale contre le Grand Commandement approche à grands pas, et les héros encore en vie de Shamakhad useront de leur dernier souffle pour frapper la chimère en plein cœur."
 flavour_heroic_realm.3.a:0 "Nous tiendrons ensemble."