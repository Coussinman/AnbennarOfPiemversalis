 mechanic_nomad_yes:1 "Est §YNomade§!"
 republic_desc:0 "Une république est un État gouverné par ses citoyens. Le pouvoir n'est pas héréditaire mais entre les mains d'un chef d'État élu."
 theocracy_desc:0 "Dans une théocratie, l'autorité dérive d'un pouvoir divin. La classe dirigeante sera souvent le clergé lui-même et le chef de l'État sera son dirigeant."
