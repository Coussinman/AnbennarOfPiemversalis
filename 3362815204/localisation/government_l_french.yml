 statists_MECHANIC_TOOLTIP:0 "Quand les Statistes sont au pouvoir, nous aurons un nouveau dirigeant élu à la fin de son mandat, mais aucun dirigeant ne peut effectuer plus d'un mandat à la fois."
 orangists_MECHANIC_TOOLTIP:0 "Quand les Orangistes sont au pouvoir, notre dirigeant actuel continuera à gouverner jusqu'à sa mort."
