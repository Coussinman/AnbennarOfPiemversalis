l_french:
 IDEAEVENT_1_1_1:0 "Attaque contre les Droits Civiques"
 IDEAEVENT_1_1_2:0 "Notre ministre de la Justice tente depuis un certain temps de saper les droits civiques accordés par Votre Majesté. Plusieurs pétitions ont désormais attiré votre attention, vous suppliant d'intervenir."
 IDEAEVENT_1_1_3:0 "Déclarer que tout restera en l'état"
 IDEAEVENT_1_1_4:0 "S'ouvrir aux réformes"
 IDEAEVENT_1_2_1:0 "Juridiction Indépendante"
 IDEAEVENT_1_2_2:0 "Nos juges exercent leur fonction comme bon leur semble. Ils n'ont pas été la cible d'influences extérieures depuis un certain temps. La confiance en leur juridiction s'est donc considérablement accrue, mais nous avons également perdu une certaine influence sur eux."
 IDEAEVENT_1_2_3:0 "Nous ne nous en mêlerons pas"
 IDEAEVENT_1_2_4:0 "Peut-être devrions-nous y réfléchir"
 IDEAEVENT_1_3_1:0 "Congrès Judiciaire"
 IDEAEVENT_1_3_2:0 "Un grand congrès judiciaire se tient actuellement dans notre capitale. De grands noms sont venus assister à cette réunion, en faisant un pas majeur vers le droit international."
 IDEAEVENT_1_3_3:0 "Un grand jour pour la justice"
 #IDEAEVENT_1_3_4:0 ""
 IDEAEVENT_1_4_1:0 "Fondation d'une Université"
 IDEAEVENT_1_4_2:0 "Après des années de construction, une nouvelle université financée par [Root.GetName] est enfin achevée. Un grand jour pour le pays !"
 IDEAEVENT_1_4_3:0 "Excellent !"
 #IDEAEVENT_1_4_4:0 ""
 IDEAEVENT_1_5_1:0 "Nouvelle Chaire Professorale"
 IDEAEVENT_1_5_2:0 "Nous avons décidé de financer une nouvelle chaire professorale pour l'une de nos meilleures universités. Cela aidera non seulement nos efforts de progrès, mais renforcera également notre contrôle sur ladite université."
 IDEAEVENT_1_5_3:0 "À la science !"
 #IDEAEVENT_1_5_4:0 ""
 IDEAEVENT_1_6_1:0 "Expert Juridique"
 IDEAEVENT_1_6_2:0 "Cet homme est véritablement un génie du droit. Certains le qualifient déjà de légende, étant un excellent avocat au tribunal et un philosophe à ses heures."
 IDEAEVENT_1_6_3:0 "Il est vraiment remarquable !"
 #IDEAEVENT_1_6_4:0 ""
 IDEAEVENT_1_7_1:0 "Jugement Important"
 IDEAEVENT_1_7_2:0 "Notre Haute Cour a rendu un jugement très important. Cela affectera grandement la jurisprudence à l'avenir."
 IDEAEVENT_1_7_3:0 "Un jour important"
 #IDEAEVENT_1_7_4:0 ""
 IDEAEVENT_1_8_1:0 "Juge Corrompu"
 IDEAEVENT_1_8_2:0 "Il y a quelque temps, ce juge avait été accusé de corruption, mais nos appréhensions se sont maintenant confirmées. Il a effectivement reçu de l'argent de diverses parties pour influencer ses décisions."
 IDEAEVENT_1_8_3:0 "Le démettre de ses fonctions"
 #IDEAEVENT_1_8_4:0 ""
 IDEAEVENT_1_9_1:0 "Tendances Réactionnaires"
 IDEAEVENT_1_9_2:0 "Temps troublés ! Le peuple débat de la valeur et de la nécessité de ses droits civiques, et de manière choquante, beaucoup semblent prêts à y renoncer pour exiger plutôt une direction forte qui les guidera vers l'avenir."
 IDEAEVENT_1_9_3:0 "Défendre les droits civiques"
 IDEAEVENT_1_9_4:0 "Qu'importe ?"
 IDEAEVENT_1_10_1:0 "Scandale Judiciaire"
 IDEAEVENT_1_10_2:0 "Notre ministre de la Justice a découvert un réseau de corruption dans notre système judiciaire. Des juges, des auxiliaires et des administrateurs ont été soudoyés et ont acquis une grande influence sur les processus de notre administration. Comme les choses fonctionnent encore assez bien en surface, nous devons décider si nous voulons prendre des mesures drastiques ou laisser faire pour le moment."
 IDEAEVENT_1_10_3:0 "Nettoyer ce désordre"
 IDEAEVENT_1_10_4:0 "Ne rien faire"
 IDEAEVENT_2_1_1:0 "Essor de la Construction"
 IDEAEVENT_2_1_2:0 "L'année dernière fut une année de grands investissements. Nos innombrables projets d'infrastructure ont conduit à un véritable essor de la construction."
 IDEAEVENT_2_1_3:0 "Excellentes nouvelles !"
 #IDEAEVENT_2_1_4:0 ""
 IDEAEVENT_2_2_1:0 "Manufactures Privées"
 IDEAEVENT_2_2_2:0 "En promulguant des lois libérales, nous avons permis à nos guildes marchandes de fonder des manufactures privées. De nombreux hommes ont saisi cette opportunité, réalisé leurs rêves et possèdent désormais leur propre manufacture."
 IDEAEVENT_2_2_3:0 "Elles stimuleront notre production"
 #IDEAEVENT_2_2_4:0 ""
 IDEAEVENT_2_3_1:0 "Développement des Terres"
 IDEAEVENT_2_3_2:0 "Nous luttons constamment contre la nature pour défricher davantage de terres que notre peuple puisse cultiver."
 IDEAEVENT_2_3_3:0 "L'arracher à la nature"
 #IDEAEVENT_2_3_4:0 ""
 IDEAEVENT_2_4_1:0 "Les Infrastructures Portent leurs Fruits"
 IDEAEVENT_2_4_2:0 "Malgré un scepticisme initial, vous devez admettre que les grands projets d'infrastructure de ces dernières années commencent à porter leurs fruits."
 IDEAEVENT_2_4_3:0 "Excellent !"
 #IDEAEVENT_2_4_4:0 ""
 IDEAEVENT_2_5_1:0 "Prêts à la Construction"
 IDEAEVENT_2_5_2:0 "En limitant le montant des intérêts autorisés, nous espérons que davantage de personnes pourront obtenir des prêts afin d'investir dans notre économie."
 IDEAEVENT_2_5_3:0 "Une excellente idée"
 #IDEAEVENT_2_5_4:0 ""
 IDEAEVENT_2_6_1:0 "Abondance de Matériaux"
 IDEAEVENT_2_6_2:0 "Toute la production de matières premières a atteint un niveau record. La qualité des matériaux est globalement satisfaisante. Notre ministre de l'Économie prédit un essor de la construction pour au moins trois ans."
 IDEAEVENT_2_6_3:0 "Construire, construire, construire !"
 #IDEAEVENT_2_6_4:0 ""
 IDEAEVENT_2_7_1:0 "Pont Effondré"
 IDEAEVENT_2_7_2:0 "Un grave message nous est parvenu du ministre des Travaux publics. Un pont, achevé il y a peu, s'est effondré sous le poids d'un trafic intense. La cause de cet accident reste pour l'instant inconnue."
 IDEAEVENT_2_7_3:0 "Une tragédie"
 #IDEAEVENT_2_7_4:0 ""
 IDEAEVENT_2_8_1:0 "Corruption au Ministère des Travaux Publics"
 IDEAEVENT_2_8_2:0 "Nous avons appris qu'en raison de nos importants investissements dans les projets d'infrastructure, une partie de l'argent fourni par les caisses de l'État a disparu. Le ministre des Travaux publics ne s'attend pas à retrouver l'argent ni ceux qui l'ont volé."
 IDEAEVENT_2_8_3:0 "Là où il y a de l'argent, il y a de la corruption"
 #IDEAEVENT_2_8_4:0 ""
 IDEAEVENT_2_9_1:0 "Hiver Rigoureux"
 IDEAEVENT_2_9_2:0 "En raison d'un hiver rigoureux, la quasi-totalité de nos projets de construction a été interrompue. À cause des températures glaciales et des chutes de neige intenses, nous n'avons pas pu progresser autant qu'espéré."
 IDEAEVENT_2_9_3:0 "C'est la météo"
 #IDEAEVENT_2_9_4:0 ""
 IDEAEVENT_2_10_1:0 "Pénurie de Matériaux"
 IDEAEVENT_2_10_2:0 "Avec l'essor actuel de la construction, d'autres projets, ainsi qu'une petite crise dans la production de matières premières, une pénurie de matériaux s'est produite sur nos marchés intérieurs."
 IDEAEVENT_2_10_3:0 "Acheter ce dont nous avons besoin à nos voisins"
 IDEAEVENT_2_10_4:0 "Nous ne pouvons rien y faire"
 IDEAEVENT_3_1_1:0 "Nouveau Médicament Découvert"
 IDEAEVENT_3_1_2:0 "Un génie médical a trouvé de nouvelles façons d'utiliser une plante commune, en préparant une certaine tisane avec d'autres ingrédients qui aide grandement contre la fièvre."
 IDEAEVENT_3_1_3:0 "C'est une percée !"
 #IDEAEVENT_3_1_4:0 ""
 IDEAEVENT_3_2_1:0 "Ouverture d'un Hôpital Privé"
 IDEAEVENT_3_2_2:0 "Une guilde marchande locale a fait don à notre grande cité en fondant un hôpital pour les riches comme pour les pauvres."
 IDEAEVENT_3_2_3:0 "Formidable !"
 #IDEAEVENT_3_2_4:0 ""
 IDEAEVENT_3_3_1:0 "Réduction de la Mortalité Infantile"
 IDEAEVENT_3_3_2:0 "Grâce à nos efforts acharnés pour éduquer notre peuple à l'hygiène de base, nous avons pu réduire considérablement la mortalité infantile."
 IDEAEVENT_3_3_3:0 "Les dieux sont de notre côté !"
 #IDEAEVENT_3_3_4:0 ""
 IDEAEVENT_3_4_1:0 "La Formation des Médecins Porte ses Fruits"
 IDEAEVENT_3_4_2:0 "En finançant la formation des médecins, nous avons pu réduire le nombre de charlatans et de bouchers essayant de vendre leur prétendue sagesse dans les rues."
 IDEAEVENT_3_4_3:0 "C'était prévisible"
 #IDEAEVENT_3_4_4:0 ""
 IDEAEVENT_3_5_1:0 "Médecine Orientale"
 IDEAEVENT_3_5_2:0 "D'autres régions du monde ont des moyens différents de traiter des maladies similaires. Nous pouvons apprendre d'eux et intégrer dans notre arsenal ce qui fonctionne mieux là-bas que chez nous."
 IDEAEVENT_3_5_3:0 "Nous ne ferons pas de discrimination"
 #IDEAEVENT_3_5_4:0 ""
 IDEAEVENT_3_6_1:0 "Société des Médecins"
 IDEAEVENT_3_6_2:0 "La société des médecins tient un forum dans notre capitale. De nouvelles méthodes de traitement et des questions éthiques y sont débattues. Nous sommes certains de pouvoir profiter de cet échange constant entre experts et que la science en bénéficiera."
 IDEAEVENT_3_6_3:0 "Un pas dans la bonne direction"
 #IDEAEVENT_3_6_4:0 ""
 IDEAEVENT_3_7_1:0 "Peste Hors de Contrôle"
 IDEAEVENT_3_7_2:0 "Dernièrement, une peste dévaste nos provinces. Nos médecins sont aussi impuissants que les charlatans, l'Église et le gouvernement."
 IDEAEVENT_3_7_3:0 "Fermer les portes"
 #IDEAEVENT_3_7_4:0 ""
 IDEAEVENT_3_8_1:0 "Mercure"
 IDEAEVENT_3_8_2:0 "Le mercure était déjà utilisé par les Castanoriens comme moyen de traiter les maladies. Toutefois, des voix s'élèvent récemment pour interdire l'usage du mercure comme médicament. On dit que rien de bon ne vient de son ingestion."
 IDEAEVENT_3_8_3:0 "Interdire le mercure comme médicament"
 IDEAEVENT_3_8_4:0 "Mais ça fonctionne !"
 IDEAEVENT_3_9_1:0 "Phlébotomie"
 IDEAEVENT_3_9_2:0 "La phlébotomie est une thérapie bien connue. Cependant, certains affirment qu'elle affaiblit plutôt le corps du patient dans la plupart des cas au lieu d'être bénéfique. Nous voyons les pour et les contre du traitement et devons décider s'il faut l'interdire dans la plupart des cas ou non."
 IDEAEVENT_3_9_3:0 "Un traitement dépassé"
 IDEAEVENT_3_9_4:0 "Pourquoi pas ?"
 IDEAEVENT_3_10_1:0 "Perte de Confiance dans les Hôpitaux"
 IDEAEVENT_3_10_2:0 "Dernièrement, notre peuple a perdu confiance en nos hôpitaux et médecins. Une terrible peste a tué de nombreuses personnes et il semble que beaucoup préfèrent consulter les bouchers et charlatans qui leur vendent des amulettes et des potions à base d'urine de cheval plutôt que de vrais médecins."
 IDEAEVENT_3_10_3:0 "Mauvaises nouvelles !"
 #IDEAEVENT_3_10_4:0 ""
 IDEAEVENT_4_1_1:0 "Un Miracle !"
 IDEAEVENT_4_1_2:0 "Dans l'une de nos provinces, une vieille guérisseuse parcourt la région en soignant les gens par le simple toucher. La nouvelle de ses miracles s'est répandue dans tout le pays et même au-delà de nos frontières."
 IDEAEVENT_4_1_3:0 "Loué soit le Seigneur"
 #IDEAEVENT_4_1_4:0 ""
 IDEAEVENT_4_2_1:0 "Béatification"
 IDEAEVENT_4_2_2:0 "L'un de nos frères a été canonisé. Nous répandrons la nouvelle de ce grand honneur et célébrerons en mémoire de ce grand saint."
 IDEAEVENT_4_2_3:0 "Un grand honneur"
 #IDEAEVENT_4_2_4:0 ""
 IDEAEVENT_4_3_1:0 "Défenseur de la Foi"
 IDEAEVENT_4_3_2:0 "En tant que Défenseur de la Foi, il est de notre devoir de protéger nos frères dans la foi de toute forme de blasphème."
 IDEAEVENT_4_3_3:0 "Par leur volonté !"
 IDEAEVENT_4_3_4:0 "Tendre l'autre joue"
 IDEAEVENT_4_4_1:0 "Concile"
 IDEAEVENT_4_4_2:0 "Parfois, la réforme au sein du clergé est un bon moyen de revitaliser l'amour et la dévotion de notre peuple."
 IDEAEVENT_4_4_3:0 "Commencer les discussions"
 #IDEAEVENT_4_4_4:0 ""
 IDEAEVENT_4_5_1:0 "Vision Divine"
 IDEAEVENT_4_5_2:0 "Soudain, vous vous réveillez, trempé de sueur. Vous avez rêvé, ou plutôt vous avez eu une vision. Les dieux sont venus à vous cette nuit et ont promis la grandeur pour vous et votre pays."
 IDEAEVENT_4_5_3:0 "C'est un miracle !"
 #IDEAEVENT_4_5_4:0 ""
 IDEAEVENT_4_6_1:0 "Prêtre Corrompu"
 IDEAEVENT_4_6_2:0 "La corruption est malheureusement un thème récurrent dans l'Église, mais ce prêtre est vraiment d'une autre trempe."
 IDEAEVENT_4_6_3:0 "Exposer ses crimes"
 IDEAEVENT_4_6_4:0 "L'ignorer"
 IDEAEVENT_4_7_1:0 "Influence sur l'État"
 IDEAEVENT_4_7_2:0 "De plus en plus de prêtres tentent d'acquérir de plus en plus d'influence dans nos affaires politiques. Cependant, notre loi stipule que notre dirigeant élu ne doit pas être influencé par des considérations purement cléricales en matière de politique séculière."
 IDEAEVENT_4_7_3:0 "Promouvoir la séparation de l'Église et de l'État"
 IDEAEVENT_4_7_4:0 "Nous sommes une théocratie"
 IDEAEVENT_4_8_1:0 "Conspiration Cléricale"
 IDEAEVENT_4_8_2:0 "Nous avons entendu des rumeurs concernant une conspiration menaçant notre règne, orchestrée par certains de nos conseillers les plus chers !"
 IDEAEVENT_4_8_3:0 "Tuer tous les traîtres"
 IDEAEVENT_4_8_4:0 "Nier son existence"
 IDEAEVENT_4_9_1:0 "Querelles Internes"
 IDEAEVENT_4_9_2:0 "Des factions rivales complotent les unes contre les autres. Elles cherchent à devenir la force dominante dans l'État."
 IDEAEVENT_4_9_3:0 "Soutenir un camp"
 IDEAEVENT_4_9_4:0 "Rester neutre"
 IDEAEVENT_4_10_1:0 "Vol de Fonds Publics"
 IDEAEVENT_4_10_2:0 "L'un de vos proches conseillers est soupçonné de voler de l'argent public avec des complices. Après enquête, il est désormais clair que le groupe a dérobé une somme considérable."
 IDEAEVENT_4_10_3:0 "Qu'on leur coupe les mains !"
 IDEAEVENT_4_10_4:0 "Exiger un remboursement intégral"
 IDEAEVENT_5_1_1:0 "Splendeur du Dictateur"
 IDEAEVENT_5_1_2:0 "Comme aux grands jours de l'Empire de Castan, notre gloire militaire brille tel un soleil radieux au-dessus de nos têtes. Nous avons même organisé un spectacle similaire aux anciennes parades castanoriennes."
 IDEAEVENT_5_1_3:0 "Tel Castan"
 #IDEAEVENT_5_1_4:0 ""
 IDEAEVENT_5_2_1:0 "Foule en Délire"
 IDEAEVENT_5_2_2:0 "La foule est toujours en liesse lorsque vous quittez votre palais. L'enthousiasme est sans limites."
 IDEAEVENT_5_2_3:0 "Voilà comment faire !"
 #IDEAEVENT_5_2_4:0 ""
 IDEAEVENT_5_3_1:0 "Propagande d'État Réussie"
 IDEAEVENT_5_3_2:0 "Grâce à une propagande soigneuse, nous avons rallié le peuple à notre cause."
 IDEAEVENT_5_3_3:0 "Excellent"
 #IDEAEVENT_5_3_4:0 ""
 IDEAEVENT_5_4_1:0 "Bonnes Relations"
 IDEAEVENT_5_4_2:0 "Les relations avec les pays étrangers sont excellentes malgré notre gouvernement autoritaire."
 IDEAEVENT_5_4_3:0 "Très bien !"
 #IDEAEVENT_5_4_4:0 ""
 IDEAEVENT_5_5_1:0 "Terreur dans nos Terres"
 IDEAEVENT_5_5_2:0 "Dernièrement, le mécontentement a grandi face aux impôts élevés. Certains paysans se sont même soulevés contre notre règne."
 IDEAEVENT_5_5_3:0 "Donner une leçon à ces paysans"
 #IDEAEVENT_5_5_4:0 ""
 IDEAEVENT_5_6_1:0 "Nettoyer les Rues"
 IDEAEVENT_5_6_2:0 "Le mécontentement parmi les citoyens s'est accru ces dernières semaines au point que certains groupes sont devenus ouvertement rebelles. Nous devons détruire ces mouvements avant que cela ne devienne une révolution contre notre règne."
 IDEAEVENT_5_6_3:0 "En joue, feu !"
 #IDEAEVENT_5_6_4:0 ""
 IDEAEVENT_5_7_1:0 "Contrecoup Républicain"
 IDEAEVENT_5_7_2:0 "Une économie en berne, des prix alimentaires élevés, des sans-abri partout. De plus en plus se souviennent des « grandes heures » de la république. De plus en plus de gens se rassemblent et exigent la restauration de l'ancienne république."
 IDEAEVENT_5_7_3:0 "Dégainez vos armes !"
 #IDEAEVENT_5_7_4:0 ""
 IDEAEVENT_5_8_1:0 "Dissidence dans les Rues"
 IDEAEVENT_5_8_2:0 "Nous ne savons pas vraiment ce que le peuple veut en ce moment. Peut-être du sang, peut-être du pain, peut-être la liberté face à l'oppression. Nous devons réagir d'une manière ou d'une autre."
 IDEAEVENT_5_8_3:0 "Mesures sévères"
 IDEAEVENT_5_8_4:0 "Attendre que la situation se calme"
 IDEAEVENT_5_9_1:0 "Tendances Pro-Monarchistes"
 IDEAEVENT_5_9_2:0 "Le règne de notre famille a été critiqué par de nombreuses personnes comme illégitime. Nous en sommes venus à la conclusion que nous devons maintenant décider où nous voulons mener ce pays. Vers une nouvelle république ou vers une monarchie sous notre règne ?"
 IDEAEVENT_5_9_3:0 "Ma famille régnera"
 IDEAEVENT_5_9_4:0 "Vive la République"
 IDEAEVENT_5_10_1:0 "Défense Patriotique"
 IDEAEVENT_5_10_2:0 "Ces dernières années, des clubs de défense patriotique se sont formés dans tout le pays. Ils vous étaient très loyaux au début, mais vos espions rapportent qu'ils vous tiennent pour responsable des erreurs commises récemment. Nous devons décider si nous tentons de les apaiser ou si nous essayons de réduire leur influence avant qu'ils ne changent de camp."
 IDEAEVENT_5_10_3:0 "Les réprimer"
 IDEAEVENT_5_10_4:0 "Les laisser tranquilles"
 IDEAEVENT_6_1_1:0 "Riche Butin"
 IDEAEVENT_6_1_2:0 "Nous avons pillé une cité et avons découvert qu'elle était en fait bien plus riche que nous ne l'espérions."
 IDEAEVENT_6_1_3:0 "Nous sommes chanceux aujourd'hui"
 #IDEAEVENT_6_1_4:0 ""
 IDEAEVENT_6_2_1:0 "Trésor Découvert"
 IDEAEVENT_6_2_2:0 "Après avoir fouillé une cité abandonnée depuis longtemps, nous avons trouvé une pièce secrète où un trésor était caché depuis tout ce temps. Il est maintenant nôtre."
 IDEAEVENT_6_2_3:0 "Le réclamer entièrement pour vous-même"
 IDEAEVENT_6_2_4:0 "Donner à chacun sa juste part"
 IDEAEVENT_6_3_1:0 "Récits sur Neagol"
 IDEAEVENT_6_3_2:0 "Le grand Caehn Neagol est mort depuis longtemps, cependant nous pouvons encore apprendre de ses grandes conquêtes."
 IDEAEVENT_6_3_3:0 "Intéressant"
 IDEAEVENT_6_3_4:0 "Je me moque des histoires"
 IDEAEVENT_6_4_1:0 "Récits sur Beastbane"
 IDEAEVENT_6_4_2:0 "Nous pouvons effrayer nos enfants avec des histoires sur Beastbane, mais pour notre vie actuelle, les récits de comment Beastbane repoussa les centaures ne sont plus si pertinents."
 IDEAEVENT_6_4_3:0 "Intéressant"
 IDEAEVENT_6_4_4:0 "Je me moque des histoires"
 IDEAEVENT_6_5_1:0 "Barde Itinérant"
 IDEAEVENT_6_5_2:0 "Un barde itinérant particulier s'est fait un nom dans votre royaume. Vos éclaireurs rapportent avoir trouvé le barde errant près de votre camp."
 IDEAEVENT_6_5_3:0 "L'inviter sous votre tente"
 IDEAEVENT_6_5_4:0 "La musique ne m'intéresse pas"
 IDEAEVENT_6_6_1:0 "Querelle de Clans"
 IDEAEVENT_6_6_2:0 "Nous pensions la querelle entre deux clans réglée depuis longtemps lorsque deux membres se sont affrontés dans une dispute au sujet d'une femme, l'un tuant l'autre. Maintenant, le clan qui a perdu un membre a juré une vengeance sanglante."
 IDEAEVENT_6_6_3:0 "Ne pas intervenir"
 IDEAEVENT_6_6_4:0 "Tenter une médiation"
 IDEAEVENT_6_7_1:0 "Général Assassiné"
 IDEAEVENT_6_7_2:0 "Un bon ami à vous, l'un de vos conseillers militaires les plus fidèles et général de vos armées, a été trouvé assassiné dans sa tente aujourd'hui."
 IDEAEVENT_6_7_3:0 "Repose en paix"
 IDEAEVENT_6_7_4:0 "Les assassins sont à blâmer"
 IDEAEVENT_6_8_1:0 "Nouveau Mode de Vie"
 IDEAEVENT_6_8_2:0 "Nous devons remettre en question notre mode de vie alors que nos rivaux ont abandonné la vie nomade pour consacrer leur temps et leur énergie à l'extraction de matériaux et à la production d'armes plus puissantes. Nous devons vraiment repenser si notre voie est toujours celle de la conquête du monde."
 IDEAEVENT_6_8_3:0 "Garder les anciennes traditions"
 IDEAEVENT_6_8_4:0 "Le changement est une chance"
 IDEAEVENT_6_9_1:0 "Épidémie Équine"
 IDEAEVENT_6_9_2:0 "Une épidémie équine a frappé notre troupeau. De nombreux chevaux sont déjà morts et beaucoup survivront peut-être, mais grandement affaiblis."
 IDEAEVENT_6_9_3:0 "Une catastrophe"
 #IDEAEVENT_6_9_4:0 ""
 IDEAEVENT_6_10_1:0 "Fourrage Échoué"
 IDEAEVENT_6_10_2:0 "Nos éclaireurs et troupes de fourrage n'ont pas réussi à nous fournir de la nourriture pendant plusieurs semaines. Nos réserves diminuent et nous serons bientôt à court d'approvisionnements."
 IDEAEVENT_6_10_3:0 "Que mangerons-nous ?"
 #IDEAEVENT_6_10_4:0 ""
 IDEAEVENT_7_1_1:0 "Archives d'État Construites"
 IDEAEVENT_7_1_2:0 "Nous avons construit de nouvelles archives d'État où toutes les informations pertinentes sur notre nation et son existence seront conservées et préservées pour les générations futures."
 IDEAEVENT_7_1_3:0 "Une bonne idée"
 #IDEAEVENT_7_1_4:0 ""
 IDEAEVENT_7_2_1:0 "Tribunal Administratif Efficace"
 IDEAEVENT_7_2_2:0 "En établissant un tribunal administratif solide, nous avons assuré que notre administration est beaucoup plus efficace qu'auparavant."
 IDEAEVENT_7_2_3:0 "Bon travail !"
 #IDEAEVENT_7_2_4:0 ""
 IDEAEVENT_7_3_1:0 "Administration Fiable"
 IDEAEVENT_7_3_2:0 "Notre administration est prévisible dans ses décisions. C'est pourquoi notre peuple a une grande confiance en elle, car il sait que chacun sera traité de manière égale lorsqu'il fait une demande."
 IDEAEVENT_7_3_3:0 "Sécurité juridique pour notre peuple"
 #IDEAEVENT_7_3_4:0 ""
 IDEAEVENT_7_4_1:0 "Administrateur Provincial Apprécié"
 IDEAEVENT_7_4_2:0 "L'un de nos administrateurs d'État dans nos provinces est aimé pour son travail remarquable. C'est vraiment un homme d'honneur et l'un de nos meilleurs bureaucrates."
 IDEAEVENT_7_4_3:0 "Excellent travail !"
 #IDEAEVENT_7_4_4:0 ""
 IDEAEVENT_7_5_1:0 "Fonctionnaires de Confiance"
 IDEAEVENT_7_5_2:0 "Nos fonctionnaires d'État ont travaillé dur ces dernières années pour gagner la confiance de notre peuple. Le dernier cas de corruption remonte à des années. Ils méritent vraiment notre confiance."
 IDEAEVENT_7_5_3:0 "Très bien"
 #IDEAEVENT_7_5_4:0 ""
 IDEAEVENT_7_6_1:0 "Harmonisation des Procédures"
 IDEAEVENT_7_6_2:0 "En évaluant certains de nos processus de travail, nous avons atteint une efficacité bien supérieure à celle d'avant."
 IDEAEVENT_7_6_3:0 "C'est efficace"
 #IDEAEVENT_7_6_4:0 ""
 IDEAEVENT_7_7_1:0 "Administrateur Provincial Détesté"
 IDEAEVENT_7_7_2:0 "L'un de nos administrateurs provinciaux est détesté par sa province. Nous ne comprenons pas vraiment pourquoi, car techniquement c'est un homme bien. Cependant, on pourrait dire qu'il ne cache pas très bien son mépris pour certaines coutumes locales."
 IDEAEVENT_7_7_3:0 "C'est ainsi"
 #IDEAEVENT_7_7_4:0 ""
 IDEAEVENT_7_8_1:0 "Archives en Flammes"
 IDEAEVENT_7_8_2:0 "L'une de nos archives d'État a pris feu lorsque la foudre a frappé son toit la nuit dernière."
 IDEAEVENT_7_8_3:0 "Une perte terrible"
 #IDEAEVENT_7_8_4:0 ""
 IDEAEVENT_7_9_1:0 "Syndicat Corrompu dans notre Administration"
 IDEAEVENT_7_9_2:0 "Nous avons découvert qu'un syndicat corrompu a partiellement pris le contrôle de notre administration et utilise une combinaison de corruption et de terreur pour saper nos politiques et s'enrichir. Techniquement, l'efficacité de notre administration reste acceptable, mais nous ne pouvons pas laisser cela continuer."
 IDEAEVENT_7_9_3:0 "Combattre pour détruire le syndicat"
 IDEAEVENT_7_9_4:0 "C'est ainsi"
 IDEAEVENT_7_10_1:0 "Administrateur Assassiné"
 IDEAEVENT_7_10_2:0 "Notre cher conseiller a été trouvé mort dans ses appartements. Nous ne savons pas encore s'il a été victime d'une intrigue de palais ou peut-être d'une liaison qui a mal tourné. Ce que nous savons avec certitude, c'est qu'il est mort."
 IDEAEVENT_7_10_3:0 "Oh non !"
 #IDEAEVENT_7_10_4:0 ""
 IDEAEVENT_8_1_1:0 "Grand Recensement"
 IDEAEVENT_8_1_2:0 "Nous avons ordonné un grand recensement de la population de notre royaume. Quand nous saurons combien de sujets nous avons, nous pourrons mieux estimer les revenus fiscaux, de production et de commerce que nous pourrions obtenir dans les prochaines années."
 IDEAEVENT_8_1_3:0 "Résultats intéressants"
 #IDEAEVENT_8_1_4:0 ""
 IDEAEVENT_8_2_1:0 "Grand Arpentage des Terres"
 IDEAEVENT_8_2_2:0 "Un arpentage des terres est important pour déterminer exactement la valeur de nos territoires."
 IDEAEVENT_8_2_3:0 "Informations importantes"
 #IDEAEVENT_8_2_4:0 ""
 IDEAEVENT_8_3_1:0 "Développement de la Capitale"
 IDEAEVENT_8_3_2:0 "Notre capitale doit être la métropole la plus prospère du monde. Nous sommes déterminés à en faire la cité la plus extraordinaire du monde entier."
 IDEAEVENT_8_3_3:0 "Notre capitale est très importante"
 #IDEAEVENT_8_3_4:0 ""
 IDEAEVENT_8_4_1:0 "Contrôle des États"
 IDEAEVENT_8_4_2:0 "Grâce à l'organisation centrale de l'État, nous pouvons concentrer les états les plus puissants du pays dans la capitale et ainsi les contrôler plus facilement puisque nous n'avons qu'un seul endroit à surveiller."
 IDEAEVENT_8_4_3:0 "Ils feront ce que nous ordonnons"
 #IDEAEVENT_8_4_4:0 ""
 IDEAEVENT_8_5_1:0 "Tourisme dans la Capitale"
 IDEAEVENT_8_5_2:0 "Le tourisme est un moyen sous-estimé de gagner de l'argent. En attirant les touristes du monde entier, nous pouvons nous assurer que l'argent étranger afflue dans nos coffres."
 IDEAEVENT_8_5_3:0 "La plus grande cité du monde"
 #IDEAEVENT_8_5_4:0 ""
 IDEAEVENT_8_6_1:0 "Essor Commercial"
 IDEAEVENT_8_6_2:0 "La centralisation du commerce dans notre capitale commerciale nous permettra d'attirer encore plus de commerce vers nos terres."
 IDEAEVENT_8_6_3:0 "Excellent"
 #IDEAEVENT_8_6_4:0 ""
 IDEAEVENT_8_7_1:0 "Agenda d'Autonomie Provinciale"
 IDEAEVENT_8_7_2:0 "Certaines de nos provinces exigent une plus grande autonomie. Cependant, cela va à l'encontre de notre pensée centraliste. En tant qu'État centraliste, nous devons pouvoir contrôler toutes nos provinces depuis la capitale."
 IDEAEVENT_8_7_3:0 "Argumenter contre"
 IDEAEVENT_8_7_4:0 "Faire de petites concessions"
 IDEAEVENT_8_8_1:0 "Corruption à la Banque Nationale"
 IDEAEVENT_8_8_2:0 "Nous avons découvert que le plus haut responsable de notre banque nationale remplissait ses propres coffres avec l'argent de l'État et avait même construit tout un réseau pour couvrir les pertes. Nous devons vraiment faire le ménage."
 IDEAEVENT_8_8_3:0 "Éliminer tous les banquiers"
 #IDEAEVENT_8_8_4:0 ""
 IDEAEVENT_8_9_1:0 "Attaque d'un Convoi Monétaire"
 IDEAEVENT_8_9_2:0 "Notre ministre des Finances est sous le choc. Un important convoi d'argent public a été attaqué. Des milliers de couronnes ont été volées, nous laissant désespérés."
 IDEAEVENT_8_9_3:0 "Trouver les responsables"
 #IDEAEVENT_8_9_4:0 ""
 IDEAEVENT_8_10_1:0 "Longues Voies de Communication"
 IDEAEVENT_8_10_2:0 "En raison d'un vaste royaume et du besoin que toutes les communications transitent par notre capitale avant que nous puissions agir sur des nouvelles importantes, notre capacité à réagir rapidement aux crises est limitée."
 IDEAEVENT_8_10_3:0 "Les inconvénients d'un vaste royaume"
 #IDEAEVENT_8_10_4:0 ""
 IDEAEVENT_9_1_1:0 "Le Fédéralisme Fonctionne"
 IDEAEVENT_9_1_2:0 "En accordant à nos provinces une certaine autonomie, nous pouvons nous assurer qu'elles restent loyales à notre règne puisqu'elles s'administrent principalement elles-mêmes."
 IDEAEVENT_9_1_3:0 "Très bien"
 #IDEAEVENT_9_1_4:0 ""
 IDEAEVENT_9_2_1:0 "Vaste Développement des Infrastructures"
 IDEAEVENT_9_2_2:0 "En répartissant notre argent sur tout le pays, nous pouvons développer nos infrastructures dans de nombreux endroits à la fois. Ce faisant, nous assurons également que notre territoire se développe de manière uniforme."
 IDEAEVENT_9_2_3:0 "Excellentes nouvelles"
 #IDEAEVENT_9_2_4:0 ""
 IDEAEVENT_9_3_1:0 "L'État est Présent"
 IDEAEVENT_9_3_2:0 "Grâce à notre stratégie décentralisée, notre État est présent même dans les régions éloignées. C'est ainsi que nous réagissons assez rapidement aux problèmes et assurons des voies de communication courtes."
 IDEAEVENT_9_3_3:0 "C'est ainsi que cela doit être"
 #IDEAEVENT_9_3_4:0 ""
 IDEAEVENT_9_4_1:0 "États Fidèles"
 IDEAEVENT_9_4_2:0 "Grâce à notre administration décentralisée, les états n'auront pas à se concentrer en un seul endroit. Cela limitera leur influence en soi et, en outre, nous pourrons travailler plus facilement à leur base."
 IDEAEVENT_9_4_3:0 "Les récompenser !"
 IDEAEVENT_9_4_4:0 "Un tel comportement devrait être attendu"
 IDEAEVENT_9_5_1:0 "Possessions d'Outre-Mer"
 IDEAEVENT_9_5_2:0 "Nos possessions d'outre-mer nous sont chères. En montrant aux gens là-bas que nous nous soucions vraiment d'eux, nous renforçons notre règne simplement en faisant notre travail."
 IDEAEVENT_9_5_3:0 "Elles deviendront des États un jour"
 IDEAEVENT_9_5_4:0 "Elles resteront toujours des provinces de second rang"
 IDEAEVENT_9_6_1:0 "Développement"
 IDEAEVENT_9_6_2:0 "Le développement des terres rurales est important pour assurer que notre peuple ait toujours suffisamment à manger. Grâce à une production alimentaire décentralisée, nous pouvons réduire les famines au minimum."
 IDEAEVENT_9_6_3:0 "Investir dans les infrastructures"
 IDEAEVENT_9_6_4:0 "Investir dans notre peuple"
 IDEAEVENT_9_7_1:0 "Autonomie Désirée"
 IDEAEVENT_9_7_2:0 "Malgré nos grands efforts pour accorder autant d'autonomie aux provinces, un certain État exige encore plus d'autonomie et refuse tout compromis."
 IDEAEVENT_9_7_3:0 "Les réprimer brutalement"
 IDEAEVENT_9_7_4:0 "Tenter de négocier"
 IDEAEVENT_9_8_1:0 "Contrôle Perdu"
 IDEAEVENT_9_8_2:0 "Nous avons pratiquement perdu le contrôle de l'une de nos provinces. La population locale a cessé de communiquer avec nos fonctionnaires et les a même expulsés de la province. Certains disent même que la province est en rébellion ouverte et que certains de nos citoyens ont déjà été assassinés."
 IDEAEVENT_9_8_3:0 "Envoyer des remplaçants"
 #IDEAEVENT_9_8_4:0 ""
 IDEAEVENT_9_9_1:0 "Administrateur Chassé"
 IDEAEVENT_9_9_2:0 "Des messages inquiétants nous sont parvenus de l'une de nos provinces. Un administrateur local a été chassé par la population."
 IDEAEVENT_9_9_3:0 "C'est un mauvais signe"
 #IDEAEVENT_9_9_4:0 ""
 IDEAEVENT_9_10_1:0 "Décentralisation en Hausse"
 IDEAEVENT_9_10_2:0 "Nous avons appris que de plus en plus de séparatistes se lèvent dans nos terres et projettent de briser notre royaume en petits États rivaux."
 IDEAEVENT_9_10_3:0 "Qu'est-ce que ces inepties ?"
 #IDEAEVENT_9_10_4:0 ""
 IDEAEVENT_10_1_1:0 "Fierté de la Flotte"
 IDEAEVENT_10_1_2:0 "Un nouveau grand navire de guerre a été lancé. Il a été baptisé « Victoire de Fer » et est la fierté de notre flotte !"
 IDEAEVENT_10_1_3:0 "C'est mon nouveau navire amiral"
 #IDEAEVENT_10_1_4:0 ""
 IDEAEVENT_10_2_1:0 "La Qualité est Bonne"
 IDEAEVENT_10_2_2:0 "Nous avons appris que nos ouvriers font un travail de qualité et utilisent les matériaux de premier choix au mieux de leurs possibilités."
 IDEAEVENT_10_2_3:0 "Bonnes nouvelles !"
 #IDEAEVENT_10_2_4:0 ""
 IDEAEVENT_10_3_1:0 "Une Bonne Année pour le Bois"
 IDEAEVENT_10_3_2:0 "La qualité du bois fourni par nos bûcherons cette année est exceptionnelle."
 IDEAEVENT_10_3_3:0 "Je n'ai jamais vu un bois d'une telle qualité"
 #IDEAEVENT_10_3_4:0 ""
 IDEAEVENT_10_4_1:0 "Essor de la Flotte"
 IDEAEVENT_10_4_2:0 "La construction récente de nombreux chantiers navals a conduit à une plus grande capacité de construction de navires rapidement. Devons-nous commencer ?"
 IDEAEVENT_10_4_3:0 "Construire encore plus de navires"
 #IDEAEVENT_10_4_4:0 ""
 IDEAEVENT_10_5_1:0 "Une Flotte Signifie le Prestige"
 IDEAEVENT_10_5_2:0 "L'amiral de notre nation a prononcé un discours sur l'importance des navires et a déclaré qu'une grande flotte signifie un grand prestige parmi les nations. Nous ne pouvons pas contester une telle sagesse."
 IDEAEVENT_10_5_3:0 "Notre fierté !"
 #IDEAEVENT_10_5_4:0 ""
 IDEAEVENT_10_6_1:0 "Bois de Mauvaise Qualité Livré"
 IDEAEVENT_10_6_2:0 "Nos bûcherons n'ont pas pu répondre à nos demandes de bois de haute qualité dernièrement. Ils prétendent que les arbres prêts à être abattus sont tels quels et qu'ils ne peuvent rien y faire."
 IDEAEVENT_10_6_3:0 "Exiger mieux"
 IDEAEVENT_10_6_4:0 "Eh bien, nous pouvons utiliser ceci"
 IDEAEVENT_10_7_1:0 "Pestilence à l'Arsenal"
 IDEAEVENT_10_7_2:0 "De mauvaises nouvelles nous sont parvenues de l'arsenal. Certaines personnes sont tombées malades d'une maladie mystérieuse."
 IDEAEVENT_10_7_3:0 "Mettre l'arsenal en quarantaine"
 IDEAEVENT_10_7_4:0 "Ce n'est qu'un simple rhume"
 IDEAEVENT_10_8_1:0 "Explosion du Magasin"
 IDEAEVENT_10_8_2:0 "Un incendie s'est déclaré dans l'un des magasins de l'arsenal. L'explosion a été assez spectaculaire."
 IDEAEVENT_10_8_3:0 "Nous devons protéger les autres bâtiments"
 IDEAEVENT_10_8_4:0 "À couvert !"
 IDEAEVENT_10_9_1:0 "La Marine Perd de sa Splendeur"
 IDEAEVENT_10_9_2:0 "Notre population perd de plus en plus d'intérêt pour notre marine. Nous devons admettre que notre marine a perdu la majeure partie de sa gloire passée."
 IDEAEVENT_10_9_3:0 "Le nier !"
 IDEAEVENT_10_9_4:0 "Il y a du vrai là-dedans"
 IDEAEVENT_10_10_1:0 "Une Foule Incendie un Chantier Naval"
 IDEAEVENT_10_10_2:0 "Le mécontentement dans la cité est élevé. Une foule s'est formée et a attaqué le port. Nous avons pu les repousser, mais en perdant du terrain, ils ont mis le feu à l'un des chantiers navals. L'incendie n'a pas pu être arrêté et le chantier est maintenant réduit en cendres."
 IDEAEVENT_10_10_3:0 "Cela nuira à notre flotte"
 #IDEAEVENT_10_10_4:0 ""
 IDEAEVENT_11_1_1:0 "Nouveaux Éperons de Galère"
 IDEAEVENT_11_1_2:0 "L'un de nos ingénieurs aurait inventé une nouvelle classe d'éperons de galère. Il affirme que ces éperons sont révolutionnaires et bien meilleurs que tout ce que nous avons vu auparavant."
 IDEAEVENT_11_1_3:0 "Les tester d'abord"
 IDEAEVENT_11_1_4:0 "Les commander maintenant"
 IDEAEVENT_11_2_1:0 "Feu Damérien ?"
 IDEAEVENT_11_2_2:0 "L'un de nos alchimistes experts est venu nous voir, tout excité, nous disant qu'il avait réinventé un prétendu « Feu Damérien » et pouvait le reproduire à des fins militaires."
 IDEAEVENT_11_2_3:0 "Financer davantage de tests"
 IDEAEVENT_11_2_4:0 "Cela me semble faux"
 IDEAEVENT_11_3_1:0 "Un Célèbre Vétéran Réapparaît"
 IDEAEVENT_11_3_2:0 "Un héros d'une bataille navale presque oubliée a réapparu. Alors que nous le croyions mort depuis longtemps ou du moins perdu pour nos services, il est prêt à revenir parmi nous maintenant."
 IDEAEVENT_11_3_3:0 "Nous le croyions mort"
 #IDEAEVENT_11_3_4:0 ""
 IDEAEVENT_11_4_1:0 "Chants de Marins"
 IDEAEVENT_11_4_2:0 "Chanter est un bon moyen de remonter le moral de nos marins. Nous avons engagé des bardes pour écrire des chants patriotiques pour notre marine qui peuvent être chantés à bord et au combat."
 IDEAEVENT_11_4_3:0 "Qu'est-ce qu'on fait d'un marin ivre ?"
 #IDEAEVENT_11_4_4:0 ""
 IDEAEVENT_11_5_1:0 "Tout l'Horizon"
 IDEAEVENT_11_5_2:0 "Si nous alignions toute notre marine, tout l'horizon en serait couvert."
 IDEAEVENT_11_5_3:0 "Tout l'horizon !"
 #IDEAEVENT_11_5_4:0 ""
 IDEAEVENT_11_6_1:0 "Dissuasion Maritime"
 IDEAEVENT_11_6_2:0 "Nos capacités et notre puissance navales sont connues dans le monde entier. Les ennemis potentiels n'oseront pas nous défier."
 IDEAEVENT_11_6_3:0 "Ils savent que nous sommes supérieurs"
 #IDEAEVENT_11_6_4:0 ""
 IDEAEVENT_11_7_1:0 "Mort d'un Célèbre Constructeur Naval"
 IDEAEVENT_11_7_2:0 "L'un de nos plus célèbres constructeurs navals, le bâtisseur de notre navire amiral, est mort la nuit dernière. Il nous a bien servis."
 IDEAEVENT_11_7_3:0 "Nous avions encore besoin de lui"
 #IDEAEVENT_11_7_4:0 ""
 IDEAEVENT_11_8_1:0 "Ingénieur Défecteur"
 IDEAEVENT_11_8_2:0 "L'un de nos ingénieurs a fait défection vers l'un de nos rivaux. Nous ne pensons pas qu'il avait des informations si précieuses que notre supériorité navale soit en danger, mais sa défection nous blesse certainement."
 IDEAEVENT_11_8_3:0 "Traître !"
 #IDEAEVENT_11_8_4:0 ""
 IDEAEVENT_11_9_1:0 "Bien Loin du Feu Damérien"
 IDEAEVENT_11_9_2:0 "Des tests récents ont montré qu'un expert qui nous avait promis du feu damérien n'a pas pu livrer pendant des semaines. Nous l'avons financé et il semble que notre argent n'en valait pas l'investissement."
 IDEAEVENT_11_9_3:0 "Exécuter le charlatan"
 IDEAEVENT_11_9_4:0 "Le renvoyer"
 IDEAEVENT_11_10_1:0 "Escarmouche Perdue"
 IDEAEVENT_11_10_2:0 "Une petite escarmouche avec quelques navires de l'un de nos rivaux s'est produite. Nous avons été surpris par eux et avons déjà subi des pertes. Que devons-nous faire ?"
 IDEAEVENT_11_10_3:0 "Battre en retraite !"
 IDEAEVENT_11_10_4:0 "Combattre jusqu'au dernier navire"
 IDEAEVENT_12_1_1:0 "Une Carrière dans la Marine Marchande"
 IDEAEVENT_12_1_2:0 "Notre marine marchande est une grande chance pour les riches comme pour les pauvres. En servant bien, on peut devenir très riche malgré ses humbles débuts."
 IDEAEVENT_12_1_3:0 "De grandes opportunités !"
 #IDEAEVENT_12_1_4:0 ""
 IDEAEVENT_12_2_1:0 "Prospérité Commerciale"
 IDEAEVENT_12_2_2:0 "Le commerce est un excellent mécanisme pour gagner beaucoup d'argent. Bien qu'il comporte un certain risque pour toutes les parties impliquées, il en vaut souvent la peine."
 IDEAEVENT_12_2_3:0 "Nous en profiterons tous"
 #IDEAEVENT_12_2_4:0 ""
 IDEAEVENT_12_3_1:0 "Pirates Repoussés"
 IDEAEVENT_12_3_2:0 "Il y a quelques mois, nos éclaireurs ont découvert un repaire de pirates d'où ils nous terrorisaient depuis des mois et d'où ils avaient capturé certains de nos navires légers. Après avoir découvert leur repaire, nous avons immédiatement rassemblé une grande force et avons réussi à les surprendre. Nous en avons tué des dizaines et capturé des centaines !"
 IDEAEVENT_12_3_3:0 "Pendez-les tous"
 #IDEAEVENT_12_3_4:0 ""
 IDEAEVENT_12_4_1:0 "Embargo Contourné"
 IDEAEVENT_12_4_2:0 "Un rival nous imposant un embargo par jalousie est un thème courant en politique actuellement. Cependant, les embargos ne nous arrêteront pas. Nous les voyons comme un défi à contourner d'une manière ou d'une autre."
 IDEAEVENT_12_4_3:0 "Excellent"
 #IDEAEVENT_12_4_4:0 ""
 IDEAEVENT_12_5_1:0 "Nouvelle Technique de Navigation"
 IDEAEVENT_12_5_2:0 "Une meilleure compréhension du vent, de la température et des courants nous a permis de naviguer beaucoup plus efficacement qu'avant."
 IDEAEVENT_12_5_3:0 "Nous serons les plus rapides"
 #IDEAEVENT_12_5_4:0 ""
 IDEAEVENT_12_6_1:0 "Transport de Marchandises Innovant"
 IDEAEVENT_12_6_2:0 "Lors d'un long voyage commercial, une gestion efficace de la cargaison augmentera considérablement notre profit."
 IDEAEVENT_12_6_3:0 "L'argent va affluer"
 #IDEAEVENT_12_6_4:0 ""
 IDEAEVENT_12_7_1:0 "Navire Saisi"
 IDEAEVENT_12_7_2:0 "L'un de nos navires marchands a été saisi par des pirates. Malheureusement, nous n'avons pas pu les retrouver."
 IDEAEVENT_12_7_3:0 "Maudits soient ces pirates"
 #IDEAEVENT_12_7_4:0 ""
 IDEAEVENT_12_8_1:0 "Flotte du Trésor Perdue"
 IDEAEVENT_12_8_2:0 "Nous ne savons pas si une flotte de pirates entière a capturé notre flotte du trésor ou si elle a été perdue dans une tempête récente. Ce que nous savons, c'est que la flotte a un grand retard et nous ne nous attendons donc pas à la revoir."
 IDEAEVENT_12_8_3:0 "Pas mon or !"
 #IDEAEVENT_12_8_4:0 ""
 IDEAEVENT_12_9_1:0 "Mauvaises Affaires"
 IDEAEVENT_12_9_2:0 "Dernièrement, nous sommes dans une spirale négative. Quoi que nous essayions de faire en ce moment, nous échouons à négocier des accords rentables pour nous."
 IDEAEVENT_12_9_3:0 "Ça ira mieux"
 #IDEAEVENT_12_9_4:0 ""
 IDEAEVENT_12_10_1:0 "Embargos non Contournés"
 IDEAEVENT_12_10_2:0 "Dernièrement, nous n'avons pas réussi à contourner les embargos imposés par nos rivaux. Nous devons admettre qu'ils nuisent à notre commerce et donc à nos revenus."
 IDEAEVENT_12_10_3:0 "De mauvaises nouvelles !"
 #IDEAEVENT_12_10_4:0 ""
 IDEAEVENT_13_1_1:0 "Aventures Coloniales"
 IDEAEVENT_13_1_2:0 "Les vétérans et colons des colonies sont très populaires en ce moment. Ils n'auront pas à payer leurs boissons dans les tavernes s'ils racontent suffisamment d'histoires sur leurs aventures dans les colonies."
 IDEAEVENT_13_1_3:0 "Racontez-m'en davantage !"
 #IDEAEVENT_13_1_4:0 ""
 IDEAEVENT_13_2_1:0 "Littérature Coloniale"
 IDEAEVENT_13_2_2:0 "La littérature racontant des histoires de vie coloniale est très populaire dans notre société actuellement. Il ne serait pas surprenant que cela conduise à un essor colonial."
 IDEAEVENT_13_2_3:0 "Savent-ils seulement lire ?"
 #IDEAEVENT_13_2_4:0 ""
 IDEAEVENT_13_3_1:0 "Fuite vers l'Inconnu"
 IDEAEVENT_13_3_2:0 "De nombreux pauvres luttant pour leur survie chez eux pourraient trouver un nouvel espoir dans les terres lointaines de nos colonies."
 IDEAEVENT_13_3_3:0 "Chacun peut devenir riche"
 #IDEAEVENT_13_3_4:0 ""
 IDEAEVENT_13_4_1:0 "Esprit de Découverte"
 IDEAEVENT_13_4_2:0 "La société est curieuse. Tout le monde aime entendre parler de nos célèbres explorateurs découvrant des terres et des nations dont nous ne connaissions même pas l'existence !"
 IDEAEVENT_13_4_3:0 "Les soutenir"
 #IDEAEVENT_13_4_4:0 ""
 IDEAEVENT_13_5_1:0 "Expédition de Recherche"
 IDEAEVENT_13_5_2:0 "Les colonies offrent des possibilités intéressantes en termes de flore et de faune. Nous pourrions en apprendre beaucoup sur les plantes et peut-être même découvrir de nouveaux médicaments."
 IDEAEVENT_13_5_3:0 "Financer ces expéditions"
 IDEAEVENT_13_5_4:0 "Ils peuvent payer eux-mêmes"
 IDEAEVENT_13_6_1:0 "Gouverneur Honnête"
 IDEAEVENT_13_6_2:0 "L'un de nos gouverneurs coloniaux est très loyal envers la nation et nous a signalé qu'un certain mécontentement envers notre direction grandit dans les colonies."
 IDEAEVENT_13_6_3:0 "Un homme bien !"
 #IDEAEVENT_13_6_4:0 ""
 IDEAEVENT_13_7_1:0 "Administration Coloniale Efficace"
 IDEAEVENT_13_7_2:0 "Gérer les colonies est une tâche difficile. Cependant, notre grande expérience dans cette gestion nous a conduits à ne pas commettre deux fois les mêmes erreurs. L'administration coloniale fonctionne très bien actuellement."
 IDEAEVENT_13_7_3:0 "Excellent !"
 #IDEAEVENT_13_7_4:0 ""
 IDEAEVENT_13_8_1:0 "Gouverneur Corrompu"
 IDEAEVENT_13_8_2:0 "L'un de nos gouverneurs a été soudoyé par certains de nos sujets coloniaux pour ignorer le mécontentement croissant dans la colonie. Pire encore, il sympathise ouvertement avec leurs objectifs."
 IDEAEVENT_13_8_3:0 "Le remplacer"
 IDEAEVENT_13_8_4:0 "Ignorer la corruption"
 IDEAEVENT_13_9_1:0 "Embargo sur les Recrues"
 IDEAEVENT_13_9_2:0 "Nos nations coloniales ont déclaré dans une déclaration commune qu'elles ne fourniront plus d'hommes pour nos guerres."
 IDEAEVENT_13_9_3:0 "Maudites soient ces colonies"
 IDEAEVENT_13_9_4:0 "Nous n'oublierons pas cela"
 IDEAEVENT_13_10_1:0 "Guerre Indigène"
 IDEAEVENT_13_10_2:0 "Un énorme soulèvement indigène s'est produit dans l'une de nos colonies. De petites escarmouches ont rapidement dégénéré en une guerre à grande échelle. Notre sujet est sous grande pression et il est rapporté que de nombreux civils ont déjà été tués par les rebelles."
 IDEAEVENT_13_10_3:0 "Les combattre !"
 IDEAEVENT_13_10_4:0 "Tenter de négocier"
 IDEAEVENT_14_1_1:0 "Bonne Connexion avec les Dieux"
 IDEAEVENT_14_1_2:0 "Notre pays est tout simplement sous protection divine."
 IDEAEVENT_14_1_3:0 "C'est agréable !"
 IDEAEVENT_14_1_4:0 "Gardez-la"
 IDEAEVENT_14_2_1:0 "Fraternisation des Cultures"
 IDEAEVENT_14_2_2:0 "Les échanges culturels nous ont conduits à ne plus nous sentir si différents de nos frères. Nous pouvons presque oublier que nous étions autrefois différents."
 IDEAEVENT_14_2_3:0 "Mon frère ?"
 IDEAEVENT_14_2_4:0 "Mon frère !"
 IDEAEVENT_14_3_1:0 "Influence Culturelle Mutuelle"
 IDEAEVENT_14_3_2:0 "Le pluralisme peut être une chance. En adoptant certains aspects culturels, nous pouvons assimiler nos frères plus rapidement."
 IDEAEVENT_14_3_3:0 "Nous pouvons apprendre les uns des autres"
 #IDEAEVENT_14_3_4:0 ""
 IDEAEVENT_14_4_1:0 "Missionnaires Bienvenus"
 IDEAEVENT_14_4_2:0 "Grâce à notre attitude tolérante et notre nature indulgente, notre religion jouit d'une excellente réputation dans les pays voisins. Pour cette raison, nos missionnaires itinérants y seront les bienvenus la plupart du temps."
 IDEAEVENT_14_4_3:0 "Que les dieux les bénissent !"
 #IDEAEVENT_14_4_4:0 ""
 IDEAEVENT_14_5_1:0 "Écoles"
 IDEAEVENT_14_5_2:0 "En introduisant des écoles dans la vie publique, nous pouvons former les enfants de nos ennemis pour qu'ils deviennent nos amis."
 IDEAEVENT_14_5_3:0 "L'éducation est très importante"
 #IDEAEVENT_14_5_4:0 ""
 IDEAEVENT_14_6_1:0 "Fierté Nationale Relativisée"
 IDEAEVENT_14_6_2:0 "La fierté nationale est un concept bourgeois qui ne convient pas à une société assimilée."
 IDEAEVENT_14_6_3:0 "Bien !"
 #IDEAEVENT_14_6_4:0 ""
 IDEAEVENT_14_7_1:0 "Mouvement Néo-Nationaliste"
 IDEAEVENT_14_7_2:0 "Dernièrement, de plus en plus de voix s'élèvent pour exiger un retour à leurs identités culturelles. C'est une mauvaise nouvelle pour nous."
 IDEAEVENT_14_7_3:0 "Tous les réprimer !"
 IDEAEVENT_14_7_4:0 "Soudoyer leurs dirigeants"
 IDEAEVENT_14_8_1:0 "Politicien Libéral Assassiné"
 IDEAEVENT_14_8_2:0 "L'un de nos plus grands bâtisseurs de ponts, un politicien célèbre, a été assassiné dans la rue alors qu'il prononçait un discours."
 IDEAEVENT_14_8_3:0 "Il nous manquera"
 IDEAEVENT_14_8_4:0 "C'était un fauteur de troubles"
 IDEAEVENT_14_9_1:0 "Chef Séparatiste Charismatique"
 IDEAEVENT_14_9_2:0 "Un mouvement séparatiste dans notre pays a trouvé un nouveau chef charismatique qui cimentera certainement leur détermination."
 IDEAEVENT_14_9_3:0 "Ordonner son assassinat"
 IDEAEVENT_14_9_4:0 "Argumenter contre lui"
 IDEAEVENT_14_10_1:0 "Choc Culturel"
 IDEAEVENT_14_10_2:0 "De plus en plus de gens sont d'avis que les cultures de notre pays sont bien trop différentes pour cohabiter."
 IDEAEVENT_14_10_3:0 "Malédiction !"
 #IDEAEVENT_14_10_4:0 ""
 IDEAEVENT_15_1_1:0 "Société Très Animée Dernièrement"
 IDEAEVENT_15_1_2:0 "La société est énergique, animée, optimiste et aimante en ce moment. Nous ne pourrions espérer un meilleur environnement."
 IDEAEVENT_15_1_3:0 "De bonnes nouvelles"
 #IDEAEVENT_15_1_4:0 ""
 IDEAEVENT_15_2_1:0 "Cafés Populaires"
 IDEAEVENT_15_2_2:0 "Les cafés sont très populaires auprès des intellectuels. Ce sont des lieux de rencontre pour des discussions sociales ou politiques, des échanges sur l'art ou simplement pour rencontrer des personnes intéressantes."
 IDEAEVENT_15_2_3:0 "Deux morceaux de sucre, s'il vous plaît"
 IDEAEVENT_15_2_4:0 "Et le thé alors ?"
 IDEAEVENT_15_3_1:0 "Culture du Débat"
 IDEAEVENT_15_3_2:0 "La société est très ouverte au débat en ce moment. Presque tous les sujets sont acceptés. C'est peut-être le début d'une nouvelle Renaissance."
 IDEAEVENT_15_3_3:0 "Être ou ne pas être"
 IDEAEVENT_15_3_4:0 "telle est la question"
 IDEAEVENT_15_4_1:0 "Voies Postales Rapides"
 IDEAEVENT_15_4_2:0 "La correspondance régulière et donc le besoin que les lettres soient livrées le plus rapidement possible ont conduit à des routes postales efficaces dans notre royaume."
 IDEAEVENT_15_4_3:0 "La communication est importante"
 #IDEAEVENT_15_4_4:0 ""
 IDEAEVENT_15_5_1:0 "Mai Intellectuel"
 IDEAEVENT_15_5_2:0 "Nos intellectuels sont plus productifs que jamais. Les philosophes appellent déjà cette année l'année des intellectuels."
 IDEAEVENT_15_5_3:0 "Grande époque !"
 #IDEAEVENT_15_5_4:0 ""
 IDEAEVENT_15_6_1:0 "Correspondance Académique"
 IDEAEVENT_15_6_2:0 "Les universités et académies sont en correspondance constante. Le partage des connaissances est bien plus facile ainsi."
 IDEAEVENT_15_6_3:0 "Formidable !"
 #IDEAEVENT_15_6_4:0 ""
 IDEAEVENT_15_7_1:0 "Repli dans la Vie Privée"
 IDEAEVENT_15_7_2:0 "Notre peuple en a assez de l'État et de la société et ne se soucie que de son propre bien-être."
 IDEAEVENT_15_7_3:0 "Rallumer leur flamme"
 IDEAEVENT_15_7_4:0 "Eh bien..."
 IDEAEVENT_15_8_1:0 "Soutien à la Guerre en Baisse"
 IDEAEVENT_15_8_2:0 "Le peuple n'apprécie pas notre guerre. Si nous perdons le soutien des intellectuels, le peuple suivra bientôt."
 IDEAEVENT_15_8_3:0 "Parler de paix"
 IDEAEVENT_15_8_4:0 "Persévérer"
 IDEAEVENT_15_9_1:0 "Oppression des Classes Inférieures"
 IDEAEVENT_15_9_2:0 "Les intellectuels critiquent notre oppression des classes inférieures. Bien qu'ils ne veuillent pas vraiment qu'elles libèrent tout leur potentiel, ils estiment qu'un peu moins d'oppression serait plus humaniste."
 IDEAEVENT_15_9_3:0 "C'est ainsi"
 #IDEAEVENT_15_9_4:0 ""
 IDEAEVENT_15_10_1:0 "Grande Dépression"
 IDEAEVENT_15_10_2:0 "L'humeur générale de la société est au plus bas. Les suicides ou les actes sombres deviennent un phénomène courant."
 IDEAEVENT_15_10_3:0 "Ramener l'optimisme"
 IDEAEVENT_15_10_4:0 "Les temps changeront"
 IDEAEVENT_16_1_1:0 "Vague d'Enthousiasme"
 IDEAEVENT_16_1_2:0 "Notre peuple s'enthousiasme facilement en ce moment. Chacune de nos actions est acclamée comme brillante."
 IDEAEVENT_16_1_3:0 "Surfer sur la vague"
 IDEAEVENT_16_1_4:0 "Essayer d'amplifier la vague"
 IDEAEVENT_16_2_1:0 "Journaux d'État Prospères"
 IDEAEVENT_16_2_2:0 "Nos journaux d'État connaissent un grand succès sans grande intervention de notre part."
 IDEAEVENT_16_2_3:0 "De bonnes nouvelles"
 #IDEAEVENT_16_2_4:0 ""
 IDEAEVENT_16_3_1:0 "Espion Découvert"
 IDEAEVENT_16_3_2:0 "Nous avons découvert un espion dans notre administration d'État provenant d'une puissance rivale. Il n'a été découvert que parce que l'un de nos journaux a averti le peuple de surveiller les traîtres."
 IDEAEVENT_16_3_3:0 "Bon travail !"
 #IDEAEVENT_16_3_4:0 ""
 IDEAEVENT_16_4_1:0 "Propagande Étrangère Réfutée"
 IDEAEVENT_16_4_2:0 "Cette fois, il nous a été assez facile de démasquer la propagande ennemie comme de simples mensonges sans doute ni question. C'est un énorme succès pour nous et nos objectifs."
 IDEAEVENT_16_4_3:0 "Beau travail !"
 #IDEAEVENT_16_4_4:0 ""
 IDEAEVENT_16_5_1:0 "Journal Interdit"
 IDEAEVENT_16_5_2:0 "Nous avons estimé qu'interdire un certain journal était nécessaire car ce soi-disant magazine patriotique ne faisait que critiquer nos méthodes et politiques."
 IDEAEVENT_16_5_3:0 "Cela les calmera un peu"
 #IDEAEVENT_16_5_4:0 ""
 IDEAEVENT_16_6_1:0 "Journaux d'État en Difficulté"
 IDEAEVENT_16_6_2:0 "Nos journaux d'État ont perdu la confiance de notre peuple. Nous avons dû admettre que certaines choses publiées récemment étaient au mieux exagérées. Ainsi, les gens ne croiront plus chaque mot qu'ils lisent."
 IDEAEVENT_16_6_3:0 "Les soutenir"
 IDEAEVENT_16_6_4:0 "Les journaux ne sont pas importants"
 IDEAEVENT_16_7_1:0 "Ministre Aperçu dans un Bordel"
 IDEAEVENT_16_7_2:0 "L'un de nos ministres a été aperçu dans un bordel. Nous l'avons toujours présenté comme l'homme le plus loyal et le plus chaste, et nous sommes maintenant en pleine crise de relations publiques."
 IDEAEVENT_16_7_3:0 "Quel idiot"
 IDEAEVENT_16_7_4:0 "Il y était pour une enquête"
 IDEAEVENT_16_8_1:0 "Affaire de Palais"
 IDEAEVENT_16_8_2:0 "De nombreux bals récents au palais ont dégénéré en termes de moralité. Nos rivaux ont eu vent de certaines « activités » qui s'y sont déroulées et sont maintenant impatients d'exploiter notre honte."
 IDEAEVENT_16_8_3:0 "Essayer d'étouffer l'affaire"
 IDEAEVENT_16_8_4:0 "Exécuter les responsables"
 IDEAEVENT_16_9_1:0 "Scandale Diplomatique"
 IDEAEVENT_16_9_2:0 "Nous avons oublié d'arrêter la publication d'un poème satirique sur le dirigeant de l'un de nos rivaux par l'un de nos journaux gouvernementaux juste avant qu'il ne soit sur le point de nous rendre visite pour une conférence."
 IDEAEVENT_16_9_3:0 "Essayer de trouver une issue à cette misère"
 IDEAEVENT_16_9_4:0 "Simplement ignorer l'article"
 IDEAEVENT_16_10_1:0 "Mensonges Révélés"
 IDEAEVENT_16_10_2:0 "Parfois, notre propagande doit mentir pour le bien commun. Nous l'avons fait par le passé et le ferons à l'avenir. Malheureusement, l'un de nos rivaux a maintenant découvert l'un de nos mensonges."
 IDEAEVENT_16_10_3:0 "C'est mauvais pour nous"
 #IDEAEVENT_16_10_4:0 ""
 IDEAEVENT_17_1_1:0 "Un Lieu pour une Base"
 IDEAEVENT_17_1_2:0 "Nous avons découvert un endroit fantastique pour une base navale. C'est plus ou moins un port naturel et facile à défendre de tous côtés."
 IDEAEVENT_17_1_3:0 "Idée fantastique !"
 #IDEAEVENT_17_1_4:0 ""
 IDEAEVENT_17_2_1:0 "Approvisionnements Sécurisés"
 IDEAEVENT_17_2_2:0 "Une bonne planification et une utilisation prévoyante des capacités de transport ont conduit à des dépôts d'approvisionnement pleins bien avant notre calendrier."
 IDEAEVENT_17_2_3:0 "Très bien !"
 #IDEAEVENT_17_2_4:0 ""
 IDEAEVENT_17_3_1:0 "Grande Démonstration de Force"
 IDEAEVENT_17_3_2:0 "En entrant dans le port avec l'escadre, tout le monde était en admiration."
 IDEAEVENT_17_3_3:0 "Montrez-leur notre puissance"
 #IDEAEVENT_17_3_4:0 ""
 IDEAEVENT_17_4_1:0 "L'Artillerie Navale Fonctionne"
 IDEAEVENT_17_4_2:0 "Des semaines de tests de notre artillerie navale en combat naval-terrestre ont grandement augmenté notre efficacité, au cas où nous aurions besoin de soutenir nos troupes à terre."
 IDEAEVENT_17_4_3:0 "Excellent"
 #IDEAEVENT_17_4_4:0 ""
 IDEAEVENT_17_5_1:0 "Bases Navales Prêtes pour la Guerre"
 IDEAEVENT_17_5_2:0 "Nos bases doivent être préparées à la guerre en tout temps. Une inspection récente a montré que la plupart de nos bases sont en fait très bien préparées. Seules quelques-unes manquent de détails mineurs, mais rien de spectaculaire."
 IDEAEVENT_17_5_3:0 "De bonnes nouvelles"
 #IDEAEVENT_17_5_4:0 ""
 IDEAEVENT_17_6_1:0 "Conscription d'Urgence"
 IDEAEVENT_17_6_2:0 "En cas de besoin d'hommes, nous pourrions enrôler le personnel de nos bases."
 IDEAEVENT_17_6_3:0 "Faites-le !"
 IDEAEVENT_17_6_4:0 "Nous aurons besoin de nos hommes pour défendre nos bases"
 IDEAEVENT_17_7_1:0 "Excellent Entraînement"
 IDEAEVENT_17_7_2:0 "Le personnel de la base est bien entraîné et défendra sa base et son foyer jusqu'au dernier homme."
 IDEAEVENT_17_7_3:0 "Très bien !"
 #IDEAEVENT_17_7_4:0 ""
 IDEAEVENT_17_8_1:0 "Tempêtes d'Automne"
 IDEAEVENT_17_8_2:0 "Des tempêtes ont récemment interrompu nos voies d'approvisionnement. Nous devrons trouver des solutions créatives pour maintenir nos bases approvisionnées cet hiver."
 IDEAEVENT_17_8_3:0 "Que pourrions-nous faire ?"
 #IDEAEVENT_17_8_4:0 ""
 IDEAEVENT_17_9_1:0 "Protection Commerciale Échouée"
 IDEAEVENT_17_9_2:0 "Normalement, nos bases sont très efficaces pour soutenir nos intérêts commerciaux et protéger les marchands des pirates, mais dernièrement, la piraterie est devenue incontrôlable."
 IDEAEVENT_17_9_3:0 "Malédiction !"
 #IDEAEVENT_17_9_4:0 ""
 IDEAEVENT_17_10_1:0 "Base Navale Attaquée par les Locaux"
 IDEAEVENT_17_10_2:0 "L'une de nos bases a été attaquée par la population locale étrangère. Ils en ont assez de notre présence sur leurs terres et voulaient prendre le contrôle de la base. Nous avons pu les repousser mais avons subi des pertes."
 IDEAEVENT_17_10_3:0 "C'est un incident diplomatique"
 IDEAEVENT_17_10_4:0 "La dissidence est normale"
 IDEAEVENT_18_1_1:0 "Club Loyal Fondé"
 IDEAEVENT_18_1_2:0 "Récemment, un club soutenant le pays et le gouvernement en organisant de la propagande ou en faisant d'autres choses a été fondé dans la capitale."
 IDEAEVENT_18_1_3:0 "Ils ont notre soutien"
 #IDEAEVENT_18_1_4:0 ""
 IDEAEVENT_18_2_1:0 "Les Nationalistes Veulent Aider l'État"
 IDEAEVENT_18_2_2:0 "Les nationalistes veulent aider l'État avec leur main-d'œuvre, pas seulement rester assis et donner des suggestions."
 IDEAEVENT_18_2_3:0 "Leur dire quoi faire"
 IDEAEVENT_18_2_4:0 "Nous n'avons pas besoin d'eux pour l'instant"
 IDEAEVENT_18_3_1:0 "Nationaliste Célèbre Honoré"
 IDEAEVENT_18_3_2:0 "Un nationaliste célèbre a été honoré par le gouvernement pour ses efforts visant à nettoyer les rues de notre capitale des bandits."
 IDEAEVENT_18_3_3:0 "Bien mérité"
 #IDEAEVENT_18_3_4:0 ""
 IDEAEVENT_18_4_1:0 "Général Nationaliste"
 IDEAEVENT_18_4_2:0 "Nous avons découvert que l'un de nos généraux les plus influents est secrètement nationaliste et parlait assez ouvertement de secrets militaires dans son club."
 IDEAEVENT_18_4_3:0 "Le mettre à la retraite maintenant"
 IDEAEVENT_18_4_4:0 "Et alors ?"
 IDEAEVENT_18_5_1:0 "Un Nationaliste Attaque un Visiteur Étranger"
 IDEAEVENT_18_5_2:0 "Un incident a attiré une large attention. Un nationaliste a attaqué un visiteur étranger de notre capitale. Ce n'est qu'un touriste et, autant que nous puissions le voir, il n'a rien fait de suspect pour justifier l'attaque."
 IDEAEVENT_18_5_3:0 "Exécuter le nationaliste"
 IDEAEVENT_18_5_4:0 "Il avait sûrement une bonne raison pour ses actes"
 IDEAEVENT_18_6_1:0 "Un Nationaliste Premier dans la Brèche"
 IDEAEVENT_18_6_2:0 "Le hasard a révélé qu'un nationaliste fut le premier à franchir la brèche."
 IDEAEVENT_18_6_3:0 "Un exemple brillant"
 IDEAEVENT_18_6_4:0 "D'accord"
 IDEAEVENT_18_7_1:0 "Les Nationalistes Deviennent Agressifs"
 IDEAEVENT_18_7_2:0 "Les nationalistes deviennent de plus en plus agressifs envers quiconque ne partage pas entièrement leurs opinions. Nous en sommes venus à la conclusion que nous devons d'une manière ou d'une autre limiter leur influence, sinon nous serons bientôt au bord de la guerre civile."
 IDEAEVENT_18_7_3:0 "Interdire le club le plus agressif"
 IDEAEVENT_18_7_4:0 "Arrêter les meneurs"
 IDEAEVENT_18_8_1:0 "Dissidence dans les Rues"
 IDEAEVENT_18_8_2:0 "Les nationalistes sont mécontents de nos politiques et protestent dans les rues."
 IDEAEVENT_18_8_3:0 "Terrible !"
 #IDEAEVENT_18_8_4:0 ""
 IDEAEVENT_18_9_1:0 "Les Nationalistes Prennent d'Assaut les Archives Nationales"
 IDEAEVENT_18_9_2:0 "Les nationalistes ont eu vent de rumeurs concernant une carte conservée dans nos archives qui ne montre pas notre pays, mais l'un de nos rivaux avec tout notre territoire occupé. Ils devraient savoir qu'il s'agit simplement d'une relique historique, mais ils veulent la brûler officiellement malgré cela."
 IDEAEVENT_18_9_3:0 "Envoyer la garnison et la reprendre"
 IDEAEVENT_18_9_4:0 "Attendre qu'ils quittent les archives"
 IDEAEVENT_18_10_1:0 "Ministre Découvert comme Nationaliste Clandestin"
 IDEAEVENT_18_10_2:0 "L'un de nos ministres a été découvert comme étant un nationaliste clandestin. Normalement, nous essayons d'équilibrer les états dans notre pays et la découverte des connexions de ce ministre a rompu l'équilibre."
 IDEAEVENT_18_10_3:0 "Le renvoyer immédiatement"
 IDEAEVENT_18_10_4:0 "Et alors ?"
 IDEAEVENT_19_1_1:0 "Nouveau Chef de la Garde Nommé"
 IDEAEVENT_19_1_2:0 "Nous avons nommé un nouveau chef de notre garde personnelle. C'est un homme de grand honneur et un officier talentueux et digne de confiance."
 IDEAEVENT_19_1_3:0 "Très bien !"
 #IDEAEVENT_19_1_4:0 ""
 IDEAEVENT_19_2_1:0 "Officier de Liaison Charismatique"
 IDEAEVENT_19_2_2:0 "L'un de nos officiers de liaison est l'homme le plus séduisant et charmant du royaume. Même les hommes ne peuvent échapper à son charme."
 IDEAEVENT_19_2_3:0 "Le promouvoir !"
 IDEAEVENT_19_2_4:0 "L'exposer davantage au public"
 IDEAEVENT_19_3_1:0 "Vague de Conquêtes"
 IDEAEVENT_19_3_2:0 "Notre territoire s'est considérablement agrandi ces derniers mois."
 IDEAEVENT_19_3_3:0 "Maintenir l'élan !"
 #IDEAEVENT_19_3_4:0 ""
 IDEAEVENT_19_4_1:0 "Renouvellement Constant"
 IDEAEVENT_19_4_2:0 "En aspirant à un renouvellement constant, notre pays devrait être moins affecté par la décadence."
 IDEAEVENT_19_4_3:0 "Au progrès !"
 #IDEAEVENT_19_4_4:0 ""
 IDEAEVENT_19_5_1:0 "Snobisme"
 IDEAEVENT_19_5_2:0 "Certains de nos intellectuels et officiers pensent que nous sommes le plus grand pays sur cette terre. Ils ne voient que nos qualités et ignorent les problèmes que nous avons."
 IDEAEVENT_19_5_3:0 "Ces idiots arrogants !"
 IDEAEVENT_19_5_4:0 "Laissez-les parler"
 IDEAEVENT_19_6_1:0 "Anciennes Traditions Remises en Question"
 IDEAEVENT_19_6_2:0 "Parfois, les anciennes traditions doivent être remises en question afin de les réformer ou de les remplacer par quelque chose de mieux adapté à la situation actuelle."
 IDEAEVENT_19_6_3:0 "Même les traditions doivent changer de temps en temps"
 IDEAEVENT_19_6_4:0 "Les laisser en l'état"
 IDEAEVENT_19_7_1:0 "Tout Royaume Périra"
 IDEAEVENT_19_7_2:0 "Il devrait être de notoriété publique qu'aucun royaume ne restera le même ni n'existera éternellement."
 IDEAEVENT_19_7_3:0 "Aul-Dwarov a duré plus de 5 000 ans"
 IDEAEVENT_19_7_4:0 "C'est pourtant vrai"
 IDEAEVENT_19_8_1:0 "La Fin des Temps pour $COUNTRY$ ?"
 IDEAEVENT_19_8_2:0 "Certains disent que le royaume est condamné. Ont-ils raison ?"
 IDEAEVENT_19_8_3:0 "Absurdités !"
 IDEAEVENT_19_8_4:0 "Peut-être ont-ils raison"
 IDEAEVENT_19_9_1:0 "Décadence Castanorienne"
 IDEAEVENT_19_9_2:0 "La décadence dans le royaume nous rappelle la décadence castanorienne. Certains de nos érudits considèrent cette décadence comme la principale raison de la chute de Castanor."
 IDEAEVENT_19_9_3:0 "Vivre selon la réputation"
 IDEAEVENT_19_9_4:0 "Le nier !"
 IDEAEVENT_19_10_1:0 "Administration Pléthorique"
 IDEAEVENT_19_10_2:0 "Équilibrer l'administration d'un royaume n'est jamais facile. Il faut peser entre une machine énorme où chaque noble a un poste important ou une administration plus réduite mais plus efficace."
 IDEAEVENT_19_10_3:0 "Réduire notre administration"
 IDEAEVENT_19_10_4:0 "Nous sommes un empire !"
 IDEAEVENT_20_1_1:0 "Personnel Innovant"
 IDEAEVENT_20_1_2:0 "Un état-major fait face à de nombreux défis sur de nombreuses questions différentes. Trouver les meilleures réponses et penser hors des sentiers battus est souvent requis ici."
 IDEAEVENT_20_1_3:0 "Ils ont toujours la réponse !"
 #IDEAEVENT_20_1_4:0 ""
 IDEAEVENT_20_2_1:0 "Manœuvres Réussies"
 IDEAEVENT_20_2_2:0 "Les dernières manœuvres furent un grand succès. Généraux et troupes ont beaucoup appris et des perceptions importantes ont été faites."
 IDEAEVENT_20_2_3:0 "Très bien !"
 IDEAEVENT_20_2_4:0 "Continuons les manœuvres !"
 IDEAEVENT_20_3_1:0 "Les Inspecteurs Généraux Font leur Travail"
 IDEAEVENT_20_3_2:0 "L'introduction d'inspecteurs généraux pour nos troupes s'est avérée être une excellente idée pour assurer une qualité durable dans notre armée."
 IDEAEVENT_20_3_3:0 "C'est pour cela que nous les avons"
 IDEAEVENT_20_3_4:0 "Les féliciter publiquement"
 IDEAEVENT_20_4_1:0 "Mise en Œuvre de Nouvelles Techniques Réussie"
 IDEAEVENT_20_4_2:0 "Mettre en œuvre de nouvelles façons de penser ou de nouvelles techniques peut être très difficile, mais moins avec un état-major innovant."
 IDEAEVENT_20_4_3:0 "L'état-major est ouvert à l'innovation"
 #IDEAEVENT_20_4_4:0 ""
 IDEAEVENT_20_5_1:0 "Général Étranger Défecteur"
 IDEAEVENT_20_5_2:0 "Un général étranger a fait défection de notre côté et travaillera désormais avec notre état-major pour découvrir les faiblesses de nos ennemis."
 IDEAEVENT_20_5_3:0 "Bonnes nouvelles !"
 #IDEAEVENT_20_5_4:0 ""
 IDEAEVENT_20_6_1:0 "Armée Professionnelle"
 IDEAEVENT_20_6_2:0 "Notre armée est professionnelle, du simple soldat au plus haut général."
 IDEAEVENT_20_6_3:0 "Très bien !"
 #IDEAEVENT_20_6_4:0 ""
 IDEAEVENT_20_7_1:0 "Mort d'un Brillant Officier d'État-Major"
 IDEAEVENT_20_7_2:0 "De tristes nouvelles nous sont parvenues aujourd'hui. Un brillant officier d'état-major est mort la nuit dernière. Il n'était pas très célèbre mais était un membre très précieux de notre état-major."
 IDEAEVENT_20_7_3:0 "Organiser des funérailles officielles"
 IDEAEVENT_20_7_4:0 "C'est une grande perte"
 IDEAEVENT_20_8_1:0 "L'Arrogance Grandit dans l'État-Major"
 IDEAEVENT_20_8_2:0 "L'état-major devient de plus en plus arrogant, totalement convaincu que sa voie et seulement sa voie est la bonne."
 IDEAEVENT_20_8_3:0 "Argumenter contre"
 IDEAEVENT_20_8_4:0 "Nous sommes les meilleurs de toute façon"
 IDEAEVENT_20_9_1:0 "Noblesse avant Performance"
 IDEAEVENT_20_9_2:0 "Les promotions annuelles à l'état-major sont imminentes et nous devons décider des meilleurs candidats."
 IDEAEVENT_20_9_3:0 "La performance est la chose la plus importante"
 IDEAEVENT_20_9_4:0 "Les nobles seront toujours supérieurs"
 IDEAEVENT_20_10_1:0 "Promotion Injustifiée"
 IDEAEVENT_20_10_2:0 "En raison d'une erreur dans l'administration, un officier ne méritant pas de promotion en a reçu une. L'annuler pourrait causer un tollé, mais ce serait la bonne décision."
 IDEAEVENT_20_10_3:0 "Admettre l'erreur"
 IDEAEVENT_20_10_4:0 "Laisser en l'état !"
 IDEAEVENT_21_1_1:0 "Bonne Situation Logistique"
 IDEAEVENT_21_1_2:0 "Avant de commencer les manœuvres annuelles, nous avons vérifié la situation logistique pour les exercices à venir et sommes heureux de rapporter que tout est prêt."
 IDEAEVENT_21_1_3:0 "C'est bon à entendre !"
 #IDEAEVENT_21_1_4:0 ""
 IDEAEVENT_21_2_1:0 "Nouvelles Armes d'Infanterie Impopulaires"
 IDEAEVENT_21_2_2:0 "Notre infanterie a reçu de nouvelles armes le mois dernier. Cependant, les mousquets sont très impopulaires auprès des troupes. Il y a diverses plaintes mais nous ne savons pas vraiment si elles sont justifiées ou non."
 IDEAEVENT_21_2_3:0 "Les imposer"
 IDEAEVENT_21_2_4:0 "Accorder un temps de transition plus long"
 IDEAEVENT_21_3_1:0 "Grande Confiance dans l'Armée"
 IDEAEVENT_21_3_2:0 "Nos dirigeants et notre peuple ont une grande confiance en notre armée, quels que soient les défis qui se présentent."
 IDEAEVENT_21_3_3:0 "Excellent"
 IDEAEVENT_21_3_4:0 "Mais ne soyez pas trop arrogants"
 IDEAEVENT_21_4_1:0 "Grande Camaraderie"
 IDEAEVENT_21_4_2:0 "Respecter les camarades et prendre soin d'eux est bénéfique sur le champ de bataille."
 IDEAEVENT_21_4_3:0 "Unis nous vaincrons !"
 #IDEAEVENT_21_4_4:0 ""
 IDEAEVENT_21_5_1:0 "Logement Privé"
 IDEAEVENT_21_5_2:0 "Parfois, le logement chez l'habitant peut vraiment renforcer les relations entre les troupes et la population. Cependant, s'il y a une jolie fille dans la maison, cela pourrait être autre chose."
 IDEAEVENT_21_5_3:0 "Une bonne opportunité !"
 IDEAEVENT_21_5_4:0 "Ne pas autoriser la fraternisation"
 IDEAEVENT_21_6_1:0 "Approvisionnements Individuels"
 IDEAEVENT_21_6_2:0 "Nos dirigeants débattent actuellement de la question de savoir si les soldats doivent porter leur équipement eux-mêmes ou si celui-ci doit être transporté pour eux."
 IDEAEVENT_21_6_3:0 "Équiper tout le monde !"
 IDEAEVENT_21_6_4:0 "Nous garderons les questions d'approvisionnement en mains centrales"
 IDEAEVENT_21_7_1:0 "Exercice Échoué"
 IDEAEVENT_21_7_2:0 "Ce régiment est tout simplement mauvais. Que pouvons-nous faire si même nos meilleurs instructeurs ont échoué ?"
 IDEAEVENT_21_7_3:0 "Les entraîner encore plus !"
 IDEAEVENT_21_7_4:0 "Ces gars sont désespérants..."
 IDEAEVENT_21_8_1:0 "Général Tué par un Soldat"
 IDEAEVENT_21_8_2:0 "Parfois, il peut être profitable qu'un général joue aux cartes avec ses soldats de temps en temps. Mais dans ce cas, cela ne s'est pas bien terminé. Le soldat a accusé le général de tricher. Quand l'accusé l'a nié avec ferveur, le soldat lui a planté un couteau dans l'œil."
 IDEAEVENT_21_8_3:0 "Exécuter le soldat immédiatement"
 IDEAEVENT_21_8_4:0 "Examiner l'affaire de manière impartiale"
 IDEAEVENT_21_9_1:0 "Génération Molle"
 IDEAEVENT_21_9_2:0 "Les nouvelles recrues se présentent dans un état pitoyable."
 IDEAEVENT_21_9_3:0 "Nous ne pouvons rien y faire"
 IDEAEVENT_21_9_4:0 "Les entraîner !"
 IDEAEVENT_21_10_1:0 "Soldats Paresseux"
 IDEAEVENT_21_10_2:0 "Quand ils n'ont rien à faire, les soldats deviennent paresseux."
 IDEAEVENT_21_10_3:0 "Eh bien..."
 IDEAEVENT_21_10_4:0 "Plus d'exercices !"
 IDEAEVENT_22_1_1:0 "Mercenaires Fidèles"
 IDEAEVENT_22_1_2:0 "Les exceptions confirment la règle, dit-on. Nous avons acquis une compagnie de mercenaires fidèle envers nous malgré quelques opportunités de nous trahir."
 IDEAEVENT_22_1_3:0 "Bien !"
 #IDEAEVENT_22_1_4:0 ""
 IDEAEVENT_22_2_1:0 "Camps de Mercenaires Préparés"
 IDEAEVENT_22_2_2:0 "Quand on engage de nombreux mercenaires, mieux vaut préparer la logistique au préalable. Car personne ne veut de mercenaires errant dans la campagne à la recherche de nourriture."
 IDEAEVENT_22_2_3:0 "La logistique est tout"
 #IDEAEVENT_22_2_4:0 ""
 IDEAEVENT_22_3_1:0 "Musique autour du Feu de Camp"
 IDEAEVENT_22_3_2:0 "Créer des liens est important en temps de guerre. Nous pensons que la musique partagée autour du feu de camp entre mercenaires et troupes régulières encouragera l'amitié mutuelle et renforcera la loyauté envers les uns les autres."
 IDEAEVENT_22_3_3:0 "Laissez-les boire ensemble"
 IDEAEVENT_22_3_4:0 "Ça ne va pas bien finir"
 IDEAEVENT_22_4_1:0 "Contrat à Long Terme Signé"
 IDEAEVENT_22_4_2:0 "Nous sommes heureux d'annoncer qu'un contrat à long terme a été conclu, liant cette compagnie de mercenaires à notre service pour des années."
 IDEAEVENT_22_4_3:0 "Bonnes nouvelles !"
 #IDEAEVENT_22_4_4:0 ""
 IDEAEVENT_22_5_1:0 "Formation Conjointe"
 IDEAEVENT_22_5_2:0 "L'un de nos généraux a suggéré que nous devrions mélanger mercenaires et troupes régulières en un front homogène."
 IDEAEVENT_22_5_3:0 "Mélanger mercenaires et unités régulières"
 IDEAEVENT_22_5_4:0 "Les garder séparés"
 IDEAEVENT_22_6_1:0 "Résistance contre les Mercenaires"
 IDEAEVENT_22_6_2:0 "Notre peuple n'aime pas que nous dépendions fortement des mercenaires. Ils détestent que leurs impôts aient augmenté et ne font généralement pas confiance aux étrangers."
 IDEAEVENT_22_6_3:0 "Expliquer votre point de vue"
 IDEAEVENT_22_6_4:0 "Leur opinion n'est pas importante"
 IDEAEVENT_22_7_1:0 "Capitaine Mercenaire Recruté"
 IDEAEVENT_22_7_2:0 "Nous avons la chance d'accueillir l'un des capitaines mercenaires dans nos rangs. C'est un compatriote et il est prêt à revenir dans l'armée régulière."
 IDEAEVENT_22_7_3:0 "Pouvons-nous lui faire confiance ?"
 IDEAEVENT_22_7_4:0 "Bienvenue dans nos rangs !"
 IDEAEVENT_22_8_1:0 "Fièvre des Casernes"
 IDEAEVENT_22_8_2:0 "Passer beaucoup de temps au camp sans rien à faire peut être très mauvais pour le moral et la discipline des troupes."
 IDEAEVENT_22_8_3:0 "Ouvrir le camp aux vivandiers"
 IDEAEVENT_22_8_4:0 "Plus d'exercices !"
 IDEAEVENT_22_9_1:0 "Flanc Rompu"
 IDEAEVENT_22_9_2:0 "L'ennemi a rompu l'un de nos flancs. Tout le flanc est en pleine retraite."
 IDEAEVENT_22_9_3:0 "Blâmer les mercenaires"
 IDEAEVENT_22_9_4:0 "Admettre la défaite"
 IDEAEVENT_22_10_1:0 "La Trahison des Mercenaires"
 IDEAEVENT_22_10_2:0 "L'un des régiments de mercenaires que nous avions engagés a saisi la première occasion de nous trahir dans une petite escarmouche qui fut un combat difficile. Le seul survivant a rapporté le message de leur trahison."
 IDEAEVENT_22_10_3:0 "Exécuter les officiers"
 IDEAEVENT_22_10_4:0 "Tuer tout le régiment"
 IDEAEVENT_23_1_1:0 "Prolongation Volontaire du Service"
 IDEAEVENT_23_1_2:0 "Nos hommes aiment servir leur patrie. Beaucoup d'entre eux choisissent de rester plus longtemps dans l'armée."
 IDEAEVENT_23_1_3:0 "Les garder dans l'armée"
 IDEAEVENT_23_1_4:0 "Nous avons aussi besoin de paysans"
 IDEAEVENT_23_2_1:0 "Jeunesse Aguerrie"
 IDEAEVENT_23_2_2:0 "La jeune génération est impatiente d'arriver bien préparée lorsqu'elle commence son service militaire."
 IDEAEVENT_23_2_3:0 "Très bien !"
 #IDEAEVENT_23_2_4:0 ""
 IDEAEVENT_23_3_1:0 "Acceptation de l'Armée en Hausse"
 IDEAEVENT_23_3_2:0 "Notre armée est acceptée et bien reçue dans notre société."
 IDEAEVENT_23_3_3:0 "Excellent"
 #IDEAEVENT_23_3_4:0 ""
 IDEAEVENT_23_4_1:0 "Grand Nombre de Volontaires"
 IDEAEVENT_23_4_2:0 "Cette année, une énorme vague de volontaires veut s'enrôler dans notre armée."
 IDEAEVENT_23_4_3:0 "Les accueillir !"
 IDEAEVENT_23_4_4:0 "Nous n'avons pas besoin d'eux pour l'instant"
 IDEAEVENT_23_5_1:0 "Pénurie d'Équipement"
 IDEAEVENT_23_5_2:0 "En raison du grand nombre de volontaires, nous avons des difficultés à les équiper correctement."
 IDEAEVENT_23_5_3:0 "Ça arrive aux meilleurs"
 IDEAEVENT_23_5_4:0 "Commander des approvisionnements immédiatement"
 IDEAEVENT_23_6_1:0 "Ancien Dépôt de Munitions Découvert"
 IDEAEVENT_23_6_2:0 "Excellentes nouvelles ! En reprenant la garnison d'un fort abandonné, nous avons trouvé un ancien dépôt de munitions qui avait apparemment été oublié ou laissé quand le fort a été mis en sommeil."
 IDEAEVENT_23_6_3:0 "C'est agréable"
 #IDEAEVENT_23_6_4:0 ""
 IDEAEVENT_23_7_1:0 "Promotion d'Officiers"
 IDEAEVENT_23_7_2:0 "La promotion des officiers est imminente. Nous devons décider des meilleurs candidats."
 IDEAEVENT_23_7_3:0 "Promouvoir quelques nobles"
 IDEAEVENT_23_7_4:0 "Nous ne promouvrons que les meilleurs"
 IDEAEVENT_23_8_1:0 "Instructeurs Incompétents"
 IDEAEVENT_23_8_2:0 "Nos inspecteurs généraux rapportent que nos instructeurs sont incompétents. Beaucoup d'entre eux vivent dans le passé et ne savent rien de la guerre moderne."
 IDEAEVENT_23_8_3:0 "Les remplacer tous"
 IDEAEVENT_23_8_4:0 "Les laisser en l'état"
 IDEAEVENT_23_9_1:0 "Explosion d'un Dépôt de Munitions"
 IDEAEVENT_23_9_2:0 "Deux soldats ont été tués quand un dépôt de munitions a explosé la nuit dernière. Nous pensons que ces imbéciles fumaient près des explosifs."
 IDEAEVENT_23_9_3:0 "Oh non !"
 #IDEAEVENT_23_9_4:0 ""
 IDEAEVENT_23_10_1:0 "Désertions en Hausse"
 IDEAEVENT_23_10_2:0 "Les récentes désertions ont atteint des niveaux inquiétants. Nous devons réagir à cette évolution."
 IDEAEVENT_23_10_3:0 "Renforcer nos contrôles"
 IDEAEVENT_23_10_4:0 "Tout cela n'est qu'une coïncidence"
 IDEAEVENT_24_1_1:0 "Champion Mondial des Exportations"
 IDEAEVENT_24_1_2:0 "Notre pays exporte le plus de marchandises au monde par rapport à notre puissance économique."
 IDEAEVENT_24_1_3:0 "C'est notre objectif"
 IDEAEVENT_24_1_4:0 "Ce n'est pas vraiment important pour moi"
 IDEAEVENT_24_2_1:0 "Exportations d'Armes au Plus Haut"
 IDEAEVENT_24_2_2:0 "Nos armes sont bien réputées dans le monde."
 IDEAEVENT_24_2_3:0 "Fournir tout le monde, même nos rivaux"
 IDEAEVENT_24_2_4:0 "Il y a une limite à tout"
 IDEAEVENT_24_3_1:0 "Essor de l'Acier"
 IDEAEVENT_24_3_2:0 "L'acier est une ressource importante pour la production d'armes et d'autres biens. Un essor de l'acier aidera certainement à porter notre production vers de nouveaux sommets."
 IDEAEVENT_24_3_3:0 "Que c'est dur !"
 #IDEAEVENT_24_3_4:0 ""
 IDEAEVENT_24_4_1:0 "Technique Raffinée"
 IDEAEVENT_24_4_2:0 "Nos armes sont assez techniques. Elles ne sont pas aussi grossières que celles de nos voisins. Certains les qualifient même d'œuvres d'art et ils n'ont pas tort."
 IDEAEVENT_24_4_3:0 "Très bien"
 #IDEAEVENT_24_4_4:0 ""
 IDEAEVENT_24_5_1:0 "Production Innovante"
 IDEAEVENT_24_5_2:0 "Il existe différentes approches parmi lesquelles nous devons choisir comment nous voulons que la production dans nos manufactures d'État soit organisée."
 IDEAEVENT_24_5_3:0 "Production Manufacturière"
 IDEAEVENT_24_5_4:0 "Production Sur Mesure"
 IDEAEVENT_24_6_1:0 "Production Privée"
 IDEAEVENT_24_6_2:0 "Certains bourgeois ont construit une manufacture privée et produisent des biens de qualité supérieure qui sont bien reçus."
 IDEAEVENT_24_6_3:0 "Cela fonctionne bien"
 IDEAEVENT_24_6_4:0 "Je ne pense pas que ce soit une bonne idée"
 IDEAEVENT_24_7_1:0 "Capitaliste Puissant"
 IDEAEVENT_24_7_2:0 "Un marchand très actif est devenu très riche en construisant des manufactures privées et cherche maintenant à exercer de l'influence dans l'État."
 IDEAEVENT_24_7_3:0 "Essayer de limiter son influence"
 IDEAEVENT_24_7_4:0 "Le déposséder partiellement"
 IDEAEVENT_24_8_1:0 "Manufacture Sabotée"
 IDEAEVENT_24_8_2:0 "L'une de nos manufactures d'État a été sabotée. Nous pensons que l'un de nos rivaux est responsable."
 IDEAEVENT_24_8_3:0 "Trouver les traîtres !"
 IDEAEVENT_24_8_4:0 "C'est la guerre..."
 IDEAEVENT_24_9_1:0 "Métal de Mauvaise Qualité"
 IDEAEVENT_24_9_2:0 "Nous avons des difficultés à trouver du métal de haute qualité dernièrement. Il semble que le métal fourni récemment était de bien moins bonne qualité qu'annoncé."
 IDEAEVENT_24_9_3:0 "Exiger une meilleure qualité"
 IDEAEVENT_24_9_4:0 "Exécuter les fraudeurs"
 IDEAEVENT_24_10_1:0 "Plans Volés"
 IDEAEVENT_24_10_2:0 "Les plans d'un nouveau design innovant de canons ont été volés à l'un de nos ingénieurs lors d'une visite dans une manufacture pour discuter des moyens de produire des canons plus rapidement."
 IDEAEVENT_24_10_3:0 "Malédiction !"
 #IDEAEVENT_24_10_4:0 ""
 IDEAEVENT_25_1_1:0 "Volontaires"
 IDEAEVENT_25_1_2:0 "Construire des forteresses est une tâche exigeante. Des volontaires pourraient certainement aider."
 IDEAEVENT_25_1_3:0 "Tant de travail à faire !"
 #IDEAEVENT_25_1_4:0 ""
 IDEAEVENT_25_2_1:0 "Doctrine Défensive"
 IDEAEVENT_25_2_2:0 "Il est peut-être plus facile de défendre que de prendre un fort, mais nous pensons qu'il serait bon d'installer un département de doctrine défensive dans notre état-major."
 IDEAEVENT_25_2_3:0 "Établir un département dans notre État-Major"
 IDEAEVENT_25_2_4:0 "Ce n'est pas nécessaire"
 IDEAEVENT_25_3_1:0 "Expert Nain"
 IDEAEVENT_25_3_2:0 "Un expert nain s'est présenté à votre ministre de la Défense pour offrir ses services."
 IDEAEVENT_25_3_3:0 "L'engager !"
 IDEAEVENT_25_3_4:0 "Nous pouvons l'avoir pour moins que ce qu'il demande"
 IDEAEVENT_25_4_1:0 "Matériaux Modernes"
 IDEAEVENT_25_4_2:0 "Seule l'utilisation des meilleures méthodes de construction moderne assurera la meilleure qualité pour nos structures."
 IDEAEVENT_25_4_3:0 "Les utiliser !"
 IDEAEVENT_25_4_4:0 "Qu'est-ce qui ne va pas avec nos anciennes techniques de construction ?"
 IDEAEVENT_25_5_1:0 "Manœuvres Conjointes"
 IDEAEVENT_25_5_2:0 "Intégrer les forts dans nos manœuvres peut être profitable pour la doctrine défensive comme offensive."
 IDEAEVENT_25_5_3:0 "Oui !"
 IDEAEVENT_25_5_4:0 "Les forteresses n'ont pas besoin de manœuvres"
 IDEAEVENT_25_6_1:0 "Entraînement d'Artillerie"
 IDEAEVENT_25_6_2:0 "Nous tirerons à l'artillerie selon les différentes saisons tout autour de nos forts. Ce faisant, nous pourrons analyser les schémas sonores. En cas de siège, nous saurons d'où l'ennemi tire même si nous ne pouvons pas voir sa position."
 IDEAEVENT_25_6_3:0 "Une très bonne idée"
 IDEAEVENT_25_6_4:0 "Un gaspillage de munitions"
 IDEAEVENT_25_7_1:0 "Experts en Fortification"
 IDEAEVENT_25_7_2:0 "Notre état-major compte un nombre croissant d'experts en fortification."
 IDEAEVENT_25_7_3:0 "Très bien !"
 #IDEAEVENT_25_7_4:0 ""
 IDEAEVENT_25_8_1:0 "Mort d'un Ingénieur"
 IDEAEVENT_25_8_2:0 "L'un de nos meilleurs ingénieurs en fortification est mort. Nous ne pouvons qu'espérer que ses successeurs seront tout aussi talentueux."
 IDEAEVENT_25_8_3:0 "Il a fait un excellent travail !"
 #IDEAEVENT_25_8_4:0 ""
 IDEAEVENT_25_9_1:0 "Forteresse Touchée par une Inondation"
 IDEAEVENT_25_9_2:0 "Une récente inondation a gravement endommagé l'un de nos forts."
 IDEAEVENT_25_9_3:0 "Réparer les dégâts"
 IDEAEVENT_25_9_4:0 "Nous n'avons pas l'argent pour l'instant"
 IDEAEVENT_25_10_1:0 "Mauvais Matériaux"
 IDEAEVENT_25_10_2:0 "Nous avons appris que les matériaux que nous avons achetés récemment étaient de mauvaise qualité et ne seraient normalement pas adaptés à la construction de forteresses."
 IDEAEVENT_25_10_3:0 "Remplacer les mauvais matériaux"
 IDEAEVENT_25_10_4:0 "Il n'est pas nécessaire de faire quoi que ce soit"
 IDEAEVENT_26_1_1:0 "Production Fluide"
 IDEAEVENT_26_1_2:0 "Nous visons à produire un certain nombre de biens afin de réaliser des profits avec nos manufactures d'État. Dernièrement, cela se passe très bien."
 IDEAEVENT_26_1_3:0 "De bonnes nouvelles !"
 #IDEAEVENT_26_1_4:0 ""
 IDEAEVENT_26_2_1:0 "Zone de Déploiement Parfaite"
 IDEAEVENT_26_2_2:0 "Le bon déploiement des troupes est très important lors d'une attaque ou d'une défense. De même, l'infrastructure pour y parvenir doit être construite."
 IDEAEVENT_26_2_3:0 "Nos infrastructures sont excellentes !"
 IDEAEVENT_26_2_4:0 "Quelle importance ont les routes de toute façon ?"
 IDEAEVENT_26_3_1:0 "Production au Sommet"
 IDEAEVENT_26_3_2:0 "Dernièrement, la production de nos manufactures d'État a atteint des chiffres que nous n'aurions jamais espérés."
 IDEAEVENT_26_3_3:0 "Très bonnes nouvelles !"
 #IDEAEVENT_26_3_4:0 ""
 IDEAEVENT_26_4_1:0 "Armes d'Infanterie de Qualité"
 IDEAEVENT_26_4_2:0 "La qualité de nos armes d'infanterie est très bonne."
 IDEAEVENT_26_4_3:0 "Excellent"
 #IDEAEVENT_26_4_4:0 ""
 IDEAEVENT_26_5_1:0 "Armes de Cavalerie de Qualité"
 IDEAEVENT_26_5_2:0 "La qualité de nos armes de cavalerie est très bonne."
 IDEAEVENT_26_5_3:0 "Excellent"
 #IDEAEVENT_26_5_4:0 ""
 IDEAEVENT_26_6_1:0 "Canons de Qualité"
 IDEAEVENT_26_6_2:0 "La qualité de nos canons est très bonne."
 IDEAEVENT_26_6_3:0 "Excellent"
 #IDEAEVENT_26_6_4:0 ""
 IDEAEVENT_26_7_1:0 "Explosion dans une Mine de Fer"
 IDEAEVENT_26_7_2:0 "Nous ne savons pas pourquoi, mais il y a eu une explosion dans l'une de nos mines de fer les plus rentables et nous devons nous attendre à ce que cela affecte grandement notre production."
 IDEAEVENT_26_7_3:0 "Enquêter sur l'affaire"
 IDEAEVENT_26_7_4:0 "Ces choses arrivent"
 IDEAEVENT_26_8_1:0 "Production en Série Défectueuse"
 IDEAEVENT_26_8_2:0 "Malheureusement, nous avons appris qu'une pièce utilisée dans nos nouveaux mousquets est défectueuse et doit être remplacée pour que le mousquet fonctionne de manière fiable."
 IDEAEVENT_26_8_3:0 "Rappeler les pièces défectueuses"
 IDEAEVENT_26_8_4:0 "Ce n'est pas important"
 IDEAEVENT_26_9_1:0 "Pénurie d'Approvisionnement"
 IDEAEVENT_26_9_2:0 "Malgré la production de guerre actuelle, nous ne pouvons pas satisfaire entièrement les demandes de notre armée."
 IDEAEVENT_26_9_3:0 "Essayer de trouver les approvisionnements ailleurs"
 IDEAEVENT_26_9_4:0 "Les hommes devront se contenter de ce qu'ils ont"
 IDEAEVENT_26_10_1:0 "Arrêt de Production"
 IDEAEVENT_26_10_2:0 "Le mécontentement dans les rangs de nos ouvriers a conduit à un arrêt complet de la production. Les ouvriers critiquent le fait qu'ils n'ont pas été payés ce que nous avions promis, ce qui est vrai."
 IDEAEVENT_26_10_3:0 "Manipuler les chiffres"
 IDEAEVENT_26_10_4:0 "Admettre votre erreur"
 IDEAEVENT_27_1_1:0 "Redéploiement Tactique"
 IDEAEVENT_27_1_2:0 "Nous avons trouvé une opportunité de faire un redéploiement rapide des troupes et de prendre l'ennemi par surprise."
 IDEAEVENT_27_1_3:0 "L'ennemi ne nous attendra pas ici"
 #IDEAEVENT_27_1_4:0 ""
 IDEAEVENT_27_2_1:0 "Beau Temps"
 IDEAEVENT_27_2_2:0 "Ces derniers mois, le temps était idéal pour les campagnes."
 IDEAEVENT_27_2_3:0 "Dieu est de notre côté"
 #IDEAEVENT_27_2_4:0 ""
 IDEAEVENT_27_3_1:0 "Attaque Surprise Réussie"
 IDEAEVENT_27_3_2:0 "Nous avons surpris notre ennemi avec une manœuvre sournoise et avons pris l'initiative."
 IDEAEVENT_27_3_3:0 "Exploiter l'avantage"
 #IDEAEVENT_27_3_4:0 ""
 IDEAEVENT_27_4_1:0 "Marcher Séparément, Frapper Ensemble"
 IDEAEVENT_27_4_2:0 "Parfois, il est conseillé de diviser les forces et de marcher rapidement sur différentes routes, puis de concentrer rapidement les troupes en un point et de détruire l'ennemi avec des forces supérieures."
 IDEAEVENT_27_4_3:0 "Faisons ainsi"
 IDEAEVENT_27_4_4:0 "Qui a dit cela déjà ?"
 IDEAEVENT_27_5_1:0 "Attaque de Diversion"
 IDEAEVENT_27_5_2:0 "Nous allons dérouter nos ennemis avec une feinte puis les submerger sur leur autre aile."
 IDEAEVENT_27_5_3:0 "Feinter à leur droite et prendre leur gauche"
 #IDEAEVENT_27_5_4:0 ""
 IDEAEVENT_27_6_1:0 "Repli Tactique"
 IDEAEVENT_27_6_2:0 "Notre front est trop étiré. Nous devons reculer un peu pour éviter d'être encerclés."
 IDEAEVENT_27_6_3:0 "Raccourcir notre ligne de bataille"
 #IDEAEVENT_27_6_4:0 ""
 IDEAEVENT_27_7_1:0 "Régiment Encerclé"
 IDEAEVENT_27_7_2:0 "Mauvaises nouvelles ! L'un de nos régiments est tombé dans le piège ennemi et a été encerclé."
 IDEAEVENT_27_7_3:0 "Contre-attaquer immédiatement"
 IDEAEVENT_27_7_4:0 "Ils sont perdus pour nous"
 IDEAEVENT_27_8_1:0 "Troupes Sous le Choc !"
 IDEAEVENT_27_8_2:0 "Les troupes sont choquées par nos pertes récentes. Nous devons les encourager maintenant ou battre en retraite et nous regrouper !"
 IDEAEVENT_27_8_3:0 "Aux drapeaux !"
 IDEAEVENT_27_8_4:0 "Battre en retraite !"
 IDEAEVENT_27_9_1:0 "Plans de Mouvement Divulgués"
 IDEAEVENT_27_9_2:0 "D'une manière ou d'une autre, l'ennemi a eu vent de nos plans de mouvement. Que devons-nous faire ?"
 IDEAEVENT_27_9_3:0 "S'en tenir au plan !"
 IDEAEVENT_27_9_4:0 "Aucun plan ne survit au premier contact avec l'ennemi"
 IDEAEVENT_27_10_1:0 "Manœuvre Échouée"
 IDEAEVENT_27_10_2:0 "Nous avions planifié une manœuvre astucieuse mais cela ne s'est pas passé comme prévu."
 IDEAEVENT_27_10_3:0 "Blâmer le général"
 IDEAEVENT_27_10_4:0 "Toutes les manœuvres ne peuvent pas réussir"
 IDEAEVENT_28_1_1:0 "Magazine Militaire"
 IDEAEVENT_28_1_2:0 "Nous avons institué un magazine spécial informant notre peuple des derniers développements militaires."
 IDEAEVENT_28_1_3:0 "Toujours de bonnes nouvelles !"
 #IDEAEVENT_28_1_4:0 ""
 IDEAEVENT_28_2_1:0 "Articles de Journaux Favorables"
 IDEAEVENT_28_2_2:0 "Même les journaux qui ne sont pas directement contrôlés par nous sont vraiment militaristes et louent généralement notre armée et notre État."
 IDEAEVENT_28_2_3:0 "Oh oui !"
 IDEAEVENT_28_2_4:0 "Ils peuvent être encore plus favorables"
 IDEAEVENT_28_3_1:0 "Parade Militaire Annuelle"
 IDEAEVENT_28_3_2:0 "La parade militaire annuelle fut une fois de plus un grand succès. Un peuple en délire a acclamé nos troupes sans fin."
 IDEAEVENT_28_3_3:0 "En avant vers la gloire"
 IDEAEVENT_28_3_4:0 "Bon sang, c'était cher"
 IDEAEVENT_28_4_1:0 "Écrivain Célèbre dans l'Armée"
 IDEAEVENT_28_4_2:0 "L'un de nos écrivains les plus célèbres sert maintenant dans notre armée."
 IDEAEVENT_28_4_3:0 "Un bon exemple"
 IDEAEVENT_28_4_4:0 "C'est mieux quand ces gens restent chez eux"
 IDEAEVENT_28_5_1:0 "Scandale Mondain"
 IDEAEVENT_28_5_2:0 "Nos officiers ont causé un scandale mondain lors d'une réception. Les rapports disent qu'ils ont trop bu et se sont montrés plutôt intrusifs envers les dames de la noblesse."
 IDEAEVENT_28_5_3:0 "Ignorer cet incident"
 IDEAEVENT_28_5_4:0 "Les discipliner"
 IDEAEVENT_28_6_1:0 "Bal des Officiers"
 IDEAEVENT_28_6_2:0 "Il n'y a pas de limite à la galanterie de nos officiers. Chaque jeune femme du royaume rêve d'en épouser un."
 IDEAEVENT_28_6_3:0 "M'accorderez-vous cette danse ?"
 #IDEAEVENT_28_6_4:0 ""
 IDEAEVENT_28_7_1:0 "Officier et Gentilhomme"
 IDEAEVENT_28_7_2:0 "L'un de nos officiers galants est actuellement sur toutes les lèvres. Il a vaincu seul des brigands qui voulaient importuner une jeune dame."
 IDEAEVENT_28_7_3:0 "Votre coiffe est en désordre, ma dame"
 #IDEAEVENT_28_7_4:0 ""
 IDEAEVENT_28_8_1:0 "Les Guerres Sont un Crime contre l'Humanité"
 IDEAEVENT_28_8_2:0 "L'un des écrivains majeurs du pays a dénoncé la guerre comme un crime contre l'humanité dans son dernier livre."
 IDEAEVENT_28_8_3:0 "Absurdités"
 IDEAEVENT_28_8_4:0 "Ils ont raison sur un point"
 IDEAEVENT_28_9_1:0 "Les Intellectuels Débattent de la Guerre"
 IDEAEVENT_28_9_2:0 "Nos intellectuels débattent des pour et des contre de la guerre et dans quelles circonstances la guerre peut éventuellement être justifiée."
 IDEAEVENT_28_9_3:0 "Laissez-les débattre, nous combattons"
 IDEAEVENT_28_9_4:0 "Argumenter contre eux"
 IDEAEVENT_28_10_1:0 "Appel à la Paix Imminent"
 IDEAEVENT_28_10_2:0 "Notre nation est fatiguée de la guerre. Les intellectuels et le peuple exigent tous la paix."
 IDEAEVENT_28_10_3:0 "Accepter"
 IDEAEVENT_28_10_4:0 "Argumenter contre la paix à tout prix"
 IDEAEVENT_29_1_1:0 "Charge de Cavalerie"
 IDEAEVENT_29_1_2:0 "Notre cavalerie charge vers l'ennemi."
 IDEAEVENT_29_1_3:0 "Formation en coin !"
 IDEAEVENT_29_1_4:0 "Chargez !"
 IDEAEVENT_29_2_1:0 "Carré Ennemi Submergé"
 IDEAEVENT_29_2_2:0 "Nos troupes ont réussi à submerger un carré ennemi."
 IDEAEVENT_29_2_3:0 "Maintenant vers l'autre flanc !"
 IDEAEVENT_29_2_4:0 "Exploiter l'avantage !"
 IDEAEVENT_29_3_1:0 "Attaques Fanatiques !"
 IDEAEVENT_29_3_2:0 "La bataille fait des va-et-vient. Alliés et ennemis sont épuisés. Si la bataille doit être décidée aujourd'hui, nous devons nous rallier pour une dernière attaque !"
 IDEAEVENT_29_3_3:0 "Encore une fois dans la brèche, chers amis"
 #IDEAEVENT_29_3_4:0 ""
 IDEAEVENT_29_4_1:0 "Suivez le Drapeau !"
 IDEAEVENT_29_4_2:0 "Un brave héros assaille l'ennemi seul, le drapeau serré dans ses mains."
 IDEAEVENT_29_4_3:0 "En avant !"
 #IDEAEVENT_29_4_4:0 ""
 IDEAEVENT_29_5_1:0 "Assaut Ennemi"
 IDEAEVENT_29_5_2:0 "L'ennemi a lancé un assaut massif sur notre centre."
 IDEAEVENT_29_5_3:0 "Contre-attaque !"
 IDEAEVENT_29_5_4:0 "Les attendre dans notre position actuelle"
 IDEAEVENT_29_6_1:0 "Harcèlement de nos Éclaireurs"
 IDEAEVENT_29_6_2:0 "Notre avant-garde est harcelée par l'ennemi et nous subissons des pertes. Nous devons décider si nous voulons battre en retraite ou renforcer l'avant-garde et repousser l'ennemi."
 IDEAEVENT_29_6_3:0 "Renforcer nos unités en première ligne"
 IDEAEVENT_29_6_4:0 "Maintenir la pression"
 IDEAEVENT_29_6_5:0 "Reculer un peu"
 IDEAEVENT_29_7_1:0 "Attaque Repoussée"
 IDEAEVENT_29_7_2:0 "Notre attaque a été repoussée. Nous avons subi de lourdes pertes."
 IDEAEVENT_29_7_3:0 "Rallier les troupes et attaquer à nouveau"
 IDEAEVENT_29_7_4:0 "Tenir bon !"
 IDEAEVENT_29_8_1:0 "Contre-attaque Ennemie !"
 IDEAEVENT_29_8_2:0 "L'ennemi sort de sa position pour nous affronter en terrain découvert."
 IDEAEVENT_29_8_3:0 "En avant !"
 IDEAEVENT_29_8_4:0 "Garder la deuxième vague en réserve"
 IDEAEVENT_29_9_1:0 "Baïonnette au Canon !"
 IDEAEVENT_29_9_2:0 "Notre assaut a été stoppé par un tir d'artillerie intense et les tranchées ennemies. Nous voyons maintenant un grand groupe de cavalerie charger sur notre gauche."
 IDEAEVENT_29_9_3:0 "Cavalerie sur notre flanc gauche !"
 IDEAEVENT_29_9_4:0 "Former le carré maintenant !"
 IDEAEVENT_29_10_1:0 "En avant vers la Victoi..."
 IDEAEVENT_29_10_2:0 "À quelques mètres de la position ennemie, notre officier de tête est abattu par une balle ennemie."
 IDEAEVENT_29_10_3:0 "À l'attaque !"
 IDEAEVENT_29_10_4:0 "En arrière !"
 IDEAEVENT_30_1_1:0 "Concentration de Tir"
 IDEAEVENT_30_1_2:0 "L'ennemi avance sur les deux flancs. Nous devons le mitrailler maintenant."
 IDEAEVENT_30_1_3:0 "Flanc gauche !"
 IDEAEVENT_30_1_4:0 "Flanc droit !"
 IDEAEVENT_30_2_1:0 "À mon Signal..."
 IDEAEVENT_30_2_2:0 "L'ennemi avance au centre. Si nous tirons maintenant, nous pourrons peut-être le mettre en déroute, mais si nous tirons plus tard, nous tuerons davantage mais nous subirons aussi une salve de leur part."
 IDEAEVENT_30_2_3:0 "Feu !"
 IDEAEVENT_30_2_4:0 "Attendez !"
 IDEAEVENT_30_3_1:0 "Excellent Approvisionnement en Munitions"
 IDEAEVENT_30_3_2:0 "Notre bataillon de ravitaillement fait un travail remarquable. Personne ne manque jamais de munitions dans notre armée."
 IDEAEVENT_30_3_3:0 "Tout envoyer au front"
 IDEAEVENT_30_3_4:0 "En garder en réserve"
 IDEAEVENT_30_4_1:0 "Riposte !"
 IDEAEVENT_30_4_2:0 "Nos lignes rencontrent nos ennemis en formation ouverte lorsque notre centre est frappé par une salve dévastatrice."
 IDEAEVENT_30_4_3:0 "Oui, mon général !"
 #IDEAEVENT_30_4_4:0 ""
 IDEAEVENT_30_5_1:0 "Excellente Position d'Artillerie Découverte"
 IDEAEVENT_30_5_2:0 "En avançant rapidement, nous avons trouvé une excellente position pour notre artillerie. Nous devons décider si nous voulons utiliser cette position et nous y retrancher ou si nous voulons poursuivre l'avance."
 IDEAEVENT_30_5_3:0 "Retranchez-vous là !"
 IDEAEVENT_30_5_4:0 "Avancer davantage !"
 IDEAEVENT_30_6_1:0 "Position d'Artillerie Ennemie Découverte"
 IDEAEVENT_30_6_2:0 "Nos éclaireurs ont enfin trouvé une position de mortier ennemie qui nous a causé de lourdes pertes."
 IDEAEVENT_30_6_3:0 "Les prendre par derrière"
 IDEAEVENT_30_6_4:0 "Les assaillir avant qu'ils ne nous remarquent"
 IDEAEVENT_30_7_1:0 "Position d'Artillerie Envahie"
 IDEAEVENT_30_7_2:0 "Grave nouvelle ! Notre emplacement d'artillerie avancé a été envahi par la cavalerie ennemie."
 IDEAEVENT_30_7_3:0 "Se replier vers notre prochaine position défensive"
 IDEAEVENT_30_7_4:0 "Se rallier immédiatement et reprendre la position"
 IDEAEVENT_30_8_1:0 "Observateur Capturé"
 IDEAEVENT_30_8_2:0 "L'un de nos observateurs cherchait des cibles ennemies quand il a été surpris par des éclaireurs ennemis. Nous n'avons pas pu empêcher sa capture."
 IDEAEVENT_30_8_3:0 "Terrible nouvelle"
 #IDEAEVENT_30_8_4:0 "L'interroger en gentilhomme"
 IDEAEVENT_30_9_1:0 "Canonnade Ennemie"
 IDEAEVENT_30_9_2:0 "Nos ennemis tirent avec un effet dévastateur sur nos rangs."
 IDEAEVENT_30_9_3:0 "À couvert !"
 #IDEAEVENT_30_9_4:0 "..."
 IDEAEVENT_30_10_1:0 "Formation Rompue"
 IDEAEVENT_30_10_2:0 "En marchant vers l'ennemi, nos troupes n'ont pas pu maintenir la formation et apparaissent maintenant en désordre devant l'ennemi."
 IDEAEVENT_30_10_3:0 "Battre en retraite !"
 IDEAEVENT_30_10_4:0 "Tenir bon et combattre !"
 ADVISOREVENT_ADM_1:0 "Ses efforts seront admirés dans toute la nation"
 ADVISOREVENT_ADM_2:0 "Sa réputation dépassera nos frontières"
 ADVISOREVENT_DIP_1:0 "Ses efforts seront admirés dans toute la nation"
 ADVISOREVENT_DIP_2:0 "Sa réputation dépassera nos frontières"
 ADVISOREVENT_MIL_1:0 "Ses efforts seront admirés dans toute la nation"
 ADVISOREVENT_MIL_2:0 "Sa réputation dépassera nos frontières"
 ADVISOREVENT_1_ADM:0 "[Root.Adm_Advisor.GetName]"
 ADVISOREVENT_1_DIP:0 "[Root.Dip_Advisor.GetName]"
 ADVISOREVENT_1_MIL:0 "[Root.Mil_Advisor.GetName]"
 ADVISOREVENT_1_desc:0 "Notre conseiller, [Root.Adm_Advisor.GetName], a écrit un essai brillant sur l'intégration des nouvelles provinces et a ainsi permis à notre administration de le faire plus efficacement."
 ADVISOREVENT_2_desc:0 "Notre conseiller, [Root.Dip_Advisor.GetName], a suggéré une nouvelle loi pour une intégration plus rapide de l'administration étrangère dans la nôtre. En promulguant cette loi, nous pourrions accélérer considérablement l'intégration de nos sujets."
 ADVISOREVENT_3_desc:0 "Notre conseiller, [Root.Adm_Advisor.GetName], est un véritable génie du secteur de la construction. Nous pouvons utiliser ses contacts pour assurer un essor de la construction harmonieux dans notre pays."
 ADVISOREVENT_4_desc:0 "Notre conseiller, [Root.Adm_Advisor.GetName], est un capitaliste, donc son succès personnel est sa première priorité. Cependant, il excelle à apporter son expertise dans des domaines comme la rentabilisation des zones rurales."
 ADVISOREVENT_5_desc:0 "Notre conseiller, [Root.Mil_Advisor.GetName], est un officier d'état-major qui a acquis une excellente réputation parmi les experts pour son travail approfondi dans tous les domaines de la guerre."
 ADVISOREVENT_6_desc:0 "Notre conseiller, [Root.Adm_Advisor.GetName], est un bâtisseur de ponts et un homme de progrès. Nous trouverons plus facile de mettre en œuvre de nouvelles technologies et façons de penser dans notre pays si nous l'écoutons."
 ADVISOREVENT_7_desc:0 "Notre conseiller, [Root.Dip_Advisor.GetName], a développé un nouveau concept pour éviter l'attrition hivernale pour notre flotte. En suivant son concept, nous pouvons maintenir un plus grand nombre de navires qu'auparavant."
 ADVISOREVENT_8_desc:0 "Notre conseiller, [Root.Adm_Advisor.GetName], combat la corruption depuis son entrée en fonction. Il a déjà obtenu de grands succès."
 ADVISOREVENT_9_desc:0 "Notre conseiller, [Root.Adm_Advisor.GetName], a réussi à réduire notre administration inefficace au point où elle peut fonctionner à nouveau avec une plus grande efficacité."
 ADVISOREVENT_10_desc:0 "Notre conseiller, [Root.Dip_Advisor.GetName], a développé un programme central de colonisation nous permettant de contrôler et de diriger le flux d'immigrants là où nous en avons besoin."
 ADVISOREVENT_11_desc:0 "Notre conseiller, [Root.Mil_Advisor.GetName], a étudié presque toutes les forteresses du monde connu et on dit qu'il a un plan d'attaque pour chacune d'elles en réserve."
 ADVISOREVENT_12_desc:0 "Notre conseiller, [Root.Mil_Advisor.GetName], développe constamment de nouvelles techniques de combat pour l'infanterie. Nous pouvons certainement profiter de ses vastes connaissances dans les guerres à venir."
 ADVISOREVENT_13_desc:0 "Notre conseiller, [Root.Mil_Advisor.GetName], est né en selle. Il utilise son influence pour étendre notre cavalerie et convainc de plus en plus de gens qu'une grande partie de l'armée devrait être de la cavalerie."
 ADVISOREVENT_14_desc:0 "Notre conseiller, [Root.Mil_Advisor.GetName], est un artilleur de la première heure. Il réclame constamment plus d'artillerie et a écrit d'innombrables essais sur la puissance de l'artillerie au combat."
 ADVISOREVENT_15_desc:0 "Notre conseiller, [Root.Mil_Advisor.GetName], est un homme qui en son temps était toujours le premier dans la brèche. C'est un héros de guerre qui inspirera les jeunes soldats partout où il apparaît."
 ADVISOREVENT_16_desc:0 "Notre conseiller, [Root.Mil_Advisor.GetName], est le héros qui a un jour tenu sa position seul contre d'innombrables ennemis et mérite toutes les louanges qu'il reçoit. Tout le monde aspirera à imiter son comportement."
 ADVISOREVENT_17_desc:0 "Notre conseiller, [Root.Mil_Advisor.GetName], a développé une formation nous permettant de tirer plus rapidement sur l'ennemi. En l'intégrant dans notre stratégie, nous pouvons obtenir un avantage jusqu'à ce que l'ennemi s'adapte."
 ADVISOREVENT_18_desc:0 "Notre conseiller, [Root.Mil_Advisor.GetName], a écrit un mémorandum déclarant que se mettre à couvert du feu ennemi n'est pas un acte de lâcheté mais préserve les ressources humaines pour notre pays."
 ADVISOREVENT_19_desc:0 "Notre conseiller, [Root.Dip_Advisor.GetName], a écrit un essai sur les cultures de notre pays, soulignant leurs similitudes. Cela nous rapprochera."
 ADVISOREVENT_20_desc:0 "Notre conseiller, [Root.Adm_Advisor.GetName], est un prêteur d'argent rusé qui connaît toutes les astuces que nous devons savoir quand nous négocions un nouvel emprunt public."
 ADVISOREVENT_21_desc:0 "Notre conseiller, [Root.Dip_Advisor.GetName], est un homme qui a beaucoup voyagé avec d'excellentes connexions dans tout le monde connu. Maintenant, nous pouvons utiliser ces connexions pour améliorer notre puissance commerciale dans d'autres pays."
 ADVISOREVENT_22_desc:0 "Notre conseiller, [Root.Dip_Advisor.GetName], est un homme issu d'une famille modeste. Cependant, il a fait une grande carrière dans notre marine et s'est élevé de mousse à amiral. Il servira d'exemple aux jeunes ambitieux."
 ADVISOREVENT_23_desc:0 "Notre conseiller, [Root.Dip_Advisor.GetName], est un négociateur très rusé. Il sait comment présenter des conditions difficiles pour paraître bienveillant envers nos ennemis."
 ADVISOREVENT_24_desc:0 "Notre conseiller, [Root.Dip_Advisor.GetName], était capitaine d'un navire lourd. Maintenant, il peut enfin mettre en œuvre les changements qu'il a toujours voulu apporter pour améliorer la capacité de combat de notre flotte."
 ADVISOREVENT_25_desc:0 "Notre conseiller, [Root.Dip_Advisor.GetName], était capitaine d'une galère. Maintenant, il peut enfin mettre en œuvre les changements qu'il a toujours voulu apporter pour améliorer la capacité de combat de notre flotte."
 ADVISOREVENT_26_desc:0 "Notre conseiller, [Root.Dip_Advisor.GetName], était capitaine d'un navire léger. Maintenant, il peut enfin mettre en œuvre les changements qu'il a toujours voulu apporter pour améliorer la capacité de combat de notre flotte."
 ADVISOREVENT_27_desc:0 "Notre conseiller, [Root.Dip_Advisor.GetName], est un apaiseur habile. Même si nos vassaux pensent à se révolter, il trouvera un moyen de les calmer."
 ADVISOREVENT_28_desc:0 "Notre conseiller, [Root.Mil_Advisor.GetName], est un ancien capitaine mercenaire. Son expérience avec les mercenaires nous sera très précieuse pour traiter avec cette engeance."
 ADVISOREVENT_29_desc:0 "Notre conseiller, [Root.Mil_Advisor.GetName], est un instructeur à l'ancienne. Il sait par expérience quelles sont les meilleures méthodes pour entraîner nos soldats."
 ADVISOREVENT_30_desc:0 "Notre conseiller, [Root.Adm_Advisor.GetName], est un militariste qui cherche à renforcer l'influence de l'armée sur l'État."
 ADVISOREVENT_31_desc:0 "Notre conseiller, [Root.Adm_Advisor.GetName], est un homme qui veut concentrer le pouvoir de l'État en une seule personne : le roi !"
 ADVISOREVENT_32_desc:0 "Notre conseiller, [Root.Adm_Advisor.GetName], aspire à unifier l'Empire en un seul royaume. Il a déjà fait les premiers pas pour atteindre ce grand objectif."
