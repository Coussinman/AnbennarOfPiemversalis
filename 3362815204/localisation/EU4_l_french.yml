 governor_removed_from:0 "Le [From.Owner.Monarch.GetTitle] [From.Owner.Monarch.GetName] est destitué"
 ban_fur_trade:0 "Interdiction du commerce des fourrures"
 desc_ban_fur_trade:0 "Cette loi nuit à l'économie locale des Indiens et des Blancs, mais assurera notre sécurité contre les raids indiens armés."
 construction_wages:0 "Salaires de construction"
 desc_construction_wages:0 "Pour contenir la hausse des prix, un salaire maximum pour la construction a été mis en place."
 tax_break_ore:0 "Exonération fiscale"
 desc_tax_break_ore:0 "Les propriétaires des mines de minerai locales ont reçu une exonération fiscale."
 tax_break_wharf:0 "Exonération fiscale"
 desc_tax_break_wharf:0 "Les propriétaires du quai local ont reçu une exonération fiscale."
 banned_tobacco_planting:0 "Plantation de tabac interdite"
 desc_banned_tobacco_planting:0 "La plantation de tabac a été interdite pendant un an afin de permettre aux prix d'augmenter."
 reformed_events.EVTNAME1:0 "Réfugiés réformés"
 reformed_events.EVTDESC1:0 "L'un de nos voisins opprime impitoyablement sa minorité de fidèles réformés. Ces pauvres âmes souhaitent échapper à la persécution et s'installer dans notre province frontalière [Root.GetName]. Permettre cela profiterait à notre économie mais contrarierait grandement notre voisin..."
 reformed_events.EVTOPTA1:0 "Les laisser passer"
 reformed_events.EVTOPTB1:0 "Nous ferions mieux de ne pas"
 reformed_events.EVTNAME2:0 "Les fidèles réformés fuient"
 reformed_events.EVTDESC2:0 "De nombreux hérétiques réformés de [Root.GetName] ont fui de l'autre côté de la frontière dans l'espoir de trouver un havre sûr à [From.GetName]. Apparemment, cela a été fait avec la sanction tacite du gouvernement de [From.Owner.GetName]."
 reformed_events.EVTOPTA2:0 "Comment osent-ils !"
 reformed_events.EVTNAME3:0 "Envoi de ministres à l'étranger"
 reformed_events.EVTDESC3:0 "Beaucoup au sein de l'Église sont d'avis que nous, en tant que nation réformée de premier plan, devrions envoyer nos ministres à l'étranger pour assurer que la vraie réformation continue de se répandre."
 reformed_events.EVTOPTA3:0 "Pour la gloire de Dieu !"
 reformed_events.EVTOPTB3:0 "La garder dans nos frontières"
 reformed_events.EVTNAME4:0 "Ministres étrangers à [Root.GetName]"
 reformed_events.EVTDESC4:0 "Il y a des rapports de ministres prêchant la foi réformée qui sont apparus à [Root.GetName]. Ils semblent venir de [From.GetName] pour encourager la population locale à résister et à riposter contre nos tentatives d'éradiquer cette hérésie."
 reformed_events.EVTOPTA4:0 "Scandaleux !"
 reformed_events.EVTNAME5:0 "Prédestination"
 reformed_events.EVTDESC5:0 "Les théologiens réformés croient que seuls ceux qui sont prédestinés au salut peuvent être sauvés. Mais puisqu'il est impossible de savoir qui est prédestiné, une notion s'est développée qu'il pourrait être possible de discerner qu'une personne est prédestinée en observant son mode de vie. Comme le travail acharné, la frugalité, le succès social et la richesse sont considérés comme des conséquences importantes d'être prédestiné, cela semble inspirer les fidèles de la foi réformée à s'efforcer de les atteindre, ainsi qu'à attirer ceux qui les possèdent déjà, comme les bourgeois et les marchands."
 reformed_events.EVTOPTA5:0 "Encourager ces croyances"
 reformed_events.EVTOPTB5:0 "Laisser faire"
 reformed_events.EVTNAME6:0 "Instruments dans l'église"
 reformed_events.EVTDESC6:0 "Les principaux théologiens sont d'avis que la musique ne devrait pas être utilisée dans les sermons religieux. Ils croient qu'elle distrait les gens de la question importante, l'adoration et la recherche de la connaissance de Dieu, et favorisent donc l'interdiction des instruments de musique dans les églises."
 reformed_events.EVTOPTA6:0 "Émettre une interdiction"
 reformed_events.EVTOPTB6:0 "Ignorer leurs opinions"
 reformed_events.EVTNAME7:0 "Fureur iconoclaste"
 reformed_events.EVTDESC7:0 "[Root.GetName] a connu des éruptions de violence religieuse alors que des foules de fidèles réformés vandalisent les églises et détruisent l'art religieux ravélien. La majorité ravélienne de [Root.GetName] exige que le gouvernement agisse immédiatement."
 reformed_events.EVTOPTA7:0 "Envoyer des troupes pour arrêter cela !"
 reformed_events.EVTOPTB7:0 "L'encourager !"
