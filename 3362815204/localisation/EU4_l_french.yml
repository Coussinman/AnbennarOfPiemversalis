 STATE_IRO:0 "$NAME$ est un §YÉtat§!."
 STATE_DRO:2 "Un royaume est divisé en plusieurs territoires, où toutes les provinces possédées dans une zone forment un territoire. Un territoire peut devenir un État de la nation, qui est une partie intégrante du royaume. Cela coûtera un certain entretien selon la distance de la capitale, tout en réduisant considérablement son autonomie minimale.\n\nLe développement dans les États et territoires utilise la capacité de gouvernance. Le développement des territoires ne compte que pour 25 % de la capacité de gouvernance. La capacité de gouvernance peut être augmentée en augmentant le rang gouvernemental, en avançant la technologie administrative, en complétant le groupe d'Idées Administratives et en utilisant la Progression de Réforme pour Étendre l'Administration dans la fenêtre des Réformes Gouvernementales."
 CONFIRMAKESTATETITLE:0 "Transformer le Territoire en État"
 CONFIRMMAKESTATETEXT:2 "Faire de $NAME$ un État nous coûtera $COST|Y$¤ d'entretien chaque mois, tandis que cela augmentera nos revenus d'environ $INC|Y$¤ quand l'autonomie aura été réduite à des niveaux inférieurs. Cela augmentera également nos effectifs et nos marins de la zone.\nTransformer $NAME$ en État utilisera $CAP|Y0$ de notre Capacité de Gouvernance, l'amenant à un total de $USED_CAP|Y0$.\n\nToutes les provinces appartenant à une §YCompagnie Commerciale§! seront automatiquement §Rretirées§! et ajoutées à l'État !"
 CONFIRMMAKESTATETEXT_OVER_CAP:1 "Faire de $NAME$ un État nous coûtera $COST|Y$¤ d'entretien chaque mois, tandis que cela augmentera nos revenus d'environ $INC|Y$¤ quand l'autonomie aura été réduite à des niveaux inférieurs. Cela augmentera également nos effectifs et nos marins de la zone.\nTransformer $NAME$ en État utilisera $CAP|Y0$ de notre Capacité de Gouvernance, l'amenant à un total de $USED_CAP|Y0$.\n§RCela nous fera dépasser notre Capacité de Gouvernance de $MAX_CAP|Y0$ et entraînera des pénalités !§!\nToutes les provinces appartenant à une §YCompagnie Commerciale§! seront automatiquement §Rretirées§! et ajoutées à l'État !"
 CONFIRABANDONSTATEITLE:0 "Abandonner l'État en Territoire"
 CONFIRMABANDONSTATETEXT:1 "En ne considérant plus $NAME$ comme un État, nous ne serons plus obligés de payer $COST|Y$¤ d'entretien chaque mois, mais l'autonomie locale dans les provinces augmentera à un niveau bien plus élevé.\n\n§RTous les modificateurs accordés par l'augmentation de l'autonomie locale seront retirés des provinces.§!"
