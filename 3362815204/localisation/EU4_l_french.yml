 castilian_civil_war.1.t:0 "Guerre Civile Castillane"
 castilian_civil_war.1.d:0 "Au cours du siècle passé, la noblesse castillane a maintes fois tenté d'interférer avec la succession de la couronne castillane et n'a pas hésité à s'allier avec des puissances étrangères. Une nouvelle bataille de ce type semble se préparer et la succession est à nouveau remise en question. La légitimité de l'héritier actuel est contestée par certains nobles influents qui préféreraient un parent du Roi aligné avec la Couronne d'Aragon. Pendant ce temps, les partisans de [Root.Heir.GetName] font des ouvertures à la couronne portugaise afin de sécuriser la position de leur candidat.\nLes choses ont maintenant dégénéré en conflit ouvert et il semble de plus en plus probable que la faction sans soutien royal tentera de placer directement son candidat sur le trône plutôt que dans la file d'attente. Certaines parties de la noblesse restent encore indécises, et d'autres ont choisi de profiter de cette occasion pour protester contre ce qu'ils perçoivent comme des atteintes à leurs anciens droits."
 castilian_civil_war.1.a:0 "Soutenir [Root.Heir.GetName]"
