 CONFIRMJOINHRETEXT:0 "La fédération de royaumes et de principautés qui constituait l'Empire d'Anbennar comprenait parfois la majeure partie du centre de Cannor. La taille de l'empire variait selon les époques et il fut faiblement organisé pendant la majeure partie de son existence, mais les terres de la rive orientale de la Tête-de-Dame aux Marches constituèrent toujours une partie intégrante de l'Empire.\nSouhaitez-vous ajouter §Y$PROV$§W à l'Empire ?"
