 ikko_ikki_rebels_army:0 "Armée Ikko-Ikki"
 ronin_rebels_name:0 "Rōnin de $COUNTRY$"
 ronin_rebels_desc:0 "Les Rōnin sont des bandes de samouraïs sans maître qui se sont tournés vers une vie de mercenaires et de brigands, et parfois vers des soulèvements locaux."
 ronin_rebels_army:0 "Armée de Rōnin"
 anti_tax_rebels_demand:0 "Baisse des impôts"
 anti_tax_rebels_demand_desc:0 "Les rebelles refusent de payer leurs impôts ! Accepter cela réduira drastiquement nos revenus."
 tribal_rebels_demand:0 "Autonomie accrue"
 tribal_rebels_demand_desc:0 "Aux yeux des tribus, notre pouvoir est faible, et elles cherchent désormais à se gouverner elles-mêmes."
 cossack_rebels_demand:0 "Autonomie accrue"
 cossack_rebels_demand_desc:0 "Les Orachav exigent le droit à la reconnaissance et la possibilité de se gouverner selon leurs propres traditions."
 particularist_rebels_demand:0 "Autonomie accrue"
 particularist_rebels_demand_desc:0 "Les particularistes sont las d'être gouvernés depuis une capitale lointaine, insensible aux besoins locaux. Ils exigent que nous laissions les régions se gouverner elles-mêmes."
 nationalist_rebels_demand:0 "Indépendance pour $INDEPENDENCE_COUNTRY$"
 nationalist_rebels_demand_desc:0 "Les séparatistes exigent l'indépendance pour $INDEPENDENCE_COUNTRY$. Ils estiment que leur souverain devrait être de culture $CULTURE$."
 patriot_rebels_demand:0 "Défection vers $DEFECT_COUNTRY$"
 patriot_rebels_demand_desc:0 "Les patriotes méprisent notre occupation injuste et aspirent à retourner dans leur terre natale de $DEFECT_COUNTRY$."
 colonial_rebels_demand:0 "Indépendance pour $INDEPENDENCE_COUNTRY$"
 colonial_rebels_demand_desc:0 "Les coloniaux en ont assez d'envoyer le fruit de leur labeur outre-mer et exigent leur indépendance !"
 colonial_patriot_rebels_demand:0 "Défection vers $DEFECT_COUNTRY$"
 colonial_patriot_rebels_demand_desc:0 "Les coloniaux estiment qu'ils ne sont pas représentés pour leurs impôts et exigent que nous les laissions rejoindre $DEFECT_COUNTRY$."
 revolutionary_rebels_demand:0 "Renverser le gouvernement"
 revolutionary_rebels_demand_desc:0 "Les révolutionnaires rejettent notre gouvernement actuel qu'ils jugent oppressif et exigent $GOVERNMENT$."
 noble_rebels_demand:0 "Privilèges accrus"
 noble_rebels_demand_desc:0 "Les nobles exigent un retour aux anciennes pratiques, où les cavaliers régnaient sur des domaines de paysans soumis. Ils exigent la fin de ce pays de marchands et de paysans."
 religious_rebels_demand:0 "Convertir $COUNTRYNAME$"
 religious_rebels_demand_desc:0 "Les rebelles religieux combattent pour la religion $RELIGION$. Ils exigent que nous reconnaissions sa suprématie ou, à tout le moins, que nous cessions nos efforts de conversion et les laissions pratiquer leur culte en paix."
 heretic_rebels_demand:0 "Acceptation de $HERETIC_RELIGION$"
 heretic_rebels_demand_desc:0 "Les rebelles $HERETIC_RELIGION$ exigent que nous les laissions pratiquer leur culte en paix. Cependant, notre clergé nous avertit que cela sapera le respect de nos croyances et permettra à des hérésies encore pires de prendre racine et de se répandre."
 pretender_rebels_demand:0 "Installer $PRETENDER_MONARCH$"
 pretender_rebels_demand_desc:0 "Les rebelles prétendants exigent que vous installiez $PRETENDER_MONARCH$ sur le trône de $COUNTRY$."
 ronin_rebels_demand:0 "Renverser le gouvernement"
 ronin_rebels_demand_desc:0 "Les Rōnin sont des samouraïs sans maître, vestiges de la guerre. Amers et pauvres, ils se sont rassemblés autour d'un chef qu'ils souhaitent installer comme Shogun."
 ikko_ikki_rebels_demand:0 "Renverser le gouvernement"
 ikko_ikki_rebels_demand_desc:0 "Les Ikko-Ikki sont des paysans mécontents de l'ordre actuel au Japon et ils tenteront de le renverser. Ils préféreraient qu'on les laisse tranquilles."
 reactionary_rebels_demand:0 "Arrêter l'occidentalisation"
 reactionary_rebels_demand_desc:0 "Les réactionnaires exigent l'arrêt de ces nouvelles idées venues de l'ouest. Ils exigent un retour au bon vieux temps."
 lollard_rebels_demand:0 "Tolérance pour les Lollards"
 lollard_rebels_demand_desc:0 "Les Lollards exigent que nous les laissions pratiquer leur culte en paix. Cependant, le Grand Recteur nous avertit que cela sapera le respect de l'Église Ravélienne et permettra à des hérésies encore pires de prendre racine et de se répandre."
 catholic_rebels_demand:0 "Convertir $COUNTRYNAME$"
 catholic_rebels_demand_desc:0 "Les rebelles religieux combattent pour la religion $RELIGION$. Ils exigent que nous reconnaissions sa suprématie ou, à tout le moins, que nous cessions nos efforts de conversion et les laissions pratiquer leur culte en paix."
 catholic_rebels_title:0 "Religieux"
 catholic_rebels_name:0 "Zélotes $RELIGION$"
 catholic_rebels_desc:0 "Les fanatiques religieux ont tendance à se soulever dans les provinces contrôlées par des nations d'une foi différente. Ils cherchent à répandre leur foi et à châtier tous les mécréants."
