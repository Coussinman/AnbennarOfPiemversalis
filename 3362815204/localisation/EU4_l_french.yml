 mesoamerican:0 "Mésoaméricain"
 north_american_desc:0 "Avec le groupe technologique nord-aelantiri, les niveaux de technologie coûtent 250 % de plus (350 %)."
 mesoamerican_desc:0 "Avec le groupe technologique mésoaméricain, les niveaux de technologie coûtent 150 % de plus (250 %)."
 south_american_desc:0 "Avec le groupe technologique sud-aelantiri, les niveaux de technologie coûtent 250 % de plus (350 %)."
 mesoamerican_spearmen:0 "Lanciers mésoaméricains"
 mesoamerican_spearmenDESCR:0 "L'unité de base des armées de Mésoamérique. C'était généralement une levée de paysans dirigée par des officiers aristocratiques et armée de lances et de boucliers. Cette unité formait l'épine dorsale des armées d'États comme l'Empire aztèque."
 south_american_forest_warfare:0 "Guerriers forestiers sud-aelantiri"
 south_american_forest_warfareDESCR:0 "Le guerrier forestier continua de s'améliorer à mesure que de nouvelles technologies et tactiques devenaient disponibles. Conservant son équilibre entre attaque et défense, il continua de progresser dans les deux domaines."
 incan_slingshots:0 "Frondeurs incas"
 incan_slingshotsDESCR:0 "Les frondeurs incas utilisaient leurs armes de jet mortelles à une portée relativement courte, où leur précision et leur impact pouvaient être dévastateurs. L'utilisation d'une fronde ou huaraca était une connaissance commune dans une grande partie de l'Amérique du Sud, les enfants passant souvent de nombreuses heures à perfectionner leurs compétences en tuant des oiseaux."
 incan_axemen:0 "Hacheurs incas"
 incan_axemenDESCR:0 "Les hacheurs incas complétaient les troupes de tir, utilisant une variété d'armes allant de petites haches à main appelées champis à des haches à manche aussi long qu'une hallebarde."
 south_american_reformed_gunpowder_warfare:0 "Mousquetaires aelantiri réformés"
 south_american_reformed_gunpowder_warfareDESCR:0 "Avec l'arrivée des Européens dans les Amériques, les armes à poudre vinrent à être connues par la population locale. Les avantages devinrent apparents et ce n'était qu'une question de temps avant que des unités portant des mousquets n'apparaissent. Le mousquetaire réformé était une tentative de combiner la nouvelle technologie avec la férocité de l'ancienne guerre tribale. Cette unité est plus forte en attaque, mais les nouvelles armes à poudre lui donnent également du poids en défense."
 south_american_arquebusier:0 "Arquebusier sud-aelantiri"
 south_american_arquebusierDESCR:0 "L'arquebusier sud-aelantiri tire parti du poids plus léger et de la maniabilité accrue de son arme. Ce qu'il perd en choc offensif, il le gagne en maintenant un feu régulier en action défensive."
 westernized_incan:0 "Infanterie inca occidentalisée"
 westernized_incanDESCR:0 "L'infanterie inca occidentalisée était les successeurs des guerriers de montagne des époques antérieures. L'entraînement et l'équipement occidentaux ont amélioré ces unités dans tous les domaines."
 reformed_westernized_incan:0 "Infanterie inca occidentalisée réformée"
 reformed_westernized_incanDESCR:0 "L'infanterie inca occidentalisée réformée utilisa la nouvelle technologie et l'entraînement à la poudre pour assumer un rôle plus défensif."
 incan_guerilla_warfare:0 "Guérillero inca"
 incan_guerilla_warfareDESCR:0 "Le guérillero inca utilisait le terrain à son avantage maximum. Bien qu'ils ne causent pas beaucoup de dégâts à l'opposition, il peut falloir longtemps pour user ces unités."
 colonial_government:0 "Gouvernement colonial"
 colonial_government_desc:0 "Un gouvernement provincial mis en place pour gérer les affaires des colonies du Nouveau Monde, dirigé par un gouverneur ou un vice-roi."
