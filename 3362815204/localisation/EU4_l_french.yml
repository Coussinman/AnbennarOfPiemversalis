 form_union_with_lithuania_desc:0 "La mort du roi sans enfant Ladislas III sur le champ de bataille de Varna a brisé l'union entre la Pologne et la Hongrie et a laissé la Pologne en interrègne. Son frère Casimir, le Grand-Duc de Lituanie, fut sollicité par la noblesse polonaise pour assumer le trône mais trouva leurs conditions inacceptables. En 1447, après trois ans de négociations, Casimir fut finalement couronné Roi de Pologne selon ses propres termes et régna sur les deux royaumes en union."
