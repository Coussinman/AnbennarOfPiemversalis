 RISE_OF_THE_OTTOMANS_DESC:0 "Les rumeurs de faiblesse ottomane poussèrent le Haut Recteur Eugène IV à appeler à une croisade contre eux en 1443. L'Occident étant encore embourbé dans la Guerre de Cent Ans, le Roi de Hongrie et de Pologne, Ladislas III, prit la cause d'expulser définitivement le fléau de la chrétienté d'Europe. Menée par le général Jean Hunyadi, le Chevalier Blanc, l'armée hongroise connut quelques succès initiaux, mais fut finalement vaincue. Le Sultan abdiqué Murad II revint aider son fils et mena l'armée ottomane à la victoire lors de la bataille de Varna où le roi Ladislas fut tué. La paix fut finalement signée mais la voie pour l'expansion ottomane en Europe de l'Est était désormais ouverte..."
