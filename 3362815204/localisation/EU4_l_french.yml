 IS_FORMER_COLONIAL_NATION:0 "Est une ancienne nation coloniale"
 native_adm_ideas:0 "Idées administratives indigènes"
 native_dip_ideas:0 "Idées diplomatiques indigènes"
 native_mil_ideas:0 "Idées militaires indigènes"
 migrative_traditions:0 "Traditions migratrices"
 migrative_traditions_desc:0 "Notre tradition de déplacer les villages lorsque les sols s'appauvrissent nous a conduits à améliorer nos méthodes de construction. En exploitant ces nouvelles méthodes et en les répandant, nous pouvons en tirer grand profit."
 clan_societies:0 "Sociétés claniques"
 clan_societies_desc:0 "Si les clans au sein de notre société prenaient chacun un rôle distinct dans les cérémonies et la vie quotidienne, nous pourrions assurer une bien plus grande efficacité dans la gouvernance de notre nation."
 wampum_belts:0 "Ceintures de wampum"
 wampum_belts_desc:0 "En utilisant des images, des ceintures de wampum et de l'art pour représenter nos rites et cérémonies sacrés, ainsi que les grands événements de notre histoire, nous pouvons assurer la continuité et la stabilité de notre société."
 law_of_peace:0 "Loi de paix"
 law_of_peace_desc:0 "En établissant des règles qui gouvernent les mœurs de notre peuple et déterminent comment les conflits entre clans doivent être résolus, nous pouvons atteindre une paix plus durable parmi notre peuple."
 tribal_constitution:0 "Constitution tribale"
 tribal_constitution_desc:0 "En développant les rôles et les pouvoirs des personnes qui gouvernent notre nation, nous pouvons grandement améliorer notre capacité à nous gouverner nous-mêmes."
 travois:0 "Travois"
 travois_desc:0 "En attachant des morceaux de bois à une plateforme tirée par un chien ou un animal plus grand, nous facilitons grandement le transport de lourdes charges sur de grandes distances, même sur un terrain accidenté et inégal."
 smoke_ceremonies:0 "Cérémonies du calumet"
 smoke_ceremonies_desc:0 "L'usage cérémoniel des pipes et du tabac parmi notre peuple est un art ancien. En utilisant ces cérémonies du calumet pour sceller paix et alliances, nous pouvons conférer une plus grande autorité à nos accords et traités."
 trade_diplomacy:0 "Diplomatie commerciale"
 trade_diplomacy_desc:0 "Dans nos relations avec d'autres peuples, nous avons trouvé une constante : le langage des cadeaux et du commerce est universel. Utiliser le commerce pour nous rendre indispensables à nos voisins aidera grandement nos relations."
 clan_migrations:0 "Migrations claniques"
 clan_migrations_desc:0 "Les régions autour de nous sont souvent habitées par des tribus désorganisées et isolées. En faisant s'installer des clans individuels de notre grand peuple dans ces régions, nous pouvons étendre notre influence à de nouvelles frontières."
 talking_leaves:0 "Feuilles parlantes"
 talking_leaves_desc:0 "Si nous pouvions développer une façon d'enregistrer nos transactions de manière permanente en utilisant des symboles pour représenter les sons comme d'autres le font, nous pourrions grandement développer nos capacités à mener le commerce et la diplomatie."
 warrior_societies:0 "Sociétés guerrières"
 warrior_societies_desc:0 "L'établissement de sociétés prestigieuses de guerriers encouragera nos jeunes hommes à faire preuve d'une plus grande bravoure sur le champ de bataille."
 raid_warfare:0 "Guerre de raids"
 raid_warfare_desc:0 "En utilisant des frappes rapides et furtives, nous pouvons surprendre nos ennemis sans défense et en tuer beaucoup avant qu'ils n'aient la chance de se retourner contre nous."
 tribal_adoptions:0 "Adoptions tribales"
 tribal_adoptions_desc:0 "Pour aider à augmenter nos effectifs, nous devrions capturer des prisonniers d'autres tribus lorsque possible, puis les adopter parmi nos propres rangs."
 trail_networks:0 "Réseaux de pistes"
 trail_networks_desc:0 "En étudiant la configuration du terrain, nous pouvons savoir quelles pistes nos troupes peuvent suivre en sécurité et quelles pistes elles devraient éviter, nous permettant de minimiser nos pertes."
 flexible_warfare:0 "Guerre flexible"
 flexible_warfare_desc:0 "À mesure que nous rencontrons de nouvelles tactiques et armes parmi nos ennemis et les autres que nous croisons, nous devons toujours rester flexibles afin de pouvoir les intégrer dans nos stratégies."
 la_plata_nation_title:0 "Former la nation de La Plata"
 la_plata_nation_desc:0 "Le temps est venu de se défaire des derniers vestiges de notre passé colonial. Nous devons former une nation à part entière et solidifier nos revendications sur cette région."
 haiti_nation_title:0 "Former la nation haïtienne"
 haiti_nation_desc:0 "Il ne suffit pas d'avoir expulsé les barbares qui ont ensanglanté notre terre. Nous devons assurer à jamais la liberté dans le pays de notre naissance et retirer tout espoir de nous réasservir au gouvernement inhumain qui nous a si longtemps opprimés. En fin de compte, nous devons vivre indépendants ou mourir."
 colombia_nation_title:0 "Former la nation colombienne"
 colombia_nation_desc:0 "Le temps est venu de se défaire des derniers vestiges de notre passé colonial. Nous devons former une nation à part entière et solidifier nos revendications sur cette région."
 chile_nation_title:0 "Former la nation chilienne"
 chile_nation_desc:0 "Le temps est venu de se défaire des derniers vestiges de notre passé colonial. Nous devons former une nation à part entière et solidifier nos revendications sur cette région."
 canada_nation_title:0 "Former la nation canadienne"
 canada_nation_desc:0 "Le temps est venu de se défaire des derniers vestiges de notre passé colonial. Nous devons former une nation à part entière et solidifier nos revendications sur cette région."
 venezuela_nation_title:0 "Former la nation vénézuélienne"
 venezuela_nation_desc:0 "Le temps est venu de se défaire des derniers vestiges de notre passé colonial. Nous devons former une nation à part entière et solidifier nos revendications sur cette région."
 usa_nation_title:0 "Former la nation américaine"
 usa_nation_desc:0 "Ces fières colonies ont longtemps été soumises à la cupidité et à l'oppression des puissances européennes, mais c'en est fini ! L'élan de liberté dans les colonies nous a offert l'opportunité de former une fière fédération d'États indépendants libérés de la tyrannie. Les États-Unis d'Amérique !"
 upca_nation_title:0 "Former la nation centraméricaine"
 upca_nation_desc:0 "Notre peuple a enduré des années d'ingérence étrangère, de subjugation, d'incursions, et nos terres divisées... Assez ! Le temps est venu de libérer et d'unir notre peuple sous une seule bannière et d'écrire notre propre destin. Nous formerons une nation libérale enrichie par le commerce passant entre les océans Atlantique et Pacifique."
 quebec_nation_title:0 "Former la nation québécoise"
 quebec_nation_desc:0 "Le temps est venu de se défaire des derniers vestiges de notre passé colonial. Nous devons former une nation à part entière et solidifier nos revendications sur cette région."
 peru_nation_title:0 "Former la nation péruvienne"
 peru_nation_desc:0 "Le temps est venu de se défaire des derniers vestiges de notre passé colonial. Nous devons former une nation à part entière et solidifier nos revendications sur cette région."
 paraguay_nation_title:0 "Former la nation paraguayenne"
 paraguay_nation_desc:0 "Le temps est venu de se défaire des derniers vestiges de notre passé colonial. Nous devons former une nation à part entière et solidifier nos revendications sur cette région."
 mexico_nation_title:0 "Former la nation mexicaine"
 mexico_nation_desc:0 "Nous devons laisser derrière nous les derniers vestiges de notre héritage colonial et nous réformer en un État indépendant à part entière. La nation du Mexique deviendra la protectrice de toute la Mésoamérique !"
 louisiana_nation_title:0 "Former la nation louisianaise"
 louisiana_nation_desc:0 "Notre peuple a dû adopter un mode de vie frontalier endurci dans cette grande nature sauvage. Nous sommes désormais simplement un peuple différent des Européens : une race d'hommes plus rude, plus coriace, plus sauvage, s'alliant par mariage aux Indiens. Construisons sur le commerce et le sol de ces riches terres fluviales, et émerveillons le monde par notre robuste prouesse."
 brazil_nation_title:0 "Former la nation brésilienne"
 brazil_nation_desc:0 "Les maîtres coloniaux qui voulaient nous asservir sont partis. Il est temps de former un pays véritablement indépendant qui nous appartienne. Désormais, le mot d'ordre du Brésil sera « Indépendance ou mort ! »"
 heretic_tolerance:0 "Tolérance hérétique"
 desc_heretic_tolerance:0 "Les fidèles hérétiques ont pu exiger d'importantes concessions par l'usage de la force militaire."
 visit_of_the_four_kings:0 "Visite des Quatre Rois"
 random_event.EVTNAME20:0 "Les Quatre Rois"
 random_event.EVTDESC20:0 "Une délégation des Cinq Nations iroquoises a fait le périlleux voyage outre-mer et est arrivée à [Root.Capital.GetCapitalName] avec l'intention de former une alliance avec nous, et sont involontairement devenus une sensation. Nos gens du peuple saluent et acclament tandis qu'ils traversent nos rues dans des carrosses royaux et nos nobles se disputent le privilège de divertir ces « Quatre Rois » des Mohawks.\n\nIls imposent une figure impressionnante, bien plus grands que notre homme moyen, et portent des culottes noires, des gilets et des bas, par-dessus lesquels ils portent tous des capes écarlates bordées d'or. Ils ont la peau sombre, les yeux sombres et des tatouages fantastiques comme nous n'en avons jamais vus. Ils ne parlent pas notre langue, mais après un échange de cadeaux, un discours a été lu en leur nom, demandant de meilleures relations et de l'aide contre nos ennemis communs, nous racontant leurs difficultés et faisant pleurer certains membres de notre cour. Ils ont fait forte impression."
 random_event.EVTOPTA20:0 "Leur donner une chaîne d'acier représentant notre lien indestructible"
 random_event.EVTOPTB20:0 "Leur donner des cadeaux mais ne faire aucune promesse"
 random_event.EVTOPTC20:0 "Ne rien leur donner, ces hommes sont des sauvages, pas des rois"
 random_event.EVTNAME21:0 "Bible traduite"
 random_event.EVTDESC21:0 "Un prêtre de [Root.GetCapitalName] a traduit la Bible dans notre langue et a commencé à en distribuer des exemplaires aux villages voisins à travers [Root.GetName]."
 random_event.EVTOPTA21:0 "Hérésie ! Brûlez le prêtre et ses livres !"
 random_event.EVTOPTB21:0 "Excellente nouvelle ! Répandez ces Bibles au loin"
 random_event.EVTNAME22:0 "Établir une colonie pénitentiaire à [Root.GetName]"
 random_event.EVTDESC22:0 "Notre colonie à [Root.GetName] n'a pas progressé aussi vite que nous le souhaitions. L'un de vos conseillers a cependant proposé un plan pour accélérer la croissance. Il propose que nous envoyions les voleurs, les débiteurs et autres criminels à [Root.GetName] et que nous leur fassions payer leur dette envers la société en travaillant pour développer la colonie et devenir éventuellement des colons une fois leur peine accomplie. Bien que ce plan puisse sembler bon sur le papier, il y a une chance qu'une rébellion éclate à cause de la concentration de tous ces individus dangereux en un seul endroit."
 random_event.EVTOPTA22:0 "Cela semble bien, mettez-le en place"
 random_event.EVTOPTB22:0 "Nous ne pouvons pas faire confiance à ces gens ! Gardez-les en prison ici"
 penal_colony:0 "Colonie pénitentiaire"
 desc_penal_colony:0 "Pour aider la colonie à se développer, des voleurs, des débiteurs et d'autres criminels ont été envoyés ici pour payer leur dette envers la société en travaillant à son développement."
 random_event.EVTNAME23:0 "Grippe !"
 random_event.EVTDESC23:1 "Des rumeurs disent que des marins sont revenus d'un voyage malades comme jamais, et ceux qui n'ont pas péri à bord ont infecté toute [Root.GetCapitalName] avec leur maladie. Il est temps d'agir avant que tout le pays ne meure de toux et de sueurs froides."
 random_event.EVTOPTA23:0 "Mettez le port en quarantaine et laissez-les mourir !"
 random_event.EVTOPTB23:0 "Ce n'est pas la première grippe dans notre pays, je m'en moque !"
 influenza_spreads:0 "La grippe finira par se propager à une province voisine..."
 quarantined_influenza:0 "Grippe mise en quarantaine"
 desc_quarantined_influenza:0 "La province a été mise en quarantaine afin d'empêcher la propagation de la grippe. Mais le manque d'aide a été dévastateur pour la province."
 influenza:0 "Grippe"
 desc_influenza:0 "La province a été dévastée par la grippe, mais des efforts pour soulager les souffrances ont été faits."
 random_event.EVTNAME24:0 "La grippe se propage"
 random_event.EVTDESC24:0 "La grippe s'est propagée à [Root.GetName] ! Comment devons-nous gérer cette épidémie croissante ?"
 random_event.EVTOPTA24:0 "Mettez la province en quarantaine !"
 random_event.EVTOPTB24:0 "Elle passera bientôt"
 random_event.EVTNAME25:0 "Fureur iconoclaste"
 random_event.EVTDESC25:0 "Durant la Réformation, des éruptions de destruction de l'art religieux ravélien eurent lieu dans divers pays européens. L'exemple le plus notoire est le « Beeldenstorm » aux Pays-Bas, mais des attaques similaires eurent lieu en Allemagne, en Suisse, en Angleterre, en Écosse, en France et en Livonie. La majorité des attaques furent menées par des foules spontanées, mais dans certains pays, le gouvernement prit un rôle de premier plan."
 random_event.EVTOPTA25:0 "Envoyez des gardes pour arrêter ces vandales !"
 random_event.EVTOPTB25:0 "Nous ne pouvons rien faire sinon traverser la tempête !"
 random_event.EVTOPTC25:0 "Il est temps de prendre la tête et de briser l'emprise du Rectorat !"
 stopped_iconoclastic_fury:0 "Fureur iconoclaste arrêtée"
 allowed_iconoclastic_fury:0 "Fureur iconoclaste permise"
 iconoclastic_fury:0 "Fureur iconoclaste"
 desc_iconoclastic_fury:0 "Les éruptions de destruction de l'art religieux ravélien à travers le pays ont poussé de nombreuses personnes à fuir leurs foyers et ont perturbé la production et le commerce."
 colonial_nation.EVTNAME300:0 "Interdire le commerce des fourrures"
 colonial_nation.EVTDESC300:0 "Les gens à [Root.GetName] sont trop amicaux avec les Indiens. Une proposition a été faite pour interdire tout commerce privé avec les Indiens, incluant la peine de mort pour quiconque est surpris à enseigner à un Indien comment tirer avec une arme. Cette nouvelle loi nuira à l'économie locale des Indiens et de la population locale, mais assurera notre sécurité contre les raids indiens armés."
 colonial_nation.EVTOPTA300:0 "Approuver la loi"
 colonial_nation.EVTOPTB300:0 "Ignorer la question"
 colonial_nation.EVTNAME301:0 "La récolte de [GetYear]"
 colonial_nation.EVTDESC301:0 "La récolte à [Root.GetName] a été très mauvaise cette année et la pénurie de nourriture se fait déjà sentir à travers la colonie. Les prix montent en flèche et certains prédisent qu'un hiver rigoureux pourrait arriver. Les Indiens voisins ont appris notre situation difficile et ont offert une partie de leurs réserves alimentaires. Ce qu'ils ont apporté est loin d'être suffisant pour nous soutenir tout l'hiver, mais il doit y avoir plus de maïs là d'où vient ce cadeau. Certains proposent que nous envoyions des soldats aux villages indiens pour saisir leur nourriture."
 colonial_nation.EVTOPTA301:0 "Prendre ce dont nous avons besoin"
 colonial_nation.EVTOPTB301:0 "Nous résoudrons cela nous-mêmes"
 colonial_nation.EVTNAME302:0 "Lois salariales pour les bâtisseurs"
 colonial_nation.EVTDESC302:0 "Les prix de la construction augmentent car la main-d'œuvre qualifiée est en pénurie alors que les nouveaux colons affluant dans la colonie demandent grandement leurs services. Une proposition a été faite qu'un salaire maximum soit fixé à travers [Root.GetName] pour tous les charpentiers, scieurs, maçons et briquetiers. Le prix sera fixé à des niveaux équitables, et quiconque exigeant un paiement plus élevé ou offrant de payer plus pour les travaux de construction serait passible d'une pénalité. Comment votons-nous ?"
 colonial_nation.EVTOPTA302:0 "Voter oui, c'est une idée sensée"
 colonial_nation.EVTOPTB302:0 "Nous n'avons pas besoin de réglementer cela"
 colonial_nation.EVTNAME303:0 "Fer découvert"
 colonial_nation.EVTDESC303:0 "Pour nous soutenir, [Root.Owner.GetName] doit chercher de nouvelles sources de revenus et réduire notre dépendance aux importations. Une grande opportunité s'est cependant présentée, car du minerai de fer des marais a été découvert à [Root.GetName] ! La proposition est d'ordonner au propriétaire de construire un fourneau et une forge et de commencer immédiatement la production. En échange, le propriétaire se verra garantir une exonération fiscale de 10 ans pour subventionner le coût initial."
 colonial_nation.EVTOPTA303:0 "Cela semble être une bonne opportunité"
 colonial_nation.EVTOPTB303:0 "Non, merci"
 colonial_nation.EVTNAME304:0 "Industrie lainière domestique"
 colonial_nation.EVTDESC304:0 "Les profits déclinants du commerce colonial et notre dépendance aux biens importés commencent à nuire à [Root.Owner.GetName]. Nous devons chercher l'indépendance économique vis-à-vis des importations et à cette fin, une nouvelle proposition a été présentée. En interdisant les exportations de moutons et en ordonnant que plus de laine soit produite localement, nous assurerons que suffisamment de vêtements chauds sont offerts aux colons. Pour cela, une manufacture textile devrait être démarrée à [Root.GetName]."
 colonial_nation.EVTOPTA304:0 "Cela semble être une bonne opportunité"
 colonial_nation.EVTOPTB304:0 "Non, merci"
 colonial_nation.EVTNAME305:0 "Un quai nécessaire"
 colonial_nation.EVTDESC305:0 "Si [Root.Owner.GetName] veut devenir moins dépendant de [Root.Owner.ColonialParent.GetName] et s'orienter vers l'autosuffisance, nous devons être capables de sécuriser suffisamment de sel et de fournitures navales. Un citoyen éminent vivant à [Root.GetCapitalName] nous a assuré qu'avec un peu d'aide, il pourrait construire un nouveau quai à [Root.GetName]. En échange de son investissement, il demande 10 ans de subventions."
 colonial_nation.EVTOPTA305:0 "Cela semble être une bonne opportunité"
 colonial_nation.EVTOPTB305:0 "Non, merci"
 colonial_nation.EVTNAME306:0 "Interdiction des cultures de rente"
 colonial_nation.EVTDESC306:0 "Contrairement aux fondateurs de [Root.Owner.GetName], les nouveaux colons tendent à être à courte vue et à privilégier les profits plutôt qu'assurer l'existence future d'eux-mêmes et de leurs familles. Ils ignorent la nécessité de produire de la nourriture pour la colonie et se tournent directement vers les cultures de rente, croyant qu'ils pourront les vendre et acheter de la nourriture à d'autres fermiers. Si cela continue, notre colonie finira par faire face à la famine et au désordre. Pour empêcher cela, une loi imposant que les nouveaux fermiers produisent de la nourriture dans au moins une partie de leurs champs a été suggérée."
 colonial_nation.EVTOPTA306:0 "Une loi semble nécessaire"
 colonial_nation.EVTOPTB306:0 "Ce ne sont pas nos affaires"
 colonial_nation.EVTNAME307:0 "Plantation de tabac interdite"
 colonial_nation.EVTDESC307:0 "Quand nous sommes arrivés ici, les prix du tabac montaient en flèche et les profits étaient immenses. Maintenant, à mesure que plus de fermiers arrivent et commencent leurs propres plantations, l'offre de tabac a rapidement augmenté et causé une baisse des prix en Europe d'année en année. Une proposition a été faite par les planteurs établis d'interdire la plantation de tabac pendant un an, afin que les prix aient le temps de se rétablir. Les nouveaux fermiers s'opposent évidemment à cette proposition, mais nous devons faire ce que nous devons pour protéger nos moyens de subsistance."
 colonial_nation.EVTOPTA307:0 "L'appliquer"
 colonial_nation.EVTOPTB307:0 "Rejeter leur proposition"
 colonial_nation.EVTNAME310:0 "Conflit frontalier colonial"
 colonial_nation.EVTDESC310:0 "Des colons d'une autre des colonies de [Root.Owner.ColonialParent.GetName] ont franchi nos frontières ! À la recherche de ressources, ils se sont étendus sur des terres faisant partie de [Root.GetName] et sont entrés en conflit avec la population locale. Cela ne peut être toléré !"
 colonial_nation.EVTOPTA310:0 "Envoyer la milice locale pour les chasser !"
 colonial_nation.EVTOPTB310:0 "Laisser la situation se résoudre d'elle-même"
 colonial_nation.EVTDESC311:0 "À la recherche de nouvelles terres et ressources, des colons de [Root.GetName] se sont aventurés au-delà de la frontière dans [From.GetName], ce qui a causé des conflits avec la population locale là-bas. [From.Owner.GetName] a alors envoyé sa milice pour les chasser, mais leur milice semble être allée trop loin et leur mission a dégénéré en un raid vengeur dans [Root.GetName]. Cela ne peut être toléré !"
 colonial_nation.EVTOPTA311:0 "Envoyer notre milice locale également !"
 colonial_nation.EVTOPTB311:0 "Laisser la situation se résoudre d'elle-même"
 colonial_nation.EVTDESC312:0 "Envoyer notre milice pour chasser les colons concurrents de [From.From.GetName] était peut-être une erreur. Encouragées par leur succès facile, nos troupes se sont laissées emporter et ont continué dans [From.GetName], pillant les villages frontaliers là-bas. Cela a grandement contrarié [From.Owner.GetName] et ils ont à leur tour envoyé leur milice dans [From.From.GetName]..."
 colonial_nation.EVTOPTA312:0 "Maudits soient-ils !"
 colonial_nation.EVTDESC313:0 "Par où commencer... Il semble que des colons de [From.Owner.GetName] se soient aventurés dans [From.From.GetName], une province de [From.From.Owner.GetName], à la recherche de nouvelles terres et ressources. [From.From.Owner.GetName] a alors envoyé sa milice pour les chasser, mais ils se sont montrés trop zélés et ont poursuivi les colons jusque dans [From.GetName], pillant et brûlant. Le conflit a ensuite dégénéré quand [From.Owner.GetName] a envoyé sa milice pour chasser la milice [From.From.Owner.GetAdjective] et mener ses propres raids dans [From.From.GetName]...\n\nLe [From.From.Owner.Monarch.GetTitle] de [From.From.Owner.GetName], [From.From.Owner.Monarch.GetName], blâme le [From.Owner.Monarch.GetTitle] de [From.Owner.GetName], [From.Owner.Monarch.GetName], et vice versa. Comment résoudre cela sans perdre la face ?"
 colonial_nation.EVTOPTA313:0 "Les laisser régler cela eux-mêmes"
 colonial_nation.EVTOPTB313:0 "Destituer le [From.From.Owner.Monarch.GetTitle] [From.From.Owner.Monarch.GetName]"
 colonial_nation.EVTOPTC313:0 "Destituer le [From.Owner.Monarch.GetTitle] [From.Owner.Monarch.GetName]"
 colonial_nation.EVTOPTD313:0 "Régler leurs différends"
 colonial_nation.EVTDESC314:0 "Dans le récent conflit le long de la frontière entre [From.From.From.GetName] et [From.From.GetName], [From.GetName] a pris le parti de [From.From.Owner.GetName] ! Le [From.Monarch.GetTitle] [From.Monarch.GetName] a décidé de blâmer le [Root.Monarch.GetTitle] [Root.Monarch.GetName] pour l'incident et l'a destitué."
 colonial_nation.EVTOPTA314:0 "Pour qui ce « [From.Monarch.GetTitle] » se prend-il ?!"
 colonial_nation.EVTDESC315:0 "Dans le récent conflit le long de la frontière entre [From.From.From.GetName] et [From.From.GetName], [From.GetName] a pris notre parti ! Le [From.Monarch.GetTitle] [From.Monarch.GetName] a décidé de blâmer le [From.From.Owner.Monarch.GetTitle] [From.From.Owner.Monarch.GetName] pour l'incident et l'a destitué."
 colonial_nation.EVTOPTA315:0 "Bien joué !"
 colonial_nation.EVTDESC316:0 "Dans le récent conflit le long de la frontière entre [From.From.From.GetName] et [From.From.GetName], [From.GetName] a pris le parti de [From.From.From.Owner.GetName] ! Le [From.Monarch.GetTitle] [From.Monarch.GetName] a décidé de blâmer le [Root.Monarch.GetTitle] [Root.Monarch.GetName] pour l'incident et l'a destitué."
 colonial_nation.EVTDESC317:0 "Dans le récent conflit le long de la frontière entre [From.From.From.GetName] et [From.From.GetName], [From.GetName] a pris notre parti ! Le [From.Monarch.GetTitle] [From.Monarch.GetName] a décidé de blâmer le [From.From.From.Owner.Monarch.GetTitle] [From.From.From.Owner.Monarch.GetName] pour l'incident et l'a destitué."
 colonial_nation.EVTNAME318:0 "Milice coloniale renforcée"
 colonial_nation.EVTDESC318:0 "L'assemblée a proposé que nous mettions de côté des ressources substantielles pour renforcer notre milice. La colonie a besoin d'une meilleure protection contre les attaques indigènes et les raids d'autres colonies. Cela nous renforcera également si nous devions un jour nous retrouver en guerre contre [Root.ColonialParent.GetName]."
 colonial_nation.EVTOPTA318:0 "L'établir"
 colonial_nation.EVTOPTB318:0 "Ne pas l'établir"
 colonial_nation.EVTNAME319:0 "Achat de terres"
 colonial_nation.EVTDESC319:0 "Les colons de [Root.GetName] se plaignent que des indigènes vivent encore dans certaines parties de la province. Ces terres pourraient être utilisées plus efficacement si elles étaient colonisées et cultivées. Ils suggèrent que nous achetions ces terres aux indigènes locaux."
 colonial_nation.EVTOPTA319:0 "Bonne idée"
 colonial_nation.EVTOPTB319:0 "C'est trop coûteux"
 colonial_nation.EVTDESC320:0 "Pour pouvoir rivaliser avec d'autres colonies, nous devons soutenir la croissance de [Root.GetName]. Les indigènes d'une province voisine se sont montrés disposés à nous vendre leurs terres. Cela semble être une solution idéale."
 colonial_nation.EVTNAME321:0 "Le dernier des Mahicans"
 colonial_nation.EVTDESC321:0 "Un petit groupe d'indigènes, depuis longtemps pacifiés et maintenant décimés par la guerre et la maladie, cherchent à vivre sous la protection de notre colonie. Bien qu'ils soient peu nombreux, ils peuvent encore nous être de quelque utilité avec leur connaissance des coutumes locales, et sont prêts à nous aider en échange de notre protection de leur village à [Root.GetName]. Mais leurs ennemis indigènes nous verraient d'un mauvais œil..."
 colonial_nation.EVTOPTA321:0 "Leur offrir notre protection"
 colonial_nation.EVTOPTB321:0 "Les refuser"
 colonial_nation.EVTNAME322:0 "Les gars de [Root.GetName]"
 colonial_nation.EVTDESC322:0 "Des nouvelles d'agressions indigènes contre notre peuple le long des frontières se sont répandues à travers la colonie. Raisonnant que tous les indigènes sont d'une manière ou d'une autre alliés et ne peuvent en aucun cas être dignes de confiance, une foule armée en colère s'est abattue sur les restes pacifiques des Mahicans vivant à [Root.GetName]. Seule une poignée, les tout derniers de leur peuple, reste, et la foule, contre laquelle personne ne témoignera, reste en liberté..."
 colonial_nation.EVTOPTA322:0 "Protéger les survivants à tout prix"
 colonial_nation.EVTOPTB322:0 "Nous ne pouvons pas les sauver..."
 colonial_nation.EVTNAME323:0 "Le dernier à mourir"
 colonial_nation.EVTDESC323:0 "Il y a des années, nous avons accordé notre protection aux derniers survivants de la tribu Mahican. Dans les années qui ont suivi, la maladie et la guerre ont fait de nouveaux ravages, jusqu'à ce qu'enfin il n'en reste qu'un seul, le dernier de son peuple. Il fut un allié fidèle, guidant notre peuple au combat et aidant nos colons, mais les lois de la vie sont dures, et maintenant lui aussi est parti. Avec lui meurent non seulement un homme, mais un peuple et un mode de vie."
 colonial_nation.EVTOPTA323:0 "Nous ne pouvons que pleurer..."
