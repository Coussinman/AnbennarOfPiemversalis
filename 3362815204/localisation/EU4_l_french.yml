 INFANTRY_DESC:0 "Colonne vertébrale de toute armée, l'humble fantassin a marché depuis la nuit des temps. Socle de votre armée qui pose les fondations permettant à vos autres corps de combattre, et premier à s'élancer dans la brèche lors de l'assaut d'une forteresse."
 CAVALRY_DESC:0 "L'entretien d'un cheval étant une entreprise coûteuse, le guerrier monté est l'élite de toute armée. La vitesse du cheval confère à ce soldat une plus grande mobilité sur le champ de bataille, tandis que seuls les soldats les plus disciplinés peuvent tenir face à une charge de cavalerie."
 ARTILLERY_DESC:0 "L'artillerie désigne spécifiquement les canons à poudre, qui sous leur forme primitive sont les plus efficaces en situation de siège. L'évolution du canon en fera une arme destructrice sur le champ de bataille."
 TRANSPORT_DESC:0 "Tout le monde sait que les soldats ne peuvent pas se transformer magiquement en bateaux ; le navire de transport est un vaisseau spécialement conçu pour déplacer des armées d'un point A à un point B sur les mers."
 GALLEY_DESC:0 "Le faible tirant d'eau de la galère lui confère une mauvaise tenue en haute mer, mais dans les eaux fermées, la galère propulsée par rames est le navire de guerre de premier ordre."
 LIGHT_SHIP_DESC:0 "Petit, rapide et maniable, le navire léger excelle dans le rôle de défense du commerce. Partout où vos navires légers vont, les marchands arborant votre pavillon se sentiront en sécurité."
 HEAVY_SHIP_DESC:0 "À l'exception des eaux fermées comme le Divenhal, le vaisseau de ligne est le principal navire de combat."
 GENERAL_DESC:0 "Que ce soit en se distinguant au combat, en prouvant ses qualités de meneur ou simplement en connaissant les bonnes personnes, cet homme a prouvé qu'il a ce qu'il faut pour mener l'une de vos armées au combat."
 ADMIRAL_DESC:0 "Loin de la terre et de toute autre source d'autorité, cet homme est presque comme un dieu pour ses marins, du moins tant qu'ils sont en vie. Cet homme mène vos flottes vers la gloire."
 CONQUISTADOR_DESC:0 "Homme d'aventure, qui mènera des bandes vers l'inconnu, le Conquistador conduira des armées là où peu osent s'aventurer."
 EXPLORER_DESC:0 "Les vastes océans sont intimidants à naviguer dans le meilleur des cas, mais naviguer sur des océans qui nous sont inconnus requiert une race d'hommes particulière. L'Explorateur est un tel homme, taillé dans un autre tissu. Il naviguera là où nul autre n'irait."
