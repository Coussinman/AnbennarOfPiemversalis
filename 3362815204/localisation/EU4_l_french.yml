 castilian_civil_war.1.b:0 "Soutenir le Candidat Aragonais"
 castilian_civil_war.1.b.tt:0 "Nous rapprochera de l'§YAragon§!"
 castilian_civil_war.2.t:0 "Propagation de la Guerre Civile"
 castilian_civil_war.2.d:1 "Des nobles influents dans l'une de nos provinces ont rejoint la révolte et pris les armes contre nous."
 castilian_civil_war.3.t:0 "Guerre Civile Castillane"
 castilian_civil_war.3.d:0 "Une fois de plus, la couronne castillane a connu une succession contestée et il semble que le pays soit maintenant au bord de la guerre civile. L'une des candidates, une nièce de [Root.Monarch.GetName], nous a envoyé une demande d'aide."
 castilian_civil_war.3.a:0 "Soutenir cette Prétendante"
 castilian_civil_war.3.b:0 "Laissons les Castillans gérer leurs propres conflits."
 castilian_civil_war.4.t:0 "Intervention Portugaise"
 castilian_civil_war.4.d:0 "[From.Monarch.GetName] a déclaré son soutien à la faction pro-portugaise dans notre pays et a envoyé une aide militaire par-delà la frontière."
 castilian_civil_war.4.a:0 "Magnifique !"
 castilian_civil_war.4.b:0 "C'est un outrage !"
 castilian_civil_war.5.t:0 "Guerre Civile Castillane"
 castilian_civil_war.5.d:0 "Une fois de plus, la couronne castillane a connu une succession contestée et il semble que le pays soit maintenant au bord de la guerre civile. L'un des candidats nous a envoyé une demande d'aide."
 castilian_civil_war.5.a:0 "Soutenir ce Prétendant"
 castilian_civil_war.5.b:0 "Laissons les Castillans gérer leurs propres conflits."
 castilian_civil_war.6.t:0 "Intervention Aragonaise"
 castilian_civil_war.6.d:1 "[From.Monarch.GetName] a déclaré son soutien à la faction pro-aragonaise dans notre pays et a envoyé une aide militaire par-delà la frontière."
 castilian_civil_war.6.a:0 "Magnifique !"
 castilian_civil_war.6.b:0 "C'est un outrage !"
 castilian_civil_war.7.t:0 "Guerre Civile Castillane"
 castilian_civil_war.7.d:0 "Une fois de plus, la couronne castillane a connu une succession contestée et il semble que le pays soit maintenant au bord de la guerre civile. L'un des candidats a reçu le soutien de la couronne aragonaise, notre rival de l'autre côté des Pyrénées."
 castilian_civil_war.7.a:0 "Soutenir l'autre candidat."
 castilian_civil_war.7.b:0 "Éviter toute implication."
 castilian_civil_war.8.t:0 "Intervention Française"
 castilian_civil_war.8.d:0 "[From.Monarch.GetName] de France a constaté l'état affaibli de notre pays et, désireux de s'opposer à l'Aragon, a décidé de soutenir la faction opposée à notre succession."
 castilian_civil_war.8.a:0 "C'est un outrage !"
 castilian_civil_war.100.t:0 "Fin de la Guerre Civile Castillane"
 castilian_civil_war.100.d:0 "Avec la conclusion des hostilités, le Royaume de Castille est à nouveau en paix intérieure. Dans le sillage du conflit, l'équilibre des pouvoirs entre le pouvoir royal et celui des nobles a changé, tout comme nos relations avec nos pays voisins."
 castilian_civil_war.100.a:0 "Cela nous rapprochera de l'Aragon."
 castilian_civil_war.100.b:0 "Cela nous rapprochera du Portugal."
 polish_noble_rebels_demand:0 "Rétablissement de la Monarchie Élective"
 polish_noble_rebels_demand_desc:0 "Les nobles exigent que nous revenions aux anciennes coutumes, où les cavaliers à cheval régnaient sur des domaines de paysans soumis. Ils exigent la fin de ce pays de marchands et de paysans."
 polish_noble_rebels_title:0 "Magnats"
 polish_noble_rebels_name:0 "Magnats Rebelles de $COUNTRY$"
 polish_noble_rebels_desc:0 "Les Magnats Rebelles sont mécontents de leur monarque, généralement en raison de réformes libérales. Ils alignent des troupes professionnelles avec une grande proportion de cavalerie."
 polish_noble_rebels_army:0 "Armée Nobiliaire"
 french_wars_of_religion:0 "Guerres de Religion Françaises"
 french_wars_of_religion_desc:0 "La France est déchirée par une série de guerres civiles religieuses."
 english_civil_war:0 "Guerre Civile Anglaise"
 english_civil_war_desc:0 "L'Angleterre est déchirée par un conflit entre Parlementaires et Royalistes."
 french_revolution:0 "Révolution Française"
 french_revolution_desc:0 "Le peuple français s'est soulevé pour renverser les monarques qui régnaient autrefois sur leur pays."
