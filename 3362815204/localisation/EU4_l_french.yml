 hannoverian_nation_title:0 "Former le Hanovre"
 hannoverian_nation_desc:0 "Maintenant que nous contrôlons les provinces clés de cette région, les nobles locaux n'ont pas d'autre choix que d'accepter notre leadership. Quand ils se rangeront à notre avis, le duché unifié de Hanovre deviendra la puissance dominante de la région."
 westfalian_nation_title:0 "Former la Westphalie"
 westfalian_nation_desc:0 "Alors que les idées des Lumières balaient l'Europe, nous pouvons choisir de les embrasser nous-mêmes en Westphalie. Notre futur État modèle présentera des idées aussi révolutionnaires que l'égalité des droits pour toute la population masculine, la liberté pour les serfs et l'émancipation des Juifs, ainsi que la possibilité de libre entreprise par l'abolition de la corvée et des guildes."
 greek_nation_title:0 "Former la Grèce"
 greek_nation_desc:0 "Pendant des années, l'Hellade a été divisée entre plusieurs royaumes ou occupée par des étrangers au gré de nos ennemis communs. Unir les terres grecques sous un seul drapeau et un seul dirigeant est notre seule voie vers la grandeur."
