 arctic_desc:0 "Le terrain arctique représente les zones couvertes de neige et de glace proches du Pôle Nord."
 forest_desc:0 "Le terrain forestier représente les zones de forêt de conifères avec une haute densité d'arbres et de sous-bois."
 hills_desc:0 "Le terrain vallonné représente les zones dominées par un paysage ondulé d'élévation variable, plus basses et moins escarpées que les montagnes. Contrairement au terrain des hautes terres, les collines représentent des zones avec une plus grande densité d'arbres et de sous-bois."
 woods_desc:0 "Le terrain boisé représente les zones de forêt de feuillus avec une haute densité d'arbres et de sous-bois."
 mountain_desc:0 "Le terrain montagneux représente les zones principalement occupées par des chaînes de montagnes escarpées et des cols étroits, souvent en haute altitude et sous un climat froid."
 desert_mountain_desc:0 "Le terrain de montagne désertique représente les zones de chaînes de montagnes escarpées et de cols étroits entourées de déserts."
 impassable_mountains_desc:0 "Le terrain de montagnes infranchissables représente les zones de montagnes trop inhospitalières ou trop difficiles pour qu'une armée puisse y manœuvrer."
 grasslands_desc:0 "Le terrain de prairies représente les zones de terres agricoles où la végétation est dominée par l'herbe."
 plains_desc:0 "Le terrain de plaines représente de vastes zones de terres plates ou ondulées sans arbres."
 jungle_desc:0 "Le terrain de jungle représente les zones envahies par une végétation tropicale dense, difficiles pour une armée à traverser."
 marsh_desc:0 "Le terrain marécageux représente les étendues de zones humides dominées par des herbes ou des arbustes bas."
 desert_desc:0 "Le terrain désertique représente les zones désolées et arides avec peu ou pas de végétation, souvent sous un climat très chaud."
 coastal_desert_desc:0 "Le terrain de désert côtier représente les zones où le désert rencontre l'océan, résultant en un climat plus doux et moins inhospitalier."
 coastline_desc:0 "Le terrain littoral représente les zones étroites où la terre et la mer se rencontrent, composées de falaises ou de dunes de sable."
 farmlands_desc:0 "Le terrain de terres agricoles représente les zones hautement cultivées où le paysage est dominé par l'agriculture et les bourgs ou villages."
 glacier:0 "Glaciaire"
 glacier_desc:0 "Le terrain glaciaire représente les zones aux conditions très rudes et froides avec souvent une couverture neigeuse permanente et des glaciers. Les zones avec un terrain glaciaire sont très inhospitalières pour l'établissement humain ou les manœuvres militaires."
 drylands_desc:0 "Les terres arides représentent de vastes zones de terres sèches, plates ou ondulées sans arbres."
 steppe_desc:0 "Le terrain de steppe représente de vastes zones ouvertes et continues couvertes d'herbe propices au pâturage mais inadaptées à l'agriculture."
 savannah_desc:0 "Le terrain de savane représente de grandes zones herbeuses avec un degré élevé d'arbres mélangés."
 highlands_desc:0 "Le terrain des hautes terres représente les zones dominées par un paysage ondulé d'élévation variable, plus basses et moins escarpées que les montagnes. Contrairement au terrain vallonné, les hautes terres représentent des zones avec une faible densité d'arbres et de sous-bois."
