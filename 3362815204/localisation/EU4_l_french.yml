 EVTNAME6436:0 "Tensions frontalières"
 EVTDESC6436:1 "Les frontières sont poreuses et en perpétuel changement, se déplaçant au gré des fortunes du dernier conquérant de passage. Les historiens nous blâmeront peut-être pour les événements qui se sont récemment produits à [From.GetName] : « Alors que [From.GetName] continuait à prospérer sous le règne bienveillant de [From.Owner.GetName], les rustres de l'autre côté de la frontière étaient voués à devenir jaloux », diront-ils peut-être. Ou peut-être nous favoriseront-ils et déclareront nos protestations contre l'occupation [From.Owner.GetAdjective] de la province bien fondées. Quoi qu'il en soit, les tensions à [From.GetName] nous ont donné une revendication sur la province."
