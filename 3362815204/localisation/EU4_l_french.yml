 elections.EVTNAME702:0 "Nouveau [Root.Monarch.GetTitle] pour [Root.GetName] ?"
 elections.EVTDESC702:0 "Le mandat du [Root.Monarch.GetTitle] [Root.Monarch.GetName] est terminé. Devons-nous demander à [Root.ColonialParent.GetName] de prolonger sa nomination pour un autre mandat, ou devons-nous leur demander d'envoyer un nouveau [Root.Monarch.GetTitle] ?"
 elections.EVTOPTA702:0 "Demander à garder [Root.Monarch.GetName]"
 elections.EVTOPTB702:0 "Leur demander d'envoyer un nouveau [Root.Monarch.GetTitle]"
 elections.EVTNAME703:0 "Nouveau [From.Monarch.GetTitle] pour [From.GetName] ?"
 elections.EVTDESC703:0 "Le mandat du [From.Monarch.GetTitle] [From.Monarch.GetName] est terminé. Devons-nous lui confier un autre mandat comme [From.Monarch.GetTitle] de [From.GetName], ou devons-nous choisir quelqu'un d'autre ?\n\nLes représentants de [From.GetName] nous ont demandé de garder [From.Monarch.GetName]."
 elections.EVTOPTA703:0 "Garder [From.Monarch.GetName]"
 elections.EVTOPTB703:0 "Envoyer un candidat bureaucrate"
 elections.EVTOPTC703:0 "Envoyer un candidat diplomate"
 elections.EVTOPTD703:0 "Envoyer un candidat militaire"
 elections.EVTNAME704:0 "Nouveau [From.Monarch.GetTitle] pour [From.GetName] ?"
 elections.EVTDESC704:0 "Le mandat du [From.Monarch.GetTitle] [From.Monarch.GetName] est terminé. Devons-nous lui confier un autre mandat comme [From.Monarch.GetTitle] de [From.GetName], ou devons-nous choisir quelqu'un d'autre ?\n\nLes représentants de [From.GetName] nous ont demandé d'envoyer un remplaçant pour [From.Monarch.GetName]."
 elections.EVTOPTA704:0 "Garder [From.Monarch.GetName]"
 elections.EVTOPTB704:0 "Envoyer un candidat bureaucrate"
 elections.EVTOPTC704:0 "Envoyer un candidat diplomate"
 elections.EVTOPTD704:0 "Envoyer un candidat militaire"
 elections.EVTNAME705:0 "Le [Root.Monarch.GetTitle] reste !"
 elections.EVTDESC705:0 "[From.GetName], dans sa grande sagesse, a choisi de prolonger la nomination de [Root.Monarch.GetName] comme [Root.Monarch.GetTitle] pour un autre mandat."
 elections.EVTOPTA705:0 "Excellent !"
 elections.EVTOPTB705:0 "Maudits soient-ils !"
 elections.EVTNAME706:0 "Un nouveau [Root.Monarch.GetTitle] arrive !"
 elections.EVTDESC706:0 "[From.GetName], dans sa grande sagesse, a choisi de rappeler [Root.Monarch.GetName] et de nommer un nouveau [Root.Monarch.GetTitle] à sa place."
 elections.EVTOPTA706:0 "Excellent !"
 elections.EVTOPTB706:0 "Maudits soient-ils !"
 elections.EVTNAME707:0 "Nouveau [From.Monarch.GetTitle] pour [From.GetName]"
 elections.EVTDESC707:0 "Nous avons choisi de remplacer [From.Monarch.GetName] comme gouverneur de [From.GetName]. Qui devons-nous nommer à sa place ?"
 elections.EVTOPTB707:0 "Candidat bureaucrate"
 elections.EVTOPTC707:0 "Candidat diplomate"
 elections.EVTOPTD707:0 "Candidat militaire"
 elections.EVTNAME708:0 "Le [Root.Monarch.GetTitle] est mort !"
 elections.EVTDESC708:0 "Le décès malheureux de [Root.Monarch.GetName] a forcé une élection prématurée d'un nouveau [Root.Monarch.GetTitle]. Trois candidats principaux ont été désignés..."
 elections.EVTNAME709:0 "Le [Root.Monarch.GetTitle] est mort !"
 elections.EVTDESC709:0 "Espérons que [Root.ColonialParent.GetName] nous envoie un bon remplaçant..."
 elections.EVTOPTB709:0 "Prions"
 elections.EVTNAME710:0 "Le [From.Monarch.GetTitle] est mort !"
 elections.EVTDESC710:0 "Le [From.Monarch.GetTitle] de [From.GetName] est soudainement décédé. Qui devons-nous envoyer pour le remplacer ?"
 elections.EVTNAME711:0 "Assemblée coloniale"
 elections.EVTDESC711:0 "Notre colonie [From.GetName] a décidé de former sa propre assemblée afin de prendre le contrôle de la législation fiscale et des budgets. Ils prétendent que ces questions sont mieux gérées localement, mais cela ressemble étrangement à un premier pas vers l'indépendance..."
 elections.EVTOPTB711:0 "Suspect en effet..."
 elections.EVTNAME712:0 "Vents de liberté"
 elections.EVTDESC712:0 "Les vents de liberté soufflent fort à [From.GetName]. L'assemblée élue localement a décidé d'élire désormais son propre [From.Monarch.GetTitle]. Heureusement, cela semble avoir atténué leur désir de liberté. Du moins pour le moment..."
 elections.EVTOPTB712:0 "Des plus inquiétants..."
 elections.700.d:0 "Avec $MONARCH$ forcé de quitter ses fonctions par les factions révoltées, un nouveau [Root.Monarch.GetTitle] devra être élu. Alors que les votes sont comptés, une excitation inhabituelle flotte dans l'air. Les trois candidats principaux sont tous pleinement conscients des événements qui se sont déroulés ces derniers jours..."
 elections.700.limitedterm:0 "Il est de nouveau temps pour les élections à [Root.GetName]. Comme le veut la tradition, [Root.Monarch.GetName] doit abdiquer afin qu'un autre candidat puisse gouverner le [Root.GovernmentName]. Les trois candidats principaux suivants ont été désignés..."
