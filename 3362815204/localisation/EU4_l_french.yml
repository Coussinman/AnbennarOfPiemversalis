 form_colonial_assembly_title:0 "Former une assemblée coloniale"
 form_colonial_assembly_desc:0 "Il est temps de transférer le contrôle et la responsabilité des impôts et des budgets gouvernementaux de l'Ancien Monde vers les colonies. Les membres seront élus annuellement et tous les citoyens propriétaires seront éligibles."
 colonial_assembly:0 "Assemblée coloniale"
 desc_colonial_assembly:0 "Une grande partie du pouvoir législatif sur les impôts et les budgets gouvernementaux a été transférée aux colonies."
