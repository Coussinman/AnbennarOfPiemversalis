 MISSION_SETTINGS_AGGRESSIVENESS_DESC:0 "L'agressivité influence la réaction de la flotte face aux navires ennemis pendant une mission.\nPlus la valeur est élevée, plus la flotte essaiera d'engager des ennemis forts.\n\n(Les missions d'exploration, d'évasion et de « réparation des navires endommagés » ne sont pas affectées par ce paramètre.)"
 MISSION_SETTINGS_AGGRESSIVENESS_DESC_CAUTIOUS:0 "Avec le paramètre prudent, la flotte essaiera généralement d'éviter les forces ennemies écrasantes et de limiter ses propres pertes, ainsi que d'éviter l'attrition.\n\n§YMission de chasse§! :\nÉviter les flottes ennemies fortes et engager s'il y a une chance raisonnable de gagner.\n\n§YMission de blocus§! :\nÉviter les grands engagements pendant le blocus.\n\n§YMission d'interception§! :\nIntercepter les flottes ennemies de taille raisonnable près de vos côtes.\n\n§YÉvasion§!, §YExploration§!, §YRéparation§! :\nNon affecté."
 MISSION_SETTINGS_AGGRESSIVENESS_DESC_BOLD:0 "Avec le paramètre audacieux, la flotte aura le courage de poursuivre l'ennemi plus loin que les flottes prudentes, ainsi que d'accepter un peu d'attrition.\n\n§YMission de chasse§! :\nPrêt à accepter un peu d'attrition pour pourchasser les flottes ennemies.\n\n§YMission de blocus§! :\nBloquer agressivement les ports ennemis.\n\n§YMission d'interception§! :\nPrêt à poursuivre les flottes ennemies un peu plus loin de vos côtes que les flottes prudentes.\n\n§YÉvasion§!, §YExploration§!, §YRéparation§! :\nNon affecté."
