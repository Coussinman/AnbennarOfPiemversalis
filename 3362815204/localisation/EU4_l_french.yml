 age_of_discovery:0 "Ère des Monstres"
 age_of_discovery_desc:1 "Les orques déferlent de l'Échine-du-Serpent, les hobgobelins marchent sur Haless, les centaures assaillent les Républiques des Lacs, et les gnolls menacent de submerger le Bulwar et le Chagrin. Seule l'émergence d'États-nations unifiés peut détourner cette marée monstrueuse."
 age_of_reformation:0 "Ère des Révélations"
 age_of_reformation_desc:1 "Avec la Redécouverte d'Aelantir viennent les secrets des elfes précurseurs, et avec eux, les secrets du monde. D'Est en Ouest, les érudits cherchent à percer les mystères du passé, inaugurant une ère d'exploration et de réformation."
 age_of_absolutism:0 "Ère des Rois-Sorciers"
 age_of_absolutism_desc:1 "La fin de la Marée Verte annonce une nouvelle ère forgée par la guerre et obscurcie par les cultes de la personnalité... mais que se passe-t-il quand la magie échappe à tout contrôle ? Que se passe-t-il dans une contrée où les règles de l'Ancienne Société n'ont plus cours ?"
 age_of_revolutions:0 "Ère des Artificiers"
 age_of_revolutions_desc:1 "Les découvertes des Précurseurs alliées à l'ingéniosité gnomique ont forgé un avenir où la magie est asservie et domestiquée. Les pouvoirs de l'ancienne classe magique deviennent largement accessibles, déclenchant l'illumination et l'ascension du peuple."
 LEDGER_SCORE_AG:0 "Score à travers les Ères"
 RELIGIOUS_CONFLICT_RULES_ON:0 "§YConflits Religieux§!\n- Les Croisades peuvent être déclarées par le Contrôleur du Rectorat.\n- Les dirigeants Ravéliens peuvent être excommuniés.\n- Des Centres de Réforme peuvent apparaître.\n- La religion affecte la diplomatie."
 RELIGIOUS_CONFLICT_RULES_OFF:0 "Cette ère ne connaît pas de conflit religieux particulier. Les Centres de Réforme ont disparu, aucune croisade n'est déclarée, le Haut Recteur ne peut excommunier."
 ABSOLUTISM_RULES_ON:0 "§YAbsolutisme§!\nLes gouvernements peuvent devenir plus absolus durant cette ère, accordant un plus grand contrôle sur l'État."
 ABSOLUTISM_RULES_OFF:0 "Dans les ères ultérieures, l'absolutisme sera un facteur qui influencera le contrôle du dirigeant sur l'État."
