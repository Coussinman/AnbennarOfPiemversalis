 icon_michael:0 "Icône de Saint Michel"
 desc_icon_michael:1 "Saint Michel, l'Archistatège, est le commandant des armées célestes et l'Archange qui vaincra Satan lors de la guerre au Ciel. Les icônes de Saint Michel sont répandues dans toute la Chrétienté Orthodoxe et la plupart des cités russes possèdent une église qui lui est dédiée."
 icon_eleusa:0 "Icône d'Eleusa"
 desc_icon_eleusa:1 "L'icône d'Eleusa représente la tendre Vierge Marie avec l'enfant Christ blotti contre sa joue. Elle exprime l'amour maternel et l'inquiétude pour son enfant."
 icon_pancreator:0 "Icône du Christ Pantocrator"
 desc_icon_pancreator:1 "Le Christ Pantocrator représente le Christ Tout-Puissant, à la fois doux et sévère. C'est l'une des images religieuses les plus populaires de notre Église, souvent peinte à l'intérieur du dôme central d'un sanctuaire."
 icon_nicholas:0 "Icône de Saint Nicolas"
 desc_icon_nicholas:1 "Nicolas le thaumaturge, ou le porteur de présents, est l'un des plus anciens saints chrétiens et apparaît sur de nombreuses icônes sous les traits d'un vieil homme à la barbe blanche."
 icon_climacus:0 "Icône de Saint Jean Climaque"
 desc_icon_climacus:1 "L'auteur de « L'Échelle du Paradis », Saint Jean Climaque, a inspiré des générations de Chrétiens Orthodoxes en décrivant comment tendre vers le divin par l'ascèse et une vie pieuse."

