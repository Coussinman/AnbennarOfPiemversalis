 bhonsle_cavalry:0 "Sowars"
 maharathan_guerilla_warfare:0 "Telingas"
 rajput_musketeerDESCR:0 "À mesure que le développement des armes à feu progressait, l'équipement des mousquetaires indiens s'améliorait en qualité. La précision et la longue portée furent privilégiées car les Moghols continuèrent à utiliser les mousquetaires comme tireurs d'élite. Les Moghols continuèrent également à utiliser des mousquetaires au service direct de l'autorité centrale, contrairement à la cavalerie aux mains des Mansabdars."
 reformed_mughal_mansabdarDESCR:0 "Les Sikhs du Pendjab développèrent un style de combat de cavalerie particulier inspiré des armées perses et afghanes. On l'appelait « dhai-phat » ou « deux et demi » frappes. Un groupe de cavaliers chargeait l'ennemi et tirait avec ses mousquets, se repliait et répétait. Lorsque l'ennemi était suffisamment affaibli, la masse de cavalerie chargeait au sabre. De même, de nombreux États du nord de l'Inde intégrèrent de plus en plus des cavaliers mobiles armés de mousquets dans leurs armées, souvent recrutés parmi les nombreux Afghans de la région."
 indian_shock_cavalryDESCR:0 "Le Deccan occidental, une région de collines, de jungles et de nombreux forts, s'avéra assez difficile à soumettre pour les grandes armées mogholes lourdement équipées. Dans sa lutte désespérée pour survivre, le sultanat d'Ahmednagar fut le pionnier de l'utilisation de cavalerie légère pour harceler les forces mogholes. Les cavaliers marathes employés par Ahmednagar eurent tant de succès qu'ils furent bientôt employés par d'autres souverains également."
 bhonsle_infantryDESCR:0 "De nombreux hommes des tribus des régions de Kanara, Desh et Malnad, comme les Berads et les Mavales, adoptèrent très tôt les mousquets à mèche pour la chasse et la guerre. En raison de leur familiarité avec ces armes, ces hommes devinrent bientôt les principaux mousquetaires du sud de l'Inde. Les armées marathes en particulier en vinrent à compter sur ces groupes tribaux pour recruter leur infanterie. L'organisation tribale des troupes fut souvent conservée, les chefs servant d'officiers. Les Berads et Mavales furent de plus en plus déployés dans les armées marathes, mogholes et mysoréennes aux XVIIe et XVIIIe siècles et finirent par former le noyau des futurs régiments d'infanterie de style européen dans la région."
 indian_archersDESCR:0 "Bien que les éléphants fussent un élément commun dans la plupart des armées indiennes, ils n'étaient souvent utilisés qu'en petit nombre par les commandants et en complément de la cavalerie ou de l'infanterie. Dans les régions dominées par la jungle cependant, comme l'Orissa ou le Bastar, les chevaux sont à la fois difficiles à utiliser efficacement et à maintenir en bonne santé. En conséquence, les armées de ces régions s'appuyèrent bien davantage sur de grandes unités d'éléphants utilisés comme plateformes mobiles d'archers."
 indian_arquebusierDESCR:0 "Avec le manque général d'intérêt pour le développement des tactiques d'infanterie dans les armées indiennes, l'avènement des armes à feu n'eut d'abord pas un grand impact. Bien que courantes dans les armées indiennes, elles ne constituèrent pas une partie importante des troupes d'infanterie pendant longtemps et les armes à feu continuèrent à être utilisées de manière individuelle plutôt qu'adoptées pour des formations spécifiques. Plutôt que d'équiper leurs propres unités avec les nouvelles armes, les États indiens se contentèrent d'abord d'engager des arquebusiers étrangers, souvent turcomans, en complément de leurs archers et de leur artillerie."
 rajput_hill_fightersDESCR:0 "Avec l'arrivée des puissances musulmanes vint un afflux accru de bonnes montures de cavalerie étrangères en Inde. L'utilisation des tactiques militaires musulmanes finit par devenir courante même dans les armées des États hindous comme l'Empire de Vijayanagara. Au nord-ouest, les guerriers Rajputs s'adaptèrent rapidement aux tactiques des sultanats indiens et une nouvelle race de chevaux de cavalerie Rajputs émergea bientôt. Le soin et l'élevage de ces chevaux Marwari prirent un rôle hautement cérémoniel et révéré dans les sociétés Rajputs très militantes. Dans le climat du sud de l'Inde, l'élevage de montures de cavalerie s'avéra plus difficile et les souverains du sud se trouvèrent à devoir compter sur les marchands de l'océan Indien pour approvisionner leur cavalerie."
 mughal_mansabdarDESCR:0 "Tout au long du XVe siècle, la cavalerie continua d'être la plus influente des armes de combat en Inde. L'arrivée de Babur au début du XVIe siècle et la naissance de l'Empire moghol accentuèrent encore cette tendance. Babur utilisa d'importants contingents d'archers à cheval des steppes de Transoxiane lors de son invasion, et les Moghols qui lui succédèrent continuèrent à s'appuyer sur une importante force de cavalerie. Alors que les autres États du nord de l'Inde tentaient de rattraper la machine militaire moghole, beaucoup d'entre eux en vinrent à compter de plus en plus sur des aventuriers d'Asie centrale comme officiers de cavalerie. L'un de ces aventuriers afghans fonda l'éphémère Empire Suri dans l'est et le centre de l'Inde."
 tipu_sultan_rocketDESCR:0 "À mesure que le XVIIIe siècle avançait, l'infanterie indienne en vint à combattre de manière plus coordonnée, avec une cadence de tir plus élevée et à être bien mieux utilisée qu'auparavant. L'ajout d'innovations militaires comme les roquettes mysoréennes et l'intégration de la cavalerie légère indienne permirent aux États indiens d'être beaucoup plus efficaces contre les armées européennes. Trouvant un bon équilibre, Mysore en particulier, sous Haider Ali et Tipu Sultan, se propulsa d'un royaume local à une puissance régionale du sud de l'Inde."
 indian_footsoldierDESCR:0 "Dans l'histoire militaire indienne, l'infanterie était souvent bon marché et facile à remplacer en raison de la grande population indienne. La cavalerie en revanche était coûteuse et avait souvent, au moins depuis l'arrivée des armées musulmanes au XIIIe siècle, prouvé être l'élément décisif sur les champs de bataille indiens. Peut-être à cause de cela, le développement des tactiques d'infanterie ne reçut pas autant d'attention pendant la majeure partie de l'époque moderne. Le rôle de l'infanterie était de constituer le gros d'une force et d'assiéger les nombreux forts du sous-continent indien."
 indian_elephantDESCR:0 "À mesure que l'empire moghol grandissait, le besoin d'une organisation centrale pour garder trace de ses nombreux détenteurs de pouvoir devint une nécessité. Sous Akbar, un système de classement numérique pour tous les nobles (Mansabdars) fut mis en place. Les jagirs, les allocations et le nombre de cavaliers qu'un noble devait fournir devinrent dépendants de ce rang."
 mughal_musketeerDESCR:2 "Avec l'invasion de l'Inde par Babur, le sous-continent vit sa première utilisation organisée des armes à feu. Cependant, contrairement à l'Occident, les mousquetaires, ou Toofangchis, tels qu'utilisés par Babur, servaient de tireurs d'élite dans ses armées, tirant individuellement sur des cibles spécifiques tant lors des batailles rangées que des sièges. Babur prit soin de former ces troupes pour obtenir de meilleurs résultats et, contrairement à la cavalerie moghole, le recrutement, la formation et l'organisation des mousquetaires restèrent sous son contrôle direct. Que le grand succès de Babur à Panipat soit dû ou non à l'utilisation des armes à feu, l'utilisation de mousquetaires devint de plus en plus courante dans les armées indiennes après l'invasion de Babur."
 maharathan_cavalryDESCR:0 "Après la chute du sultanat d'Ahmednagar, les Marathes qui avaient auparavant prospéré à son service en vinrent à combattre au service de Bijapur et d'autres puissances locales ou régionales désireuses de développer davantage de moyens de déjouer les grandes armées mogholes empiétant sur le Deccan. Avec la montée des capacités militaires marathes vint la montée du pouvoir politique marathe, et ces guerriers du Deccan formèrent bientôt des États à eux, éclipsant leurs anciens employeurs musulmans et se révélant une menace pour leur némésis moghole. Par l'utilisation de cavalerie et d'infanterie légères, les armées marathes purent harceler et couper des forces mogholes beaucoup plus grandes et moins mobiles et tailler plusieurs empires dans l'État moghol déclinant."
 sikh_rifleDESCR:0 "L'engagement d'officiers européens pour entraîner et diriger des régiments indiens changea le paysage militaire de l'Inde de nombreuses façons. Les armées utilisant des tactiques traditionnelles, privilégiant la cavalerie, furent souvent battues par des forces avec une infanterie à mousquet entraînée et de l'artillerie mobile. Pour rester en avance, il devint essentiel d'organiser la cavalerie, l'infanterie et l'artillerie pour combattre ensemble à un degré bien supérieur à ce qui avait été vu auparavant en Inde. Mysore sous Hyder Ali et Tipu Sultan fut l'un des États qui prit cette leçon le plus à cœur et réussit à prouver que tant qu'elle pouvait être correctement coordonnée avec les autres armes, la cavalerie légère restait un outil très puissant pour perturber les opérations de ses adversaires en Inde."
 south_indian_musketeerDESCR:0 "Vijayanagara et ses États successeurs comptaient sur les chefs locaux des communautés de leur empire pour une grande partie de leur administration. Parmi leurs tâches figuraient l'organisation de la défense locale et le recrutement et le rassemblement des troupes."
 sikh_hit_and_runDESCR:0 "La branche moins prestigieuse de l'infanterie attirait communément les troisièmes ou quatrièmes fils de familles Rajputs pauvres de la campagne du nord, des Afghans déserteurs, des fermiers Jats et d'autres groupes aux perspectives médiocres. Incapables de se payer des chevaux, ces groupes adoptèrent l'utilisation des armes à feu comme moyen moins coûteux de réussir sur le champ de bataille. Bien qu'ils reçussent peu de formation formelle, ces mousquetaires Purbia autodidactes finirent par former le noyau d'une armée nord-indienne plus moderne, car leur utilisation des armes à feu et l'adoption éventuelle de tactiques d'infanterie européennes plus modernes leur permirent de faire de plus en plus la différence sur les champs de bataille de l'Inde."
 indian_rifleDESCR:0 "Le rôle que les Telingas et les Berads remplissaient dans le sud finit par être assumé par les Purbias dans le nord. Des officiers britanniques au service de la Compagnie des Indes orientales et des aventuriers français au service des Moghols ou d'autres souverains indiens devinrent de plus en plus courants comme commandants d'infanterie à mousquet indienne dans le nord-est. En conséquence, des régiments d'infanterie indienne entraînés purent bientôt être trouvés dans toutes les armées des États du nord ainsi que dans des bandes de mercenaires. Finalement, le recrutement devint encore plus organisé et ces troupes du nord de l'Inde, connues sous le nom de cipayes d'après le terme moghol pour fantassin, furent étroitement associées au règne de la Compagnie en Inde."
 reformed_mughal_musketeerDESCR:0 "Alors que l'empire de Vijayanagara se fracturait en plusieurs royaumes Nayak suite à sa défaite à Talicota, les Poligars locaux restèrent en place en tant que détenteurs du pouvoir local responsables du recrutement. Dans certains de ces États successeurs, les Poligars acquirent une position encore plus indépendante qu'ils n'avaient eue sous Vijayanagara. Combiné à la pénurie continue de chevaux, cela conduisit à un ratio d'infanterie encore plus élevé dans les armées du sud. Les armes à feu continuèrent également à devenir plus courantes dans le sud comme dans le nord au cours du XVIe siècle."
 bhonsle_cavalryDESCR:0 "La cavalerie légère marathe prouva de plus en plus à quel point les grandes armées de cavalerie lourde moghole étaient vulnérables si l'on pouvait couper leurs approvisionnements. Durant la première moitié du XVIIIe siècle, alors que le pouvoir marathe grandissait et que l'infanterie s'organisait de plus en plus à la manière européenne, le besoin de régiments de cavalerie plus organisés se fit sentir. À partir des années 1720, la taille et le niveau d'organisation des armées de cavalerie indiennes augmentèrent pour tenter d'égaler le développement des tactiques d'infanterie et d'artillerie qui avait alors lieu. Il fallut un certain temps avant que les généraux indiens expérimentés ne réalisent à quel point leur focalisation sur la cavalerie pouvait les rendre vulnérables face aux régiments de mousquetaires entraînés de style européen qui devenaient de plus en plus courants au cours des années 1700."
 maharathan_guerilla_warfareDESCR:0 "À mesure que les Français s'impliquaient de plus en plus dans les affaires des États du sud et de l'est de l'Inde, ils commencèrent à former des troupes indiennes aux tactiques d'infanterie européenne coordonnée. Cela allait bientôt se révéler être le début d'une révolution dans la guerre indienne, l'infanterie plutôt que la cavalerie devenant de plus en plus le facteur déterminant dans les batailles. Sous Dupleix et de Bussy, les soldats Telugus commencèrent à combattre et à s'armer d'une manière plus similaire aux armées européennes de l'époque. Ces troupes étaient connues sous le nom de Telingas d'après leur région d'origine (Telingana), mais bientôt le terme en vint à désigner les troupes d'infanterie armées de mousquets et en uniforme dans d'autres parties de l'Inde."
 cb_revoke_electorate:0 "Révoquer l'électorat"
