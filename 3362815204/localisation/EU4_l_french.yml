 cb_maya_expansion:0 "Confédération maya"
 cb_maya_expansion_desc:0 "Les terres autour de nous sont divisées en de nombreux Cahs, des cités-États de peu d'importance. Tous les Cahs voisins doivent rejoindre notre cité ou périr."
