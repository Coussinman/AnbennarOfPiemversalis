 CONFIRMLEAVEHRE:0 "Abandonner l'Empire d'Anbennar"
 CONFIRMLEAVEHRETEXT:0 "Les conflits incessants, tant religieux que politiques, au sein de l'Empire d'Anbennar épuisent le moral de la population de $PROV$. Les relations avec l'Empereur ont atteint leur plus bas niveau et la réputation déshonorante de $TITLE$ $MONARCHNAME$ n'a pas amélioré notre situation. Beaucoup considèrent qu'il est dans l'intérêt de $PROV$ de quitter la confédération.\nÊtes-vous vraiment certain ?"
