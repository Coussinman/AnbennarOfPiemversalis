l_french:
 #Events
 lizard.1.t:0 "Ravagés par le Sang"

 lizard.1.d:0 "Un groupe d'Hommes-lézards Ashhana dans [raging_crocs_province.GetName] est devenu vorace, consumé par le désir sauvage de sang. Nul ne sait comment cela a commencé : peut-être un complot de sorcière, une dispute violente ou simplement de la mauvaise musique. Quoi qu'il en soit, ils sèment le chaos à travers notre province."

 lizard.1.a:0 "Envoyez l'armée."

 lizard.1.b:0 "N'envoyez personne, les habitants locaux peuvent s'en occuper eux-mêmes."

 lizard.1.c:0 "Envoyez un artiste pour les calmer."


 lizard.2.t:0 "Un Son Apaisant"

 lizard.2.d:0 "Il semble que les Ashhana de [soothing_sound_province.GetName] soient plus cordiaux et productifs que d'habitude. Après enquête, la cause semble être un artiste très talentueux. Son art a assourdi la malédiction du sang des villageois ; ils ne sont plus constamment tourmentés par les murmures de la soif de sang."

 lizard.2.a:0 "Il devrait consacrer son talent à tous dans notre pays."

 lizard.2.b:0 "Qu'il reste là où son cœur le désire."


 lizard.3.t:0 "Les Halfelins organisent un festival de Drongay"

 lizard.3.d:0 "Les halfelins de l'une de nos provinces ont organisé un festival en l'honneur d'un de leurs dieux, en l'occurrence le dieu des Hommes-lézards, Drongay, et notre peuple l'a remarqué. Certains ont choisi d'assister au festival et ont été accueillis par des hôtes bienveillants leur offrant nourriture, boisson et divertissement en abondance, ce qui a répandu une grande allégresse sur ces terres. \nLe festival touche peut-être à sa fin, mais si nous proposons d'intervenir avec un financement, nous pourrions l'étendre à une célébration nationale, ce qui encouragerait la coopération entre nous et nos sujets halfelins à plus grande échelle. Nous autres Hommes-lézards ne sommes peut-être pas réputés pour nos festivités fantaisistes, mais nous en voyons l'utilité pratique."

 lizard.3.a:0 "Très bien."

 lizard.3.b:0 "Un plus grand festival, si nous le finançons, pourrait apporter de plus grandes récompenses."


 lizard.4.t:0 "Bakoly Chantaudace"

 lizard.4.d:0 "Il y a quelques années, une halfeline du nom de Bakoly Chantaudace quitta nos terres pour Fahvanosy, à la recherche du collège Mihipha afin de devenir une barde renommée. Peu y prêtèrent attention en dehors de son village agricole natal, qui organisa une fête d'adieu. Mais ces derniers mois, il est devenu évident qu'elle est revenue, et avec un talent considérable. \nChaque chanson qu'elle entonne s'incruste dans l'esprit des individus les plus stoïques et les plus endurcis, et sa tournée à travers la campagne de [Root.Country.GetName] a beaucoup contribué à remonter le moral de notre peuple. Nous autres Hommes-lézards admirons les musiciens et les artistes autant que n'importe quel autre peuple, et nous louons donc le travail d'une barde aussi impressionnante. \nCependant, peut-être ses talents sont-ils gaspillés dans les tavernes et les places de village. Avoir une barde de cette renommée à notre cour, surtout une native de nos terres, rehausserait grandement notre prestige. Alternativement, nous pourrions la payer pour qu'elle se concentre sur les fermes et les plantations afin d'augmenter leur productivité, ce qui nous donnerait une récompense plus tangible pour être la patrie de Bakoly Chantaudace."

 lizard.4.a:0 "Qu'elle continue sa tournée à travers la campagne."

 lizard.4.b:0 "Nous pourrions utiliser une barde de cette renommée à notre cour."

 lizard.4.c:0 "La payer pour chanter dans les fermes et plantations pourrait nous apporter un bénéfice plus tangible."


 lizard.5.t:0 "Commerce de clous de girofle entre initiés"

 lizard.5.d:0 "Il apparaît qu'une famille halfeline de nos terres, ayant des cousins cultivateurs de clous de girofle, a pu acheter cette épice ridiculement chère à un prix bien inférieur à celui des marchands étrangers, générant des profits massifs. \nMaintenant que nous l'avons découvert, la seule question est comment nous en tirerons profit. La réponse évidente serait de les taxer, réduisant leurs profits mais nous donnant un beau tas d'or. La seconde réponse serait simplement de les laisser non taxés, car les clous de girofle bon marché ont commencé à attirer les marchands vers nos ports. Enfin, nous pourrions choisir d'embaucher le halfelin responsable de cela, car peut-être pourrions-nous faire bon usage d'un marchand ayant des connexions avec les cultivateurs de clous de girofle de Favhanosy ?"

 lizard.5.a:0 "Laissez-les non taxés, les clous de girofle bon marché attireront les marchands comme des mouches vers le miel."

 lizard.5.b:0 "Taxez-les, je veux prélever ma part maintenant, pas plus tard."

 lizard.5.c:0 "Peut-être leurs connexions peuvent-elles être exploitées par nous plus directement."


 lizard.6.t:0 "Notre Candidat au Marathon"

 lizard.6.d:0 "Le marathon de Favhanosy, une tradition plutôt étrange pour nous, est néanmoins devenu un événement international parmi les halfelins, qui voyagent d'aussi loin qu'Aelantir et Cannor pour y participer. \nRécemment, l'un de nos halfelins est devenu renommé pour tout l'entraînement qu'il a effectué en préparation, au point que beaucoup de nos sujets Hommes-lézards ont commencé à considérer sa participation au marathon avec une sorte de fierté nationale. Beaucoup de notre peuple espèrent qu'il remportera une grande victoire lors de l'événement, et qu'il apportera la fierté à [Root.Country.GetName]. Bien sûr, peu d'entre nous ont la moindre idée de ce que cette tradition implique exactement, mais cela a certainement suscité beaucoup d'enthousiasme."

 lizard.6.a:0 "Qu'il remporte la victoire !"

 lizard.6.b:0 "Pour représenter [Root.Country.GetName] dans les Îles d'Été, nous célébrerons pour faire connaître cet honneur !"

 lizard.7.t:0 "Frères en Conflit"
 lizard.7.d:0 "Le temps du 333ᵉ Empire est proche. Les nagas ont choisi Sykar Griffe-de-Rivière de Rayaz pour être le Souverain qui mènera les Hommes-lézards dans cette nouvelle ère. Un tel arrangement est risible. Chaque victoire lui a été servie sur un plateau d'argent. Pendant ce temps, c'est nous qui avons pris la grande cité de Karassk contre toute attente. Nous avons prouvé notre valeur.\n\nIl est temps de mettre fin à cette farce. Envoyez une délégation à Rayaz. Cette alliance est terminée. Désormais, nous sommes ennemis. Nous n'aurons de repos qu'après les avoir écrasés. C'est nous qui mènerons les Hommes-lézards vers l'aube de leur plus grande ère !"
 lizard.7.a:0 "Pour Asarta ! Pour Katyradz !"

 lizard.8.t:0 "Trahison"
 lizard.8.d:0 "Dire que cela a commencé dans la joie. Lorsque la nouvelle de la prise de Karassk par les forces d'Asarta se répandit à Rayaz, une célébration fut planifiée pour coïncider avec l'arrivée attendue d'une délégation d'Asarta dans la capitale. Les familles devaient se réunir, partager un festin et discuter des plans pour le futur gouvernement des Hommes-lézards.\n\nAu lieu de cela, ils n'apportèrent que des nouvelles de trahison. Asarta a poignardé l'alliance en plein cœur et a annoncé qu'ils n'auraient de repos qu'après la chute de Rayaz. Aucune guerre n'a été déclarée, mais désormais ils ne sont plus que des ennemis jurés. Aucun 333ᵉ Empire ne peut être formé tant que l'autre existe encore."
 lizard.8.a:0 "Sang-froid."

 lizard.9.t:0 "Les Revendications d'Arazin"
 lizard.9.d:0 "L'unité des Griffes-de-Rivière n'est plus. La sécession d'Asarta de notre alliance crée une opportunité politique unique qui ne doit pas être sous-estimée. Si nous voulons agir, c'est le bon moment. \n\nLes tribus de Yushyn sont connues pour leur rébellion et leur sens inébranlable de l'identité. Avant la guerre, Rayaz leur avait demandé de se rebeller contre les Zerat dans une tentative conjointe de briser les Anzara. Ils espéraient l'indépendance, mais l'administration de Sykar ne leur en laissa pas une once au final, établissant leurs propres garnisons et gardant des personnages importants en résidence surveillée. Ces régions sont une bombe à retardement qui n'attend que le bon moment pour exploser. \n\nNous offrirons nos services à Rayaz et revendiquerons les provinces de Verthica et Tsaratokh, proposant d'agir comme tampon contre les Yushyn. Et s'ils refusent... eh bien, peut-être la relation entre nos tribus ne sera-t-elle plus aussi profitable pour nous."
 lizard.9.a:0 "Ce sera votre choix d'être avec ou contre nous."

 lizard.10.t:0 "Un Message d'Arazin"
 lizard.10.d:0 "Comme si nous n'étions pas déjà dans une situation fâcheuse après qu'Asarta ait brisé les liens de notre famille, nous avons reçu un message d'Arazin. Sous prétexte de s'offrir comme barrière contre une possible rébellion Yushyni, ils exigent l'accès aux provinces de Tsaratokh et Verthica. \n\nBien que leurs arguments soient valides, ils sont pleinement conscients de tous nos efforts pour centraliser nos possessions afin de mener une offensive unifiée contre Anzara. Pour aggraver les choses, ils ont indirectement suggéré que c'est une affaire qui vaut la peine de rompre notre alliance ! \n\nNe voient-ils pas la situation dans son ensemble ? Ils viennent de nous mettre dans une situation perdante : soit nous cédons et risquons que les autres partis suivent avec leurs demandes, soit nous refusons et endommageons davantage la stabilité de notre coalition !"
 lizard.10.a:0 "Cédons, cela restera dans la famille de toute façon."
 lizard.10.b:0 "Nous ne reculerons pas, pas maintenant."

 lizard.11.t:0 "Asarta Isolée"
 lizard.11.d:0 "Aujourd'hui, nous avons reçu des nouvelles fraîches de nos sources à Rayaz. Nos frères d'Arazin ont fait valoir leurs revendications sur Tsaratokh contre Rayaz et malheureusement pour nous, Rayaz a cédé. Notre [Root.Monarch.GetTitle] est en colère depuis que la nouvelle s'est répandue. À juste titre, car il semble que la seule opportunité de sécuriser un allié de plus pour notre cause vient de nous glisser entre les doigts."
 lizard.11.a:0 "Une chaîne d'événements malheureuse."

 lizard.12.t:0 "Revendication Satisfaite"
 lizard.12.d:0 "Bonne nouvelle, [Root.Monarch.GetTitle] ! Notre revendication sur Tsaratokh a reçu une réponse positive et nous avons obtenu le contrôle des territoires !"
 lizard.12.a:0 "Je t'aime, mon cher [Root.Monarch.GetSisterBrother]."

 lizard.13.t:0 "Revendication Refusée"
 lizard.13.d:0 "Grave nouvelle, [Root.Monarch.GetTitle]. Notre revendication sur Tsaratokh a été refusée. Le seul moyen de reprendre ce qui nous appartient repose sur l'obtention du soutien d'autres tribus, mais heureusement il y a un candidat avec lequel nous attendions de nous réconcilier."
 lizard.13.a:0 "Chers frères Asartas..."

 lizard.14.t:0 "Un Allié Inattendu"
 lizard.14.d:0 "...Vous n'êtes pas les seuls à garder rancune envers les Rayazas. Depuis que leurs élites ont été infiltrées par les nagas, ils nous ont privés de nos droits sur nos terres légitimes à Tsaratokh. Encore et encore, nos suppliques pour revenir ont été repoussées au point où notre patience est à bout. Nous demandons à rejoindre votre cause, à écraser nos frères égoïstes et arrogants et à créer une nouvelle alliance Griffe-de-Rivière, une où Arazin et Asarta mènent la voie vers un nouvel empire.\n\nVotre cher [L97.Monarch.GetSisterBrother],\n[L97.Monarch.GetName] Griffe-de-Rivière"
 lizard.14.a:0 "Tous sont bienvenus pour conspirer contre des ennemis communs."
 lizard.14.b:0 "La chute de Rayaz est notre devoir et le nôtre seul."

 lizard.15.t:0 "Laissés dans le Froid"
 lizard.15.d:0 "Le pire scénario s'est manifesté. Dans la poursuite de nos propres ambitions, nous avons été abandonnés par nos deux groupes de frères et nous nous retrouvons maintenant encerclés par des puissances hostiles. Sans personne pour nous protéger, nous ne pouvons qu'espérer que notre fin vienne plus tard plutôt que plus tôt."
 lizard.15.a:0 "Nous avons attiré ce destin sur nous-mêmes et maintenant nous en payons le prix."

 lizard.16.t:0 "Ce Qui Aurait Pu Être"
 lizard.16.d:0 "La scission dans notre famille fut un coup auquel personne ne s'attendait. Pourtant, tout ne s'est pas déroulé de la pire façon possible. L'alliance des traîtres ne s'est pas concrétisée, car les Asartas ont refusé l'offre d'Arazin de les rejoindre dans un effort commun contre nous. Nous ne pouvons qu'être heureux qu'il y ait encore une opportunité de diviser et conquérir les tribus rebelles."
 lizard.16.a:0 "Une goutte de bonheur dans la mer de misère."

 lizard.17.t:0 "Établir un Précédent"
 lizard.17.d:0 "La scission dans notre famille fut un coup auquel personne ne s'attendait. Un par un, Asarta et Arazin se sont distancés de nous, car ils ont maintenant formé une alliance, unis par leur ressentiment commun envers nous.\n\nAlors que nous aspirons à revendiquer le titre du dernier empire, ce ne peut pas être le conflit qui nous abat. Nous apporterons la vengeance à nos frères pour leur insubordination et les remettrons sous notre joug une fois de plus, cette fois directement sous notre gestion."
 lizard.17.a:0 "Nous ferons d'eux un exemple."

