###Ashhana Lizardfolk###

 ashhana_tribe:0 "Tribu Ashhana"
 ashhana_tribe_desc:0 "Bien que souple, les tribus Ashhana possèdent une autorité centrale dirigeante. Leur rôle principal est de rassembler une armée pour défendre les fermiers de tchoken qui composent la majeure partie de la société Ashhana en cas de raids humains, trolls ou d'autres Hommes-lézards. Rassembler des forces n'est pas difficile, car la rage alimentée par la malédiction du sang facilite la conscription de villages entiers pour défendre leur territoire, mais ce système ne s'adapte pas bien à mesure que le nombre de villages sous le contrôle du chef augmente."
 war_as_art:0 "La Guerre comme Art"
 war_as_art_desc:0 "Qu'est-ce que l'art ? Le premier Ashhana qui découvrit que l'art pouvait libérer son esprit de la malédiction du sang le fit en écoutant un barde et sa musique. D'autres se sont tournés vers la peinture ou la sculpture. Mais ce sont des définitions bien trop étroites. Tout ce dont l'existence dépasse l'utilitaire et dont le but s'étend à l'esthétique peut être considéré comme de l'art. Même l'acte de bataille lui-même peut trouver une expression artistique."
 rally_to_the_roar:0 "Ralliement au Rugissement"
 rally_to_the_roar_desc:0 "Les Ashhana périront si les autres Hommes-lézards s'unissent un jour suffisamment pour nous chasser de nos foyers. Le rugissement n'est pas seulement un beuglement physique, mais un cri pour le peuple Ashhana. Nous partons en guerre, et chaque crocodile doit jouer son rôle."
 spread_the_cure:0 "Répandre le Remède"
 spread_the_cure_desc:0 "La félicité d'un esprit libéré doit être partagée par tous. On ne peut pas dire que la malédiction du sang est guérie si seuls ceux du pavillon du chef savent que c'est par l'art que votre rage peut être apaisée. Cela doit être répandu dans chaque village de notre territoire."
 crocadilian_unity:0 "Unité Crocodilienne"
 crocadilian_unity_desc:0 "Savez-vous comment les autres Hommes-lézards nous appellent ? Monstres. Ils nous désignent dans le même langage dégradant qu'on réserve habituellement aux trolls. Si c'est ainsi qu'ils nous appellent, alors peut-être devrions-nous faire de notre mieux pour mériter ce sobriquet."
 paintbrushes_for_everyone:0 "Des Pinceaux pour Tous"
 paintbrushes_for_everyone_desc:0 "Percevoir l'art, c'est toucher le divin. Le créer est un acte divin. Chacun est capable du divin, mais manque simplement des outils pour y parvenir. Les pinceaux sont l'outil le plus simple de l'artiste. Créez-en des milliers et envoyez-les à chaque Ashhana. Alors même le plus humble fermier de tchoken pourra devenir divin."
 festivals_of_blood:0 "Festivals du Sang"
 festivals_of_blood_desc:0 "Beaucoup de ceux qui suivent Zaradyrra le font pour le sens de la communauté. Ce n'est pas seulement l'art, mais les festivals qui célèbrent l'art. Pour ceux qui voient la félicité à embrasser la rage sanguinaire, des festivals similaires où l'on se laisse consumer par elle peuvent être libérateurs."
 free_our_souls:0 "Libérer Nos Âmes"
 free_our_souls_desc:0 "Depuis un millénaire ou plus, nos âmes sont liées à la malédiction du sang. La société, la culture, la civilisation, tout a échoué tandis que la rage nous consumait. Mais plus maintenant ! Nous avons trouvé le remède à ce fardeau que les sorcières ont gravé dans nos êtres. Embrasser l'art, créer l'art, consommer l'art, à chaque étape nous libérons nos esprits de la brume rouge qui menace de nous engloutir. Nous ne sommes plus maudits. Nous sommes libres."
 embrace_the_carnage:0 "Embrasser le Carnage"
 embrace_the_carnage_desc:0 "Ils appellent cela une malédiction. Ce qui nous donne la force. Ce qui fait que tous nous craignent. Nous pourrions mettre des civilisations à genoux. Et pourtant nous continuons à la fuir. Pourquoi ? Ce n'est pas une malédiction, mais un don ! Embrassez-la, et en cela nous trouvons le vrai pouvoir."


 ashhana_crocadilian_unity_tt:0 "Cinq provinces d'Hommes-lézards non-Ashhana possédées changent pour la culture Homme-lézard Ashhana"
 rally_to_the_roar_tt:0 "Obtenir §G5 000§! effectifs chaque fois que vous déclarez la guerre"
 festivals_of_blood_effect_tt: "Les 2 prochaines fois que nous organisons un §YFestival de Zaradyrra§!, nous gagnons §G5§! §YInfanterie§! dans notre capitale et §G+10§! §YLimite de forces terrestres§! pendant 10 ans"
 festivals_of_blood_lets_go_tt: "Gagnez §G5§! §YInfanterie§! dans votre capitale et §G+10§! §YLimite de forces terrestres§! pendant 10 ans"
 festivals_of_blood_army_size: "Festival du Sang"
 festivals_of_blood_army_size_desc: "Alors que nous nous abandonnons à la malédiction du sang, davantage d'Ashhana désirent rejoindre le combat"