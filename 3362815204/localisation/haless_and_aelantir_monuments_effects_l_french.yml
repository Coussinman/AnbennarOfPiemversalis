l_french:

guhe_discovery_of_precursor_relics: "Découverte de ruines d'un Haut Temple sous la Citadelle !"
guhe_discovery_of_precursor_relics_desc: "Une découverte incroyable a été faite. Alors que des unités de la garnison locale de la citadelle travaillaient à l'expansion d'une fondation, une partie du sol s'est effondrée, révélant une étroite crevasse. Avec quelques efforts, nous avons pu envoyer quelques hommes explorer, et ce qu'ils ont découvert était stupéfiant : un important dépôt de reliques antiques d'une civilisation précurseur ! Nous avions toujours entendu dire que Guhe avait été bâtie sur les ruines d'un Haut Temple, mais voir cela si richement confirmé sous nos yeux est véritablement extraordinaire."

aoshan_hanging_temple_hokuto_shinken: "Un Art Martial Ancien Découvert... Hokuto Shinken !"
aoshan_hanging_temple_hokuto_shinken_desc: "Un art martial terrifiant s'est transmis pendant 2 000 ans. Il est connu sous le nom de Hokuto Shinken, nommé d'après la Grande Ourse sacrée. La tragédie a toujours suivi ceux qui héritent de ce style ! (Puisque vous avez lu cette description, vous êtes désormais obligé de vous mettre dans l'ambiance correcte du Hokuto Shinken en cherchant « You Wa Shock » sur youtube et en écoutant le premier résultat.)"

vels_bacar_scol_mecynn_like_water: "Enseigner aux Soldats à se Mouvoir comme l'Eau"
vels_bacar_scol_mecynn_like_water_desc: "L'une des leçons essentielles enseignées aux lames-de-rivière de Scol Mecynn est comment se mouvoir simultanément avec grâce et léthalité. Tant en combat singulier qu'à la guerre, la vitesse est cruciale, et c'est bien souvent le coup décisif qui détermine les vainqueurs et les vaincus d'un conflit."

nakar_koraim_discovery_of_precursor_relics: "Découverte de Reliques Précurseurs sous la Cité !"
nakar_koraim_discovery_of_precursor_relics_desc: "En creusant une nouvelle section de terrain pour l'ajouter au port, un bloc de pierre s'est brisé et a révélé un trou profond. Après investigation, il semble y avoir les ruines d'une autre cité construite sous Nakar Koraim ! Nul doute que de nombreux artefacts précieux se cachent sous terre, attendant d'être mis au jour..."

gundhaghidur_library_of_insight_library_research: "Recherches dans la Bibliothèque de Gundhaghidur"
gundhaghidur_library_of_insight_library_research_desc: "Nombre de nos plus brillants esprits se sont aventurés dans la bibliothèque de Gundhaghidur dans l'espoir de percer les secrets contenus dans les innombrables tomes qui s'y trouvent. Aujourd'hui, ils sont heureux d'annoncer leurs découvertes à l'État."

malacnar_city_of_warriors_greatest_warriors_of_all_the_ynn: "Les Plus Grands Guerriers de Tout l'Ynn !"
malacnar_city_of_warriors_greatest_warriors_of_all_the_ynn_desc: "Les guerriers de Malacnar sont les plus forts et les plus redoutables de tous les nombreux États de l'Ynn. Prouvons-le au monde entier !"

yinquan_the_conquerors_hotspring_soaked_men_tell_no_tales: "Les Hommes Trempés ne Racontent pas d'Histoires"
yinquan_the_conquerors_hotspring_soaked_men_tell_no_tales_desc: "Les eaux de Mulim peuvent délier plus que des muscles fatigués. Les hauts fonctionnaires des terres voisines qui s'aventurent dans les sources sont généralement plus enclins à parler des plans de leur pays qu'ils ne le seraient normalement lorsqu'ils sont détendus et trempés jusqu'aux os."

hubao_the_tiger_fortress_invincible_fortress: "Hubao, une Forteresse Invincible ?"
hubao_the_tiger_fortress_invincible_fortress_desc: "Avec les nouvelles améliorations apportées au réseau de fortifications défensives de Hubao, certains de nos ingénieurs militaires supérieurs se demandent s'il est même possible pour une armée assiégeante de percer la forteresse avec des armes conventionnelles. Seul le temps dira si la Forteresse du Tigre est véritablement indestructible."

eranils_oddities_eranil_summons_a_damestear_meteor: "Eranil l'Étrange Invoque un Météore de Damestear !"
eranils_oddities_eranil_summons_a_damestear_meteor_desc: "Eranil l'Étrange, l'ancien et excentrique artisan elfe qui dirige les Curiosités d'Eranil, a accompli l'impossible. Avec une somme considérable de fonds d'État à sa disposition pour les ingrédients et divers outils et appareils exotiques, Eranil a réussi à invoquer un météore contenant une quantité importante de Damestear à un emplacement précis près du centre de Kalib. Bien que physiquement peu imposant, Eranil nous assure que la Damestear contenue dans le météore est plus que suffisante pour au moins un siècle d'utilisation, sinon plus, et promet une part considérable de celle-ci à l'État en échange de son généreux budget de matériaux utilisé dans le processus d'invocation."

azjakuma_ajgriijarul_the_bright_claw_fearsome_oni_warriors: "Les Grands et Redoutables Oni"
azjakuma_ajgriijarul_the_bright_claw_fearsome_oni_warriors_desc: "Depuis des millénaires, les Ajgriijarul ont cultivé et affiné la capacité d'instiller la peur dans le cœur de tous les autres êtres vivants qui osent menacer le pouvoir des Oni. Pendant d'innombrables générations, cela a été une posture presque exclusivement défensive. Mais maintenant que nos armées sont en marche, il est temps de passer à l'offensive et de rappeler à tous ceux qui s'opposent à nous que les Oni sont les héritiers des Vrais Géants."

azjakuma_chumijemoya_the_silent_mist_expand_the_shadow_path: "Étendre la Voie de l'Ombre"
azjakuma_chumijemoya_the_silent_mist_expand_the_shadow_path_desc: "Notre grande nation s'est tournée vers l'extérieur pour faire face au reste du monde, et nos précédents réseaux d'espionnage utilisés pour surveiller les rivaux locaux sont rapidement débordés. Les nouvelles menaces contre notre État nécessitent une surveillance secrète. L'Ordre de la Brume Silencieuse grandira pour répondre à nos besoins."