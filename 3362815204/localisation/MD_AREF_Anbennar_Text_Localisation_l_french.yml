  # Age Painting Descriptions
 pic_age_of_greentide_desc: "La Bataille de Rottenstep, 1443\n\nÀ l'été 1443, une bataille sanglante fut remportée de manière décisive par les Seigneurs des Marches de Cannor, principalement des aventuriers humains, des déserteurs et des vétérans des Guerres Lilas, contre l'avant-garde numériquement supérieure de la Marée Verte. La grande force orque menée par Korgus Jour-Fatal et ses dix commandants fut défaite après une bataille acharnée qui faillit tourner en leur faveur.\n\nL'issue de la bataille fit reculer la Marée Verte, les orques ayant perdu plus du double de soldats avec 35 000 pertes contre 15 000 morts chez les Seigneurs des Marches. Fait notable de cette bataille, une jeune écuyère nommée Corin perdit la vie en défendant son seigneur, Frederic Bennon, avant d'être ressuscitée par le dieu de la guerre disgracié, Agrados, qui la nomma sa championne et son avatar, rachetant ainsi son héritage et la faisant le remplacer comme nouvelle déesse de la guerre."
 pic_age_of_unraveling_desc: "Torrieth Parle-aux-Dieux découvre le Fragment Divin\n\nTorrieth Parle-aux-Dieux, une mage elfe et Haute Rectrice de l'Église Ravélienne, fut une figure de proue de l'expédition qui découvrit le Fragment Divin. Elle fut également la première personne capable d'interpréter ses messages."
 pic_age_of_witchkings_desc: "Forteresse du Domaine-Noir\n\nInitialement développée à partir des divagations d'Adelar síl na Whistlehill, la religion du Domaine-Noir commença à prendre racine lorsque ses écrits furent découverts à l'Ère des Rois-Sorciers. Il prêchait contre les dieux des autres religions et cherchait à établir un État magocratique mondial dirigé par des mages mortels et non par des divinités. L'union politique du Domaine-Noir serait menée par un puissant Roi-Sorcier avec 8 acolytes sous ses ordres, régnant depuis le Trône du Crâne. Les armées du Domaine-Noir reposent sur la nécromancie et les morts ressuscités."
 pic_age_of_artificers_desc: "Cuirassé de la Hiérarchie Gnomique\n\nAlors que l'Ère des Rois-Sorciers touche à sa fin, l'ingéniosité et la domination des Gnomes dans les domaines de la technologie et de la magie reprendront racine à Halann. La combinaison de la technologie et de la magie mènera à des révolutions technologiques et militaires qui changeront le monde."


