 idea_variation_act_556: "Culture Agricole"
 desc_idea_variation_act_556: "La production agricole a été maximisée en déplaçant l'attention des petites exploitations vers l'établissement de grandes plantations."
 idea_variation_act_557: "Loi sur l'École Navale"
 desc_idea_variation_act_557: "En établissant des écoles navales, nous pourrons améliorer la qualité de nos amiraux et de nos marins."
 idea_variation_act_558: "Loi sur l'Espionnage"
 desc_idea_variation_act_558: "En utilisant les dernières inventions, nous pouvons garder une longueur d'avance sur nos ennemis et rendre notre espionnage encore plus puissant."
 idea_variation_act_559: "Loi sur la Loyauté Nobiliaire"
 desc_idea_variation_act_559: "Nos espions veilleront à ce que nos nobles restent loyaux à la couronne, même en temps de troubles."
 idea_variation_act_560: "Loi sur l'Établissement du Conseil Privé"
 desc_idea_variation_act_560: "Être informé des événements au sein de l'État est vital pour tout souverain. En établissant un conseil privé, nous pourrons garder un œil sur notre peuple."
 idea_variation_act_561: "Loi sur le Soutien Étranger"
 desc_idea_variation_act_561: "Parfois, la meilleure façon de vaincre nos ennemis est de retourner leur propre peuple contre eux. Coûteux, mais sûr."
 idea_variation_act_562: "Loi sur les Déserteurs"
 desc_idea_variation_act_562: "Nous avons été bien trop indulgents envers les déserteurs par le passé. Désormais, nos agents veilleront à ce que les lâches subissent le sort qu'ils méritent."
 idea_variation_act_563: "Loi sur l'Enregistrement des Mercenaires"
 desc_idea_variation_act_563: "En gardant un registre des mercenaires dans notre pays, nous pouvons nous assurer que nous bénéficierons de leurs services quand nous en aurons le plus besoin."
 idea_variation_act_564: "Loi sur les Commissions Royales"
 desc_idea_variation_act_564: "Vérifier les comportements suspects au sein de l'administration peut être une bonne idée de temps en temps. La création de commissions royales contribuera certainement à réduire la corruption."
 idea_variation_act_565: "Édit d'Expulsion"
 desc_idea_variation_act_565: "La politique d'expulsion des éléments hérétiques indésirables du royaume garantira que la foi de nos loyaux sujets ne sera pas subvertie dans leurs interactions sociales avec ces éléments. Il leur est donc ordonné de partir et de ne jamais revenir."
 idea_variation_act_566: "Loi sur l'Aide Sociale"
 desc_idea_variation_act_566: "Les pauvres souffrent le plus en temps de troubles. Quelques petits dons aideront à soulager leur misère, et s'assureront que la populace ne prenne pas les torches et les fourches."
 idea_variation_act_567: "Loi sur la Découverte des Espions"
 desc_idea_variation_act_567: "Notre administration sera toujours une cible de choix pour les espions ennemis. Mais nous pouvons faire certaines choses pour leur rendre la vie beaucoup plus difficile."
 idea_variation_act_568: "Appliquer la Loi Religieuse"
 desc_idea_variation_act_568: "Regardons de beaucoup plus près nos écritures saintes pour distinguer les crimes et les peines pour notre société. Ce n'est que lorsqu'une société est gouvernée de manière vraiment pieuse que son peuple peut atteindre la véritable grandeur."
 idea_variation_act_569: "Légitimité Publique"
 desc_idea_variation_act_569: "Impliquer tous les gens de bonne éducation dans la gouvernance de notre pays réduira les tendances traîtresses."
 idea_variation_act_570: "Politique de Taxation des Vassaux"
 desc_idea_variation_act_570: "Assurer une position plus agressive dans la taxation des nations sujettes fournira un meilleur flux d'or vers nos coffres."
 idea_variation_act_571: "Loi sur le Timbre"
 desc_idea_variation_act_571: "Nous devrions activement imposer des taxes supplémentaires à nos établissements coloniaux."
 idea_variation_act_572: "Normes de Qualité des Armes"
 desc_idea_variation_act_572: "Nous devrions activement superviser la production d'armes pour nous assurer qu'elles répondent à nos hautes normes."
 idea_variation_act_573: "Loi sur l'Administration Coloniale"
 desc_idea_variation_act_573: "En fournissant un meilleur contrôle et une meilleure administration de notre effort colonial, nous pouvons assurer une meilleure concentration de nos colons pour le bien de la nation."
 idea_variation_act_574: "Loi sur la Tenue des Archives"
 desc_idea_variation_act_574: "Avec une loi exigeant que nos diplomates conservent tout enregistré pour que leurs collègues puissent le lire, nous pouvons être plus efficaces dans nos entreprises diplomatiques."
 idea_variation_act_575: "Politique d'Évaluation des Risques"
 desc_idea_variation_act_575: "Les opérations d'espionnage sont parfois entreprises sans pleinement apprécier les répercussions. En évaluant soigneusement les résultats possibles d'une ligne d'action potentielle, nous minimisons à la fois le risque et l'impact de l'échec."
 idea_variation_act_576: "Politique de Temporisation Calculée"
 desc_idea_variation_act_576: "Avec des promesses et des assurances de sécurité et de tolérance, nous pouvons convaincre les incroyants au sein de notre royaume de rester pacifiques et désarmés. Cela devrait au moins retarder temporairement la menace d'une guerre civile religieuse jusqu'à ce que nous soyons mieux équipés pour faire face à leur méchanceté et les ramener à la vraie foi."
 idea_variation_act_577: "Loi sur le Cabinet Noir"
 desc_idea_variation_act_577: "Nous devrions créer une agence gouvernementale dédiée chargée de tout ce qui concerne l'espionnage, la crypto-analyse et les opérations clandestines."
 idea_variation_act_578: "Échange d'Idées"
 desc_idea_variation_act_578: "En encourageant activement l'incorporation d'idées et de pratiques étrangères dans notre culture, nous pouvons faciliter la mise en œuvre de nouvelles idées à l'avenir."
 idea_variation_act_579: "Loi sur les Obligations des Vassaux"
 desc_idea_variation_act_579: "Fixer par la loi les obligations militaires et économiques précises que nos États clients ont envers nous."
 idea_variation_act_580: "Conseillers Étrangers"
 desc_idea_variation_act_580: "À partir de Vlad l'Empaleur, les postes à la cour étaient souvent attribués à des étrangers sans terres en Valachie. Cela réduisait la dépendance envers l'aristocratie locale."
 idea_variation_act_581: "Loi sur l'Intégration des Vassaux"
 desc_idea_variation_act_581: "Incorporer des terres étrangères dans notre pays est une affaire difficile et chronophage. En établissant une série de pratiques standard pour l'intégration, nous pouvons la faciliter."
 idea_variation_act_582: "Dominions d'Outre-Mer"
 desc_idea_variation_act_582: "Gouverner des terres lointaines est difficile, surtout quand ces terres sont séparées par un océan. En établissant des dominions gouvernés par des vice-rois locaux loyaux à la couronne, nous pouvons tirer le meilleur parti de ces terres."
 idea_variation_act_583: "Loi sur la Libération"
 desc_idea_variation_act_583: "Annoncer notre intention de libérer les sujets opprimés des tyrans étrangers afin qu'ils puissent jouir du privilège de notre propre règne éclairé."
 idea_variation_act_584: "Penseurs Visionnaires"
 desc_idea_variation_act_584: "Notre pays est un bastion de la pensée intellectuelle et nos universités produisent certains des penseurs les plus brillants et les plus visionnaires au monde."
 idea_variation_act_585: "Loi sur le Transport"
 desc_idea_variation_act_585: "Établir un système fixe de frais de transport pour les marchandises afin d'encourager l'exportation de biens précieux."
 idea_variation_act_586: "Administration Portuaire"
 desc_idea_variation_act_586: "Établir un office national pour l'administration et l'entretien de nos ports."
 idea_variation_act_587: "Convois d'Approvisionnement"
 desc_idea_variation_act_587: "S'assurer que nos possessions d'outre-mer ont un accès régulier aux approvisionnements de la mère patrie."
 idea_variation_act_588: "Statut des Monopoles"
 desc_idea_variation_act_588: "En promouvant le libre-échange et la libre circulation des marchandises entre les nations commerçantes, nous avons augmenté à la fois notre production et notre efficacité commerciale."
 idea_variation_act_589: "Loi sur le Recrutement"
 desc_idea_variation_act_589: "Imposer à tout homme valide sans aucun moyen de subsistance de s'enrôler pour le service naval provoquera sans doute une certaine controverse."
 idea_variation_act_590: "Système de Convois Navals"
 desc_idea_variation_act_590: "Un système de convoi pour les navires transportant de l'or ou d'autres biens exotiques a été adopté pour prévenir la piraterie."
 idea_variation_act_591: "Loi sur la Dissolution"
 desc_idea_variation_act_591: "Toutes les mesures ont été prises pour empêcher le roi d'exercer un contrôle absolu sur son royaume sans le consentement du Parlement."
 idea_variation_act_592: "La Flotte Est Notre Muraille de Bois"
 desc_idea_variation_act_592: "Je n'ai jamais dit que les Français ne viendraient pas, j'ai juste dit qu'ils ne viendraient pas par la mer."
 idea_variation_act_593: "Loi sur l'Importation"
 desc_idea_variation_act_593: "Des restrictions ont été imposées sur la quantité de marchandises pouvant être vendues ou importées de pays étrangers."
 idea_variation_act_594: "Expansion Coloniale"
 desc_idea_variation_act_594: "Un programme de réinstallation a été introduit pour augmenter la taille de nos colonies."
 idea_variation_act_595: "Négligence Bienveillante"
 desc_idea_variation_act_595: "Une certaine liberté politique a été accordée à nos colonies afin d'améliorer les relations."
 idea_variation_act_596: "Restrictions Coloniales"
 desc_idea_variation_act_596: "Des règles strictes ont été établies concernant le commerce et la production pour augmenter le contrôle sur nos colonies."
 idea_variation_act_597: "Infrastructure Navale"
 desc_idea_variation_act_597: "Nous sommes en mesure de maintenir une grande infrastructure navale pour soutenir plus de navires."
 idea_variation_act_598: "Coopération Diplomatique"
 desc_idea_variation_act_598: "En intensifiant la coopération avec nos voisins, nous pourrons adopter leurs avancées technologiques beaucoup plus rapidement."
 idea_variation_act_599: "Système Bancaire"
 desc_idea_variation_act_599: "Certains de nos commerçants ont déclaré qu'ils souhaitaient établir un système bancaire. Si nous les soutenons, cela ne leur profitera pas seulement à eux, mais aussi à nous."
 idea_variation_act_600: "Nouvelles Tactiques Navales"
 desc_idea_variation_act_600: "Nos amiraux peuvent être un peu peu orthodoxes avec leurs tactiques de temps en temps, mais le succès leur donne raison."
 idea_variation_act_601: "Politique de Connexions Commerciales"
 desc_idea_variation_act_601: "En utilisant les connexions de nos vieilles familles nobles, nous pouvons rendre la vie beaucoup plus facile à nos marchands."
 idea_variation_act_602: "Loi sur les Ambassades Nobiliaires"
 desc_idea_variation_act_602: "En envoyant des nobles avec nos expéditions à l'étranger, nous pourrons faire une impression considérable en terres étrangères."
 idea_variation_act_603: "Traditions Navales Nobiliaires"
 desc_idea_variation_act_603: "Nos nobles font partie intégrante de notre marine depuis un certain temps déjà. Leurs anciennes traditions et compétences seront très précieuses à l'avenir."
 idea_variation_act_604: "Loi sur le Secret Naval"
 desc_idea_variation_act_604: "Nous avons vu beaucoup de choses de ce Nouveau Monde étrange. Des choses que nos ennemis aimeraient certainement connaître. Désormais, toutes les affaires navales seront considérées comme des informations secrètes."
 idea_variation_act_605: "Production Rationalisée de Galères"
 desc_idea_variation_act_605: "Nos constructeurs de navires nous disent que beaucoup pourrait être accompli en termes d'efficacité quand il s'agit de la production de galères pour notre marine. En rationalisant et standardisant les processus de production et en veillant à ce que les chantiers navals ne soient jamais en manque d'approvisionnement, nous poserons une base solide pour notre pays en tant que grande puissance navale."
 idea_variation_act_606: "Édit sur la Qualité des Étoffes"
 desc_idea_variation_act_606: "Pour assurer une meilleure qualité des étoffes offertes sur le marché, nous déclarons que si l'étoffe offerte par un marchand n'est pas jugée de qualité satisfaisante à trois reprises distinctes, ledit marchand sera attaché à un poteau avec ladite étoffe attachée à lui en guise de punition."
 idea_variation_act_607: "Loi sur les Quotas de Production"
 desc_idea_variation_act_607: "Fixer et faire respecter des quotas de production plus élevés nous permettra simplement de gagner plus de revenus en produisant plus de biens."
 idea_variation_act_608: "Encouragement de la Marine Marchande"
 desc_idea_variation_act_608: "L'encouragement de l'expansion de la marine marchande privée nous permettra d'accroître notre influence commerciale à travers le monde."
 idea_variation_act_609: "Ambassades Commerciales"
 desc_idea_variation_act_609: "Nos ambassadeurs à l'étranger ne devraient pas seulement agir comme envoyés, ils devraient également être chargés de protéger et de promouvoir notre commerce. Ils devraient veiller à ce que tous les accords passés continuent d'être prolongés et honorés dans les cours étrangères et ne devraient pas hésiter à espionner nos concurrents afin de saboter leurs efforts."
 idea_variation_act_610: "Réseau de Comptoirs Commerciaux"
 desc_idea_variation_act_610: "En maintenant des comptoirs commerciaux dans les pays étrangers avec lesquels nous avons des liens commerciaux, nous pourrons contrôler leur commerce sans avoir à nous battre pour le territoire."
 idea_variation_act_611: "Politique de Neutralité"
 desc_idea_variation_act_611: "En évitant les alliances avec d'autres pays, nous nous assurons également que nous n'aurons pas à participer à leurs guerres futures, garantissant une paix durable pour la république."
 idea_variation_act_612: "Corps Diplomatique Professionnel"
 desc_idea_variation_act_612: "En employant des diplomates professionnels, et non pas seulement des personnes ayant reçu le rang d'ambassadeur en raison de leur sang, nous gagnons en efficacité."
 idea_variation_act_613: "Loi sur les Compagnies Coloniales"
 desc_idea_variation_act_613: "L'exploration est devenue rentable et nos marchands veulent atteindre plus loin que leur richesse individuelle ne le permet. En établissant des compagnies coloniales, nous pouvons exploiter leur capital pour explorer, s'étendre et exploiter."
 idea_variation_act_614: "Loi sur les Voies Maritimes Protégées"
 desc_idea_variation_act_614: "Nos navires transportant des marchandises commerciales à travers le monde bénéficient de routes établies par la nature des vents et des océans. En sécurisant ces voies, nous pouvons nous assurer que notre commerce est effectué de manière sûre et efficace."
 idea_variation_act_615: "Guildes Parrainées par la Religion"
 desc_idea_variation_act_615: "L'artisanat offre de nombreuses occasions de célébrer le spirituel, donnant à nos dirigeants religieux des raisons de soutenir ce travail. Nous aidons la manifestation du divin dans la création du quotidien."
 idea_variation_act_616: "Aumôniers de la Flotte"
 desc_idea_variation_act_616: "Les tempêtes déchaînées en haute mer peuvent mettre à l'épreuve la foi de tout marin, surtout celui voyageant dans un navire déchiré par la guerre. Les aumôniers militaires de la flotte aident nos recrues à maintenir l'espoir dans les temps d'adversité."
 idea_variation_act_617: "Diplomates Multilingues"
 desc_idea_variation_act_617: "S'assurer que nos diplomates sont instruits dans les langues des cours étrangères afin de faciliter la compréhension entre nous et les autres cultures."
 idea_variation_act_618: "Loi sur l'Assimilation des Indigènes"
 desc_idea_variation_act_618: "Encourager activement l'assimilation des tribus indigènes dans nos colonies."
 idea_variation_act_619: "Compréhension Culturelle"
 desc_idea_variation_act_619: "Notre nation a une compréhension considérable des coutumes et traditions des cultures étrangères, nous permettant de nous fondre dans leur société lorsque nécessaire."
 idea_variation_act_620: "Loi sur l'Aide Étrangère"
 desc_idea_variation_act_620: "L'aide étrangère, bien que certainement bonne pour notre réputation, peut aussi être un outil utile pour promouvoir nos agendas diplomatiques à l'étranger."
 idea_variation_act_621: "Unité Culturelle"
 desc_idea_variation_act_621: "En nous concentrant sur l'unité par la foi et les coutumes, nous pouvons faciliter l'assimilation des étrangers dans notre culture."
 idea_variation_act_622: "Chirurgiens de Flotte"
 desc_idea_variation_act_622: "Exiger que tous les navires de guerre au-dessus d'une certaine taille aient un chirurgien pour soigner les blessures et les maladies parmi l'équipage."
 idea_variation_act_623: "Ambassades d'Outre-Mer"
 desc_idea_variation_act_623: "Établir des ambassades dans les terres d'outre-mer pour faciliter la diplomatie avec les États lointains."
 idea_variation_act_624: "Cartographes Compétents"
 desc_idea_variation_act_624: "En recrutant uniquement les meilleurs cartographes pour faire nos cartes et nos cartes marines, nous pouvons augmenter le rayon d'action de nos commerçants et de nos colons."
 idea_variation_act_625: "Comptoirs Commerciaux Fortifiés"
 desc_idea_variation_act_625: "Établir des comptoirs commerciaux en terres étrangères est vital pour nos intérêts économiques, mais ils ont tendance à être exposés aux attaques de puissances étrangères et de locaux hostiles. En fournissant à chacun une petite garnison, nous pouvons réduire ce risque."
 idea_variation_act_626: "Loi sur l'Administration Intégrée"
 desc_idea_variation_act_626: "Intégrer nos États clients dans l'administration de l'État pour améliorer les revenus et simplifier la gouvernance."
 idea_variation_act_627: "Loi sur la Coopération"
 desc_idea_variation_act_627: "Encourager la coopération parmi nos commerçants afin qu'ils travaillent ensemble pour prendre le contrôle des routes commerciales lucratives."
 idea_variation_act_628: "Loi sur la Pleine Souveraineté"
 desc_idea_variation_act_628: "Garantir la souveraineté future et l'autonomie des États vassaux pour faciliter leur incorporation dans notre État."
 idea_variation_act_629: "Système de Taxation Provinciale"
 desc_idea_variation_act_629: "Nous avons établi un système permanent de taxation provinciale qui optimisera les gains pour le trésor."
 idea_variation_act_630: "Loi sur les Mines"
 desc_idea_variation_act_630: "À part une taxe minière, tous les aspects de l'exploitation minière sont gérés par des entreprises privées."
 idea_variation_act_631: "Loi sur les Spiritueux"
 desc_idea_variation_act_631: "Des réglementations et des droits de licence ont été introduits concernant la vente de gin."
 idea_variation_act_632: "Artillerie à Cheval"
 desc_idea_variation_act_632: "Avec de la coordination, les équipages peuvent rapidement dételer et tirer, puis atteler et s'éloigner. Cela crée une artillerie rapide à déplacer et rapide à tirer."
 idea_variation_act_633: "Loi sur la Neutralité Armée"
 desc_idea_variation_act_633: "Nos marchands ont le droit de commercer sans ingérence étrangère et nous protégerons ce droit."
 idea_variation_act_634: "Loi Anti-Contrebande"
 desc_idea_variation_act_634: "Avec l'utilisation de notre armée, nous pouvons réduire la quantité de contrebande, augmentant ainsi les revenus de l'État."
 idea_variation_act_635: "Loi sur les Marines Organisés"
 desc_idea_variation_act_635: "Nos navires de guerre sont équipés de marines compétents, les rendant plus résistants aux actions d'abordage ennemies."
 idea_variation_act_636: "Systèmes d'Approvisionnement Supérieurs"
 desc_idea_variation_act_636: "Approvisionner des troupes en terres étrangères n'est jamais facile. Heureusement, nous avons appris quelques astuces qui rendent cela beaucoup plus facile. Pour plus de détails, veuillez consulter Hearts of Iron III sur comment créer un simulateur logistique parfait."
 idea_variation_act_637: "Armes de Siège Modernes"
 desc_idea_variation_act_637: "Grâce à nos ingénieurs diligents, nous pouvons déployer des armes de siège toujours plus puissantes."
 idea_variation_act_638: "Fortifications Supérieures"
 desc_idea_variation_act_638: "Nous veillerons à ce que nos forteresses soient toujours construites et équipées avec les technologies les plus avancées."
 idea_variation_act_639: "Techniques Modernes de Production d'Armes à Feu"
 desc_idea_variation_act_639: "Les armes à feu sont devenues un atout vital pour nos armées. Nos dirigeants savent comment les utiliser à notre avantage, mais cela ne sert à rien si nous ne pouvons pas équiper nos unités."
 idea_variation_act_640: "Système de Garnison"
 desc_idea_variation_act_640: "Grâce à un système de garnison, nous pouvons nous assurer que les recrues sont affectées là où nous en avons le plus besoin."
 idea_variation_act_641: "Loi sur les Agents de Terrain"
 desc_idea_variation_act_641: "En employant des agents de terrain, nous aurons de meilleures chances de recueillir des renseignements militaires sur nos ennemis."
 idea_variation_act_642: "Loi Anti-Hérésie"
 desc_idea_variation_act_642: "Tout le monde doit toujours travailler contre les hérésies. Les hérésies sont punissables de mort !"
 idea_variation_act_643: "Loi sur le Zèle Militaire"
 desc_idea_variation_act_643: "Augmenter le nombre de prêtres dans les rangs de notre armée aidera à convaincre nos soldats que Dieu est de notre côté dans la guerre et qu'ils font l'œuvre de Dieu."
 idea_variation_act_644: "Lettres de Marque"
 desc_idea_variation_act_644: "En rédigeant des lettres de marque pour des capitaines privés entreprenants, ils renforceront le nombre de corsaires que nous pouvons employer."
 idea_variation_act_645: "Prêtres de Campagne et Livres de Prières des Soldats"
 desc_idea_variation_act_645: "Nous devons nous efforcer d'inculquer le zèle à nos soldats et les rendre disposés à se sacrifier pour notre sainte cause. À tout moment, nous devons nous assurer qu'il y a un grand nombre de prêtres pour veiller à la santé spirituelle de nos hommes sur le terrain, pour les guider dans le culte et pour s'occuper d'eux quand leur vie prend fin. Nous devons également nous assurer qu'ils ne sont jamais sans livres de prières ou tout autre matériel religieux qu'ils pourraient désirer pendant nos campagnes."
 idea_variation_act_646: "Loi sur la Plume et l'Épée"
 desc_idea_variation_act_646: "N'abandonnant ni le pouvoir des actes ni celui des mots, notre nation recrute à la fois de grands ambassadeurs et orateurs et la force militaire pour soutenir leurs arguments."
 idea_variation_act_647: "Loi sur la Défense Diplomatique"
 desc_idea_variation_act_647: "En utilisant nos diplomates pour réfuter les revendications hostiles sur nos terres, nous rendrons leur processus d'intégration beaucoup plus lent, et plus douloureux."
 idea_variation_act_648: "Organisation Locale de l'Armée"
 desc_idea_variation_act_648: "Nous devons réorganiser notre armée pour nous assurer que nos forces peuvent combattre efficacement quand et où c'est nécessaire."
 idea_variation_act_649: "Loi sur la Diplomatie Sourde"
 desc_idea_variation_act_649: "Parfois, les gens ont besoin d'un « cadeau » quand vous essayez de les persuader. En canalisant plus de nos ressources vers nos diplomates, nous pouvons plus facilement faire voir les choses à notre façon."
 idea_variation_act_650: "Aventuriers Engagés"
 desc_idea_variation_act_650: "La perspective de richesse et de prospérité a attiré de nombreux aventuriers vers les terres nouvellement découvertes. En engageant les plus capables, nous nous assurerons que leurs services seront toujours à notre disposition."
 idea_variation_act_651: "Loi sur l'Abolition des Tenures"
 desc_idea_variation_act_651: "Un montant fixe de compensation a été établi pour le monarque et divers types de tenures militaires et agricoles dues à la couronne ont été supprimés."
 idea_variation_act_652: "Garnisons Coloniales"
 desc_idea_variation_act_652: "En établissant des garnisons permanentes outre-mer, nous pouvons encourager la croissance de nos colonies."
 idea_variation_act_653: "Loi sur la Suprématie Navale"
 desc_idea_variation_act_653: "Un régime d'entraînement strict pour nos marins garantira que nos équipages comprennent comment mener le plus efficacement possible un blocus ou un embargo."
 idea_variation_act_654: "Navires Messagers"
 desc_idea_variation_act_654: "Créer un système de petits bateaux messagers pour transmettre les ordres de notre amirauté au reste de la flotte."
 idea_variation_act_655: "Loi sur la Formation Nautique"
 desc_idea_variation_act_655: "Assurer un haut niveau de formation pour nos officiers de marine afin qu'ils comprennent les principes vitaux de l'artillerie dans les batailles."
 idea_variation_act_656: "Capitaines Zélés"
 desc_idea_variation_act_656: "Choisir nos capitaines parmi des hommes de foi et de feu qui n'ont aucun scrupule à aborder les navires ennemis pour en découdre avec les païens."
 idea_variation_act_657: "Domaines Autonomes"
 desc_idea_variation_act_657: "Accorder un certain degré d'autonomie politique aux domaines de nos sujets nous donnera plus de marge de négociation pour extraire des impôts de leurs terres."
 idea_variation_act_658: "Chefs Inspirants"
 desc_idea_variation_act_658: "S'assurer que nos officiers sont des hommes de raison et de savoir qui peuvent inspirer les soldats ordinaires sur le champ de bataille."
 idea_variation_act_659: "Loi sur l'Inspection Navale"
 desc_idea_variation_act_659: "Créer un conseil d'inspection pour veiller au bien-être des marins ordinaires dans notre marine."
 idea_variation_act_660: "Loi sur la Préparation"
 desc_idea_variation_act_660: "Le savoir érudit nous dit que la guerre est inévitable, mais il peut aussi nous aider à comprendre quand elle est susceptible d'éclater afin que nous puissions nous y préparer."
 idea_variation_act_661: "Milices Locales"
 desc_idea_variation_act_661: "Fournir un soutien de l'État aux milices locales qui peuvent résister à l'incursion de troupes étrangères sur nos terres."
 idea_variation_act_662: "Commandement Unifié de l'Armée"
 desc_idea_variation_act_662: "Inclure les armées de nos États sujets dans notre propre commandement afin que tout le monde reçoive les mêmes ordres et qu'il n'y ait pas de confusion sur le champ de bataille."
 idea_variation_act_663: "Guerre de Guérilla"
 desc_idea_variation_act_663: "Créer des caches d'armes et d'approvisionnements pour permettre à la population locale de résister à l'invasion étrangère."
 idea_variation_act_664: "Navires Marchands Combattants"
 desc_idea_variation_act_664: "Nos marchands savent se défendre contre les pirates et autres adversaires."
