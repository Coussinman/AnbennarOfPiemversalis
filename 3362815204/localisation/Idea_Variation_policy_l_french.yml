l_french:
 idea_variation_act_1: "Ministère de la Marine"
 desc_idea_variation_act_1: "Le Ministère de la Marine s'occupe des affaires navales."
 idea_variation_act_2: "Ministère des Colonies"
 desc_idea_variation_act_2: "Le Ministère des Colonies s'occupe des affaires coloniales."
 idea_variation_act_3: "Loi sur les Ports"
 desc_idea_variation_act_3: "La Loi sur les Ports garantit la paix et l'ordre."
 idea_variation_act_4: "Ministre des Colonies"
 desc_idea_variation_act_4: "Le Ministre des Colonies parcourt les colonies et est chargé d'en découvrir de nouvelles."
 idea_variation_act_5: "Directive d'Intégration"
 desc_idea_variation_act_5: "La Directive d'Intégration nous permet d'intégrer plus rapidement les terres étrangères à notre royaume."
 idea_variation_act_6: "Contrats Mercenaires Standardisés"
 desc_idea_variation_act_6: "Les Contrats Mercenaires Standardisés nous aident à réduire l'entretien que nous devons verser à nos mercenaires."
 idea_variation_act_7: "Planification de la Production"
 desc_idea_variation_act_7: "En planifiant notre production, nous pouvons anticiper les pertes futures et les compenser avant qu'elles ne surviennent."
 idea_variation_act_8: "Département de la Recherche"
 desc_idea_variation_act_8: "Le Département de la Recherche s'occupe du progrès technique."
 idea_variation_act_9: "Juridiction Royale"
 desc_idea_variation_act_9: "La Juridiction Royale améliore l'acceptation de notre monarque."
 idea_variation_act_10: "Droits des Minorités"
 desc_idea_variation_act_10: "Les Droits des Minorités unissent les différentes cultures."
 idea_variation_act_11: "Loi sur le Mercantilisme"
 desc_idea_variation_act_11: "Le mercantilisme nous aide à maintenir les flux d'argent."
 idea_variation_act_12: "Conventions de Guerre"
 desc_idea_variation_act_12: "Par la protection des innocents en terres étrangères, les étrangers sont moins hostiles envers nous."
 idea_variation_act_13: "Loi sur le Droit à l'Éducation"
 desc_idea_variation_act_13: "La Loi sur le Droit à l'Éducation nous garantit une population instruite, bien plus utile qu'une population ignorante."
 idea_variation_act_14: "Loi sur la Production de Guerre"
 desc_idea_variation_act_14: "La Loi sur la Production de Guerre améliore notre capacité à produire des biens essentiels."
 idea_variation_act_15: "Loi Constitutionnelle"
 desc_idea_variation_act_15: "Une constitution garantit souvent certains droits pour apaiser le peuple. Toutefois, si vous tentez de les lui retirer, il ne sera pas satisfait."
 idea_variation_act_16: "Doctrine Juridictionnelle"
 desc_idea_variation_act_16: "La juridiction identifie les similitudes entre deux pays et favorise ainsi leur compréhension mutuelle."
 idea_variation_act_17: "Loi sur l'Avancement Technique"
 desc_idea_variation_act_17: "La Loi sur l'Avancement Technique améliore les capacités de notre économie et de nos soldats."
 idea_variation_act_18: "Loi sur les Routes Commerciales"
 desc_idea_variation_act_18: "Les routes commerciales sont des voies lucratives où circule le commerce."
 idea_variation_act_19: "Loi sur l'Amélioration des Chantiers Navals"
 desc_idea_variation_act_19: "Les Chantiers Navals Améliorés augmentent la durabilité de nos navires."
 idea_variation_act_20: "École d'État-Major"
 desc_idea_variation_act_20: "L'École d'État-Major améliore nos compétences théoriques en matière militaire."
 idea_variation_act_21: "Programme National de Construction"
 desc_idea_variation_act_21: "Le Programme National de Construction priorise les projets de construction importants."
 idea_variation_act_22: "Programme Impérial de Construction"
 desc_idea_variation_act_22: "Le Programme Impérial de Construction vise à rehausser le prestige de l'État par de magnifiques édifices."
 idea_variation_act_23: "Loi sur les Subventions"
 desc_idea_variation_act_23: "Les subventions nationales peuvent être essentielles pour maintenir l'économie en marche."
 idea_variation_act_24: "Matériaux de Qualité"
 desc_idea_variation_act_24: "Les matériaux de qualité sont essentiels pour construire des forteresses durables."
 idea_variation_act_25: "Soins Médicaux au Front"
 desc_idea_variation_act_25: "Les Soins Médicaux au Front augmentent les chances de survie de nos soldats."
 idea_variation_act_26: "Loi sur la Formation Médicale"
 desc_idea_variation_act_26: "La Loi sur la Formation Médicale garantit que nous aurons toujours suffisamment de médecins."
 idea_variation_act_27: "Loi sur les Médecins d'Entreprise"
 desc_idea_variation_act_27: "La Loi sur les Médecins d'Entreprise nous aide à améliorer les soins médicaux dans les manufactures."
 idea_variation_act_28: "Loi sur la Prévention des Épidémies"
 desc_idea_variation_act_28: "La Loi sur la Prévention des Épidémies vise à combattre toutes les formes d'épidémie en améliorant la santé et l'hygiène du peuple."
 idea_variation_act_29: "Loi sur l'Aide Médicale"
 desc_idea_variation_act_29: "L'aide médicale dans les territoires nouvellement conquis nous aide à être acceptés."
 idea_variation_act_30: "Loi sur les Médecins Coloniaux"
 desc_idea_variation_act_30: "Les médecins coloniaux combattront les maladies dans les colonies et peuvent aider à intégrer les autochtones."
 idea_variation_act_31: "Convois de Bagages"
 desc_idea_variation_act_31: "Les convois de bagages qui suivent notre armée réduisent nos pertes."
 idea_variation_act_32: "Loi sur l'Équilibre des Provisions Navales"
 desc_idea_variation_act_32: "Il est primordial de surveiller son alimentation lors des longs voyages."
 idea_variation_act_33: "Endoctrinement"
 desc_idea_variation_act_33: "L'endoctrinement des jeunes augmente l'acceptation de notre règne."
 idea_variation_act_34: "Loi sur l'Obligation d'Adaptation"
 desc_idea_variation_act_34: "Les étrangers sont tenus de s'adapter."
 idea_variation_act_35: "Département de la Propagande"
 desc_idea_variation_act_35: "Le Département de la Propagande s'occupe de notre réputation."
 idea_variation_act_36: "Loi sur le Contrôle Social"
 desc_idea_variation_act_36: "Nous contrôlons toujours notre société en termes de loyauté."
 idea_variation_act_37: "Conscription Forcée"
 desc_idea_variation_act_37: "Si nécessaire, nous forcerons tout le monde à combattre pour nous."
 idea_variation_act_37_1: "Conscription Forcée"
 desc_idea_variation_act_37_1: "Si nécessaire, nous forcerons tout le monde à combattre pour nous."
 idea_variation_act_37_2: "Conscription Forcée"
 desc_idea_variation_act_37_2: "Si nécessaire, nous forcerons tout le monde à combattre pour nous."
 idea_variation_act_37_3: "Conscription Forcée"
 desc_idea_variation_act_37_3: "Si nécessaire, nous forcerons tout le monde à combattre pour nous."
 idea_variation_act_38: "Loi sur l'Économie Planifiée"
 desc_idea_variation_act_38: "Par la planification, nous pouvons développer notre économie plus rapidement."
 idea_variation_act_39: "Doctrine de Prétention au Statut de Grande Puissance"
 desc_idea_variation_act_39: "Nous sommes toujours convaincus d'être une grande puissance."
 idea_variation_act_40: "Doctrine de la Vague Humaine"
 desc_idea_variation_act_40: "Dans les temps difficiles, peu nous importe combien meurent sur le champ de bataille, pourvu que nous l'emportions."
 idea_variation_act_41: "Loi sur le Commerce Colonial"
 desc_idea_variation_act_41: "Nous avons besoin de plus de marchands pour nous adapter à la nouvelle situation commerciale dans les colonies."
 idea_variation_act_42: "Loi sur la Liberté d'Expression dans les Colonies"
 desc_idea_variation_act_42: "La liberté d'expression règne dans les colonies."
 idea_variation_act_43: "Exploitation Coloniale"
 desc_idea_variation_act_43: "Nous tenterons de gagner autant d'argent que possible."
 idea_variation_act_44: "Doctrine de Guerre Coloniale Asymétrique"
 desc_idea_variation_act_44: "Nous nuirons à nos rivaux coloniaux en employant des corsaires."
 idea_variation_act_45: "Doctrine de Base de Pouvoir Coloniale"
 desc_idea_variation_act_45: "Nous avons développé des bases dans et autour de nos colonies."
 idea_variation_act_46: "Loi sur la Terre Promise"
 desc_idea_variation_act_46: "Notre propagande vante sans cesse la grandeur des colonies. Elles attireront assurément du monde."
 idea_variation_act_47: "Loi sur l'Expansion Coloniale"
 desc_idea_variation_act_47: "Nous voulons nous étendre. Nous financerons des colons supplémentaires."
 idea_variation_act_48: "Loi sur la Pacification des Nouvelles Terres"
 desc_idea_variation_act_48: "Par le maintien de bases dans les terres récemment conquises, nous augmentons l'acceptation de notre règne."
 idea_variation_act_49: "Doctrine de Promotion Culturelle"
 desc_idea_variation_act_49: "Notre propagande vante notre culture en permanence."
 idea_variation_act_50: "Doctrine de Victoire Sociale"
 desc_idea_variation_act_50: "Notre société est très attractive. Notre État en profitera également."
 idea_variation_act_51: "Doctrine du Combat Côte à Côte"
 desc_idea_variation_act_51: "Il existe une grande solidarité dans notre société."
 idea_variation_act_51_1: "Doctrine du Combat Côte à Côte"
 desc_idea_variation_act_51_1: "Il existe une grande solidarité dans notre société."
 idea_variation_act_51_2: "Doctrine du Combat Côte à Côte"
 desc_idea_variation_act_51_2: "Il existe une grande solidarité dans notre société."
 idea_variation_act_51_3: "Doctrine du Combat Côte à Côte"
 desc_idea_variation_act_51_3: "Il existe une grande solidarité dans notre société."
 idea_variation_act_52: "Loi sur les Tactiques de Combat Étrangères"
 desc_idea_variation_act_52: "Nous apprendrons des tactiques de combat étrangères et les emploierons peut-être aussi."
 idea_variation_act_53: "Loi sur l'Assimilation Humaniste"
 desc_idea_variation_act_53: "Nous assimilons les peuples de manière humaniste."
 idea_variation_act_54: "Société Pieuse"
 desc_idea_variation_act_54: "Notre société est très pieuse. L'Église appréciera cela."
 idea_variation_act_55: "Propagande de Guerre"
 desc_idea_variation_act_55: "Notre société nous soutiendra indéfiniment en temps de guerre."
 idea_variation_act_56: "Société Dévouée"
 desc_idea_variation_act_56: "Notre société se sent redevable envers notre État."
 idea_variation_act_57: "Société Belliciste"
 desc_idea_variation_act_57: "Notre société est belliciste."
 idea_variation_act_58: "Société Nautique"
 desc_idea_variation_act_58: "Notre société est passionnée par la marine."
 idea_variation_act_59: "Culte Monarchique"
 desc_idea_variation_act_59: "Le peuple aime le monarque."
 idea_variation_act_60: "Propagande de Défense Nationale"
 desc_idea_variation_act_60: "La volonté de nos hommes de défendre le pays est sans limites."
 idea_variation_act_61: "Doctrine de Fierté Nationale"
 desc_idea_variation_act_61: "Nos hommes font la fierté de l'État et ils le savent."
 idea_variation_act_62: "Propagande Outre-Mer"
 desc_idea_variation_act_62: "Notre propagande affecte des pays très éloignés de nous."
 idea_variation_act_63: "Programme de Flotte Publique"
 desc_idea_variation_act_63: "L'État a décidé d'adopter un programme de flotte."
 idea_variation_act_64: "Loi sur les Petites Améliorations"
 desc_idea_variation_act_64: "Par de nombreuses petites améliorations, nous pouvons grandement augmenter l'efficacité de notre marine."
 idea_variation_act_65: "Doctrine de Défense des Bases Navales"
 desc_idea_variation_act_65: "Nous devons être capables de défendre nos bases navales contre les attaques par voie terrestre."
 idea_variation_act_66: "Loi sur la Protection des Marchands"
 desc_idea_variation_act_66: "Les marchands pourchassés peuvent trouver refuge dans nos bases."
 idea_variation_act_67: "Loi sur l'État-Major : Priorité Marine"
 desc_idea_variation_act_67: "L'état-major a reçu l'ordre de se concentrer sur la formation de nouveaux amiraux."
 idea_variation_act_68: "Généraux Fiers"
 desc_idea_variation_act_68: "Nos généraux sont fiers de leur pays."
 idea_variation_act_69: "Terre Brûlée"
 desc_idea_variation_act_69: "La tactique de la terre brûlée améliore nos capacités défensives."
 idea_variation_act_70: "Persévérance Générale"
 desc_idea_variation_act_70: "Nos hommes ne se rendront pas."
 idea_variation_act_71: "Enthousiasme Guerrier"
 desc_idea_variation_act_71: "L'enthousiasme guerrier est intact."
 idea_variation_act_72: "Loi sur le Travail pour la Guerre"
 desc_idea_variation_act_72: "Tout le monde travaille pour gagner la guerre."
 idea_variation_act_73: "Traditions Républicaines"
 desc_idea_variation_act_73: "Une société vivante renforce notre tradition républicaine."
 idea_variation_act_74: "Loi sur la Fidélité à l'État"
 desc_idea_variation_act_74: "Notre société est fidèle à notre État."
 idea_variation_act_75: "Loi sur les Mercenaires Impériaux"
 desc_idea_variation_act_75: "Avec un empire de cette taille, nous devons pouvoir lever davantage de mercenaires."
 idea_variation_act_76: "Loi sur la Dévotion Divine"
 desc_idea_variation_act_76: "La dévotion divine à combattre pour sa terre et son roi inspire notre peuple."
 idea_variation_act_76_1: "Loi sur la Dévotion Divine"
 desc_idea_variation_act_76_1: "La dévotion divine à combattre pour sa terre et son roi inspire notre peuple."
 idea_variation_act_76_2: "Loi sur la Dévotion Divine"
 desc_idea_variation_act_76_2: "La dévotion divine à combattre pour sa terre et son roi inspire notre peuple."
 idea_variation_act_76_3: "Loi sur la Dévotion Divine"
 desc_idea_variation_act_76_3: "La dévotion divine à combattre pour sa terre et son roi inspire notre peuple."
 idea_variation_act_77: "Loi sur l'Extension Impériale"
 desc_idea_variation_act_77: "Notre objectif d'agrandir le royaume continuellement nous a rendus expérimentés dans l'intégration de nouvelles terres."
 idea_variation_act_78: "Quête Impériale de Puissance"
 desc_idea_variation_act_78: "En tant qu'empire, nous avons besoin d'une grande armée et d'une grande marine."
 idea_variation_act_79: "Loi sur la Diplomatie Impériale"
 desc_idea_variation_act_79: "En tant qu'empire, nous pouvons faire des choses que d'autres pays ne peuvent pas faire et nous en tirer."
 idea_variation_act_80: "Loi sur l'Influence Impériale"
 desc_idea_variation_act_80: "Par notre seule puissance, nous jouissons d'une grande influence politique."
 idea_variation_act_81: "Loi sur l'École Offensive"
 desc_idea_variation_act_81: "Notre état-major est grandement influencé par l'école offensive."
 idea_variation_act_82: "Loi sur l'École de la Qualité des Armes"
 desc_idea_variation_act_82: "Notre état-major est grandement influencé par l'école de la qualité des armes."
 idea_variation_act_83: "Loi sur la Pénétration Sociale"
 desc_idea_variation_act_83: "L'acceptation de notre état-major dans la société est immense."
 idea_variation_act_84: "Loi sur les Manœuvres Continues"
 desc_idea_variation_act_84: "Nous effectuons toujours des manœuvres pour améliorer nos capacités."
 idea_variation_act_85: "Loi sur l'Approvisionnement Rapide"
 desc_idea_variation_act_85: "Un approvisionnement rapide peut décider d'une bataille. L'état-major le sait bien."
 idea_variation_act_86: "Loi sur la Formation Intensive à l'Armement"
 desc_idea_variation_act_86: "Nos troupes doivent être formées à tous les types d'armement. Cela améliorera considérablement leur qualité."
 idea_variation_act_87: "Administration Militaire Efficace"
 desc_idea_variation_act_87: "Une administration militaire efficace réduira considérablement notre entretien."
 idea_variation_act_88: "Ministère de la Défense"
 desc_idea_variation_act_88: "Le Ministère de la Défense s'occupe des questions de défense nationale."
 idea_variation_act_89: "Marins Professionnels"
 desc_idea_variation_act_89: "Nous avons de nombreux marins professionnels."
 idea_variation_act_89_1: "Marins Professionnels"
 desc_idea_variation_act_89_1: "Nous avons de nombreux marins professionnels."
 idea_variation_act_89_2: "Marins Professionnels"
 desc_idea_variation_act_89_2: "Nous avons de nombreux marins professionnels."
 idea_variation_act_89_3: "Marins Professionnels"
 desc_idea_variation_act_89_3: "Nous avons de nombreux marins professionnels."
 idea_variation_act_90: "Loi sur le Casus Belli"
 desc_idea_variation_act_90: "Nos capacités à justifier une guerre sont incroyables grâce à la tradition de notre armée."
 idea_variation_act_91: "Tradition Mercenaire"
 desc_idea_variation_act_91: "Notre pays s'est toujours appuyé sur les mercenaires."
 idea_variation_act_92: "Loi sur le Butin de Guerre"
 desc_idea_variation_act_92: "Il est important de continuer à investir le butin de guerre."
 idea_variation_act_93: "Loi sur l'Innovation Mercenaire"
 desc_idea_variation_act_93: "Nos mercenaires nous apportent un point de vue différent sur bien des choses. Cela favorise vraiment notre pensée innovante."
 idea_variation_act_94: "Loi sur l'Intégration des Mercenaires"
 desc_idea_variation_act_94: "Les mercenaires de notre armée sont si bien intégrés qu'on pourrait oublier qu'ils sont mercenaires."
 idea_variation_act_95: "Loi sur les Contrats Mercenaires"
 desc_idea_variation_act_95: "Les contrats mercenaires à long terme réduisent nos coûts."
 idea_variation_act_96: "Négociateurs Mercenaires"
 desc_idea_variation_act_96: "Les négociateurs mercenaires peuvent être bénéfiques pour le royaume."
 idea_variation_act_97: "Loi sur la Défense du Foyer"
 desc_idea_variation_act_97: "Nos hommes combattent pour défendre leurs foyers."
 idea_variation_act_98: "Loi sur le Service dans les Bases Navales"
 desc_idea_variation_act_98: "Le service dans les bases navales est bénéfique pour la formation de nos marins."
 idea_variation_act_99: "Loi sur la Gestion des Travailleurs"
 desc_idea_variation_act_99: "Par une gestion spécifique de nos travailleurs, nous pouvons mobiliser plus d'hommes pour l'armée."
 idea_variation_act_100: "Loi sur le Capitalisme de l'Armement"
 desc_idea_variation_act_100: "Celui qui produit les meilleures armes obtiendra le contrat."
 idea_variation_act_101: "Loi sur les Forteresses Modernes"
 desc_idea_variation_act_101: "Nos forteresses sont toujours à la pointe."
 idea_variation_act_102: "Doctrine de l'Équipement de Siège Moderne"
 desc_idea_variation_act_102: "Avec l'amélioration générale des forteresses, nous devons développer un équipement de siège moderne."
 idea_variation_act_103: "Loi sur la Qualité de l'Armée"
 desc_idea_variation_act_103: "Notre armée n'est que qualité."
 idea_variation_act_104: "Loi sur les Biens Stratégiques"
 desc_idea_variation_act_104: "La production de biens stratégiques est la chose la plus importante et a la priorité."
 idea_variation_act_105: "Loi sur les Obligations de Guerre"
 desc_idea_variation_act_105: "Parfois, il faut s'endetter en temps de guerre. Mais nos lois réduiront alors nos intérêts."
 idea_variation_act_106: "Loi sur les Manufactures de Qualité"
 desc_idea_variation_act_106: "Nos manufactures sont les meilleures du monde connu."
 idea_variation_act_107: "Canons de Forteresse"
 desc_idea_variation_act_107: "Nous équiperons nos forteresses de canons. Cela améliorera grandement leur capacité défensive."
 idea_variation_act_108: "Doctrine des Forteresses"
 desc_idea_variation_act_108: "Notre expérience des forteresses nous aide à les gérer très efficacement."
 idea_variation_act_109: "Loi sur l'École Défensive"
 desc_idea_variation_act_109: "Notre état-major est grandement influencé par l'école défensive."
 idea_variation_act_110: "Doctrine de la Famine"
 desc_idea_variation_act_110: "Nous veillerons à ce que l'ennemi meure de faim sur nos terres tandis que nous conservons les provisions dans nos forteresses."
 idea_variation_act_111: "Inclusion Coloniale"
 desc_idea_variation_act_111: "Par l'intégration de l'administration coloniale, nous pouvons diminuer nos propres dépenses administratives."
 idea_variation_act_112: "Liberté Religieuse"
 desc_idea_variation_act_112: "Comme nous garantissons la liberté religieuse dans nos colonies, nous devenons plus attractifs pour tous."
 idea_variation_act_113: "Plan de Relance Colonial"
 desc_idea_variation_act_113: "Les investissements à long terme porteront leurs fruits dans nos colonies."
 idea_variation_act_114: "Enthousiasme Colonial"
 desc_idea_variation_act_114: "Nos colonies ont une excellente réputation. Prendre la mer n'a jamais été aussi attrayant."
 idea_variation_act_115: "Flotte Coloniale"
 desc_idea_variation_act_115: "Nous avons besoin d'une grande flotte coloniale pour protéger nos colonies."
 idea_variation_act_116: "Commission d'Enregistrement"
 desc_idea_variation_act_116: "Par l'enregistrement, nous pouvons éviter les famines dans nos colonies."
 idea_variation_act_117: "Loi sur la Colonisation de Masse"
 desc_idea_variation_act_117: "Nous nous concentrons sur l'acquisition du plus de terres possible."
 idea_variation_act_118: "Programme de Construction Colonial"
 desc_idea_variation_act_118: "Avoir un programme de construction colonial nous permettra d'utiliser nos ressources le plus efficacement possible."
 idea_variation_act_119: "Colonie Pénitentiaire"
 desc_idea_variation_act_119: "Nous enverrons les indésirables dans les colonies."
 idea_variation_act_120: "Loi Anti-Corruption Coloniale"
 desc_idea_variation_act_120: "Nous avons établi un système administratif très résistant à la corruption."
 idea_variation_act_121: "Conseillers Coloniaux"
 desc_idea_variation_act_121: "Il y a des gens dans les colonies qui pourraient être utiles. Nous devrions les laisser nous conseiller."
 idea_variation_act_122: "Armée Coloniale"
 desc_idea_variation_act_122: "Nous avons besoin d'une armée assez grande pour défendre à la fois notre patrie et nos colonies."
 idea_variation_act_123: "Mercenaires Coloniaux"
 desc_idea_variation_act_123: "Par notre expansion coloniale, notre bassin potentiel de mercenaires augmentera considérablement."
 idea_variation_act_124: "Armes d'Outre-Mer"
 desc_idea_variation_act_124: "Les approvisionnements en armes depuis l'outre-mer nous permettront de compenser nos pertes plus rapidement qu'auparavant."
 idea_variation_act_125: "Nécessité des Forteresses"
 desc_idea_variation_act_125: "Il sera essentiel de fortifier nos colonies."
 idea_variation_act_126: "Loi sur les Colonies en Guerre"
 desc_idea_variation_act_126: "Lorsque nous sommes en guerre, les colonies devront prendre leur part dans la victoire."
 idea_variation_act_127: "Doctrine des Enclaves"
 desc_idea_variation_act_127: "Notre administration peut maintenir plus d'États légitimés."
 idea_variation_act_128: "Doctrine de Coopération Culturelle"
 desc_idea_variation_act_128: "Par la coopération culturelle, nous pouvons améliorer l'administration de nos terres d'outre-mer."
 idea_variation_act_129: "Loi sur l'Administration Innovante"
 desc_idea_variation_act_129: "Par une administration innovante, nous stimulerons la qualité de notre administration dans son ensemble."
 idea_variation_act_130: "Diplomatie Religieuse"
