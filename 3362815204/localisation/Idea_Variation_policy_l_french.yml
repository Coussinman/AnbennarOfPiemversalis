 desc_idea_variation_act_506: "En attribuant des diplômes de capitaine, nous pouvons être sûrs que nos chefs navals sont compétents."
 idea_variation_act_507: "Grandes Manœuvres"
 desc_idea_variation_act_507: "Les grandes manœuvres nous aident à former une armée formidable."
 idea_variation_act_508: "Expansion des Navires Lourds"
 desc_idea_variation_act_508: "En élargissant nos flottes, nous créerons de nombreux emplois."
 idea_variation_act_509: "Expansion des Navires Marchands"
 desc_idea_variation_act_509: "Nous étendrons notre flotte marchande."
 idea_variation_act_510: "Expansion des Galères"
 desc_idea_variation_act_510: "Nous montrerons notre présence en construisant une flotte de galères."
 idea_variation_act_510_1: "Expansion des Galères"
 desc_idea_variation_act_510_1: "Nous montrerons notre présence en construisant une flotte de galères."
 idea_variation_act_510_2: "Expansion des Galères"
 desc_idea_variation_act_510_2: "Nous montrerons notre présence en construisant une flotte de galères."
 idea_variation_act_510_3: "Expansion des Galères"
 desc_idea_variation_act_510_3: "Nous montrerons notre présence en construisant une flotte de galères."
 idea_variation_act_511: "Auditeurs"
 desc_idea_variation_act_511: "En employant des auditeurs, nous garderons un œil sur ce que font nos nations coloniales."
 idea_variation_act_512: "Assimilation Coloniale"
 desc_idea_variation_act_512: "Nous ferons tout pour assimiler les indigènes."
 idea_variation_act_513: "Culture Dominante"
 desc_idea_variation_act_513: "Notre culture montrera la voie."
 idea_variation_act_514: "Propagande des États"
 desc_idea_variation_act_514: "Notre propagande dira à notre peuple que certains États nous appartiennent de droit."
 idea_variation_act_515: "Expansion des Bases Navales"
 desc_idea_variation_act_515: "Nous étendrons nos bases navales."
 idea_variation_act_516: "Territoire Impérial"
 desc_idea_variation_act_516: "Un empire a besoin de beaucoup de territoire."
 idea_variation_act_517: "Centre du Nationalisme"
 desc_idea_variation_act_517: "Par des provinces très loyales, nous pouvons augmenter notre nombre de recrues."
 idea_variation_act_517_1: "Centre du Nationalisme"
 desc_idea_variation_act_517_1: "Par des provinces très loyales, nous pouvons augmenter notre nombre de recrues."
 idea_variation_act_517_2: "Centre du Nationalisme"
 desc_idea_variation_act_517_2: "Par des provinces très loyales, nous pouvons augmenter notre nombre de recrues."
 idea_variation_act_517_3: "Centre du Nationalisme"
 desc_idea_variation_act_517_3: "Par des provinces très loyales, nous pouvons augmenter notre nombre de recrues."
 idea_variation_act_518: "Grande Armée Permanente"
 desc_idea_variation_act_518: "Il est plus facile pour un État centraliste de maintenir une grande armée."
 idea_variation_act_519: "Organisation de l'État-Major"
 desc_idea_variation_act_519: "Notre état-major a une grande influence dans l'entretien des forts, de l'armée et de la flotte."
 idea_variation_act_520: "Point Focal Mercenaire Central"
 desc_idea_variation_act_520: "Les points focaux augmenteront notre capacité à trouver des mercenaires pour notre armée."
 idea_variation_act_521: "Recrutement Central"
 desc_idea_variation_act_521: "Les stations de recrutement centrales nous garantiront de nouvelles recrues."
 idea_variation_act_522: "Arsenaux Centraux"
 desc_idea_variation_act_522: "Les arsenaux centraux seront bénéfiques en temps de guerre."
 idea_variation_act_523: "Construction Centrale de Forteresses"
 desc_idea_variation_act_523: "Nous construirons les meilleures forteresses."
 idea_variation_act_524: "Production d'Armes"
 desc_idea_variation_act_524: "La production d'armes est importante pour le succès de la guerre."
 idea_variation_act_525: "Tactiques Centrales"
 desc_idea_variation_act_525: "En appliquant de bonnes tactiques, nous pouvons atteindre nos objectifs plus facilement."
 idea_variation_act_526: "Militarisme Encouragé"
 desc_idea_variation_act_526: "Nous encouragerons le militarisme et ainsi notre armée ne perdra jamais son attrait."
 idea_variation_act_527: "Donnez-leur un Pouce"
 desc_idea_variation_act_527: "Et ils prendront un kilomètre."
 idea_variation_act_528: "Investissement Diplomatique"
 desc_idea_variation_act_528: "Nous resterons en contact étroit avec tout le monde."
 idea_variation_act_529: "Diversité Diplomatique"
 desc_idea_variation_act_529: "Notre diplomatie fonctionnera partout."
 idea_variation_act_530: "Offensive des Conseillers"
 desc_idea_variation_act_530: "Nous ferons tout pour obtenir des conseillers compétents."
 idea_variation_act_531: "Défenseurs Locaux"
 desc_idea_variation_act_531: "Nous utiliserons des troupes locales pour défendre les cités."
 idea_variation_act_532: "Intérêts Commerciaux Divers"
 desc_idea_variation_act_532: "En raison de nos intérêts divers, nous devons diviser nos ressources."
 idea_variation_act_533: "Vastes Colonies"
 desc_idea_variation_act_533: "En augmentant le nombre de nos colonies, la croissance en souffrira, mais nous pourrons revendiquer plus de territoire."
 idea_variation_act_534: "L'Expérience est Atout"
 desc_idea_variation_act_534: "Nous utiliserons l'expérience de nos capitaines ainsi que celle de nos rivaux."
 idea_variation_act_535: "Armement Décentralisé"
 desc_idea_variation_act_535: "Nous produirons des armes partout dans le pays."
 idea_variation_act_536: "Recrutement Décentralisé"
 desc_idea_variation_act_536: "Nous trouverons plus de recrues si nous sommes présents dans chaque comté."
 idea_variation_act_537: "Combattants Solitaires"
 desc_idea_variation_act_537: "Nos navires lourds continueront à combattre même encerclés."
 idea_variation_act_538: "Protection du Commerce"
 desc_idea_variation_act_538: "Nous aurons besoin de chaque navire pour protéger notre commerce."
 idea_variation_act_539: "Petits Ports"
 desc_idea_variation_act_539: "En dispersant notre flotte, nous sommes plus à l'abri des raids."
 idea_variation_act_540: "Découvrir le Nouveau Monde !"
 desc_idea_variation_act_540: "En trouvant plus de régions coloniales, nous serons plus rapides que nos rivaux."
 idea_variation_act_541: "Accepter, puis Assimiler"
 desc_idea_variation_act_541: "Avant d'assimiler les cultures étrangères, nous devrons d'abord les accepter."
 idea_variation_act_542: "Clubs d'État Décentralisés"
 desc_idea_variation_act_542: "Les clubs d'État signaleront quiconque veut miner notre règne."
 idea_variation_act_543: "Propagande Décentralisée"
 desc_idea_variation_act_543: "Notre propagande est aussi rusée que possible."
 idea_variation_act_544: "Nombreuses Bases"
 desc_idea_variation_act_544: "Il est important de maintenir autant de bases navales que possible."
 idea_variation_act_545: "Taxation Décentralisée"
 desc_idea_variation_act_545: "En organisant des percepteurs régionaux, nous pouvons augmenter notre efficacité."
 idea_variation_act_546: "Petits Groupes Nationalistes"
 desc_idea_variation_act_546: "En soutenant de petits groupes nationalistes dans nos provinces, nos ennemis pourraient avoir du mal à intégrer ces provinces."
 idea_variation_act_547: "Casernement Décentralisé"
 desc_idea_variation_act_547: "En casernant nos troupes dans différents endroits, il nous sera plus facile de les approvisionner."
 idea_variation_act_548: "Recrutement par l'État-Major"
 desc_idea_variation_act_548: "L'état-major sera fortement impliqué dans le recrutement de nouveaux hommes."
 idea_variation_act_549: "Mercenaires Étrangers"
 desc_idea_variation_act_549: "Les mercenaires étrangers épargneront nos propres capacités."
 idea_variation_act_550: "Armée Motivée"
 desc_idea_variation_act_550: "Les conscrits sont beaucoup plus motivés que les mercenaires."
 idea_variation_act_551: "Construction de Qualité"
 desc_idea_variation_act_551: "En construisant avec des matériaux de qualité, nous économiserons des coûts à long terme."
 idea_variation_act_552: "Manœuvre d'Assaut de Forteresse"
 desc_idea_variation_act_552: "Nous nous entraînerons à prendre d'assaut les forteresses."
 idea_variation_act_553: "Manufactures Décentralisées"
 desc_idea_variation_act_553: "Notre économie ne s'effondrera pas si une manufacture est prise par l'ennemi."
 idea_variation_act_554: "Déploiement Secret"
 desc_idea_variation_act_554: "Nos armées ont la capacité d'attaquer de nulle part."
 idea_variation_act_555: "Opportunité d'Avancement"
 desc_idea_variation_act_555: "Nos jeunes hommes ont des opportunités d'avancement."
