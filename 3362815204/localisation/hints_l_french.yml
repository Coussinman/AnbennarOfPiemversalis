l_french:
 HINTS_DISABLE_ALL_HINTS:0 "Désactiver"
 HINTS_DISABLE_HINT:0 "Masquer cet indice"
 HINT_CONFIRM_DISABLE_TITLE:0 "Désactiver les indices"
 HINT_CONFIRM_DISABALE_DESC:0 "Êtes-vous certain de vouloir désactiver les indices ? Vous pouvez les réactiver dans les Options."
 HINTBAR_HINTS:0 "Indices"
 HINT_MAXIMIZE:0 "Agrandir la fenêtre"
 HINT_MINIMIZE:0 "Réduire la fenêtre"
 HINT_DISABLETHIS_TIP:0 "Empêchera cet indice de s'afficher automatiquement à l'avenir."
 HINT_TURNOFF_TIP:0 "Ceci masquera l'interface des indices. Elle peut être réactivée via le menu des options."
 HINT_BANNER_TEXT:0 "En savoir plus sur..."
 HINT_MODE_BUTTON:1 "§YMode clic-pour-indice§!"
 HINT_MODE_BUTTON_DESC:0 "Ceci vous permettra de cliquer sur les boutons et icônes du jeu pour obtenir plus d'informations."
 HINT_INTRO_TILE:0 "Indices"
 HINT_INTRO_TEXT:0 "Les indices visent à vous aider en vous donnant des informations sur les éléments du jeu. Vous pouvez cliquer sur le bouton Clic-pour-indice en haut à droite pour activer le mode indice. Une fois en mode indice, la plupart des icônes brilleront en bleu. Cliquer dessus vous donnera alors des informations sur leur fonction. Vous pouvez réduire et agrandir cette interface en cliquant sur le bouton réduire/agrandir."
 HINT_STABILITY_TITLE:0 "Stabilité"
 HINT_STABILITY_TEXT:0 "La stabilité représente la solidité du gouvernement de votre nation. Une stabilité élevée vous accorde plus d'impôts tandis qu'une stabilité basse augmentera les risques de révoltes."
 HINT_INCREASESTABILITY_TITLE:0 "Augmenter la stabilité"
 HINT_INCREASESTABILITY_TEXT:0 "La stabilité peut être augmentée en cliquant sur le bouclier en haut à gauche de l'écran, puis en cliquant sur l'onglet Stabilité et Expansion. Une fois là, cliquez sur le bouton Renforcer pour augmenter la stabilité."
 HINT_LOSESTABILITY_TITLE:0 "Perdre de la stabilité"
 HINT_LOSESTABILITY_TEXT:0 "La stabilité peut être perdue par des événements, en déclarant la guerre sans casus belli, en rompant un mariage royal ou si votre souverain ou héritier meurt au combat."
 HINT_DUCATS_TITLE:0 "Couronnes"
 HINT_DUCATS_TEXT:0 "Les couronnes sont la ressource principale du jeu. Elles servent à tout acheter, des nouveaux navires aux salaires des conseillers, en passant par le recrutement des armées."
 HINT_MONARCHPOINTS_TITLE:0 "Points de monarque"
 HINT_MONARCHPOINTS_TEXT:1 "Les points de monarque comptent parmi les ressources les plus importantes du jeu. Ils servent à débloquer de nouvelles technologies, idées et bien plus encore. Le nombre de points de monarque que vous obtenez chaque mois dépend des capacités de votre souverain et peut être augmenté en engageant des conseillers. Il existe trois catégories de points de monarque : pouvoir administratif, pouvoir diplomatique et pouvoir militaire."
 HINT_MANPOWER_TITLE:0 "Effectifs"
 HINT_MANPOWER_TEXT:0 "Les effectifs représentent le nombre d'hommes en âge de combattre disponibles dans votre nation. Les effectifs servent à recruter de nouvelles troupes et à renforcer les armées ayant subi des pertes au combat."
 HINT_LEGITIMACY_TITLE:0 "Légitimité"
 HINT_LEGITIMACY_TEXT:1 "La légitimité représente le degré de légitimité de votre souverain. Une légitimité élevée réduira l'agitation globale tandis qu'une légitimité basse aura l'effet inverse. Les nations ayant un mariage royal peuvent finir par propager leur dynastie, ce qui peut ensuite être utilisé pour revendiquer des trônes."
 HINT_LOSELEGITIMACY_TITLE:0 "Perdre de la légitimité"
 HINT_LOSELEGITIMACY_TEXT:0 "Contracter un mariage royal réduira la légitimité au début, mais l'augmentera davantage avec le temps. La légitimité peut aussi être perdue par des événements aléatoires ou en ayant un héritier avec une prétention faible."
 HINT_GAINLEGITIMACY_TITLE:0 "Gagner de la légitimité"
 HINT_GAINLEGITIMACY_TEXT:0 "La légitimité peut être augmentée par des événements aléatoires, mais augmente aussi avec le temps. Le mariage royal, le contrôle de véridiques et un prestige élevé sont quelques-uns des facteurs qui augmenteront la légitimité de votre souverain avec le temps."
 HINT_REPUBLICAN_TITLE:0 "Tradition républicaine"
 HINT_REPUBLICAN_TEXT:0 "La tradition républicaine représente la force des traditions dans une république. Une république élit un nouveau dirigeant tous les quelques années et garder le même dirigeant sur plusieurs élections réduira votre tradition républicaine. Si elle tombe à 0, la république se transformera en monarchie despotique."
 HINT_PRESTIGE_TITLE:0 "Prestige"
 HINT_PRESTIGE_TEXT:0 "Le prestige représente la performance globale de votre nation. Un prestige élevé procure de nombreux effets positifs bénéfiques, mais non cruciaux. Un prestige bas donne les mêmes effets, mais négatifs. D'autres nations avec lesquelles vous avez un mariage royal peuvent aussi tenter de revendiquer votre trône pour vous forcer dans une union personnelle."
 HINT_INCREASEPRESTIGE_TITLE:0 "Augmenter le prestige"
 HINT_INCREASEPRESTIGE_TEXT:0 "Le prestige s'obtient en accomplissant des missions, par des événements aléatoires et en gagnant des guerres."
 HINT_LOSEPRESTIGE_TITLE:0 "Perdre du prestige"
 HINT_LOSEPRESTIGE_TEXT:0 "Le prestige peut être perdu par des événements aléatoires, en déclinant un appel aux armes d'alliés ou en perdant des guerres."
 HINT_ENVOYS_TITLE:0 "Émissaires"
 HINT_ENVOYS_TEXT:0 "Les émissaires sont une forme de ressource utilisée pour accomplir certaines actions. Les émissaires ne sont jamais consommés, mais effectueront plutôt une certaine action pendant un temps et reviendront une fois leur tâche accomplie. Les marchands, colons, diplomates et missionnaires sont tous des émissaires."
 HINT_MERCHANT_TITLE:0 "Marchands"
 HINT_MERCHANT_TEXT:0 "Les marchands peuvent être utilisés pour effectuer l'une des deux actions dans un nœud commercial. Ils peuvent soit collecter du commerce soit transférer de la valeur commerciale. Un marchand qui collecte augmentera les revenus générés par ce nœud commercial, tandis qu'un marchand qui transfère pourra orienter la valeur commerciale."
 HINT_MOREMERCHANT_TITLE:0 "Obtenir des marchands"
 HINT_MOREMERCHANT_TEXT:0 "Vous pouvez obtenir plus de marchands en sélectionnant certains groupes d'idées. Les groupes d'idées Commerce et Expansion fournissent tous deux des marchands supplémentaires, bien que le groupe Commerce en donne davantage."
 HINT_COLONIST_TITLE:0 "Colons"
 HINT_COLONIST_TEXT:0 "Les colons servent à fonder de nouvelles colonies sur des terres non colonisées."
 HINT_MORECOLONIST_TITLE:0 "Obtenir des colons"
 HINT_MORECOLONIST_TEXT:0 "Plus de colons peuvent être débloqués en sélectionnant les groupes d'idées Exploration ou Expansion."
 HINT_DIPLOMAT_TITLE:0 "Diplomates"
 HINT_DIPLOMAT_TEXT:0 "Les diplomates servent à envoyer des actions diplomatiques pour transmettre des offres diplomatiques à d'autres nations. Une fois l'offre remise, ils devront rentrer chez eux avant que vous puissiez leur donner un nouvel ordre."
 HINT_MOREDIPLOMAT_TITLE:0 "Obtenir des diplomates"
 HINT_MOREDIPLOMAT_TEXT:1 "Plus de diplomates peuvent être débloqués en sélectionnant les groupes d'idées Diplomatie ou Aristocratie. Être le Contrôleur du Rectorat ou avoir un rang de gouvernement Royaume fournit également des diplomates supplémentaires."
 HINT_MISSIONARY_TITLE:0 "Missionnaires"
 HINT_MISSIONARY_TEXT:0 "Les missionnaires sont des émissaires utilisés pour convertir la religion dans les provinces. Lorsqu'une province n'a pas la même religion que votre religion d'État, vous pouvez envoyer un missionnaire pour commencer à convertir la province. Une fois terminé, il rentrera chez lui et sera prêt pour un autre ordre."
 HINT_MOREMISSIONARY_TITLE:0 "Obtenir des missionnaires"
 HINT_MOREMISSIONARY_TEXT:0 "Plus de missionnaires peuvent être débloqués en sélectionnant le groupe d'idées Religieux. Certaines idées nationales fournissent également des missionnaires supplémentaires. Les idées espagnoles en sont un exemple."
 HINT_SCORE_TITLE:0 "Score"
 HINT_SCORE_TEXT:0 "Le score représente la performance de votre nation et se divise en trois catégories : score administratif, score diplomatique et score militaire."
 HINT_ADMSCORE_TITLE:0 "Gagner du score admin."
 HINT_ADMSCORE_TEXT:0 "Le score administratif s'obtient avec un revenu mensuel élevé, la technologie administrative, un grand nombre de provinces, une stabilité élevée, du prestige et de la légitimité ou tradition républicaine."
 HINT_DIPSCORE_TITLE:0 "Gagner du score diplomatique"
 HINT_DIPSCORE_TEXT:0 "Le score diplomatique s'obtient par la technologie diplomatique, une efficacité commerciale élevée, les marchands, le nombre d'amiraux, une grande flotte, le moral naval, le fait d'avoir des vassaux et des alliés puissants."
 HINT_MILSCORE_TITLE:0 "Gagner du score militaire"
 HINT_MILSCORE_TEXT:0 "Le score militaire s'obtient par la technologie militaire, un moral terrestre élevé, le nombre de généraux, une discipline élevée et une grande armée."
 HINT_OUTLINER_TITLE:0 "Aperçu"
 HINT_OUTLINER_TEXT:0 "L'aperçu est une liste d'informations concernant votre pays."
 HINT_WAROVERVIEW_TITLE:0 "Aperçu de guerre"
 HINT_WAROVERVIEW_TEXT:0 "L'issue d'une guerre est calculée en score de guerre. Chaque camp a un chef de guerre. Lorsque vous négociez avec un chef de guerre, vous traitez avec toute son alliance. Signer une paix avec un chef de guerre vous mettra donc en paix avec toute cette alliance."
 HINT_HRE_TITLE:0 "Empire d'Anbennar"
 HINT_HRE_TEXT:0 "L'Empire d'Anbennar est un ensemble de pays damériens, esmaris et des Marches qui forment ensemble un Empire avec des Électeurs et un Empereur. Quand le vieil Empereur meurt, un nouveau est choisi par les Électeurs. Attaquer tout pays de l'Empire d'Anbennar donnera à l'Empereur un appel aux armes pour défendre les États membres contre les menaces étrangères."
 HINT_PAPACY_TITLE:0 "Papauté"
 HINT_PAPACY_TEXT:1 "Les pays ravéliens peuvent rivaliser pour l'influence auprès de la Papauté en dépensant de l'influence du Rectorat pour tenter de devenir le prochain Contrôleur du Rectorat."
 HINT_MACROBUILD_TITLE:0 "Interface de production"
 HINT_MACROBUILD_TEXT:0 "L'interface de production est conçue pour vous aider à gérer plus efficacement la production dans votre pays une fois qu'il devient plus grand. Elle facilite également l'identification des endroits où un bâtiment vous apporterait le plus grand bénéfice. Sélectionnez ce que vous voulez construire puis cliquez sur la province où vous voulez démarrer la production."
 HINT_ADMINPOWER_TITLE:0 "Pouvoir administratif"
 HINT_ADMINPOWER_TEXT:0 "Le pouvoir administratif est peut-être la ressource la plus importante du jeu. Ses utilisations principales sont de transformer des provinces en provinces légitimées et d'augmenter la technologie administrative ou de débloquer de nouvelles idées."
 HINT_DIPLOPOWER_TITLE:0 "Pouvoir diplomatique"
 HINT_DIPLOPOWER_TEXT:0 "Le pouvoir diplomatique est l'une des ressources principales du jeu. Ses utilisations principales sont de changer la culture dans les provinces et d'augmenter la technologie diplomatique ou de débloquer de nouvelles idées."
 HINT_MILPOWER_TITLE:0 "Pouvoir militaire"
 HINT_MILPOWER_TEXT:0 "Le pouvoir militaire est l'une des ressources principales du jeu. Ses utilisations principales sont d'augmenter la technologie militaire, d'engager des commandants ou de débloquer de nouvelles idées."
 HINT_CHANGEGOV_TITLE:0 "Changer de gouvernement"
 HINT_CHANGEGOV_TEXT:1 "Vous pouvez changer le type de gouvernement que vous avez. Les monarchies ne peuvent changer de type de gouvernement que vers d'autres monarchies, et ainsi de suite. Les décisions nationales spécifiques sont le seul moyen de passer d'une monarchie à une république. Changer de type de gouvernement coûtera 100 points de pouvoir administratif."
 HINT_GOVTYPE_TITLE:0 "Formes de gouvernement"
 HINT_GOVTYPE_TEXT:0 "La forme de gouvernement de votre pays détermine quel type de dirigeant vous avez. Les monarchies sont héréditaires et le pouvoir passera à un héritier à la mort du vieux souverain. Les théocraties changeront de dirigeant à la mort de l'ancien. Les républiques auront des élections tous les 3 à 8 ans où un nouveau dirigeant peut être choisi."
 HINT_PRIMARYCULTURE_TITLE:0 "Culture principale"
 HINT_PRIMARYCULTURE_TEXT:0 "La culture principale détermine quelle culture est la culture dominante du pays. Les cultures du même groupe culturel que votre culture principale sont des cultures tolérées et elles ont une pénalité de -15 % sur les effectifs et les revenus fiscaux. Les cultures non acceptées subissent une pénalité de -33 % sur les effectifs et les revenus fiscaux."
 HINT_ACCEPTCULTURE_TITLE:0 "Cultures acceptées"
 HINT_ACCEPTCULTURE_TEXT:1 "Les cultures acceptées sont les cultures qui ne subissent aucune pénalité sur les effectifs, les revenus fiscaux ou l'agitation. Un pays qui atteint le rang Empire est une union culturelle qui traitera toutes les cultures tolérées de ce groupe culturel comme des cultures acceptées."
 HINT_COUNTRYMOD_TITLE:0 "Modificateurs de pays"
 HINT_COUNTRYMOD_TEXT:0 "Les modificateurs de pays sont les effets qui affectent actuellement votre pays. Ils peuvent être positifs comme négatifs. D'autres termes courants pour les désigner seraient « bonus » ou « malus »."
 HINT_ADVISOR_TITLE:0 "Conseillers"
 HINT_ADVISOR_TEXT:0 "Les conseillers augmentent le nombre de points de monarque que vous gagnez chaque mois. Ils coûtent de l'or à engager et vous leur payez également un salaire chaque mois. Engager un conseiller plus cher vous donnera plus de points de monarque mensuels, mais vous gagnerez moins d'or chaque mois."
 HINT_TECHNOLOGY_TITLE:0 "Technologie"
 HINT_TECHNOLOGY_TEXT:0 "Il existe trois catégories différentes de technologie, chacune associée à un ensemble spécifique de points de monarque. La technologie administrative se débloque avec le pouvoir administratif, et ainsi de suite. Vous pouvez débloquer la technologie en dépensant des points de monarque. Le coût est déterminé par votre groupe technologique ainsi que par votre avance en technologie."
 HINT_TECHGROUP_TITLE:0 "Groupe technologique"
 HINT_TECHGROUP_TEXT:1 "Chaque nation appartient à un groupe technologique spécifique qui détermine quels types d'unités elle obtient."
 HINT_SPYEFFICIENCY_TITLE:0 "Réseaux d'espionnage"
 HINT_SPYEFFICIENCY_TEXT:1 "Les réseaux d'espionnage sont construits dans d'autres nations pour obtenir des bonus passifs avec cette nation. Des niveaux plus élevés de vitesse de construction de réseau d'espionnage vous permettront de construire des réseaux plus rapidement, et la détection des espions étrangers vous permettra d'attraper les espions dans votre nation plus vite. Les points de réseau d'espionnage servent à forger des revendications, soutenir des rebelles et d'autres actions d'espionnage."
 HINT_IDEAS_TITLE:0 "Idées"
 HINT_IDEAS_TEXT:0 "Les idées sont un moyen de spécialiser votre nation de certaines façons. Après avoir sélectionné un groupe d'idées, vous pouvez commencer à débloquer des idées dans ce groupe. Débloquer une idée coûtera 400 points de monarque associés. Débloquer trois idées débloquera également l'une de vos idées nationales."
 HINT_IDEAGROUP_TITLE:0 "Groupes d'idées"
 HINT_IDEAGROUP_TEXT:0 "Les groupes d'idées sont une mécanique où vous choisissez une spécialisation pour votre pays. Chaque groupe d'idées est lié à un ensemble spécifique de points de monarque. Chaque groupe d'idées contient 7 idées et lorsque vous les débloquez toutes, vous recevez un bonus. Vous débloquez de nouveaux emplacements de groupes d'idées à certains intervalles de technologie administrative."
 HINT_NATIONALIDEAS_TITLE:0 "Idées nationales"
 HINT_NATIONALIDEAS_TEXT:0 "Les idées nationales ajoutent de la saveur aux différentes nations en fournissant un contexte historique supplémentaire. Débloquer trois idées débloquera également automatiquement l'une de vos idées nationales. Vos idées nationales vous donnent un bonus de départ et débloquer toutes les idées nationales vous donnera un bonus supplémentaire."
 HINT_DIPUPKEEP_TITLE:0 "Relations diplomatiques"
 HINT_DIPUPKEEP_TEXT:0 "Les alliances, mariages royaux, sujets, garanties et accès militaires nécessitent tous des relations diplomatiques pour être maintenus. Chaque relation diplomatique au-delà de la limite de relations diplomatiques vous coûtera 1 point de pouvoir diplomatique par mois. Un pays ne nécessitera qu'un emplacement de relation diplomatique, donc vous pouvez être allié et avoir un mariage royal avec lui sans que cela prenne deux emplacements."
 HINT_DIPREPUTATION_TITLE:0 "Réputation diplomatique"
 HINT_DIPREPUTATION_TEXT:0 "La réputation diplomatique est une mécanique qui vous permet d'avoir plus de succès dans l'accomplissement de certaines actions diplomatiques. L'annexion diplomatique des vassaux est un processus qui prend plusieurs années et ce temps est réduit par la réputation diplomatique. La réputation diplomatique augmente également la probabilité que d'autres nations acceptent vos offres diplomatiques."
 HINT_RELIGION_TITLE:0 "Religion"
 HINT_RELIGION_TEXT:0 "Une cause majeure de division, outre les différences culturelles, ce sont les différences religieuses. Un pays ravélien, par exemple, considérera les autres pays de la Cour Régente ou corinites comme des hérétiques, tandis qu'il considérera les autres religions comme des païens. Toutes les provinces de votre pays affectent votre unité religieuse. Vous pouvez convertir les provinces à votre religion avec un missionnaire."
 HINT_RIVAL_TITLE:0 "Rivaux"
 HINT_RIVAL_TEXT:0 "Chaque pays peut sélectionner jusqu'à trois rivaux. Lorsque vous sélectionnez un pays comme rival, vos relations avec lui seront diminuées, mais ses ennemis vous apprécieront davantage. Les pays rivaux ont plus de chances de recevoir des missions et événements qui leur donnent des raisons de se combattre. Il est gratuit pour eux de s'imposer un embargo mutuel, moins cher de demander plus l'un à l'autre dans les accords de paix et affaiblir vos rivaux vous donne de la projection de puissance. Une fois défini, un rival reste pendant 25 ans, après quoi il peut être changé contre 100 points diplomatiques."
 HINT_ADMTECH_TITLE:0 "Technologie administrative"
 HINT_ADMTECH_TEXT:0 "La technologie administrative coûte du pouvoir administratif et est très importante pour débloquer plus de groupes d'idées et de bâtiments de la catégorie gouvernementale."
 HINT_DIPTECH_TITLE:0 "Technologie diplomatique"
 HINT_DIPTECH_TEXT:0 "La technologie diplomatique coûte du pouvoir diplomatique et est importante pour débloquer la technologie liée au commerce et les bâtiments des catégories commerciales et navales. Des navires plus puissants sont également débloqués par la technologie diplomatique."
 HINT_MILTECH_TITLE:0 "Technologie militaire"
 HINT_MILTECH_TEXT:0 "La technologie militaire coûte du pouvoir militaire et est importante pour débloquer de nouvelles unités et technologies liées au militaire. Elle débloque également les bâtiments des catégories fort et armée."
 HINT_TAXES_TITLE:0 "Impôts"
 HINT_TAXES_TEXT:1 "Les impôts sont collectés dans les provinces et sont directement liés à la taxe de base. Le montant des impôts collectés dépend du développement de taxe de base de la province, de son statut de province légitimée ou non et du niveau d'agitation dans la province. Les revenus fiscaux sont augmentés par l'efficacité fiscale."
 HINT_TRADE_TITLE:0 "Commerce"
 HINT_TRADE_TEXT:0 "Le commerce peut être une source majeure de revenus pour un pays. Le monde est divisé en nœuds commerciaux et toute la valeur commerciale produite dans les provinces est transportée vers leur nœud commercial associé. Vous pouvez soit orienter le commerce soit collecter des revenus d'un nœud commercial. La puissance commerciale influence la part d'un nœud commercial que vous pouvez contrôler, et est donc très importante. Les revenus commerciaux sont directement modifiés par l'efficacité commerciale."
 HINT_INCOME_TITLE:0 "Revenus"
 HINT_INCOME_TEXT:0 "Les revenus peuvent provenir des impôts, de la production et des tarifs. Les impôts sont collectés dans les provinces et peuvent être améliorés par l'efficacité fiscale. La production provient de la valeur commerciale d'une province et peut être améliorée par l'efficacité de production. Les tarifs représentent les revenus des nations coloniales. Certaines idées peuvent augmenter les tarifs collectés."
 HINT_ROYALMARRIAGE_TITLE:0 "Mariage royal"
 HINT_ROYALMARRIAGE_TEXT:0 "Un mariage royal est le lien dynastique entre deux nations. Avoir un mariage royal augmentera l'opinion, mais s'accompagnera également d'une chance que les deux dynasties fusionnent. Deux nations avec des souverains de la même dynastie auront une opinion accrue l'une de l'autre. Être de la même dynastie signifie qu'il y a une chance que lorsque le souverain d'un pays meurt sans héritier, le pays puisse devenir partenaire junior dans une union personnelle."
 HINT_ENTERROYALMARRIAGE_TITLE:0 "Contracter un mariage royal"
 HINT_ENTERROYALMARRIAGE_TEXT:0 "Contracter un mariage royal est une action diplomatique que l'on trouve dans la catégorie des actions dynastiques dans la vue Diplomatie. Faites un clic droit sur une nation, développez l'accordéon des actions dynastiques et cliquez sur le bouton Mariage royal."
 HINT_ENTERPERSONALUNION_TITLE:0 "Entrer en union personnelle"
 HINT_ENTERPERSONALUNION_TEXT:0 "Si vous avez un mariage royal avec une autre nation qui a un faible prestige, vous pouvez utiliser l'action diplomatique Revendiquer le trône. Cela vous donnera un casus belli pour les forcer dans une union personnelle sous votre nation. Lorsqu'un souverain meurt sans héritier, il y a une chance que le pays puisse entrer en union personnelle avec un autre pays s'ils avaient un mariage royal."
 HINT_PERSONALUNION_TITLE:0 "Union personnelle"
 HINT_PERSONALUNION_TEXT:0 "Une union personnelle est une forme de vassalité qui signifie que le souverain est le souverain des deux nations. Le partenaire junior compte comme un vassal sous la direction du chef de l'union. Si les relations sont assez bonnes, un chef d'union a la chance d'hériter des terres du partenaire junior, transférant effectivement toutes les provinces au chef de l'union."
 HINT_INFLATION_TITLE:0 "Inflation"
 HINT_INFLATION_TEXT:1 "L'inflation aura des effets économiques négatifs sur votre pays. L'inflation augmentera les coûts de la plupart des choses dans votre pays. L'inflation peut être augmentée par des événements aléatoires et les revenus en or des provinces. L'inflation peut être réduite annuellement avec un conseiller Maître de la Monnaie ou l'idée économique Banque Nationale. Dans l'écran économie, vous pouvez réduire l'inflation en dépensant du pouvoir administratif."
 HINT_WARTAXES_TITLE:0 "Impôts de guerre"
 HINT_WARTAXES_TEXT:0 "Les impôts de guerre peuvent être collectés pendant la guerre. Collecter les impôts de guerre vous donnera une réduction significative des coûts d'unité, mais coûtera également 50£mil tous les deux ans."
 HINT_WAREXHAUSTION_TITLE:0 "Lassitude de guerre"
 HINT_WAREXHAUSTION_TEXT:0 "La lassitude de guerre représente à quel point votre nation a été ravagée par la guerre. Une lassitude de guerre élevée augmentera l'agitation tout en rendant le recrutement de régiments et la construction de navires significativement plus lents. Il sera également plus coûteux de transformer des provinces en provinces légitimées. La lassitude de guerre peut être réduite en dépensant du pouvoir diplomatique."
 HINT_REVOLTRISK_TITLE:0 "Agitation"
 HINT_REVOLTRISK_TEXT:0 "L'agitation est la probabilité que des rebelles apparaissent dans vos provinces. Une mauvaise culture, une mauvaise religion ou des événements aléatoires sont autant de choses qui peuvent affecter l'agitation locale dans une province. Une stabilité basse, une légitimité basse, une lassitude de guerre élevée sont des exemples de choses qui peuvent affecter votre agitation au niveau national."
 HINT_REBELS_TITLE:0 "Rebelles"
 HINT_REBELS_TEXT:0 "Les rebelles peuvent apparaître dans vos provinces en raison d'une agitation élevée ou par des événements aléatoires. Si vos armées ont du mal à vaincre les rebelles au combat, il pourrait être judicieux d'aller dans l'onglet Stabilité et Expansion et de traiter avec les rebelles en cliquant sur « Gérer »."
 HINT_REBELTYPES_TITLE:0 "Types de rebelles"
 HINT_REBELTYPES_TEXT:0 "Il existe de nombreux types de rebelles allant des paysans ou hérétiques aux prétendants ou nationalistes. Les différents rebelles varient en force, les rebelles prétendants étant généralement les plus forts car ils ont accès à des troupes de meilleure qualité et ont généralement un moral plus élevé tout en étant menés par le prétendant lui-même."
 HINT_LEADER_TITLE:0 "Commandants"
 HINT_LEADER_TEXT:0 "Les commandants sont des chefs qui dirigent vos armées ou flottes. Les généraux dirigent les armées et sont recrutés en dépensant 50£mil. Les amiraux sont des commandants que vous mettez à la tête de vos flottes et ils sont recrutés en dépensant 50£dip. Chaque commandant au-delà de votre entretien gratuit vous coûtera 1 point de pouvoir militaire par mois."
 HINT_EXPCONQ_TITLE:0 "Explorateurs et conquistadors"
 HINT_EXPCONQ_TEXT:0 "Les explorateurs sont des amiraux qui peuvent être envoyés dans des provinces maritimes inexplorées pour les découvrir. Les conquistadors sont des généraux et peuvent être mis à la tête d'armées pour leur permettre de se déplacer sur des terres inexplorées. Les explorateurs et conquistadors nécessitent l'idée Quête pour Aelantir dans le groupe d'idées Exploration."
 HINT_EXPLORATION_TITLE:0 "Exploration"
 HINT_EXPLORATION_TEXT:0 "Les terres inexplorées sont cachées par la Terra Incognita. Vous aurez besoin d'un explorateur ou d'un conquistador pour vous déplacer en Terra Incognita. Les explorateurs dirigent les flottes tandis que les conquistadors dirigent les armées."
 HINT_TERRAINCOGNITA_TITLE:0 "Terra Incognita"
 HINT_TERRAINCOGNITA_TEXT:1 "La Terra Incognita est la partie du monde que vous n'avez pas encore explorée. À moins que votre unité ne soit dirigée par un explorateur ou un conquistador ou que la terre soit possédée par quelqu'un avec qui vous êtes en guerre, il sera impossible d'y déplacer vos unités."
 HINT_TERRAINCOGNITA_ED_TEXT:0 "La Terra Incognita est la partie du monde que vous n'avez pas encore explorée. Vous devez donner à une unité dirigée par un explorateur ou conquistador une mission d'explorer ici, et tant que la mission n'est pas accomplie, il sera impossible d'y déplacer vos unités."
 HINT_TERRAINCOGNITA_QFTNW_WARN:0 "§R- Vous avez besoin de l'idée $IDEANAME$ pour explorer à travers les océans.§!"
 HINT_TERRAINCOGNITA_NEED_EXPLORER:0 "§R- Votre flotte doit être dirigée par un explorateur pour révéler la Terra Incognita.§!"
 HINT_TERRAINCOGNITA_OUT_OF_RANGE:0 "§R- Notre portée de colonisation ne nous permet pas encore d'explorer ceci.§!"
 HINT_TERRAINCOGNITA_EXPLORE_REGION:0 "Clic droit pour envoyer votre flotte explorer §Y$REGION$§!"
 HINT_LOANS_TITLE:0 "Emprunts"
 HINT_LOANS_TEXT:0 "Des emprunts peuvent être contractés pour sauver votre nation en cas de péril économique ou pour faire un investissement économique pour un profit à plus long terme. Contracter un emprunt vous donnera les couronnes instantanément et vous payez des intérêts chaque mois jusqu'au remboursement de l'emprunt. Si vos intérêts sont supérieurs à vos revenus mensuels, votre pays fera faillite. Vous ne devriez pas avoir peur de contracter des emprunts."
 HINT_INTEREST_TITLE:0 "Intérêts"
 HINT_INTEREST_TEXT:1 "Chaque fois que vous contractez un emprunt, vous paierez des intérêts mensuels sur cet emprunt. Les intérêts sont plus élevés avec une stabilité basse."
 HINT_HEAVYSHIPS_TITLE:0 "Navires lourds"
 HINT_HEAVYSHIPS_TEXT:0 "Les navires lourds sont les navires de guerre les plus puissants et sont également le type de navire le plus coûteux à construire. Ils ont le plus de canons et la plus grande taille de coque."
 HINT_LIGHTSHIPS_TITLE:0 "Navires légers"
 HINT_LIGHTSHIPS_TEXT:0 "Les navires légers sont des navires rapides principalement utilisés pour sécuriser les opportunités commerciales. Une flotte avec des navires légers peut recevoir l'ordre de protéger le commerce dans un nœud commercial. Les navires légers qui protègent le commerce augmenteront la puissance commerciale dans ce nœud."
 HINT_GALLEYS_TITLE:0 "Galères"
 HINT_GALLEYS_TEXT:0 "Les galères sont des navires de guerre bon marché qui sont très rentables dans les mers intérieures, où elles reçoivent un bonus de 100 % aux dégâts infligés aux non-galères. Vous pouvez survoler une zone maritime avec la souris pour voir l'infobulle et savoir s'il s'agit d'une mer intérieure ou non. La Tête-de-Dame et le golfe du Rahen sont des exemples de mers intérieures."
 HINT_TRANSPORTS_TITLE:0 "Transports"
 HINT_TRANSPORTS_TEXT:0 "Les transports servent à transférer des armées par voie maritime. Chaque navire de transport peut transporter un régiment, que le régiment soit à pleine force ou non."
 HINT_BLOCKADE_TITLE:0 "Blocus"
 HINT_BLOCKADE_TEXT:0 "Le blocus est disponible au niveau 3 de technologie diplomatique et vous pouvez bloquer une province ennemie en plaçant des navires devant ses ports. Une province bloquée a des revenus fiscaux et une puissance commerciale réduits. Une province qui n'est pas bloquée résistera plus longtemps pendant un siège."
 HINT_COALITION_TITLE:0 "Coalition"
 HINT_COALITION_TEXT:0 "Pour qu'une coalition se forme, il faut qu'un pays soit outré par l'expansion agressive causée par un autre pays. Bien qu'une coalition se dissolve quand aucun membre n'est outré, les membres de la coalition n'ont pas besoin d'être outrés pour la rejoindre. L'opinion, la distance et la menace affectent tous la probabilité que de nouveaux membres rejoignent la coalition. Lorsqu'un membre de la coalition est en guerre avec la cible de la coalition, tous les membres de la coalition rejoindront."
 HINT_ATTRITION_TITLE:0 "Attrition"
 HINT_ATTRITION_TEXT:0 "Chaque régiment dans votre armée compte pour le poids d'unité de l'armée. Le poids d'unité détermine combien de troupes peuvent être dans une province sans subir d'attrition. L'attrition cause lentement des pertes aux grandes armées et est plus sévère en climat tropical ou pendant l'hiver."
 HINT_COLONIALRANGE_TITLE:0 "Portée coloniale"
 HINT_COLONIALRANGE_TEXT:0 "La portée coloniale détermine à quelle distance doit se trouver une terre non colonisée pour que vous puissiez y envoyer un colon. La portée coloniale peut être augmentée par les idées d'Exploration ou par le niveau technologique."
 HINT_COLONY_TITLE:0 "Colonies"
 HINT_COLONY_TEXT:0 "Lorsque vous envoyez un colon fonder une colonie, il lui faudra d'abord un certain temps pour y arriver. Une fois le colon arrivé sur place, une colonie sera fondée dans la province. Lorsque la population de colons de la colonie atteint 1 000, la province devient une cité et peut construire des bâtiments et générera plus de revenus."
 HINT_BUILDING_TITLE:0 "Bâtiments"
 HINT_BUILDING_TEXT:1 "Les bâtiments peuvent être construits dans une province qui n'est pas une colonie. Une province a un nombre limité d'emplacements de bâtiments basé sur son terrain et son développement."
 HINT_MONARCHY_TITLE:0 "Monarchies"
 HINT_MONARCHY_TEXT:0 "Les monarchies sont une forme de gouvernement où le souverain reste normalement au pouvoir jusqu'à sa mort, suivi par l'héritier qui deviendra le prochain souverain. Les monarchies ont une légitimité pour représenter la force de la prétention du souverain au trône. Seules les monarchies et les républiques nobles peuvent contracter des mariages royaux."
 HINT_REPUBLIC_TITLE:0 "Républiques"
 HINT_REPUBLIC_TEXT:1 "Les républiques sont une forme de gouvernement où un nouveau dirigeant est élu tous les 4 à 8 ans. Lors d'une élection, vous aurez le choix entre différents candidats. Alternativement, vous pouvez choisir de garder le dirigeant précédent, ce qui réduira votre tradition républicaine. La force principale des républiques est leur capacité à choisir un dirigeant adapté à la tâche que la république s'est fixée."
 HINT_TRIBE_TITLE:0 "Tribus"
 HINT_TRIBE_TEXT:0 "La tribu est la forme de gouvernement la plus primitive. Elles varient dans leur façon de sélectionner leurs chefs et dans le degré de centralisation du pouvoir. Leur progrès technologique est sérieusement entravé jusqu'à ce qu'elles réforment leur gouvernement."
 HINT_NOMAD_TITLE:0 "Nomades des steppes"
 HINT_NOMAD_TEXT:0 "Les nomades des steppes sont les vestiges des hordes mongoles des siècles passés. Ils sont dirigés par un khan qui maintient son pouvoir et sa popularité en écrasant l'opposition et en pillant les pays voisins. Leur progrès technologique est sérieusement entravé jusqu'à ce qu'ils réforment leur gouvernement. Les nomades reçoivent également un bonus de dégâts au combat lorsqu'ils combattent en terrain plat."
 HINT_THEOCRACY_TITLE:0 "Théocraties"
 HINT_THEOCRACY_TEXT:0 "La théocratie est une forme de gouvernement où le dirigeant est un chef religieux tel que le Haut Recteur ou un archevêque. Le dirigeant règne jusqu'à sa mort, moment où un nouveau dirigeant est choisi. Les théocraties ont des idées nationales spéciales."
 HINT_COMBATPOWER_TITLE:0 "Capacité de combat"
 HINT_COMBATPOWER_TEXT:0 "La capacité de combat est un bonus qui donne à vos unités des dégâts supplémentaires au combat. Elle diffère de la discipline car la capacité de combat n'augmente que les dégâts, tandis que la discipline réduit également les dégâts subis."
 HINT_PREFERREDUNIT_TITLE:0 "Unité préférée"
 HINT_PREFERREDUNIT_TEXT:0 "L'unité préférée est l'unité que vous avez choisie comme unité préférée pour chaque type d'unité. Par exemple, il existe de nombreux types différents d'infanterie, dont beaucoup sont débloqués par la technologie. Lorsque vous débloquez une nouvelle unité, vous pouvez changer votre unité préférée pour que toute votre infanterie passe à cette unité. Changer d'unité préférée videra tout le moral de ce type d'unité."
 HINT_UNITBASECOST_TITLE:0 "Coût de base des unités"
 HINT_UNITBASECOST_TEXT:0 "Chaque unité a un coût de base associé en couronnes. L'infanterie coûte 10, la cavalerie 25 et l'artillerie 30. Le montant que vous finissez par payer est réduit par les idées ou les bâtiments dans la province."
 HINT_INFANTRY_TITLE:0 "Infanterie"
 HINT_INFANTRY_TEXT:0 "L'infanterie est le cœur de la plupart des armées. Elle est bon marché et efficace, mais éclipsée par la cavalerie en début de partie. Une fois que vous commencez à débloquer des niveaux plus élevés de modificateur de feu par la technologie, l'infanterie commencera à rendre la cavalerie moins efficace. L'infanterie peut être utilisée pour donner l'assaut aux forts pendant les sièges."
 HINT_CAVALRY_TITLE:0 "Cavalerie"
 HINT_CAVALRY_TEXT:0 "La cavalerie est très forte en début de partie quand son choc plus élevé signifie qu'elle infligera une quantité notable de dégâts. Si vous n'avez pas un certain mélange d'infanterie et de cavalerie, vous recevrez un modificateur de soutien insuffisant qui réduit les dégâts infligés par vos troupes. La quantité d'infanterie ou de cavalerie que vous pouvez avoir dépend de votre groupe technologique."
 HINT_ARTILLERY_TITLE:0 "Artillerie"
 HINT_ARTILLERY_TEXT:0 "L'artillerie est composée de régiments de soutien qui vous aident à assiéger les provinces plus rapidement. Elle fournit également 50 % de son choc et feu (pips verts) pour aider une unité en première ligne à subir moins de dégâts lorsqu'elle est attaquée. L'artillerie peut également attaquer depuis l'arrière et elle inflige 50 % des dégâts. L'artillerie positionnée à l'avant subira le double de dégâts lorsqu'elle est attaquée."
 HINT_TOLERANCETRUE_TITLE:0 "Vraie foi"
 HINT_TOLERANCETRUE_TEXT:0 "La tolérance de la vraie foi réduit l'agitation dans les provinces qui ont la même religion que votre religion d'État."
 HINT_TOLERANCEHERETIC_TITLE:0 "Hérétiques"
 HINT_TOLERANCEHERETIC_TEXT:0 "La tolérance des hérétiques affecte l'agitation dans les provinces qui ont une religion similaire, mais pas identique, à votre religion d'État."
 HINT_TOLERANCEHEATHEN_TITLE:0 "Païens"
 HINT_TOLERANCEHEATHEN_TEXT:0 "La tolérance des païens affecte l'agitation dans les provinces qui ont une religion différente de votre religion d'État."
 HINT_REFORMDESIRE_TITLE:0 "Savoir dévoilé"
 HINT_REFORMDESIRE_TEXT:0 "Le savoir dévoilé représente les découvertes et secrets du monde trouvés par l'Église Ravélienne. À 100 % de savoir dévoilé, un débat ravélien sera déclenché, permettant aux pays ravéliens de solidifier une nouvelle doctrine de la foi. Cela retombera à 0 et pourra déclencher d'autres débats. Le savoir dévoilé est généralement augmenté par des événements aléatoires et est global pour toute la religion ravélienne, pas seulement votre pays. (Les débats ravéliens sont notre version du Concile de Trente, mais dans Anbennar, cela ne débloque qu'une rangée à la fois)"
 HINT_PAPALINFLUENCE_TITLE:0 "Influence ravélienne"
 HINT_PAPALINFLUENCE_TEXT:1 "L'influence ravélienne est une ressource que vous utilisez pour obtenir des bonus du Haut Rectorat et tenter de devenir Contrôleur du Rectorat. L'influence ravélienne est gagnée annuellement grâce à l'unité religieuse et de bonnes relations avec l'État Ravélien. Certaines idées peuvent également augmenter votre influence ravélienne."
 HINT_CHANGERELIGION_TITLE:0 "Changer de religion"
 HINT_CHANGERELIGION_TEXT:0 "Changer de religion réduira la stabilité de votre pays de -5."
 HINT_CARDINAL_TITLE:0 "Véridique"
 HINT_CARDINAL_TEXT:1 "Les véridiques sont assignés aléatoirement aux provinces ravéliennes. Les propriétaires de ces provinces reçoivent un bonus à leur influence ravélienne."
 HINT_OVEREXTENSION_TITLE:0 "Surextension"
 HINT_OVEREXTENSION_TEXT:0 "Chaque province que vous possédez qui n'est pas l'une de vos provinces légitimées augmentera votre surextension. Le montant de surextension dépend de la taxe de base de la province. Habituellement, chaque 1 de développement équivaut à 1 % de surextension, bien que ce nombre puisse être réduit avec l'efficacité administrative. Vous voulez généralement transformer les provinces récemment conquises en provinces légitimées aussi vite que possible."
 HINT_SETTLERGROWTH_TITLE:0 "Croissance des colons"
 HINT_SETTLERGROWTH_TEXT:0 "La croissance des colons est un bonus à l'augmentation annuelle de la population de colons dans une colonie. Lorsque la population de colons atteint 1 000, la colonie deviendra une province-cité et pourra être transformée en province légitimée pour commencer à produire des unités et construire des bâtiments."
 HINT_COLONISTTIME_TITLE:0 "Temps de voyage du colon"
 HINT_ADMINISTRATIVE_EFFICIENCY_TEXT:0 "L'efficacité administrative s'obtient à partir de niveaux élevés de technologie administrative. C'est une mesure de l'efficacité de votre nation à intégrer les provinces étrangères, réduisant l'impact de la surextension et le coût de création de province légitimée des provinces non légitimées et rendant moins coûteux de conquérir des terres en guerre. Cependant, elle augmentera également le fardeau administratif sur vos nations coloniales, augmentant leur désir de liberté."
 HINT_ADMINISTRATIVE_EFFICIENCY_TITLE:0 "Efficacité administrative"
 HINT_COLONISTTIME_TEXT:0 "Le temps de voyage du colon est le temps qu'il faut à votre colon pour arriver sur la terre non colonisée où vous l'avez envoyé. Une fois arrivé, la province deviendra une colonie."
 HINT_TRADERANGE_TITLE:0 "Portée commerciale"
 HINT_TRADERANGE_TEXT:0 "La portée commerciale détermine jusqu'où vous pouvez envoyer un marchand. Un marchand peut soit collecter du commerce soit transférer de la puissance commerciale."
 HINT_MERCANTILISM_TITLE:0 "Mercantilisme"
 HINT_MERCANTILISM_TEXT:0 "Le mercantilisme est un bonus qui affecte votre puissance commerciale dans les provinces. Plus il est élevé, mieux c'est. Le mercantilisme peut être gagné ou réduit par des événements aléatoires."
 HINT_TRADESTEERING_TITLE:0 "Orientation du commerce"
 HINT_TRADESTEERING_TEXT:0 "Lorsque vous voulez orienter le commerce d'un nœud commercial à un autre, vous pouvez envoyer un marchand au nœud commercial avec l'ordre de transférer la puissance commerciale. Cela transférera de la valeur commerciale d'un nœud commercial au nœud commercial suivant en aval. La quantité de commerce orientée dépend de votre puissance commerciale. Vous ne pouvez jamais orienter le commerce en amont ou au-delà de votre ville commerciale principale."
 HINT_TRADEEFF_TITLE:0 "Efficacité commerciale"
 HINT_TRADEEFF_TEXT:0 "L'efficacité commerciale affecte le montant de revenus supplémentaires que vous pouvez collecter du commerce."
 HINT_BASETAX_TITLE:0 "Taxe de base"
 HINT_BASETAX_TEXT:1 "La taxe de base est une valeur très importante qui représente la valeur d'une province. La population, les bons sols et l'infrastructure sont tous représentés par la taxe de base. La taxe de base détermine le coût pour faire de la province une province légitimée ou changer sa culture et sa religion. La taxe de base compte avec le reste du développement pour déterminer votre limite de forces terrestres ainsi que la limite de forces navales dans les provinces côtières."
 HINT_TRADEPOWER_TITLE:0 "Puissance commerciale"
 HINT_TRADEPOWER_TEXT:0 "La puissance commerciale est directement liée à la quantité de commerce que vous contrôlez dans un nœud commercial. La puissance commerciale provient des provinces ainsi que des navires légers qui effectuent l'action Protéger le commerce. Les navires légers sont essentiels pour rivaliser pour le contrôle d'un nœud commercial. La puissance commerciale détermine directement la quantité de commerce que vous pouvez orienter ou le montant de revenus que vous pouvez collecter."
 HINT_TRADEVALUE_TITLE:0 "Valeur commerciale"
 HINT_TRADEVALUE_TEXT:0 "Les provinces produisent des marchandises qui ont une valeur associée. La quantité de marchandises produites et la valeur de ces marchandises constituent ensemble la valeur commerciale. La valeur commerciale est envoyée au nœud commercial pour le calcul de la quantité de commerce dans ce nœud, mais est également utilisée pour les revenus de production dans une province."
 HINT_TRADEGOODS_TITLE:0 "Marchandises"
 HINT_TRADEGOODS_TEXT:0 "Chaque province produit un certain type de marchandises. Les marchandises existantes sont le poisson, les fournitures navales, le grain, le cuivre, le fer, le vin, le tissu, la laine, le sel, l'or, la porcelaine, les épices, les esclaves et l'ivoire. L'or est la seule marchandise qui n'est pas commercée, mais plutôt directement convertie en revenus de production."
 HINT_PAPALCONTROLLER_TITLE:0 "Contrôleur du Rectorat"
 HINT_PAPALCONTROLLER_TEXT:1 "Lorsqu'un nouveau Haut Recteur règne au Rectorat Ravélien, un nouveau pays est choisi comme Contrôleur du Rectorat en fonction de son influence ravélienne investie. Le Contrôleur du Rectorat obtient l'accès à des bonus et à des actions papales spécifiques qui peuvent être utilisées via la vue Diplomatie."
 HINT_PAPALACTIONS_TITLE:0 "Actions papales"
 HINT_PAPALACTIONS_TEXT:0 "Le Contrôleur du Rectorat a accès à quelques actions diplomatiques supplémentaires appelées actions papales. Ces actions incluent Excommunier, qui vous permet d'excommunier un souverain ravélien à condition que ses relations avec les États Pontificaux soient suffisamment mauvaises. Appeler à la croisade est une autre action papale qui permet au Contrôleur du Rectorat d'appeler à une croisade contre un pays infidèle, encourageant les autres pays ravéliens à l'attaquer."
 HINT_VASSALS_TITLE:0 "Vassaux"
 HINT_VASSALS_TEXT:0 "Les vassaux sont des pays qui sont sujets d'un autre pays. Lorsque le suzerain entre en guerre, les vassaux rejoindront également automatiquement la guerre. Les vassaux ont aussi toujours un accès militaire à travers le pays suzerain. Les vassaux coûtent des relations diplomatiques à maintenir et paient une part de leurs revenus mensuels à leur suzerain."
 HINT_ALLIANCE_TITLE:0 "Alliances"
 HINT_ALLIANCE_TEXT:0 "Chaque fois que vous déclarez une guerre, vous pouvez choisir d'appeler également vos alliés dans cette guerre. Si un allié est attaqué, vous recevrez automatiquement un appel aux armes de sa part. Décliner un appel aux armes rompra l'alliance et affectera négativement votre prestige. Chaque alliance coûte des relations diplomatiques à maintenir."
 HINT_MILITARYACCESS_TITLE:0 "Accès militaire"
 HINT_MILITARYACCESS_TEXT:0 "L'accès militaire permet à vos troupes de se déplacer à travers les provinces de l'autre pays. L'accès militaire nécessite un emplacement de relations diplomatiques pour être maintenu."
 HINT_PROVINCE_TITLE:0 "La province"
 HINT_PROVINCE_TEXT:0 "Les provinces sont la mesure principale pour déterminer la puissance et la richesse de votre nation. Les marchandises sont produites dans les provinces, les impôts sont collectés dans les provinces, les régiments sont recrutés dans les provinces et tous les navires et bâtiments sont construits dans les provinces. La richesse d'une province est déterminée par la valeur de taxe de base et le type de marchandises produites."
 HINT_CORE_TITLE:0 "Province légitimée"
 HINT_CORE_TEXT:0 "Les provinces légitimées sont des terres que vous considérez comme légitimement vôtres. Une province qui est légitimée a des revenus fiscaux accrus et vous ne pouvez recruter des régiments et construire des navires que dans les provinces légitimées. Une province peut être transformée en province légitimée en dépensant du pouvoir administratif."
 HINT_RULER_TITLE:0 "Le souverain"
 HINT_RULER_TEXT:0 "Les points de monarque comptent parmi les ressources les plus importantes du jeu. Les points de monarque sont gagnés chaque mois et le montant dépend des compétences de votre souverain et de vos conseillers. Le souverain joue un rôle crucial dans la planification de la spécialisation de votre pays. Si vous êtes une monarchie avec un héritier qui a une compétence diplomatique élevée, vous savez que vous gagnerez beaucoup de pouvoir diplomatique quand l'héritier deviendra le nouveau souverain."
 HINT_HEIR_TITLE:0 "L'héritier"
 HINT_HEIR_TEXT:0 "Les points de monarque de l'héritier prendront effet à la mort du souverain actuel."
 HINT_TRADENODE_TITLE:0 "Nœud commercial"
 HINT_TRADENODE_TEXT:1 "Toute la valeur commerciale des provinces afflue vers le nœud commercial associé. Le monde est divisé en différents nœuds commerciaux et chaque province appartient à un. La valeur commerciale peut s'écouler en aval d'un nœud commercial au suivant. La puissance commerciale est essentielle pour sécuriser des revenus dans un nœud commercial ou pour déterminer quelle quantité de valeur commerciale est orientée en aval. Le commerce ne peut pas être orienté depuis Venise, Gênes ou la Manche."
 HINT_TRADEPOST_TITLE:0 "Comptoir commercial"
 HINT_TRADEPOST_TEXT:0 "Les républiques marchandes ont la possibilité de créer un comptoir commercial dans les provinces qu'elles possèdent ; les comptoirs donnent à la province une puissance commerciale supplémentaire et augmentent les limites de forces navales. Une république marchande ne peut avoir qu'un seul comptoir commercial dans chaque nœud et ne peut pas créer de comptoirs dans son nœud d'origine."
 HINT_FORTDEFENSE_TITLE:0 "Défense du fort"
 HINT_FORTDEFENSE_TEXT:0 "La défense du fort modifie directement le temps entre chaque phase de siège. Une phase de siège dure normalement 30 jours, mais une défense du fort de +50 % augmenterait cela à 45 jours."
 HINT_EMPEROR_TITLE:0 "Empereur d'Anbennar"
 HINT_EMPEROR_TEXT:0 "L'Empereur est un souverain qui est élu à la mort du vieil Empereur. L'Empereur dirige l'Empire d'Anbennar et le protège contre les menaces étrangères. L'Empereur accumule de l'autorité impériale, qui peut être utilisée pour promulguer des réformes impériales. Être l'Empereur comporte des bonus spécifiques selon le nombre de réformes impériales promulguées."
 HINT_ELECTOR_TITLE:0 "Électeur"
 HINT_ELECTOR_TEXT:0 "L'Empereur d'Anbennar est choisi par les électeurs. L'Empire d'Anbennar devrait avoir sept électeurs et en avoir moins fera perdre de l'autorité impériale à l'Empereur. Si un pays électeur cesse d'exister, l'Empereur peut accorder le titre à un nouveau pays."
 HINT_IMPERIALAUTHORITY_TITLE:0 "Autorité impériale"
 HINT_IMPERIALAUTHORITY_TEXT:0 "L'autorité impériale est nécessaire pour que l'Empereur de l'Empire d'Anbennar tente de promulguer des réformes impériales. Une autorité impériale élevée augmentera la probabilité que les pays membres votent en faveur d'une nouvelle réforme impériale. L'autorité impériale est gagnée lorsque l'Empereur maintient l'unité religieuse dans l'Empire et lorsqu'il protège l'Empire d'Anbennar contre les agresseurs étrangers."
 HINT_UNITY_TITLE:0 "Unité religieuse"
 HINT_UNITY_TEXT:0 "L'unité religieuse est déterminée par le pourcentage de toutes les provinces que vous contrôlez qui ont la même religion que votre religion d'État. Vous pouvez envoyer un missionnaire pour convertir la religion d'une province. Une faible unité religieuse augmentera l'agitation dans vos provinces et le coût de stabilité."
 HINT_FIRE_TITLE:0 "Feu de l'unité"
 HINT_FIRE_TEXT:0 "Le feu offensif (pips orange) de l'attaquant est soustrait par le feu défensif (pips verts) du défenseur. Le résultat est ensuite modifié par les commandants et les pénalités de terrain. Un feu offensif élevé signifie qu'une unité aura plus de facilité à infliger des dégâts de feu, tandis que le feu défensif rendra plus facile de résister aux dégâts de feu."
 HINT_SHOCK_TITLE:0 "Choc de l'unité"
 HINT_SHOCK_TEXT:0 "Le choc offensif (pips orange) de l'attaquant est soustrait par le choc défensif (pips verts) du défenseur. Le résultat est ensuite modifié par les commandants et les pénalités de terrain. Un choc offensif élevé signifie qu'une unité aura plus de facilité à infliger des dégâts de choc, tandis que le choc défensif rendra plus facile de résister aux dégâts de choc."
 HINT_UNITMORALE_TITLE:0 "Moral de l'unité"
 HINT_UNITMORALE_TEXT:0 "Le moral offensif (pips orange) de l'attaquant est soustrait par le moral défensif (pips verts) du défenseur. Une fois les dégâts calculés, les dégâts sont infligés au moral et sous forme de pertes. Un moral offensif élevé signifie qu'une unité aura plus de facilité à faire fuir les ennemis, tandis que le moral défensif rendra plus difficile pour les ennemis de faire fuir l'unité."
 HINT_SHOCKMOD_TITLE:0 "Modificateur de choc"
 HINT_SHOCKMOD_TEXT:0 "Pendant la phase de choc et après que le jet de dé et les autres modificateurs ont été additionnés, l'unité effectue une attaque sur une unité ennemie. Le modificateur de choc affecte directement les dégâts infligés au moral et le nombre de pertes infligées."
 HINT_FIREMOD_TITLE:0 "Modificateur de feu"
 HINT_FIREMOD_TEXT:0 "Pendant la phase de feu et après que le jet de dé et les autres modificateurs ont été additionnés, l'unité effectue une attaque sur une unité ennemie. Le modificateur de feu affecte directement les dégâts infligés au moral et le nombre de pertes infligées."
 HINT_MILTAC_TITLE:0 "Tactique militaire"
 HINT_MILTAC_TEXT:0 "La tactique militaire affecte directement le montant de dégâts subis pendant le combat. Plus la valeur est élevée, plus les dégâts sont réduits. De nouveaux niveaux de tactique militaire sont débloqués par la technologie militaire."
 HINT_DISCIPLINE_TITLE:0 "Discipline"
 HINT_DISCIPLINE_TEXT:0 "La discipline affecte directement le montant de dégâts que vos troupes infligent et le montant de dégâts qu'elles subissent pendant le combat. Affecte à la fois les pertes et les dégâts au moral."
 HINT_COMBATWIDTH_TITLE:0 "Largeur de combat"
 HINT_COMBATWIDTH_TEXT:1 "La largeur de combat détermine combien de régiments peuvent combattre en même temps. Une largeur de combat accrue peut être débloquée par la technologie militaire."
 HINT_FORTLVL_TITLE:0 "Niveau du fort"
 HINT_FORTLVL_TEXT:0 "Un niveau de fort plus élevé signifie que le siège prendra plus de temps à se terminer. Le niveau du fort ajoute directement un modificateur négatif à tout jet de siège. Le niveau du fort peut être amélioré en construisant des bâtiments de fort dans la province."
 HINT_SIEGE_TITLE:0 "Siège"
 HINT_SIEGE_TEXT:0 "Un siège commence quand une armée entre dans une province ennemie pendant la guerre. Le siège durera des mois jusqu'à ce que les défenseurs se rendent, selon un certain nombre de valeurs. Une vérification de siège a lieu tous les 30 jours par défaut, et est modifiée par la défense du fort du défenseur et la capacité de siège de l'attaquant. Les forts peuvent être pris d'assaut pour raccourcir le siège, mais au prix de lourdes pertes même si les murs ont été percés."
 HINT_COMBAT_TITLE:0 "Combat terrestre"
 HINT_COMBAT_TEXT:0 "Lorsque deux armées en guerre se rencontrent dans une province, elles démarrent un combat. Le combat est divisé en 2 phases, la phase de feu et la phase de choc. Chaque phase dure 5 jours. Si vous avez un ratio cavalerie/infanterie trop élevé, vous subirez une pénalité de dégâts. L'artillerie est très utile pour réduire les dégâts subis par les unités devant elle et elle peut attaquer depuis la rangée arrière."
 HINT_COMBATADV_TITLE:0 "Combat terrestre (avancé)"
 HINT_COMBATADV_TEXT:0 "Au combat, les deux camps font un jet et l'additionnent avec des modificateurs tels que le terrain et les commandants. Chaque unité attaque une unité ennemie à portée et les pips orange de l'attaquant sont soustraits par les pips verts du défenseur. Le résultat est ensuite divisé par la tactique militaire puis multiplié par la discipline. Le résultat est ensuite utilisé pour calculer les dégâts au moral et les pertes infligées."
 HINT_BREACH_TITLE:0 "Brèche"
 HINT_BREACH_TEXT:0 "Une brèche peut se produire pendant un siège quand le jet de siège est de 14. Une brèche ajoutera jusqu'à 3 au modificateur de progression du siège et facilite l'assaut du fort par les troupes."
 HINT_CANNONS_TITLE:0 "Canons"
 HINT_CANNONS_TEXT:0 "Le nombre de canons sur un navire détermine les dégâts qu'il inflige au combat."
 HINT_HULLSIZE_TITLE:0 "Taille de coque"
 HINT_HULLSIZE_TEXT:0 "La taille de coque réduit le montant de dégâts qu'un navire subit au combat."
 HINT_LEADERFIRE_TITLE:0 "Feu du commandant"
 HINT_LEADERFIRE_TEXT:0 "Le feu du commandant de l'attaquant est soustrait par le feu du commandant du défenseur. Le résultat est ajouté au jet de dé."
 HINT_LEADERSHOCK_TITLE:0 "Choc du commandant"
 HINT_LEADERSHOCK_TEXT:0 "Le choc du commandant de l'attaquant est soustrait par le choc du commandant du défenseur. Le résultat est ajouté au jet de dé."
 HINT_LEADERMANEUVER_TITLE:0 "Manœuvre du commandant"
 HINT_LEADERMANEUVER_TEXT:0 "La manœuvre du commandant affecte la vitesse de déplacement de l'armée ou de la flotte à laquelle le commandant est assigné. Pour les commandants terrestres, la manœuvre réduit également l'attrition et augmente la vitesse de renfort. Pour les commandants navals, elle influence le positionnement de la flotte, et chaque point donne un bonus de puissance commerciale lorsqu'il est assigné à une flotte qui protège un nœud commercial."
 HINT_LEADERSIEGE_TITLE:0 "Siège du commandant"
 HINT_LEADERSIEGE_TEXT:0 "Le siège du commandant vous donne un bonus au jet de siège pendant un siège."
 HINT_MORALE_TITLE:0 "Moral"
 HINT_MORALE_TEXT:0 "Un combat est souvent gagné par la fuite d'un camp, pas par son anéantissement complet. Le moral décide du montant de dégâts au moral qu'une armée peut subir avant de fuir."
 HINT_MANEUVER_TITLE:0 "Manœuvre"
 HINT_MANEUVER_TEXT:0 "La manœuvre décide de la taille de la zone d'engagement pour une unité pendant le combat. L'infanterie commence avec 1 tandis que la cavalerie et l'artillerie commencent toutes deux avec 2. La manœuvre peut être améliorée par la technologie. Cela ne doit pas être confondu avec la manœuvre du commandant, qui est utilisée à d'autres fins."
 HINT_SEACOMBAT_TITLE:0 "Combat naval"
 HINT_SEACOMBAT_TEXT:0 "Lorsque deux flottes en guerre entrent dans la même province, un combat naval commence. Un navire essaiera de trouver une cible et d'effectuer une attaque. Le nombre de canons de l'attaquant affecte les dégâts infligés et la taille de coque du défenseur affecte la réduction des dégâts. Le modificateur de feu d'artillerie donne un bonus ou une pénalité aux dégâts infligés selon que l'attaquant ou le défenseur a un avantage technologique."
 HINT_BREAKUNION_TITLE:0 "Rompre une union"
 HINT_BREAKUNION_TEXT:0 "Un partenaire junior peut utiliser le casus belli Indépendance pour tenter de se libérer. Il proclamera un roi à lui et devra ensuite gagner une guerre contre le chef de l'union. Il doit gagner la guerre pour se libérer. Une paix blanche ne suffira pas."
 HINT_INHERIT_TITLE:0 "Héritage"
 HINT_INHERIT_TEXT:0 "Si vous êtes un chef d'union, vous avez une chance d'hériter du partenaire junior à la mort de votre souverain. Vous devez avoir un prestige positif et un prestige plus élevé que le partenaire junior. Lorsque vous héritez ou intégrez un pays, vous obtiendrez des provinces légitimées dans toutes les provinces."
 HINT_INTEGRATE_TITLE:0 "Intégrer"
 HINT_INTEGRATE_TEXT:0 "Vous pouvez essayer manuellement d'intégrer un partenaire junior dans votre nation si vous êtes le chef de l'union. Les relations entre vos deux pays doivent être excellentes et le partenaire junior doit avoir été dans l'union personnelle pendant au moins 50 ans. Lorsque le processus d'intégration est terminé, vous obtiendrez toutes les provinces du partenaire junior et elles deviendront vos provinces légitimées."
 HINT_POWERPROJECTION_TITLE:0 "Projection de puissance"
 HINT_POWERPROJECTION_TEXT:0 "La projection de puissance représente la manière dont votre nation affirme sa puissance à l'international. Elle s'obtient en sélectionnant des rivaux et en les affaiblissant, directement ou indirectement. Une projection de puissance élevée accorde des points de monarque supplémentaires, car le souverain augmente son autorité grâce à ces succès."
 HINT_POLICIES_TITLE:0 "Politiques"
 HINT_POLICIES_TEXT:0 "Les politiques sont des bonus spéciaux qu'une nation peut activer temporairement. Cinq peuvent être actives à tout moment, mais chacune coûte un point de monarque en entretien chaque mois. Une fois promulguée, une politique ne peut pas être révoquée pendant 10 ans. De nouvelles politiques sont débloquées en complétant des groupes d'idées dans différentes combinaisons."
 HINT_RELIGIOUSREFORMS_TITLE:0 "Réformes religieuses"
 HINT_RELIGIOUSREFORMS_TEXT:0 "Il est nécessaire pour les nations de certaines religions de débloquer des bonus et d'éviter la stagnation en passant une série de réformes religieuses."
 HINT_FACTIONS_TITLE:0 "Factions"
 HINT_FACTIONS_TEXT:0 "Certaines formes de gouvernement, par exemple la république marchande et l'empire céleste, voient des factions politiques rivaliser pour le pouvoir et l'influence. La domination d'une faction se fait aux dépens des autres ; seule la faction dominante donnera ses bonus spécifiques à la nation. Vous pouvez directement modifier l'équilibre des factions en dépensant des points de monarque."
 HINT_NATIVES_TITLE:0 "Natifs"
 HINT_NATIVES_TEXT:0 "Les natifs ont accès à des capacités spéciales telles que migrer vers une autre province et participer à des fédérations."
 HINT_PRIVATEERING_TITLE:0 "Piraterie"
 HINT_PRIVATEERING_TEXT:0 "La piraterie est possible avec toute flotte qui contient des navires légers. Une flotte de pirates ajoutera la puissance commerciale de ses navires légers à une nation pirate dans n'importe quel nœud commercial sélectionné. Contrairement à la mission de protection du commerce, une puissance commerciale existante n'est pas nécessaire dans un nœud commercial pour démarrer une mission de piraterie."
 HINT_IMPROVERELATIONS_TITLE:0 "Améliorer les relations"
 HINT_IMPROVERELATIONS_TEXT:0 "Vous pouvez envoyer un diplomate pour améliorer les relations avec une autre nation. Chaque mois où le diplomate reste actif, leur opinion de vous augmentera jusqu'à atteindre un maximum, après quoi on vous demandera si vous voulez que le diplomate maintienne les relations ou rentre chez lui. Les relations avec les vassaux, marches et partenaires juniors d'union personnelle peuvent être améliorées davantage qu'avec les autres nations."
 HINT_COPTS_TITLE:0 "Coptes"
 HINT_COPTS_TEXT:0 "Coptes."
