l_french:
 # temp loc
 favoured_IC.tempstart.d:0 "Contrairement aux disciples égarés et insensés de la Cour Régente, ceux qui embrassent la véritable Cour ne se contentent pas de se consumer en « réflexions » ou en « prières » pour prouver leur ferveur à leur divinité tutélaire. Non, nous agissons, par des démonstrations de débauche, de cruauté et de malveillance. Des actes particulièrement excessifs peuvent même attirer l'attention de notre Cour et permettre d'obtenir une chance de devenir un « Élevé », une marque prouvant que l'on se tient au-dessus des faibles et des hésitants.\n\nOr donc, nos prêtres estiment qu'une telle chance pourrait être vôtre, mon [Root.Monarch.GetTitle]. Et bien qu'il ne soit guère surprenant que la Cour ait remarqué vos « activités », il ne fait aucun doute que pour mériter la Marque, davantage doit être accompli. En effet, les affaires de l'État devront passer au second plan tandis que la Cour observe vos prochains agissements."
 favoured_IC.tempend.d:0 "Pendant cinq années, vous vous êtes entièrement consacré à votre Patron. Les méfaits commis. Les excès assouvis. La malveillance infligée. Tout cela pour vous et pour votre Patron.\n\nSi les imbéciles vertueux de la Cour Régente devaient contempler votre âme noire, ils en resteraient bouche bée d'horreur. Et c'est peut-être pour cette raison que vous vous tenez désormais en Élevé. Car là où d'autres reculent à la simple pensée de ce que vous avez accompli, vous, vous souriez simplement."
 favoured_IC.temp.a:0 "« Je suis Élevé. »"

 favoured_ic_tt:0 "À l'issue d'une saine complaisance, §Y[Root.Monarch.GetName]§! obtiendra :"
 favoured_IC.1.t:0 "Favorisé par les Archidiables : Kazraiel"
 favoured_IC.1.d:0 "Contrairement aux disciples égarés et insensés de la Cour Régente, ceux qui embrassent la véritable Cour ne se contentent pas de se consumer en « réflexions » ou en « prières » pour prouver leur ferveur à leur divinité tutélaire. Non, nous agissons, par des démonstrations de débauche, de cruauté et de malveillance. Des actes particulièrement excessifs peuvent même attirer l'attention de notre Cour et permettre d'obtenir une chance de devenir un « Élevé », une marque prouvant que l'on se tient au-dessus des faibles et des hésitants.\n\nOr donc, nos prêtres estiment qu'une telle chance pourrait être vôtre, mon [Root.Monarch.GetTitle]. Et bien qu'il ne soit guère surprenant que la Cour ait remarqué vos « activités », il ne fait aucun doute que pour mériter la Marque, davantage doit être accompli. En effet, les affaires de l'État devront passer au second plan tandis que la Cour observe vos prochains agissements."
 favoured_IC.1.a:0 "Je me consacrerai à l'émulation de Kazraiel, le Maître de Guerre."
 favoured_IC.1.b:0 "Je me consacrerai à l'émulation de Kazraiel, le Subjugateur."
 favoured_IC.1.c:0 "Kazraiel m'honore peut-être de sa faveur, mais je n'ai pas le temps de me livrer à des années de contemplation religieuse."

 favoured_IC.2.t:0 "Élevé du Maître de Guerre"
 favoured_IC.2.d:0 "Pendant cinq années, vous vous êtes entièrement consacré à votre Patron. Les méfaits commis. Les excès assouvis. La malveillance infligée. Tout cela pour vous et pour votre Patron.\n\nSi les imbéciles vertueux de la Cour Régente devaient contempler votre âme noire, ils en resteraient bouche bée d'horreur. Et c'est peut-être pour cette raison que vous vous tenez désormais en Élevé. Car là où d'autres reculent à la simple pensée de ce que vous avez accompli..."
 favoured_IC.2.a:0 "...vous, vous souriez simplement."

