#Battlemages
 warmage_tooltip1: "You can now recruit §GBattle Mage§! generals without requiring the §GBattle Mage Academy§! great project."
 warmage_tooltip2: "Recruiting a mage general is improved: bonuses are calculated as if you had §GTier 1 of the Battle Mage Academy§! magic project."
 warmage_tooltip3: "Recruiting a mage general is improved: bonuses are calculated as if you had §GTier 2 of the Battle Mage Academy§! magic project."

#Conjuration with MM
 conjuration_1_summon_hellhounds_1_spell_effect_tt: "Gain access to the §YHellhounds§! mercenary company for §Y5§! years. They do NOT count towards your §YForce Limit§!.\nThis company has a maximum size of §Y20§! regiments, consisting entirely of §YCavalry§!.\nFrom the §YHellhounds§! traditions:\n   Discipline: §R-10.0%§!\n   Cavalry Shock: §G+1§!\n   Maximum Cavalry-to-Infantry Ratio: §G100%§!\n   Land Attrition: §G-25.0%§!.\n"
 conjuration_1_summon_hellhounds_2_spell_effect_tt: "Gain access to an improved §YHellhounds§! mercenary company for §Y5§! years. They do NOT count towards your §YForce Limit§!.\nThis company has a maximum size of §Y40§! regiments, consisting entirely of §YCavalry§!.\nFrom the §YHellhounds§! traditions:\n   Discipline: §R-10.0%§!\n   Cavalry Shock: §G+3§!\n   Maximum Cavalry-to-Infantry Ratio: §G100%§!\n   Land Attrition: §G-25.0%§!.\n"

 merc_hellhounds_1: "Hellhounds"
 merc_hellhounds_2: "Hellhounds"
 MM_animal_tt_3: "Empowers the §GSummon Animals§! spell, granting access to summoning §YHellhounds§! — ferocious giant hyenas imbued with hellish energy.\n§H(Gameplay: a powerful cavalry)§!"
 MM_animal_tt_2: "Further empowers the §GSummon Hellhounds§! spell: increases unit size and improves combat characteristics."
 conjuration_1_summon_hellhounds_mod_1: "Summon Hellhounds"
 conjuration_1_summon_hellhounds_mod_2: "Summon Hellhounds"

