 desc_dwindling_prince_autonomy:0 "Grâce aux politiques intégrationnistes étendues de l'Empereur, l'Empire est désormais entier, mais une certaine influence résiduelle des princes subsiste encore, l'Empereur s'étant engagé à assurer leur soutien en offrant de petites compensations pour une durée limitée."
 eoa_extra_prosperity:0 "Loi De Jure Anbennarienne"
