 ###GOVERNMENT REFORMS###
 imperial_parliament_reform:0 "Parlement Impérial d'Anbennar"
 imperial_parliament_reform_desc:0 "L'Organe Suprême de Gouvernance dans l'Empire d'Anbennar. Ici, les questions transmises par l'Empereur seront discutées et votées par les princes impériaux. Les Princes-Électeurs disposent chacun de deux voix, tandis que les représentants appartenant au collège des Villes Libres n'ont pas de voix, conformément à leur accord de ne pas s'immiscer dans la Politique Impériale."
 ability_anb_imperial_parliament:0 "Parlement Impérial"
 monthly_imperial_parliament_support:0 "Gain Mensuel de Soutien"
 imperial_parliament_support_gain_modifier:0 "Modificateur de Gain de Soutien"
 imperial_parliament_support:0 "Signatures"
 nobles_of_the_wand_reform:0 "Promouvoir les Nobles de la Baguette"
 nobles_of_the_wand_reform_desc:0 "Renforcez la noblesse magique et étendez ses capacités à gouverner au nom du monarque. Ils aideront également à instruire nos héritiers, augmentant la probabilité qu'ils deviennent de puissants mages à l'avenir."
 damerian_monarchy_aristo_path:0 "Monarchie Damérienne"
 damerian_monarchy_aristo_path_desc:0 "La Monarchie Damérienne est une monarchie représentative, avec un parlement convoqué régulièrement par le monarque régnant. Elle repose sur des traditions transmises depuis l'époque de la République Damérienne."
 imperial_marquis_reform:0 "Marquis"
 imperial_marquis_reform_desc:0 "Les rangs de Marquis sont réservés aux princes puissants au sein de l'Empire qui peuvent lever une force considérable et l'employer pour défendre l'Empire. Cette position s'accompagne de plusieurs avantages tels que l'autorisation d'augmenter le recrutement et le financement des réparations de forts et châteaux."
 ##Parliament Issues
 eoa_princely_support:0 "Le soutien des Princes Impériaux est très important si nous voulons faire adopter cette question !\nCela dépend du nombre de princes ayant actuellement au moins 50 d'opinion positive envers l'Empereur.\n§R9 ou moins§! est considéré comme très faible et a une §Rtrès faible chance§! d'obtenir les effets désirés.\n§YEntre 9 et 20§! est considéré comme un soutien moyen et donne une §Ychance moyenne§! de succès.\n\n§GPlus de 20§! princes nous soutenant §Ggarantira le succès§!.\n\nVous êtes soutenu par §Y[Root.get_eoa_prince_support]§! Princes, et cette question a [Root.EoaPrincelySupportChance]."
 eoa_princely_support_low:0 "§R10 %§! de chances de succès"
