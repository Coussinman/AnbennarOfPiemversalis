l_french:

 #HRE_REFORM_PATHS_MUTUALLY_EXCLUSIVE:0 "Magocratic Reforms and Aristocratic Reforms are mutually exclusive paths. The Emperor can only go down one path!\n\nA Magocratic Anbennar would focus on increasing the absolute power of the Emperor through empowering the mages and entrenching their positions in the Empire's wider powerstructure.\n\nAn Aristocratic Anbennar would delegate power to regional authorities and work towards unification with a federative approach."
 #HRE_LEFTBRANCH:0 "Magocratic"
 #HRE_RIGHTBRANCH:0 "Aristocratic" >>>>>>>>>>>>>>>>>>>>>> IF YOU WANNA CHANGE THESE GO TO emperor_l_english (civi)
 ###parliament###
 #emperor_parliament_name:0 "Imperial Parliament"
 eoa_imperial_parliament.tt:0 "§YMécanique de l'Empire d'Anbennar§! :\nActive des enjeux uniques liés à l'Empire d'Anbennar, menant à terme à §Tl'unification de l'Empire sous une seule bannière !§!"
 ###REFORMS###
 anbennar_call_for_reforms_title:0 "Appel aux Réformes"
 anbennar_imperial_adventurer_companies_title:0 "Parrainer les Compagnies Impériales d'Aventuriers"
 anbennar_guarantee_temple_rights_title:0 "Garantir les Droits des Temples"
 anbennar_reinforce_imperial_frontiers_title:0 "Renforcer les Frontières Impériales"
 anbennar_permanent_parliament_title:0 "Établir un Parlement Permanent"
 anbennar_imperial_dynasty_title:0 "Établir une Dynastie Impériale"
 anbennar_form_anbennar_title:0 "Unifier l'Empire !"
 ###REFORM DESC###
 anbennar_call_for_reforms_desc:0 "Depuis les Guerres de Succession, l'Empire d'Anbennar s'est dressé, inébranlable, contre les forces chaotiques qui menacent nos frontières. Mais ces dernières décennies, l'administration impériale s'est alourdie, les tensions croissantes entre nobles et mages engendrent des conflits violents, et une pourriture interne ronge l'Autorité Impériale.\n\nQu'on ne s'y trompe point : nous sommes en lent déclin. Cependant, si nous embrassons des réformes ambitieuses et rapides, nous pourrons peut-être enrayer, voire inverser cette décadence.\n--------------"
 anbennar_imperial_adventurer_companies_desc:0 "Les aventuriers ont été tantôt bénédiction, tantôt fléau pour les souverains désespérés à travers l'histoire. Ils se proclament héros, mais ne sont guère plus que des bandes de mercenaires. Nul ne peut cependant nier l'utilité de ces guerriers téméraires et sacrifiables ; nombre de princes impériaux engagent ces compagnies d'aventuriers pour leurs guerres.\n\nIl serait avantageux de formaliser l'engagement de ces guerriers et d'assouplir certaines exigences. En reconnaissant officiellement quelques-unes comme compagnies d'aventuriers agréées par l'Empire, nous pourrons négocier leurs coûts exorbitants et renforcer les princes impériaux.\n--------------"
 anbennar_guarantee_temple_rights_desc:0 "Tandis que la Réforme Corinite fait rage, les Temples Impériaux s'inquiètent de leur place au sein de l'Empire. Nous devons les rassurer quant à leur souveraineté, mais plus encore, nous pouvons user de l'influence et du pouvoir des temples pour tempérer les flammes du conflit religieux.\n\nL'Empereur proclamera un édit garantissant les droits des temples et davantage d'autonomie dans leurs fonctions quotidiennes. Mais l'administration impériale entend promouvoir une ouverture d'esprit, même parmi nos clercs les plus zélés. Puissent-ils répondre à notre grâce avec la même bienveillance.\n--------------"
 anbennar_reinforce_imperial_frontiers_desc:0 "L'Aigle gawedi plane au nord et la Rose lorentaise cherche à nous étrangler depuis l'ouest, parmi d'autres menaces. Les défenses de l'Empire s'effritent et les armées ennemies nous menacent de toutes parts. Mais en concentrant les ressources de l'Empire sur le renforcement de ses frontières et en fournissant un approvisionnement régulier en troupes fraîches et matériel à nos marches, nous serons en mesure d'opposer une défense formidable.\n--------------"
 anbennar_permanent_parliament_desc:0 "Convoquer le Parlement Impérial représente un défi logistique considérable qui entrave notre capacité à répondre aux crises affectant l'Empire. Si nous proclamions une résidence permanente pour le Parlement, dotée de représentants pour chaque prince impérial communiquant avec leurs suzerains par pierre messagère, nous pourrions avoir un Empire capable de répondre aux défis les plus terribles dans l'instant.\n--------------"


 #mage path
 anbennar_nobles_of_the_wand_title:0 "Établir les Nobles de la Baguette"
 anbennar_enable_magisterium_governance_title:0 "Autoriser la Gouvernance du Magisterium"
 anbennar_erelas_doctrine_title:0 "Le Grand Geas"
 anbennar_regulate_artificery_title:0 "Réglementer l'Artisanat Magique"
 anbennar_imperial_wizards_title:0 "Ordre des Mages de Guerre Impériaux"
 anbennar_mages_peace_title:0 "Consacrer la Paix des Mages"
 anbennar_imperial_dynasty_desc:0 "En 1421, la Bataille du Conseil Lunaire éclata, se soldant par la mort d'électeurs, une tentative d'assassinat sur le candidat impérial Adenn Lanceciel, et une guerre qui dura deux décennies, manquant de détruire l'Empire d'Anbennar. Tout cela à cause de ces jeux politiques violents autour des Élections Impériales.\n\nSi nous déclarions plutôt le titre d'Empereur héréditaire, ces intrigues politiques qui gangrènent l'Empire seraient entravées. Cependant, cela exigerait aussi la soumission immédiate des princes impériaux, qui devraient plier le genou devant l'Empereur. L'Histoire serait en marche si cette décision passait devant le Parlement Impérial.\n--------------"
 anbennar_nobles_of_the_wand_desc:0 "En raison de l'influence toujours croissante des classes élitaires de l'Empire, un équilibre précaire s'est établi entre les princes impériaux et les mages. Plus souvent qu'autrement, cela a dégénéré en compétition et intrigues politiques violentes, les mages ayant récemment pris l'avantage. Si l'Empereur renforçait le pouvoir des mages au sein de la classe noble, peut-être cet équilibre pourrait-il être entièrement rompu, la faction magique dominante prenant le contrôle.\n--------------"
 anbennar_enable_magisterium_governance_desc:0 "Le Magisterium est l'un des piliers fondamentaux de l'Empire. Créé après les Guerres de Succession pour consolider l'influence des mages et collaborer avec l'Empire pour gouverner Anbennar, il a été un acteur clé dans la régulation et le contrôle des affaires magiques impériales. Leur règne a vraisemblablement empêché de nombreux sorciers noirs d'accéder au pouvoir.\n\nSi le financement était augmenté, si les privilèges étaient transférés de l'organisation noble rivale, l'Orda Aldresia, vers le Magisterium, et si ces mages obtenaient la capacité de prendre des mesures exécutives dans les disputes impériales, l'Empire pourrait entamer une nouvelle ère de puissance magique.\n--------------"
 anbennar_erelas_doctrine_desc:0 "Des temps difficiles planent sur l'Empire, et en réponse, l'Empereur envisage désormais un décret audacieux de centralisation. La proposition : lancer un Geas, un sortilège ancien et contraignant, sur les serviteurs impériaux et ceux ayant le potentiel d'être les yeux de l'Empereur aux quatre coins de l'Empire, des chambres du palais aux frontières lointaines d'Arbaran. Ce sortilège imposerait un devoir indéfectible envers la volonté de l'Empereur, forgeant la discipline par des moyens arcaniques.\n\nLes détracteurs avertissent qu'un tel acte frôle la coercition, risquant de compromettre la confiance des Princes Impériaux et de perturber le délicat équilibre de loyauté au sein du royaume. Les partisans arguent que cela unifierait le commandement et priverait de pouvoir ceux qui menacent l'Empire de l'intérieur ou de l'extérieur. Alors que le débat touche à sa fin, tous les regards se tournent vers le trône : la décision finale appartient à l'Empereur.\n--------------§!"
 anbennar_regulate_artificery_desc:0 "La création de l'Artisanat Magique fut d'abord une perspective enthousiasmante, mais de nombreux mages qualifient ces inventions de contre-nature. Beaucoup expriment même l'intention d'interdire purement et simplement cette pratique pour hérésie. D'une certaine manière, le djinn est sorti de la lampe et l'Empire ne parviendra probablement pas à éliminer complètement l'Artisanat Magique ; cependant, des limites peuvent être imposées.\n\nLe parlement a soumis une loi à l'Empereur, réglementant l'Artisanat Magique et accordant à plusieurs organisations de mages l'autorité de limiter ces pratiques partout dans l'Empire. Les opposants arguent qu'il s'agit d'une prise de pouvoir éhontée par les mages, craignant de perdre leur emprise sur la magie face à l'innovation. Il appartient à l'Empereur de promulguer ou de rejeter cette loi.\n--------------"
 anbennar_imperial_wizards_desc:0 "L'Académie Impériale des Mages de Guerre à Anbenncóst a été un centre d'apprentissage pour l'Empire, mais ces dernières décennies, elle a opté pour une approche plus académique. L'intention originelle était de former des mages de guerre pour l'Empire, pour combattre et tuer au nom d'Anbennar. Cette intention s'est égarée, et l'Empereur entend revitaliser l'académie.\n\nEn établissant l'Ordre des Mages de Guerre Impériaux, en réorganisant l'Académie et en dirigeant les diplômés vers l'Ordre, l'Empire peut disposer d'un approvisionnement constant de mages de bataille puissants et zélés, prêts à servir.\n--------------§!"
 anbennar_mages_peace_desc:0 "Jamais depuis les Guerres de Succession les mages de l'Empire n'ont été aussi puissants. Indomptables et inattaquables, ces mages sont loyaux à l'Empereur et remettent en question les incessantes manœuvres politiques, coups dans le dos et querelles de la Noblesse Impériale.\n\nLe Grand Magistère suggère de démontrer le nouveau pouvoir des mages aux princes. Plus de politique impériale, plus de guerres douteuses, seulement la loi de la magie.\n--------------"
 anbennar_form_anbennar_desc:0 "Unifiez l'Empire d'Anbennar sous une seule bannière !\n--------------"


 #noble path
 anbennar_expand_marquis_rank_title:0 "Étendre le Rang de Marquis"
 anbennar_expand_marquis_rank_desc:0 "L'Empire souffre sur tous les fronts, notamment de sa domination militaire déclinante. Avec l'Escann en plein essor, l'Aigle du Nord aux aguets et la Rose de l'Ouest en pleine floraison, l'Empereur s'évertue à consolider les défenses impériales.\n\nLe Parlement Impérial a proposé l'extension du titre de Marquis. Un titre et une désignation militaires pour les puissants Princes Impériaux, il confère des privilèges et le devoir de protéger l'Empire contre toutes les menaces. La législation doit bientôt être présentée à l'Empereur, et elle suggère même d'inviter de nouvelles puissances dans l'Empire sous cette désignation.\n--------------"
 anbennar_internal_divisions_title:0 "Formaliser les Divisions Administratives Internes"
 anbennar_internal_divisions_desc:0 "Le temps est venu de réformer le système administratif fracturé de l'Empire !\n--------------"
 anbennar_electoral_council_title:0 "Égaliser le Collège des Électeurs"
 anbennar_electoral_council_desc:0 "Les Guerres de Succession, un terrible affrontement entre mages et seigneurs, se terminèrent par la Paix des Mages et l'établissement du Magisterium comme Électeur au sein de l'Empire. Cependant, depuis lors, les mages ont cherché à étendre leur pouvoir au fil des siècles. Les nobles, en réponse, tentent de contrer le pouvoir des mages, et récemment, une proposition de loi suggère d'élargir le Collège des Électeurs.\n\nDans un défi direct à l'autorité du Magisterium, les nobles proposent d'élever l'Orda Aldresia au rang de huitième électeur. Un ordre de chevaliers-mages nobles, ils sont les rivaux du Magisterium et menacent de faire basculer le statu quo en faveur de la noblesse. Même si les chevaliers-mages ne sont pas choisis, un huitième électeur à lui seul diluerait l'influence politique des mages.\n--------------"
 anbennar_imperial_embassies_title:0 "Établir des Ambassades Impériales"
 anbennar_imperial_embassies_desc:0 "L'Empire d'Anbennar, sur le papier, est une entité unifiée qui agit de concert. En pratique, ce sont des dizaines de princes querelleurs qui pétitionnent tous l'Empereur sur les conflits internes les plus infimes, qu'ils soient politiques ou commerciaux. Cela détourne l'Empereur des menaces et situations extérieures plus pressantes.\n\nUn électeur suggère que l'Empereur autorise l'établissement d'Ambassades Impériales parmi les princes. Cela déléguerait le pouvoir de gérer diplomatiquement leurs différends entre eux et libérerait la Cour Impériale pour traiter plus efficacement avec les puissances extérieures.\n--------------§!"
 anbennar_empower_imperial_diet_title:0 "Élever la Diète Impériale"
 anbennar_empower_imperial_diet_desc:0 "La Diète Impériale peut être une institution frustrante pour la noblesse impériale. Elle peut proposer, suggérer, donner un avis, mais elle n'a aucun pouvoir légal réel. Pour les mages, c'est un statu quo bienvenu, mais même pour les Empereurs, c'est une impasse pour toute initiative noble réelle. Si le parlement était investi d'un véritable pouvoir légal, l'Empereur pourrait rallier une noblesse unie pour affronter tout problème domestique ou juridique, indépendamment de l'opinion des mages.\n--------------"
 anbennar_imperial_war_title:0 "Guerre Impériale du Royaume !"
 anbennar_imperial_war_desc:0 "« Par ta sagesse, fais de moi un bouclier indestructible, une épée étincelante, une forteresse indomptable protégeant et guidée par le rêve d'Anbennar. » — Serment de l'Orda Aldresia\n--------------"
 anbennar_aristo_revoke_title:0 "Arheta Anbennar !"
 anbennar_aristo_revoke_desc:0 "Vivre dans l'Empire aujourd'hui, c'est être d'abord Anbennarien, mage, noble, marchand ou soldat ensuite. Les anciennes étiquettes comptent encore, mais elles ne nous définissent plus. Ce qui jadis fracturait notre société est devenu le cœur de notre unité. Les longues épreuves que nous avons endurées n'ont pas effacé nos différences, mais les ont tissées en une seule identité, résiliente. La loyauté n'est plus due uniquement à une maison, une guilde ou un credo : elle est due à quelque chose de plus grand, l'Empire lui-même. Dans chaque province et chaque quartier, une voix nouvelle s'élève, non pas comme de nombreuses voix discordantes, mais comme une seule, résolue et anbennarienne. Car Anbennar est, à la fin de toutes choses : Éternel.\n\nArheta Anbennar !\n\nArheta Anbennar !\n\nArheta Anbennar !\n--------------"
 anbennar_aristo_unite_title:0 "Unifier l'Empire !"
 anbennar_aristo_unite_desc:0 "Créez un Empire plus unifié !\n--------------"


 ###EVENTS###
 flavour_eoa_reforms.1.t:0 "L'Empereur Garantit les Droits des Temples"
 flavour_eoa_reforms.1.d:0 "« Oyez, oyez ! »\n\n\nLes crieurs de Tellum ont annoncé la promulgation d'une nouvelle loi : le Parlement Impérial a confirmé les droits des temples dans l'Empire, garantissant le statut immédiat des princes ecclésiastiques envers l'Empire et l'Empereur. Les envoyés de l'Empereur ont été dépêchés auprès de chaque prince de l'Empire pour exiger leur reconnaissance de cette décision."
 flavour_eoa_reforms.1.a:0 "L'Empereur les protège… ?"
 flavour_eoa_reforms.1.b:0 "Bénédictions sur l'Empereur !"
 flavour_eoa_reforms.1.c:0 "Que ma volonté soit faite."
 flavour_eoa_reforms.1.e:0 "Pour la gloire de l'Empire ! Mais… nous serons compensés pour cela, n'est-ce pas… ?"
 flavour_eoa_reforms.1.f:0 "Nous avons nos propres privilèges."
 flavour_eoa_reforms.2.t:0 "Les Nobles de la Baguette"
 flavour_eoa_reforms.2.d:0 "La capacité magique a longtemps été considérée comme un signe traditionnel de noblesse dans les terres qui allaient former l'Empire d'Anbennar. On disait, et on dit encore, que la magie était un signe de la volonté manifeste des dieux, que cette bénédiction divine, qui accordait le droit de régner, pouvait se transmettre par le sang, formant ainsi le fondement d'une aristocratie pratiquant la magie. Mais quand Délian Manteau-Blanc fonda l'Empire, tout fut bouleversé : la magie n'était pas accordée aux nobles pour signifier leur position bénie des dieux, mais plutôt la noblesse était conférée aux grands mages qui avaient contribué à la création d'Anbennar, et qui devaient assumer les positions et titres des maisons nobles et dynasties de seigneurs de guerre détruites dans le processus.\n\nL'Empereur [Emperor.Monarch.GetName] a promulgué la restauration de cette pratique ancienne, établissant une nouvelle classe de Nobles de la Baguette, recrutés parmi ceux dont le pouvoir magique exceptionnel leur a valu les droits de la noblesse. De nombreux magistères et mages de bataille éminents de tout l'Empire assistaient à la première cérémonie d'anoblissement à Anbenncóst, où ils jurèrent de défendre le rêve d'Anbennar et d'être fidèles et loyaux à l'Empereur et à l'Empire."
 flavour_eoa_reforms.2.a:0 "Les mages sont satisfaits de cette évolution, mais où se situeront leurs véritables loyautés ?"
 flavour_eoa_reforms.2.b:0 "[Root.Monarch.GetName] [Root.Monarch.GetHerselfHimself] était naturellement présent(e)."
 flavour_eoa_reforms.3.t:0 "La Loi Spéciale Encadrant les Praticiens de l'Artisanat Magique"
 flavour_eoa_reforms.3.d:0 "D'un trait de plume, l'Empereur a restauré l'ordre à Anbennar ! Désormais, tous les artificiers, leurs ateliers, leurs employés et tous leurs associés doivent être pleinement agréés et supervisés par les autorités magiques locales, et conformes au maximum à un vaste ensemble de règles et règlements. Cet arrêté est promulgué pour assurer la sécurité de tous les citoyens impériaux et un accès équitable à la Damestear et autres réactifs magiques pour tous les mages !\n\nDe plus, un processus spécial de brevets sera mis en œuvre pour s'assurer que les artificiers renégats ne mettent pas en danger la santé ou la stabilité du marché avec leur concurrence dangereuse et franchement contre-nature. Toutes leurs œuvres seront enregistrées auprès du Magisterium, et les dispositifs les plus dangereux jugés trop périlleux seront, bien sûr, interdits, et leur fabrication sévèrement punie. Le Magisterium a été chargé d'assurer la pleine conformité à cette loi dans tout l'Empire, et son budget a été augmenté pour répondre à ses besoins accrus en personnel et ressources pour faire appliquer ce mandat."
 flavour_eoa_reforms.3.a:0 "Il n'y a qu'une seule lumière de l'invention, et les mages ont tiré un rideau devant elle."
 flavour_eoa_reforms.3.b:0 "Tenter de trouver un compromis !"
 flavour_eoa_reforms.4.t:0 "L'Ordre des Mages de Guerre Impériaux"
 flavour_eoa_reforms.4.d:0 "La jeune mage s'inclina et présenta un parchemin scellé. Son contenu l'identifiait comme une récente diplômée de l'Académie Impériale des Mages de Guerre d'Anbenncóst, et comme membre certifiée du nouvel Ordre des Mages de Guerre Impériaux. Ce plus récent édit de l'Empereur, établissant ledit Ordre, avait causé quelque consternation à travers l'Empire, certains, y compris plusieurs conseillers de [Root.Monarch.GetName], arguant que cela constituait une nouvelle intrusion inquiétante des magocrates. « Comme si le Grand Geas n'était pas allé assez loin », comme le formula un conseiller. « Le Magisterium a raflé les meilleurs mages de guerre de tout l'Empire, et nous récupérons leurs rebuts ! »\n\nMais cette jeune mage au visage candide, désireuse d'assister les troupes régulières et, plus important, désireuse de faire ses preuves sous la chaîne de commandement ordinaire en tant que mage de bataille puissante et tant nécessaire, ne semblait guère être une agente du contrôle magocratique. Son comportement enjoué semblait presque contagieux, inspirant les troupes à servir leur suzerain de leurs meilleurs efforts. Comme elle ne se lassait pas de proclamer, l'Ordre des Mages de Guerre Impériaux n'était là que pour aider !"
 flavour_eoa_reforms.4.a:0 "Ils semblent dignes de confiance !"
 flavour_eoa_reforms.5.t:0 "La Seconde Paix des Mages"
 flavour_eoa_reforms.5.d:0 "« Mes amis, princes compagnons, peuples de l'Empire : je vous félicite. Enfin, il y a la paix. Enfin, les guerres entre nous ont pris fin. Enfin, nous sommes véritablement unis en pensée et en acte.\n\nIl y a des siècles, un groupe de mages extraordinaires partageait le rêve que leurs capacités extraordinaires pouvaient accomplir une fin extraordinaire : un royaume uni, en paix. Ils renversèrent les seigneurs de guerre de l'Interrègne et bâtirent cet Empire. Il perdura, un temps. La négligence, la vanité, l'avidité, les querelles mesquines, les vendettas sanglantes et les ennemis étrangers, tous cherchèrent à déchirer cet Empire.\n\nMais je vous félicite. Nous nous sommes souvenus d'où nous venions. Nous nous sommes souvenus du pouvoir de la magie. Nous nous sommes souvenus de ce qui peut être accompli avec la volonté d'utiliser ce pouvoir. Et maintenant, il y a la paix. L'Empire est entier. Nous avons persévéré ! Contre toute attente, nous avons vaincu ! »\n\nLes paroles de l'Empereur ont été promulguées dans tout l'Empire. Il n'y aura plus de guerres entre les Princes de l'Empire, et tous les conflits en cours seront rapidement résolus par la puissance de l'Ordre des Mages de Guerre Impériaux. Tous les différends entre les princes seront désormais renvoyés aux tribunaux impériaux."
 flavour_eoa_reforms.5.a:0 "… Nous ferions mieux de consulter un bon avocat à Crothán…"
 flavour_eoa_reforms.6.t:0 "Maréchal de l'Empire"
 flavour_eoa_reforms.6.d:0 "Alors que [Emperor.Monarch.GetTitle] [Emperor.Monarch.GetName] poursuit le processus de Réforme Impériale, [Emperor.Monarch.GetSheHe] a constamment dû s'appuyer sur les maisons nobles de l'Empire pour obtenir du soutien. Toute réforme requiert donc le soutien de l'aristocratie impériale.\n\nLe Parlement Impérial a désormais présenté une loi au Trône de la Colombe pour établir plusieurs hautes fonctions supervisant les diverses fonctions du gouvernement impérial, chacune de ces charges étant la responsabilité héréditaire d'un prince particulier. Tandis que certaines de ces nominations se feront sans contestation, comme conférer au Comte de Konwell une série officielle de responsabilités pour les Archives Impériales ou accorder des rôles purement cérémoniels, une fonction particulière est controversée : celle de Maréchal de l'Armée Impériale, une évolution de la charge de Maréchal de l'Empire. Le Maréchal de l'Armée Impériale commandera les forces militaires conjointes de l'Empire, ce qui en fait, évidemment, une position à ne pas confier à la légère.\n\nLe titre de Maréchal de l'Empire appartient depuis longtemps au Duc d'Istralore, mais c'est l'occasion soit de trouver un candidat plus approprié… soit d'honorer les droits traditionnels d'Istralore."
 flavour_eoa_reforms.6.k:0 "Cela requiert mûre réflexion… Redemandez dans un an."
 flavour_eoa_reforms.6.l:0 "… Pourquoi quelqu'un d'autre commanderait-il l'Armée Impériale ?"
 flavour_eoa_reforms.6.a:0 "La charge appartient à Istralore et demeurera à Istralore."
 flavour_eoa_reforms.6.b:0 "Verne. Peut-être qu'un jour ils s'envoleront…"
 flavour_eoa_reforms.6.c:0 "Non pas un maréchal de campagne, mais un maréchal de flotte. À Neckcliffe elle ira !"
 flavour_eoa_reforms.6.e:0 "Nous pouvons compter sur la fureur alénique de Sugamber."
 flavour_eoa_reforms.6.f:0 "Wex doit régner ! L'armée, s'entend."
 flavour_eoa_reforms.6.g:0 "Il serait injuste, scandaleux même, de ne pas choisir le Grand Maître Aldrésien."
 flavour_eoa_reforms.6.h:0 "Les Chevaliers de Cestirande chevaucheront avec nous !"
 flavour_eoa_reforms.6.i:0 "Imaginez un maréchal avec des décennies, des siècles d'expérience. Ibevar, bien sûr !"
 flavour_eoa_reforms.6.j:0 "Qui de mieux que le gardien du Détroit ? Au Bord-de-Perles !"
 flavour_eoa_reforms_marshall_permanent:0 "Nommer un Maréchal Impérial §GPermanent§! !"
 eoa_a45_marsh:0 "Choisir Istralore nous accordera les modificateurs suivants :\n\nDégâts de choc §G+10 %§!\nEffectifs dans les provinces de vraie foi §G+10 %§!"
 flavour_eoa_reforms.6.a45:0 "Nous sommes et serons toujours le Maréchal légitime !"
 eoa_a33_marsh:0 "Choisir Verne nous accordera les modificateurs suivants :\n\nTradition navale annuelle §G+1§!\nFeu de l'artillerie §G+0,25§!"
 eoa_a22_marsh:0 "Choisir Neckcliffe nous accordera les modificateurs suivants :\n\nCapacité de combat des vaisseaux lourds §G+10 %§!\nDégâts depuis l'arrière §G+10 %§!"
 eoa_a48_marsh:0 "Choisir Sugamber nous accordera les modificateurs suivants :\n\nFeu de la cavalerie §G+0,25§!\nCoût de la technologie militaire §G-5 %§!"
 eoa_a30_marsh:0 "Choisir Wex nous accordera les modificateurs suivants :\n\nCapacité de combat de l'infanterie §G+10 %§!\nTradition militaire annuelle §G+0,5§!"
 eoa_a77_marsh:0 "Choisir l'Orda Aldresia nous accordera un §Ogénéral Mage de Guerre§! ainsi que les modificateurs suivants :\n\nInfluence de l'État des Mages §Y+5 %§!\nChoc de l'infanterie §G+0,15§!"
 eoa_a98_marsh:0 "Choisir Cestirande nous accordera les modificateurs suivants :\n\nCapacité de combat de la cavalerie §G+15 %§!\nModificateur de limite de forces terrestres §G+10 %§!"
 eoa_a32_marsh:0 "Choisir Ibevar nous accordera les modificateurs suivants :\n\nDégâts de feu terrestres §G+5 %§!\nVitesse de déplacement §G+10 %§!"
 eoa_a11_marsh:0 "Choisir le Bord-de-Perles nous accordera les modificateurs suivants :\n\nModificateur de canons de navire §G+10 %§!\nModificateur de limite de forces navales §G+10 %§!"
 flavour_eoa_reforms.7.t:0 "Élévation au Rang de Marquis"
 flavour_eoa_reforms.7.d:0 "L'Empereur nous a invités à rejoindre les rangs des Marquis et à défendre l'empire.\n\nLe titre de Marquis est réservé aux princes puissants au sein de l'Empire qui peuvent lever une force considérable et l'employer pour défendre l'Empire. Cette position s'accompagne de plusieurs avantages tels que l'autorisation d'augmenter le recrutement et le financement des réparations de forts et châteaux."
 flavour_eoa_reforms.7.a:0 "Ce serait un honneur !"
 flavour_eoa_reforms.7.b:0 "Nous avons d'autres projets."
 flavour_eoa_reforms.8.t:0 "Attribution des Divisions Internes"
 flavour_eoa_reforms.8.d:0 "Chaos et désordre : voilà ce qu'est devenue l'Administration Impériale depuis le début de la Guerre Lilas. Des dizaines de princes impériaux et des centaines de leurs suites rivalisant pour des audiences, des compromis judiciaires sur des différends et la faveur de l'Empereur dans l'administration de leurs terres.\n\nLa Cour Impériale ploie sous le poids de chaque région, et la décentralisation est donc envisagée. L'Empereur contemple une forme d'auto-gouvernance régionale. En divisant l'Empire en différentes cours, celles-ci pourront traiter entre elles les problèmes locaux tandis que les questions transrégionales plus pressantes pourront être envoyées au parlement."
 flavour_eoa_reforms.8.a:0 "Adopter les Réformes !"
 flavour_eoa_reforms.8.b:0 "Nous nous en sortons très bien."
 flavour_eoa_reforms.8.c:0 "Inviter les représentants et adopter les divisions de cour !"
 flavour_eoa_reforms.8.e:0 "Simplement inviter les représentants."
 flavour_eoa_reforms.9.t:0 "Faire le Huitième"
 flavour_eoa_reforms.9.d:0 "Le Conseil Électoral était censé apporter l'équilibre à l'Empire. Il y avait trois Électeurs pour les minorités de l'Empire : Forgelune, Pic-des-Abeilles et Havre-Lunaire. Il y avait trois Électeurs représentant la majorité humaine : Couronne-de-Dame, Bord-de-Perles et Istralore. Deux sur la rive occidentale de la Tête-de-Dame, deux au nord de l'Empire et deux en Damérie orientale. Chacun représentait une charge impériale, bien que, certes, seule celle du Maréchal Impérial ait conservé une quelconque pertinence.\n\nCependant, il y avait toujours un Électeur différent des autres : le Magisterium. Situé au centre, avec de multiples enclaves et bureaux extraterritoriaux, représentant la classe des mages plutôt qu'un peuple distinct, et dont l'ancienne charge impériale était celle de l'empereur lui-même, le Magisterium a toujours eu plus de pouvoir à portée de main, souvent littéralement, que les autres Électeurs.\n\nPar décret impérial et volonté du parlement, une solution a été trouvée. Depuis trop longtemps, des appels ont été lancés pour une nouvelle addition aux rangs de l'Électorat, quelqu'un qui défendrait les droits de nombreux groupes sous-représentés : les Gnomes, les Aléniques, les Escannais, voire les demi-orques en tant que peuple. Et maintenant, un nouvel Électeur siégera au nom de toutes ces voix inentendues d'Anbennar. Et, officieusement, il servira de contrepoids utile au Magisterium."
 flavour_eoa_reforms.9.a:0 "Que se passe-t-il en cas d'égalité… ?"
 flavour_eoa_reforms.9.b:0 "Enfin, un devoir plus grand que celui d'un simple chevalier. Un devoir d'importance !"
 flavour_eoa_reforms.10.t:0 "La Constitution Aulique"
 flavour_eoa_reforms.10.d:0 "En ce jour, l'Empire d'Anbennar adopte sa première constitution entièrement écrite, rédigée par une armée de juristes et d'érudits crotháni. Une grande partie du travail préparatoire avait été accomplie bien avant ce jour, supervisée par les nobles réformistes de premier plan. Chaque article avait été soigneusement rédigé pour respecter les normes et traditions juridiques de chaque partie de l'Empire, pour formaliser et harmoniser les nombreuses lois et serments féodaux sous-tendant les obligations des nombreux Princes, et pour définir, déléguer et équilibrer adéquatement les droits et pouvoirs de chaque prince aux côtés des institutions de la Cour Impériale.\n\nLe document ne prétend pas créer de nouvelles lois, mais plutôt consacrer le système actuel, non écrit, de l'Empire et ses principes en un seul texte. Chaque article avait été approuvé avant même de recevoir les signatures de l'Empereur et des Électeurs. Ce jour, bien qu'il soit une occasion mémorable, n'a pas été accueilli par des fanfares ou des rébellions, et sera principalement retenu comme un seul paragraphe redouté dans les manuels d'histoire des étudiants d'un futur lointain.\n\nMais ne vous y trompez pas. En ce jour, en vertu de la loi, les royaumes constitutifs de l'Empire d'Anbennar sont devenus irrévocablement liés ensemble, une étape monumentale sur la voie de l'unité complète. Le jour où cette unité sera enfin réalisée n'est plus très loin."
 flavour_eoa_reforms.10.a:0 "Est-ce vraiment en train de se produire… ?"
 flavour_eoa_reforms.11.t:0 "La Guerre Impériale du Royaume !"
 flavour_eoa_reforms.11.d:0 "GUERRE ! L'Empire d'Anbennar est menacé, encerclé par des complots hostiles et des ennemis intrigants. Notre rêve de paix, si durement conquis et pourtant si peu assuré, et l'unité des nombreux peuples sous les ailes de la Colombe ne seront jamais acceptés par nos ennemis. Ils verraient volontiers notre Empire à nouveau divisé en un patchwork mesquin de sots querelleurs et chamaillards. Plus jamais. Notre Empereur a déclaré une Guerre Impériale du Royaume contre une nation ennemie. La menace contre le royaume doit être repoussée, et nous leur imposerons la Paix des Mages !"
 flavour_eoa_reforms.11.a:0 "Pour la gloire de l'Empire !"
 flavour_eoa_reforms.11.b:0 "Rassemblez notre armée. Nous marchons vers la victoire !"
 flavour_eoa_reforms.11.c:0 "Mercenaires recherchés ! Il y a du butin à prendre !"
 flavour_eoa_reforms.11.e:0 "Nos canons les plus récents et les plus fins sont prêts ! Au combat !"
 flavour_eoa_reforms.11.f:0 "Nous chevauchons ! Vers la gloire ! Pour l'Empereur !"
 flavour_eoa_reforms.11.g:0 "Contemplez les armées infinies de l'Empire !"
 flavour_eoa_reforms.11.h:0 "Des marins de notre marine marchande se sont portés volontaires pour combattre pour l'Empire !"
 flavour_eoa_reforms.11.i:0 "La religion de qui ? La Religion de l'Empire !"
 flavour_eoa_reforms.11.j:0 "Ils ne passeront pas !"
 flavour_eoa_reforms.11.k:0 "Alertez tous les commandements ! Déployez notre nouveau navire de guerre !"
 flavour_eoa_reforms.12.t:0 "Occupation d'un Temple Impérial"
 flavour_eoa_reforms.12.d:0 "Notre annexion légitime de cette terre a été jugée illégale par l'Empereur."
 flavour_eoa_reforms.12.a:0 "Nous ne pouvons rien y faire…"
 flavour_eoa_reforms.12.b:0 "Envoyons quelques « présents » à l'Empereur…"
 flavour_eoa_reforms.12.c:0 "Qu'ils viennent le reprendre, s'ils l'osent !"
 flavour_eoa_reforms.12.e:0 "Nous n'avons d'autre choix que de céder…"
 flavour_eoa_reforms.12.f:0 "Accepter de leur accorder l'autonomie."
 flavour_eoa_reforms.13.t:0 "Affaires du parlement impérial"
 flavour_eoa_reforms.13.d:0 "Voir ci-dessus"
 flavour_eoa_reforms.14.t:0 "Offre de devenir maréchal"
 flavour_eoa_reforms.14.b:0 "Offre de devenir maréchal"
 flavour_eoa_reforms.14.a:0 "Nous acceptons."
 flavour_eoa_reforms.14.b:0 "Nous refusons."
 flavour_eoa_reforms.15.t:0 "Un Nouveau Maréchal Nommé"
 flavour_eoa_reforms.15.d:0 "Le prince que nous avons choisi a accepté l'offre de devenir le protecteur de l'Empire."
 flavour_eoa_reforms.15.a:0 "Excellent."
 flavour_eoa_reforms.24.t:0 "L'Empereur Parraine des Colonies Supplémentaires !"
 flavour_eoa_reforms.24.d:0 "L'Empereur nous a fourni des ressources supplémentaires pour aider nos efforts d'expansion du Domaine Impérial en Aelantir."
 flavour_eoa_reforms.24.a:0 "Hourra !"
 flavour_eoa_reforms.16.t:0 "Cours Impériales Consolidées"
 flavour_eoa_reforms.16.d:0 "Grâce à une planification et des délibérations minutieuses, nos administrateurs ont réussi à fusionner les cours impériales mineures en cours plus grandes. Cela améliorera l'efficacité de nos districts administratifs ; bien que certains puissent considérer cette sage décision de l'Empereur comme une prise de pouvoir, les résultats parlent d'eux-mêmes !"
 flavour_eoa_reforms.16.a:0 "Que l'impôt afflue !"
 flavour_eoa_reforms.17.t:0 "Abolition des Frontières Internes"
 flavour_eoa_reforms.17.d:0 "Nous avons réussi à utiliser notre autorité pour abolir les frontières arbitraires établies illégalement par certains princes, facilitant immensément le commerce et les voyages."
 flavour_eoa_reforms.17.a:0 "Intéressant."
 flavour_eoa_reforms.18.t:0 "Addendum aux Lois Féodales de l'Empire"
 flavour_eoa_reforms.18.d:0 "L'Empereur a fait appliquer le dernier arrêt adopté par le Parlement Impérial, visant à réformer les règles médiévales de gouvernance au sein du royaume. Rédigé avec soin par les plus fins érudits de Crothan et Konwell, ce nouvel addendum déclare obsolètes de nombreuses lois tombées en désuétude et les remplace par un code nouveau et plus moderne, attrayant tant pour les aristocrates que pour les roturiers."
 flavour_eoa_reforms.18.a:0 "L'Empire avance."
 flavour_eoa_reforms.19.t:0 "L'Édit d'Esmarie"
 flavour_eoa_reforms.19.d:0 "L'Empereur a décrété que tous les princes peuvent gouverner leur royaume selon leurs propres croyances religieuses, soutenant officiellement les anciennes traditions d'Anbennar qui permettent la liberté de pratique religieuse au sein du Royaume. Bien que cela ne calme pas complètement le zèle que certains ont pour répandre leurs croyances, cela garantira au moins qu'une guerre majeure pour des disputes religieuses n'aura pas lieu."
 flavour_eoa_reforms.19.a:0 "Intéressant."
 flavour_eoa_reforms.20.t:0 "Édit de Suprématie Adéanique"
 flavour_eoa_reforms.20.d:0 "L'Empereur a exigé que tous les princes hérétiques de l'Empire acceptent la seule vraie foi légitime de l'Empire et renoncent à leurs fausses croyances. Le non-respect pourrait donner à l'Empereur la raison dont il a besoin pour prendre des mesures drastiques !"
 flavour_eoa_reforms.20.a:0 "Intéressant."
 flavour_eoa_reforms.23.t:0 "Sentiment d'Unification au Sein de l'Empire"
 flavour_eoa_reforms.23.d:0 "Les questions religieuses réglées, le Parlement Impérial s'est retrouvé acculé par les politiques de l'Empereur. La plupart des facteurs qui auraient empêché une plus grande intégration des royaumes impériaux ont été traités par les nouvelles politiques, adoptées au sein de ce même parlement. À ce stade, le parlement serait impuissant à empêcher l'empereur de poursuivre des politiques intégrationnistes."
 flavour_eoa_reforms.23.a:0 "Intéressant."
 flavour_eoa_reforms.25.t:0 "La Question de l'Unification"
 flavour_eoa_reforms.25.d:0 "Nous sommes désormais en position de récolter les fruits de nos efforts. L'Empire fonctionne maintenant effectivement comme un seul État, interconnecté et prospère. Il est temps de décider ce que l'avenir réserve à notre royaume.\n\nMais quel que soit le choix d'aujourd'hui, la réalité ne change jamais : Arheta Anbennar ! Anbennar est éternel !"
 flavour_eoa_reforms.25.a:0 "Vers l'Unification !"
 flavour_eoa_reforms.25.b:0 "Nous serons séparés, mais d'une même essence !"
 flavour_eoa_reforms.27.t:0 "L'Empereur Exige la Conformité Religieuse"
 flavour_eoa_reforms.27.d:0 "Après une série de conflits brutaux, la faction [Emperor.GetReligionNoun] a réussi à établir sa domination. Le nouveau paysage politique de l'Empire est encore façonné par ces décennies de conflit, et le plus récent arrêt du Parlement, envoyé au nom de l'Empereur, exige la conformité religieuse des princes jugés « hérétiques » par la Loi Impériale. Si nous ne nous conformons pas, l'Empereur aura toutes les raisons nécessaires pour tenter de révoquer notre autonomie religieuse par la force !"
 flavour_eoa_reforms.27.a:0 "La loi est la loi, nous nous conformerons."
 flavour_eoa_reforms.27.b:0 "Nous ne tremblerons pas devant ces menaces creuses !"
 flavour_eoa_reforms.26.t:0 "L'Empereur Propose l'Intégration Complète"
 flavour_eoa_reforms.26.d:0 "L'Empereur a proposé une politique d'intégration qui englobe tous les territoires de l'Empire, tant à Cannor qu'outre-mer. Considérant l'autorité de l'Empereur et le soutien du parlement, toute résistance à cette avancée pourrait être considérée comme trahison par l'Empereur !"
 flavour_eoa_reforms.26.a:0 "Nous Soutenons l'Unification !"
 flavour_eoa_reforms.26.b:0 "Nous n'avons jamais accepté cela !"
 flavour_eoa_reforms.30.t:0 "L'Empire ne suit pas l'air du temps"
 flavour_eoa_reforms.30.d:0 "Malgré nos meilleurs efforts, la communauté élargie de l'Empire d'Anbennar n'a pas soutenu cette réforme."
 flavour_eoa_reforms.30.a:0 "Qu'il en soit ainsi."
 flavour_eoa_reforms.30.a_tt:0 "Nous pourrons retenter notre chance dans quelques années."
 flavour_eoa_reforms.31.t:0 "Choix d'un Maréchal Impérial Permanent"
 flavour_eoa_reforms.31.d:0 "Maintenant que l'Empire est unifié, nous pouvons adopter les tactiques de notre Maréchal Impérial choisi et les utiliser pour mettre à jour le programme d'entraînement de l'armée qui formera les générations futures !"
 flavour_eoa_reforms.31.a:0 "Tactiques Istraloraines !"
 flavour_eoa_reforms.31.b:0 "Tactiques Aldrésiennes !"
 flavour_eoa_reforms.31.c:0 "Tactiques Cestirandaises !"
 flavour_eoa_reforms.31.e:0 "Tactiques Sugambriennes !"
 flavour_eoa_reforms.31.f:0 "Tactiques Neckcliffiennes !"
 flavour_eoa_reforms.31.g:0 "Tactiques Vernaises !"
 flavour_eoa_reforms.31.h:0 "Tactiques Perlières !"
 flavour_eoa_reforms.31.i:0 "Tactiques Ibevariennes !"
 flavour_eoa_reforms.31.j:0 "Tactiques Wexonardes !"

