 ##IMPERIAL CIRCLES##
 imperial_yellow_court:0 "Cour Impériale : Jaune"
 imperial_yellow_court_desc:0 "En tant qu'opportunistes de premier plan de l'Empire, les princes de Couronne-de-Dame et d'Arbaran cherchent à poursuivre leurs objectifs monétaires en s'impliquant dans la politique impériale et en augmentant leur influence dans la région."
 imperial_orange_court:0 "Cour Impériale : Orange"
 imperial_orange_court_desc:0 "Les princes esmari comptent parmi les sujets les plus décadents mais aussi les plus sophistiqués et rusés de l'Empire. Ils cherchent à étendre leur portée politique tout en enrichissant leur propre royaume en s'impliquant dans la politique impériale."
 imperial_blue_court:0 "Cour Impériale : Bleue"
 imperial_blue_court_desc:0 "Les princes damériens sont fiers de leurs liens étroits avec l'héritage du Grand-Duché de Damérie désormais éteint. Ils ont historiquement été les dirigeants d'Anbennar et cherchent à reconquérir cette position, tandis que les princes de la Luna sont fiers de leur mode de vie métropolitain et sont prêts à se battre pour maintenir leur indépendance. Ils sont au cœur des événements impériaux et agissent comme intermédiaires diplomatiques."
 imperial_sapphire_court:0 "Cour Impériale : Saphir"
 imperial_sapphire_court_desc:0 "Les princes des Marches utilisent le mandat impérial pour mieux se protéger des forces extérieures tout en fournissant à l'Empire certains des meilleurs soldats de Cannor."
 imperial_purple_court:0 "Cour Impériale : Pourpre"
 imperial_purple_court_desc:0 "On peut faire confiance aux princes wexonards pour faire une chose correctement : utiliser la force efficacement. Que ce soit pour sécuriser leurs frontières, vaincre des princes rivaux ou réprimer des dissidents internes."
 imperial_red_court:0 "Cour Impériale : Rouge"
 imperial_red_court_desc:0 "Les princes vernais de l'Empire regardent en arrière sur une histoire d'aventure et aspirent à maintenir cette réputation, que ce soit comme mercenaires ou alliés fiables, ils ont acquis une bonne réputation au sein de l'Empire."
 imperial_white_court:0 "Cour Impériale : Blanche"
 imperial_white_court_desc:0 "Les princes plus éloignés de Damérie occidentale, bien qu'attachés à certains idéaux damériens, ont choisi de regarder vers l'avenir et de se concentrer sur leurs forces. Certains tentent d'exploiter au maximum leur littoral, tandis que d'autres se tournent vers d'anciens héros tels qu'Ancard le Guerrier pour s'inspirer."
 imperial_ruby_court:0 "Cour Impériale : Rubis"
 imperial_ruby_court_desc:0 "Taillés dans le rival traditionnel de l'Empire, le Royaume de Lorent, les princes lencori sont fiers de leurs traditions sophistiquées de chevalerie, de liens familiaux et, bien sûr, d'une agréable conversation autour d'une bouteille de vin."
 imperial_rainbow_court:0 "Cour Impériale : Arc-en-ciel"
 imperial_rainbow_court_desc:0 "Les princes du Petit-Pays et des environs ont traditionnellement demeuré sur le sol très riche de la région et fourni à l'Empire la ressource la plus cruciale de toutes : la nourriture, ou selon leurs propres termes, le levier ultime."
 imperial_black_court:0 "Cour Impériale : Noire"
 imperial_black_court_desc:0 "Les princes de la Cour Noire sont la seule connexion fiable de l'Empire avec l'Alen en amont, les positionnant dans un emplacement crucial, mûr avec de nombreuses opportunités, qu'elles soient politiques ou économiques, attendant d'être exploitées."
 imperial_silver_court:0 "Cour Impériale : Argent"
 imperial_silver_court_desc:0 "Tandis que le Castanor d'antan était un ennemi des institutions nées en Damérie, les nouveaux princes qui ont choisi de rejoindre l'Empire apportent avec eux de nouveaux esprits talentueux qui élèvent l'efficacité administrative et l'innovation militaire à un tout autre niveau."
 imperial_aquamarine_court:0 "Cour Impériale : Aigue-marine"
 imperial_aquamarine_court_desc:0 "Les toujours fiers princes de l'Étendue sont des guerriers fougueux et des rameurs prêts à relever même les tâches les plus intimidantes. Aucune route commerciale n'est trop dangereuse et aucune mer n'est assez tumultueuse pour se dresser entre eux et leurs ambitions."
 #imperial_obsidian_court:0 "Cour Impériale : Obsidienne"
 #imperial_green_court:0 "Cour Impériale : Verte"
 imperial_pink_court:0 "Cour Impériale : Rose"
 imperial_pink_court_desc:0 "La Côte-du-Dragon abrite un étrange mélange de peuples, des pillards aux petites gens, mais ce qui les unit tous est leur désir d'innovation, faisant de la Côte-du-Dragon le foyer de nombreux officiers et hommes d'État ambitieux."
 imperial_copper_court:0 "Cour Impériale : Cuivre"
 imperial_copper_court_desc:0 "Les pieux Businori regardent vers les mers lointaines pour réaliser leurs ambitions. Bien que faisant partie de l'Empire, leurs esprits vagabondent à travers les mers sans fin, cherchant à planter un drapeau sur chaque île sous le soleil au nom de leur Empereur et de leur foi."
 imperial_gray_court:0 "Cour Impériale : Grise"
 imperial_gray_court_desc:0 "Les seigneurs toujours mystérieux et distants de Dostanor ont maintenu leurs royaumes par pure volonté, surmontant toutes les difficultés, de la malveillance nocturne aux bêtes de la Folie-de-Daravan. Ils comprennent la valeur d'une poigne ferme sur leur populace mieux que quiconque."
