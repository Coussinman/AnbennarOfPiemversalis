 #############Agendas###############
 estate_nobles_imperial_land:0 "@Z01 Reconquérir les Terres Impériales @Z01"
 estate_nobles_imperial_land_desc:0 "Des tyrans étrangers gouvernent nos sujets sans se soumettre à la volonté de l'Empereur et aux lois de l'Empire. Cela doit cesser !"
 estate_nobles_unlawful_territory:0 "@Z01 Exiger le Territoire Impérial Illégal @Z01"
 estate_nobles_unlawful_territory_desc:0 "Un prince opportuniste a violé les lois de l'Empire en s'emparant d'une province sans avoir de revendication légitime sur celle-ci. Cela ne saurait être toléré !"
 estate_church_enforce_eoa_religion:0 "@Z01 Imposer la Religion Officielle @Z01"
 estate_church_enforce_eoa_religion_desc:0 "Notre autorité sur les pratiques religieuses de l'Empire étant solidifiée, nous sommes en position d'imposer notre propre religion aux princes dissidents. Cette opportunité ne devrait pas être gaspillée."
 estate_church_improve_with_temple:0 "@Z01 Améliorer les Relations avec les Temples de l'Empire @Z01"
 estate_church_improve_with_temple_desc:0 "Les dieux de la cour sont vénérés dans tout l'Empire, mais leurs plus grands temples sont bâtis là où leur culte est le plus fort. En approchant les classes cléricales qui gouvernent ces temples, nous pouvons accroître notre influence au sein de l'Empire."
 estate_burghers_stablize_indebted_prince:0 "@Z01 Stabiliser un Prince Endetté @Z01"
 estate_burghers_stablize_indebted_prince_desc:0 "Les guildes marchandes nous informent qu'un prince de l'Empire peine à maintenir sa situation financière. Si nous n'agissons pas rapidement, ses voisins pourraient profiter de l'état affaibli du royaume et déstabiliser l'Empire par la même occasion."
 estate_burghers_emperor_combat_pirates:0 "@Z01 Repousser les Pirates des Nœuds Commerciaux Impériaux @Z01"
 estate_burghers_emperor_combat_pirates_desc:0 "De sauvages pirates se sont mis à piller les convois et navires marchands impériaux. Si cela continue, l'autorité de l'Empereur sera remise en question… inacceptable !"
 estate_burghers_support_colonists:0 "@Z01 Financer les Colonies Impériales @Z01"
 estate_burghers_support_colonists_desc:0 "Certains marchands fortunés de l'Empire ont exprimé leur volonté de fournir navires et provisions aux princes de l'Empire qui tentent de créer de nouvelles colonies outre-mer. Ils ont pétitionné l'Empereur pour encourager ces princes à créer davantage de colonies."
 estate_mages_emperor_dev:0 "@Z01 Développer les Ressources Magiques @Z01"
 estate_mages_emperor_dev_desc:0 "Les guildes de mages demandent que nous investissions dans l'extraction de matériaux arcaniques sensibles de l'une de nos provinces."
 estate_mages_war_with_witch:0 "@Z01 Maîtriser le Mage Renégat @Z01"
 estate_mages_war_with_witch_desc:0 "Un monarque trop ambitieux a osé défier les lois établies par le Magisterium et se proclame Roi-Sorcier. En tant qu'Empereur d'Anbennar, il est de notre devoir de mettre fin à cette farce !"
 estate_adventurers_emperor_help_colony:0 "@Z01 Parrainer des Missions d'Exploration @Z01"
 estate_adventurers_emperor_help_colony_desc:0 "La Guilde des Aventuriers a pétitionné l'Empereur pour parrainer l'un des princes impériaux qui tente de lancer une exploration de l'Aelantir."