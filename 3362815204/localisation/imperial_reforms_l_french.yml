 eoa_add_anbenncost_ptm:0 "\n§Y[8.GetName]§! gagne §G+2,00§! Questions de Parlement Possibles supplémentaires tant qu'elle fait partie de l'§YEmpire d'Anbennar§!."
 unlocks_abolish_borders:0 "Cette réforme débloquera une §Yquestion unique§! pour le §YParlement Impérial§! appelée « §YAbolir les Frontières Internes§! ».\nL'Empereur doit adopter les questions précédentes ainsi que posséder §Y10§! d'Autorité Impériale pour que celle-ci apparaisse !"
 unlocks_de_jure_law:0 "Cette réforme débloquera une §Yquestion unique§! pour le §YParlement Impérial§! appelée « §YRéformer la Loi Féodale Anbennarienne§! ».\nL'Empereur doit adopter les questions précédentes ainsi que posséder §Y10§! d'Autorité Impériale pour que celle-ci apparaisse !"
 unlocks_peace_edict:0 "Cette réforme débloquera jusqu'à §Yquatre§! différentes §yquestions mutuellement exclusives§! pour le §YParlement Impérial§! concernant la §Yfoi officielle§! de l'§YEmpire d'Anbennar§!.\nL'Empereur doit adopter les questions précédentes ainsi que posséder §Y10§! d'Autorité Impériale pour que celles-ci apparaissent !"
