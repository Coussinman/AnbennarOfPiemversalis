 iv_game_options_title:0 "Options de Jeu Idea Variation"
 iv_game_options_desc:0 "Choisissez ou modifiez les options de jeu supplémentaires d'Idea Variation ici."
 idea_settings.10:0 "Bienvenue dans Idea Variation Version Lite par flogi"
 idea_settings.11:0 "Idea Variation propose des options de jeu supplémentaires à activer ou désactiver. Utilisez la décision Options de Jeu Idea Variation pour activer ou désactiver certaines options. Note : Un seul joueur doit l'utiliser pour que cela fonctionne pour tous, idéalement l'hôte en multijoueur."
 idea_settings.12:0 "D'accord !"
 idea_settings.20:0 "Paramètres de Difficulté Bonus IA"
 idea_settings.21:0 "Idea Variation propose une nouvelle difficulté : le Mode Difficile Idea Variation. L'IA recevra des bonus croissants à chaque ère. L'IA ne sera pas totalement surpuissante, mais vous pourriez trouver un défi."
 idea_settings.22:0 "Activer le Mode Difficile Idea Variation (Bonus IA)"
 idea_settings.23:0 "Activer le Mode Normal Idea Variation"
 idea_settings.30:0 "Paramètres de Développement"
 idea_settings.31:0 "Ici, vous pouvez choisir si vous voulez jouer avec un système de développement légèrement modifié. Ce système, lorsqu'il est activé, augmentera le coût de développement en fonction du nombre de provinces que vous contrôlez. Les idées de Centralisation et de Horde auront un impact si ce système est activé, alors ne soyez pas confus par l'info-bulle de ces idées si vous désactivez le système. Il est recommandé de jouer avec ce système activé. Les coûts de développement commenceront à augmenter lorsque vous contrôlerez plus de 50 provinces d'État."
 idea_settings.32:0 "Activer les Fonctionnalités de Développement"
 idea_settings.33:0 "Désactiver les Fonctionnalités de Développement"
 idea_settings.40:0 "Événement intermédiaire"
 idea_settings.41:0 "Vous ne devriez pas voir ceci."
 idea_settings.42:0 "Ceci non plus"
 idea_settings.50:0 "Résumé des Paramètres du Mod"
 idea_settings.51:0 "Juste un petit rappel de vos choix. Amusez-vous bien !"
 idea_settings.52:0 "Commençons !"
 idea_settings.60:0 "Paramètres de Difficulté Malus Joueur"
 idea_settings.61:0 "Idea Variation propose une nouvelle difficulté : le Mode Difficile Idea Variation. En activant ceci, votre pays recevra des malus croissants à chaque ère. Vous aurez plus de mal à maintenir votre pays sans rebelles ou à gagner autant d'argent qu'avant."
 idea_settings.62:0 "Activer le Mode Difficile Idea Variation (Malus Joueur)"
 idea_settings.63:0 "Activer le Mode Normal Idea Variation"
 idea_settings.70:0 "Entretien d'État/Coût de Développement pour les Bâtiments"
 idea_settings.71:0 "Idea Variation augmente par défaut l'entretien d'État local et le coût de développement avec certains bâtiments. Cette option peut être désactivée avec cet événement. \n(Note : Si vous désactivez l'entretien d'État et le coût de développement des bâtiments, ils s'afficheront toujours comme augmentés, mais cela sera annulé par un modificateur de province invisible)"
 idea_settings.72:0 "Conserver l'Entretien d'État/Coût de Développement supplémentaire pour les Bâtiments"
 idea_settings.73:0 "Désactiver l'Entretien d'État/Coût de Développement supplémentaire pour les Bâtiments"
 idea_settings.80:0 "Interactions d'États"
 idea_settings.81:0 "Idea Variation ajoute de nouvelles interactions d'états. Vous pouvez les activer ou les désactiver."
 idea_settings.82:0 "Activer les nouvelles interactions d'états"
 idea_settings.83:0 "Désactiver les nouvelles interactions d'états"
 idea_settings.90:0 "Ajustements Multijoueur"
 idea_settings.91:0 "Vous pouvez activer ces ajustements pour les parties multijoueur : \n- Les forteresses à partir du niveau 4 recevront un malus croissant à la défensive lorsqu'elles sont adjacentes les unes aux autres. \n- Un système qui pénalise le dépassement important de la limite de forces terrestres \n- Un système qui pénalise le fait d'avoir de nombreux emprunts"
