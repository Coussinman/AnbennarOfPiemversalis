 flogi_ideas.104a:0 "Innovation Augmentée"
 flogi_ideas.104b:0 "Grâce à notre politique d'éducation générale, nous avons augmenté notre innovation."
 flogi_ideas.104c:0 "Bien !"
 flogi_ideas.104d:0 "Pas maintenant !"
