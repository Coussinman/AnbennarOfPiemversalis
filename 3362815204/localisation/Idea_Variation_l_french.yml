l_french:
 cb_coast:0 "Invasion Côtière"
 cb_coast_desc:0 "En tant que nation maritime, nous avons besoin de bases et parfois il faut se battre pour les obtenir."
 COAST_WAR_NAME:0 "$ORDER$$FIRST$ Invasion côtière contre $SECOND$"
 cb_seekrieg:0 "Guerre Maritime"
 cb_seekrieg_desc:0 "Nous avons décidé d'affronter nos rivaux en mer, mais nous n'avons pas l'intention d'en faire une guerre totale sur terre et sur mer."
 SEEKRIEG_WAR_NAME:0 "$ORDER$$FIRST$ Guerre maritime contre $SECOND$"
 cb_dynastie:0 "Guerre d'Unification Dynastique"
 cb_dynastie_desc:0 "Nous combattrons notre propre dynastie pour unir deux couronnes."
 DYNASTIE_WAR_NAME:0 "$ORDER$$FIRST$ Guerre d'unification dynastique contre $SECOND$"
 cb_konigreich:0 "Assujettissement"
 cb_konigreich_desc:0 "Nous pouvons assujettir les petits pays grâce à notre rang de royaume."
 development_raised:0 "Développement Augmenté"
 development_raised_desc:0 "Le développement a été augmenté. Ce fut une tâche extrêmement difficile pour votre administration et il vous faudra du temps pour vous remettre de ces efforts avant de pouvoir relancer un tel projet."
 dynastic_involvement:0 "Implication Dynastique"
 dynastic_involvement_desc:0 "Nous nous sommes impliqués dans la politique dynastique d'un pays étranger. Nous avons réussi à installer un héritier prêt à monter sur le trône et à propager notre dynastie, mais cela a nui à notre réputation."
 dynastic_change:0 "Influence Dynastique"
 dynastic_change_desc:0 "Notre pays a été influencé pour adopter un nouvel héritier afin de succéder à notre roi. En raison de la grande influence étrangère liée à ce processus, nos actions ne seront pas perçues comme les nôtres pendant un certain temps."
 zentra_dev:0 "Planification de Métropole"
 zentra_dev_desc:0 "Planifier de très grandes cités nécessite de l'expérience et peut être très coûteux. Cependant, nous sommes expérimentés et ne commettrons pas d'erreurs de débutant."
 advisor_hired:0 "Conseiller engagé"
 advisor_hired_desc:0 "Nous avons choisi un nouveau conseiller. Nous sommes satisfaits de notre choix, mais trouver un autre groupe de candidats aussi qualifiés prendra du temps."
 advisor_hired_2:0 "Conseiller engagé"
 advisor_hired_2_desc:0 "Nous avons choisi un nouveau conseiller. Nous sommes satisfaits de notre choix, mais trouver un autre groupe de candidats aussi qualifiés prendra du temps."
 hire_advisor_title:0 "Engager un Conseiller"
 hire_advisor_desc:0 "Engagez un conseiller contre de l'argent, mais vous pourrez choisir librement le bonus que le conseiller accorde et son niveau de compétence (2 ou 3). Vous ne pouvez faire cela que tous les 3 ans et selon le niveau de compétence choisi, vous devrez payer des frais supplémentaires."
 diktatur_dec_title:0 "Réformer le pays"
 diktatur_dec_desc:0 "En tant que dictateur, vous pouvez faire ce que vous voulez."
 monarchie_dec_title:0 "Trouver un héritier pour notre dynastie."
 monarchie_dec_desc:0 "Comme notre dynastie n'a pas d'héritier, nous allons essayer d'en trouver un dans notre famille."
 diktatur_done:0 "Réformes récentes"
 diktatur_done_desc:0 "Le dirigeant a promulgué des réformes récentes qui mécontenteront certaines personnes."
 konigreich_dec_title:0 "Organiser la Fête de l'Été"
 konigreich_dec_desc:0 "En organisant une fête pour nos sujets, nous montrons quel souverain généreux nous sommes."
 konigreich_done:0 "Fête de l'Été organisée"
 konigreich_done_desc:0 "La fête fut un grand succès."
 iv_mercanti_dec_title:0 "Améliorer le Mercantilisme"
 iv_mercanti_dec_desc:0 "Grâce à notre politique économique, nous pouvons améliorer le mercantilisme tous les 5 ans."
 improved_mercanti:0 "Délai d'amélioration du Mercantilisme"
 IV_reform_has_mercanti:0 "Possède la réforme : Politique Mercantiliste"
 iv_manufactory_dec_title:0 "Investissement Manufacturier"
 iv_manufactory_dec_desc:0 "Notre politique d'État nous permet de construire des manufactures à moindre coût."
 IV_reform_has_manufactory:0 "Possède la réforme : Politique Manufacturière"
 iv_innovative_dec_title:0 "Augmenter l'Innovation"
 iv_innovative_dec_desc:0 "Grâce à notre politique d'éducation générale, nous pouvons augmenter notre innovation contre des points de monarque tous les 5 ans."
 IV_reform_has_ausbildung:0 "Possède la réforme : Éducation Générale"
 improved_innovativ:0 "Innovation augmentée"
 IV_reform_has_vision:0 "Possède la réforme : Idées Révolutionnaires"
 IV_reform_has_vision_2:0 "Possède la réforme : Contre-Révolution"
 iv_trade_center_dec_title:0 "Déclarer un nouveau Centre de Commerce"
 iv_trade_center_dec_desc:0 "Grâce à notre politique de centres de commerce régionaux, nous pouvons déclarer de nouveaux centres de commerce."
 new_trade_center:0 "Nouveau Centre de Commerce établi"
 IV_reform_has_trade_center:0 "Possède la réforme : Centres de Commerce Régionaux"
 sailor_manpower_dec_title:0 "Conversion Marins/Main-d'œuvre"
 sailor_manpower_dec_desc:0 "Nous pouvons convertir les marins en main-d'œuvre et vice versa avec cette décision."
 sailor_converted:0 "Marins/Main-d'œuvre convertis"
 iv_inner_cohesion_dec_title:0 "Augmenter la Stabilité/Réduire la Lassitude de Guerre"
 iv_inner_cohesion_dec_desc:0 "Grâce à notre réforme Cohésion Interne, nous pouvons périodiquement augmenter notre stabilité ou réduire la lassitude de guerre."
 stab_or_we:0 "Stabilité ou Lassitude de Guerre"
 IV_reform_has_inner_cohesion:0 "Possède la réforme : Cohésion Interne"
 IV_reform_has_dev_own_lands:0 "Possède la réforme : Développement de nos Terres"
