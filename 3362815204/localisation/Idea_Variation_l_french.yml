 flogi_ideas.100a:0 "Recherche d'un héritier."
 flogi_ideas.100b:0 "Notre dynastie est sans héritier évident. Nous devons examiner notre famille tant dans notre pays que dans d'autres contrées pour trouver quelqu'un apte à reprendre la dynastie."
 flogi_ideas.100c:0 "Peut-être un cousin éloigné."
 flogi_ideas.100d:0 "Peut-être un autre cousin éloigné."
 flogi_ideas.100e:0 "Les candidats n'ont pas su me convaincre."
 flogi_ideas.101a:0 "Fête de l'Été"
 flogi_ideas.101b:0 "La tradition veut que le souverain organise la fête personnellement, montrant ainsi son lien fort avec ses sujets."
 flogi_ideas.101c:0 "Allons-y !"
 flogi_ideas.101d:0 "Attendez, je ne fais pas cela"
 flogi_ideas.102a:0 "Mercantilisme Amélioré"
 flogi_ideas.102b:0 "Grâce à notre politique économique, nous avons pu améliorer le mercantilisme dans notre pays."
 flogi_ideas.102c:0 "Excellent !"
 flogi_ideas.103a:0 "Investissement d'État en Manufacture"
 flogi_ideas.103b:0 "Nous avons décidé d'investir dans une manufacture. Nous pouvons choisir le type, mais pas l'emplacement. C'est à la bureaucratie de décider."
