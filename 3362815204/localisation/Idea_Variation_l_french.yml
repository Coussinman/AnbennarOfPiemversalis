 estate_janissary:0 "Janissaires"
 estate_janissary_desc:0 "L'armée ottomane était traditionnellement composée principalement de cavalerie. Au milieu du XIVe siècle, Orhan Ier puis son fils Murad Ier introduisirent les Janissaires. Formés à partir de prisonniers de guerre et d'esclaves, les Janissaires devinrent une infanterie permanente d'élite, régulièrement payée et hautement disciplinée."
 estate_nationalist:0 "Nationalistes"
 estate_nationalist_desc:0 "Les Nationalistes sont des hommes qui aiment leur pays et veulent le voir fort et prospère. Ils haïssent leurs rivaux et ne croient souvent pas en la résolution pacifique des conflits."
