# Typos and some wording clean up from Picasso Sparks, use or ignore as you like.
l_french:
 #religious group ideas have been purged by Jaddar
 justiz0: "Idées de Jurisprudence"
 justiz0_desc: "Un système juridique fonctionnel est souhaité et considéré comme essentiel dans notre État."
 justiz1: "Compilation des Lois"
 justiz1_desc: "Les lois offrent au peuple sécurité et stabilité."
 justiz2: "Ministère de la Justice"
 justiz2_desc: "Le ministère de la Justice s'emploie à élaborer de nouvelles lois et à actualiser les anciennes."
 justiz3: "Tradition Juridique"
 justiz3_desc: "Nos juristes assurent le bon fonctionnement du pays."
 justiz4: "Droit Commercial"
 justiz4_desc: "Le droit commercial est essentiel pour établir des règles régissant nos interactions avec les autres nations."
 justiz5: "Lois contre l'Usure"
 justiz5_desc: "L'usure paralyse l'économie. Nous devons la combattre."
 justiz6: "Droit International Public"
 justiz6_desc: "Le droit international public définit les règles fondamentales régissant les relations entre États."
 justiz7: "Droits des Minorités"
 justiz7_desc: "Les droits des minorités stabilisent notre royaume et réduisent les soulèvements."
 gesundheit0: "Idées de Santé Publique"
 gesundheit0_desc: "L'État œuvrera à améliorer la santé du peuple pour son propre bien."
 gesundheit1: "Journées de Travail Prolongées"
 gesundheit1_desc: "Celui qui travaille plus longtemps génère davantage de richesses."
 gesundheit2: "Prévention des Épidémies"
 gesundheit2_desc: "Peu de fléaux peuvent causer autant de dommages à l'économie que les épidémies. De bonnes pratiques permettront de les prévenir."
 gesundheit3: "Amélioration de la Longévité"
 gesundheit3_desc: "En améliorant l'espérance de vie de notre peuple, nous pourrons accroître notre population."
 gesundheit4: "Robustesse"
 gesundheit4_desc: "Un corps robuste supporte mieux les situations extrêmes."
 gesundheit5: "Réduction de la Mortalité Infantile"
 gesundheit5_desc: "Si moins de nourrissons périssent, nos réserves de travailleurs et de soldats s'accroîtront considérablement."
 gesundheit6: "Technologie Médicale"
 gesundheit6_desc: "L'amélioration de la technologie médicale nous aidera à progresser dans les sciences."
 gesundheit7: "Hôpitaux Publics"
 gesundheit7_desc: "Les hôpitaux publics satisferont le peuple."
 monarchie0: "Idées Monarchiques"
 monarchie0_desc: "Nous sommes gouvernés par des rois et des reines."
 monarchie4: "Chevaliers Nobles"
 monarchie4_desc: "L'entretien de la cavalerie nécessite un système économique produisant un grand nombre de chevaux excédentaires. Si nous garantissions les privilèges de notre noblesse, non seulement elle serait bien plus satisfaite, mais elle accomplirait l'essentiel du travail pour élever les montures nécessaires. Notre bouffon de cour a décrit cela ainsi : le service garantit les serfs."
 monarchie6: "Noblesse Internationale"
 monarchie6_desc: "Les relations internationales sont une affaire délicate. Certains prétendent que la classe marchande, habituée à traiter avec les étrangers, y excelle. Ceux qui affirment cela ignorent les liens de parenté que nos familles nobles ont tissés au fil des ans. Ces liens serviront notre cause diplomatique."
 monarchie1: "Liens Familiaux Nobles"
 monarchie1_desc: "Nos liens familiaux avec la haute noblesse renforceront notre droit de régner. \n§GDécision§W pour rechercher un héritier dans votre famille.§W"
 monarchie3: "Noblesse Locale"
 monarchie3_desc: "La noblesse sait qu'elle est supérieure au commun des mortels et accordera sa loyauté à ceux qui en sont dignes. Si nous confirmons leurs privilèges, ils se souviendront de notre générosité et résisteront mieux aux tentations des puissances étrangères."
 monarchie2: "Politique Dynastique"
 monarchie2_desc: "Nous maintiendrons notre dynastie vivante à tout prix."
 monarchie7: "Milice Locale"
 monarchie7_desc: "Notre noblesse lèvera des hommes pour former des milices quand il s'agira de défendre la patrie."
 monarchie5: "Renforcement de l'Autorité Royale"
 monarchie5_desc: "Renforcer l'autorité royale facilitera notre gouvernance du royaume."
 republik0: "Idées Républicaines"
 republik0_desc: "La forme républicaine de gouvernement règne dans notre pays."
 republik2: "Abolition du Servage"
 republik2_desc: "Nous savons par les récits de l'époque castanorienne qu'une armée citoyenne d'hommes libres est bien plus disposée à combattre que ceux qui y sont contraints. Nous devons accorder une juste liberté à notre paysannerie, et elle combattra pour défendre cette liberté."
 republik3: "Déclaration des Droits"
 republik3_desc: "En accordant aux citoyens certains droits fondamentaux, nous réduisons la probabilité d'un soulèvement paysan."
 republik5: "Tradition Républicaine"
 republik5_desc: "En tant que république de longue date, notre gouvernement fera face aux défis et les surmontera plus aisément."
 republik1: "Mission Diplomatique"
 republik1_desc: "Nous devons jouer le jeu diplomatique pour assurer notre liberté, car notre mode de vie représente à la fois une opportunité et une menace pour nos voisins."
 republik6: "Émancipation"
 republik6_desc: "Depuis longtemps, nous avons restreint la propriété foncière à ceux que nous estimions dignes de confiance. Si nous levions ces restrictions, les propriétés seraient consolidées. Cela créerait un réservoir de main-d'œuvre saisonnière pour qui la vie militaire pourrait s'avérer attrayante."
 kolonialimperium0: "Idées d'Empire Colonial"
 kolonialimperium0_desc: "Notre pays met tout en œuvre pour bâtir un puissant empire colonial."
 kolonialimperium1: "Ruée Coloniale"
 kolonialimperium1_desc: "Quand l'espace vient à manquer, nous devons nous hâter de mettre la main sur les meilleures terres."
 kolonialimperium2: "Aventuriers Autonomes"
 kolonialimperium2_desc: "Nul besoin de payer des gens pour explorer ces terres. Des aventuriers indépendants le feront pour nous.\nColons pour les nations coloniales §G+1§W"
 kolonialimperium3: "Conscription Coloniale"
 kolonialimperium3_desc: "En échange de notre aide et de notre argent, les colonies nous fourniront des hommes en temps de guerre. \nModificateur de main-d'œuvre nationale/Nation coloniale §G+2,0 %§W \nModificateur de marins nationaux/Nation coloniale §G+2,0 %§W"
 kolonialimperium4: "Tarifs Accrus"
 kolonialimperium4_desc: "Par des lois spécifiques, nous pouvons maximiser les profits tirés des colonies. \nTarifs globaux/Nation coloniale §G+1,0 %§W \nInflation annuelle/Nation coloniale §R+0,025§W"
 kolonialimperium5: "Développement Accéléré des Infrastructures"
 kolonialimperium5_desc: "À mesure que nous nous étendons et élargissons notre rayon d'action, nous devons pouvoir améliorer considérablement nos infrastructures."
 kolonialimperium6: "Flotte de Commandement"
 kolonialimperium6_desc: "Pour défendre nos colonies, nous avons besoin d'une grande flotte. \nModificateur de limite de forces navales/Nation coloniale §G+2,0 %§W"
 kolonialimperium7: "Transport de Troupes Efficace"
 kolonialimperium7_desc: "Pour combattre nos rivaux coloniaux ou réprimer les soulèvements, nous devons transporter nos troupes aussi rapidement que possible. Ainsi, nous garderons tout le monde sous contrôle."
 assimilation0: "§T***§W Idées d'Assimilation §T***§W"
 assimilation0_desc: "L'État fait tout son possible pour assimiler les autres cultures."
 assimilation2: "Intégration Rapide"
 assimilation2_desc: "Les vassaux doivent être intégrés le plus vite possible à la mère patrie."
 assimilation3: "Tolérance Religieuse"
 assimilation3_desc: "La tolérance religieuse est secondaire lorsqu'il s'agit d'une intégration rapide."
 assimilation4: "Apaisement des Nationalistes"
 assimilation4_desc: "Il peut être utile d'apaiser les nationalistes par de petites concessions."
 assimilation5: "Pamphlets Élogieux"
 assimilation5_desc: "Nos propres philosophes feront l'éloge de notre culture et de notre œuvre."
 assimilation6: "Solidarité Inébranlable"
 assimilation6_desc: "Si quiconque tente de conquérir nos terres, notre peuple restera loyal."
 assimilation7: "Plus d'Ennemis, que des Frères"
 assimilation7_desc: "Dès le premier jour après avoir conquis les terres de notre ennemi, nous appellerons cet ennemi notre frère."
 gesellschaft0: "Idées de Société"
 gesellschaft0_desc: "L'État s'efforce de bâtir une société civile."
 gesellschaft1: "Obligations de Guerre"
 gesellschaft1_desc: "Les obligations de guerre nous aideront à payer nos soldats."
 gesellschaft2: "Programme d'Échange"
 gesellschaft2_desc: "Les programmes d'échange favorisent la compréhension entre les peuples et améliorent nos relations avec les autres pays."
 gesellschaft3: "Fondation d'Universités"
 gesellschaft3_desc: "Les universités nous aident à progresser technologiquement."
 gesellschaft4: "Possibilités d'Avancement"
 gesellschaft4_desc: "Les possibilités d'avancement motivent ceux qui ne sont pas issus d'une grande famille à travailler dur pour réussir."
 gesellschaft5: "Population Vigilante"
 gesellschaft5_desc: "Notre peuple est vigilant face à toute menace."
 gesellschaft6: "Peuple Satisfait"
 gesellschaft6_desc: "Un peuple satisfait est moins enclin à se rebeller."
 gesellschaft7: "Contre Vents et Marées"
 gesellschaft7_desc: "La solidarité de la société est essentielle pour défendre une nation."
 propaganda0: "Idées de Propagande"
 propaganda0_desc: "La propagande d'État règne sur les médias."
 propaganda2: "Ministre de la Propagande"
 propaganda2_desc: "Un ministre de la propagande peut s'avérer très bénéfique."
 propaganda3: "Influence sur l'Étranger"
 propaganda3_desc: "Grâce à notre propagande, même les autres nations croient certaines de nos histoires."
 propaganda4: "Crédibilité"
 propaganda4_desc: "En disant la vérité au moins parfois ou partiellement, nous gagnons en crédibilité."
 propaganda5: "Aspiration aux Grandes Choses"
 propaganda5_desc: "Nous aspirons toujours aux plus grandes choses, voilà l'essence de notre propagande.\nRéduction de l'impact sur l'absolutisme maximum des privilèges : §G-20,0 %§!"
 propaganda7: "Devoir de Vaincre"
 propaganda7_desc: "Le peuple de notre pays ne perd pas. Jamais."
 nationalismus0: "§T***§W Idées Nationalistes §T***§W"
 nationalismus0_desc: "L'État encourage le nationalisme du peuple."
 nationalismus2: "Pour la Patrie !"
 nationalismus2_desc: "Notre peuple est inspiré à tout donner pour notre terre."
 nationalismus3: "Forces Volontaires"
 nationalismus3_desc: "En temps de guerre, des forces volontaires combattront à nos côtés."
 nationalismus4: "Attaques Partisanes"
 nationalismus4_desc: "Si l'ennemi envahit nos terres, le peuple s'organisera en unités partisanes."
 nationalismus5: "Terre Inflexible"
 nationalismus5_desc: "Insoumis, Inflexibles, Invaincus !"
 nationalismus6: "Confiance en l'État"
 nationalismus6_desc: "Grâce à notre nationalisme, notre peuple accorde une confiance inconditionnelle à notre gouvernement."
 nationalismus7: "Il est Doux de Mourir pour la Patrie"
 nationalismus7_desc: "Nos soldats sont sans peur, et donc redoutés partout."
 imperialismus0: "Idées Impérialistes"
 imperialismus0_desc: "L'État se considère comme un empire."
 imperialismus1: "La Loi de la Jungle"
 imperialismus1_desc: "Nous avons le droit de conquérir les terres ennemies parce que nous le pouvons."
 imperialismus3: "Passé Glorieux"
 imperialismus3_desc: "Notre passé glorieux nous aide à toujours conserver l'éclat de la gloire."
 imperialismus5: "Flotte Impériale"
 imperialismus5_desc: "La flotte d'un empire se doit d'être imposante."
 imperialismus6: "Armée Impériale"
 imperialismus6_desc: "L'armée d'un empire se doit d'être imposante."
 generalstab0: "Idées d'État-Major"
 generalstab0_desc: "Un groupe de généraux et d'officiers discute constamment de questions de stratégie et de tactique pour garantir des généraux compétents à notre armée."
 generalstab1: "Théorie du Combat de Choc"
 generalstab1_desc: "En étudiant les tactiques ancestrales et les manœuvres de cavalerie, nos généraux deviennent maîtres dans l'art de surprendre et d'étourdir l'ennemi."
 generalstab2: "Théorie du Combat à Distance"
 generalstab2_desc: "À mesure que le temps passe et que les armées du monde entier abandonnent arcs et arquebuses pour adopter le mousquet et le fusil, nous excellerons à les utiliser pour écraser et dominer nos ennemis."
 generalstab3: "Manuel de Manœuvres Navales"
 generalstab3_desc: "En employant nos amiraux pour former la génération suivante, leur savoir perdurera et enrichira ceux qui viendront. Le célèbre Manuel de Manœuvres Navales est considéré comme la pierre angulaire de l'éducation de tout amiral accompli et renommé."
 generalstab4: "Théorie du Combat de Siège"
 generalstab4_desc: "Depuis l'introduction des canons, les généraux n'ont plus à se fier uniquement à la chance pour vaincre les défenseurs d'un fort. En formant nos meilleures troupes et nos commandants à l'usage des canons, nous accélérons efficacement le cycle de tout siège."
 generalstab5: "Théorie du Combat Naval"
 generalstab5_desc: "Feu ! Rechargez ! Gardez la formation ! Les amiraux légendaires inspirent souvent leurs hommes à dépasser leurs propres limites. Selon les amiraux accomplis qui nous ont servis, avoir une présence légendaire parmi ses hommes peut augmenter la cadence de tir d'un navire ainsi que la vitesse de choc."
 generalstab6: "Exercices Constants"
 generalstab6_desc: "La vie d'un soldat dans nos rangs est très simple : son devoir principal est de rester en pleine forme. S'exercer constamment transformera chaque soldat, avec le temps, en ce que l'État veut qu'il soit : une machine à tuer efficace et aguerrie."
 stehendesheer0: "§O***§W Armée Permanente §O***§W"
 stehendesheer0_desc: "Une armée permanente peut être coûteuse à entretenir, mais elle est bien préparée pour mener la guerre."
 stehendesheer1: "Entraînement Spécialisé de l'Infanterie"
 stehendesheer1_desc: "Diverses nouvelles techniques et mises en œuvre améliorent considérablement l'efficacité de la ligne de front au combat, rendant ainsi nos fantassins excellents au cœur de la mêlée."
 stehendesheer2: "Tactiques de Cavalerie Tournante"
 stehendesheer2_desc: "En employant des tactiques de harcèlement et d'attaques surprises, nous tirons excellent parti de la charge féroce et de la puissance de notre cavalerie, une force qu'il ne faut pas sous-estimer."
 stehendesheer3: "Commander le Barrage"
 stehendesheer3_desc: "Faisant pleuvoir le feu sur l'ennemi, les compétences de ces canonniers sont affinées à la perfection pour délivrer le barrage le plus discipliné et le plus dévastateur."
 stehendesheer4: "Feu à Mon Commandement !"
 stehendesheer4_desc: "En entraînant nos soldats à penser et agir comme un seul homme, nous atteignons l'état de discipline absolue. Aucun soldat ne rompt la ligne, aucun soldat ne faiblit face à l'ennemi ; il n'y a qu'une cible et un ordre de tirer."
 stehendesheer5: "Manuel Militaire"
 stehendesheer5_desc: "Les progrès militaires ont conduit notre état-major à rédiger des manuels sur la formation des nouvelles recrues et le perfectionnement de leurs compétences, accélérant ainsi le temps nécessaire pour les entraîner."
 stehendesheer7: "Percée en Poliorcétique"
 stehendesheer7_desc: "Nos scientifiques militaires expérimentent constamment de nouvelles techniques de bombes, d'échelles et de canons pour abattre les murs ennemis aussi rapidement et efficacement que possible. Nos recherches ont abouti à une percée."
 wehrpflicht0: "§O***§W Idées de Conscription §O***§W"
 wehrpflicht0_desc: "La conscription générale appelle tout homme aux armes pour combattre pour son pays. Les conscrits ne sont pas aussi bien formés que les soldats professionnels, mais ils se battent pour leurs foyers."
 wehrpflicht2: "Obligations de Guerre"
 wehrpflicht2_desc: "La guerre peut être aussi épuisante pour notre trésor que pour notre main-d'œuvre. Nous devrions proposer des obligations de guerre, afin que ceux qui ne combattent pas contribuent au moins de leurs bourses."
 wehrpflicht3: "Mobilisation Rapide"
 wehrpflicht3_desc: "Grâce à notre excellente préparation, nous pouvons rassembler nos troupes très rapidement."
 wehrpflicht5: "Esprit Militaire du Temps"
 wehrpflicht5_desc: "Nos méthodes d'entraînement et nos tactiques sont en phase avec leur époque."
 wehrpflicht6: "Vaste Réservoir de Recrues"
 wehrpflicht6_desc: "Parce que nous levons tant d'hommes, nous pouvons choisir les meilleurs pour les meilleures fonctions."
 wehrpflicht7: "Segments d'Entraînement"
 wehrpflicht7_desc: "Nous avons standardisé nos méthodes de formation pour toutes les nouvelles recrues."
 waffenqualitat0: "Idées de Qualité des Armes"
 waffenqualitat0_desc: "La qualité des armes peut être un facteur décisif à la guerre."
 waffenqualitat1: "Production d'Armes"
 waffenqualitat1_desc: "Une production coordonnée d'armes est essentielle pour équiper une grande armée."
 waffenqualitat2: "Armes d'Infanterie de Qualité"
 waffenqualitat2_desc: "Les armes de notre infanterie doivent être de la plus haute qualité."
 waffenqualitat3: "Armes de Cavalerie de Qualité"
 waffenqualitat3_desc: "Les armes de notre cavalerie doivent être de la plus haute qualité."
 waffenqualitat4: "Marchands d'Armes"
 waffenqualitat4_desc: "Il y a beaucoup d'armes sur les marchés et beaucoup de gens qui en vendent."
 waffenqualitat7: "Canons de Qualité"
 waffenqualitat7_desc: "Nos canons doivent être de la plus haute qualité."
 festung0: "Idées de Forteresse"
 festung0_desc: "Une position fortement fortifiée que l'ennemi met des années à prendre peut être très bénéfique pour se regrouper et planifier une contre-attaque."
 festung1: "Artillerie Défensive"
 festung1_desc: "Tenez l'ennemi en respect grâce au feu de l'artillerie défensive."
 festung2: "Logistique de Construction"
 festung2_desc: "Notre dévouement à la construction de nouvelles fortifications a amélioré notre processus de transport des matières premières et des équipes de construction."
 festung3: "Canons de Forteresse"
 festung3_desc: "Nos forteresses sont bien équipées en canons. En cas de grande bataille, nous pouvons les utiliser pour renforcer notre armée régulière."
 festung4: "Meilleure Administration des Forts"
 festung4_desc: "Nous administrons nos forts de manière plus efficace, ce qui réduit leur entretien."
 kriegsproduktion0: "Idées de Production de Guerre"
 kriegsproduktion0_desc: "La réalité du conflit oblige parfois à réorganiser l'économie pour les besoins de la guerre."
 kriegsproduktion1: "Production Manufacturière d'Armes d'Infanterie"
 kriegsproduktion1_desc: "Produire des armes d'infanterie en manufactures est bien moins coûteux que de les produire de façon indépendante."
 kriegsproduktion4: "Construction de Bases Efficace"
 kriegsproduktion4_desc: "Nous devons construire efficacement des entrepôts pour nos troupes afin de pouvoir les approvisionner en tout temps."
 kriegsproduktion5: "Production de Mousquets"
 kriegsproduktion5_desc: "La production de mousquets est cruciale pour nos capacités militaires."
 kriegsproduktion7: "Dépôts Militaires"
 kriegsproduktion7_desc: "Les dépôts militaires nous permettent d'équiper plus facilement nos armées en temps de guerre."
 staatsverwaltung0: "Idées d'Administration d'État"
 staatsverwaltung0_desc: "Une bonne administration d'État peut faire des merveilles."
 staatsverwaltung1: "Droit Communal"
 staatsverwaltung1_desc: "Le droit communal garantira notre contrôle sur les provinces éloignées et augmentera ainsi notre capacité à administrer de nombreux États."
 staatsverwaltung2: "Droit Administratif"
 staatsverwaltung2_desc: "Le droit administratif maintient l'administration transparente et intègre."
 staatsverwaltung3: "Commerce Intérieur"
 staatsverwaltung3_desc: "Nous devons soutenir le commerce intérieur en construisant un réseau routier."
 staatsverwaltung4: "Espionnage Administratif"
 staatsverwaltung4_desc: "Nos yeux et nos oreilles doivent être partout, sous peine de manquer un détail important."
 staatsverwaltung5: "Orientation du Commerce"
 staatsverwaltung5_desc: "Nous devons orienter le commerce vers la direction qui nous est la plus profitable."
 staatsverwaltung6: "Application du Progrès"
 staatsverwaltung6_desc: "Parfois, la population paysanne et les conservateurs peuvent être réticents à accepter les avancées techniques. Nous devons les convaincre que le progrès est dans leur intérêt."
 staatsverwaltung7: "Simplification de la Fondation de Manufactures"
 staatsverwaltung7_desc: "Nous simplifions le processus de fondation des manufactures pour améliorer la production de biens dans notre pays."
 militarismus0: "Idées de Militarisme"
 militarismus0_desc: "La société de notre pays est militariste."
 militarismus2: "Carrière d'Officier"
 militarismus2_desc: "Tous nos jeunes rêvent d'une carrière d'officier."
 militarismus5: "Volontaires pour la Défense"
 militarismus5_desc: "Assiégés ? De nombreuses personnes seront prêtes à défendre leurs foyers."
 formation1: "Marche en Colonne"
 formation1_desc: "Cette méthode de marche nous permet de nous déplacer plus vite."
 formation2: "Assaut"
 formation2_desc: "Les assauts peuvent être très utiles lorsqu'on veut conquérir rapidement une position ou submerger l'ennemi avant l'arrivée de renforts."
 formation3: "Enveloppement Extensif"
 formation3_desc: "Parfois, il faut prendre des risques et laisser la cavalerie envelopper l'ennemi dans une large manœuvre. Cela paie souvent."
 formation4: "Carré"
 formation4_desc: "Dans les situations extrêmement désespérées ou sous de lourdes attaques de cavalerie, l'infanterie doit passer en défense tous azimuts."
 formation5: "Feu par Rang"
 formation5_desc: "Avec notre infanterie tirant par rang, nous pouvons infliger davantage de pertes à l'adversaire."
 formation6: "Médecins de l'Armée"
 formation6_desc: "Nos médecins militaires ne nous aideront pas seulement à réduire nos pertes au combat, mais garantiront que la plupart de nos hommes arrivent en bonne santé sur le champ de bataille."
 formation7: "Feu de Couverture"
 formation7_desc: "Combattre l'ennemi à couvert n'est pas déshonorant, mais raisonnable."
 shock0: "§R***§W Idées de Choc §R***§W"
 shock0_desc: "Notre armée sera entraînée à privilégier le combat rapproché."
 shock2: "Attaque Chevauchante"
 shock2_desc: "Lorsque nous chargeons l'ennemi, notre cavalerie peut assaillir toute la ligne de front ou se concentrer sur une seule unité. Nous pouvons également réagir aux opportunités de charger l'ennemi par surprise."
 shock5: "Cavalerie de Dragons"
 shock5_desc: "En privilégiant les escarmouches légères, notre cavalerie peut infliger des pertes sans jamais s'aventurer trop dans le danger."
 shock6: "Formation en Coin"
 shock6_desc: "Les coins de notre cavalerie sont redoutés par tous nos ennemis."
 shock7: "Généraux de Choc"
 shock7_desc: "Notre priorité dans la formation des généraux est l'enseignement du combat rapproché."
 fire0: "§R***§W Idées de Feu §R***§W"
 fire0_desc: "Notre armée se concentrera sur le combat à distance."
 fire1: "Salves Concentrées"
 fire1_desc: "La fureur d'un ennemi qui charge peut être maîtrisée par un feu de suppression."
 fire2: "Canons de Siège"
 fire2_desc: "Nos canons sont polyvalents, qu'il s'agisse de sièges ou de batailles."
 fire3: "Rechargement Rapide"
 fire3_desc: "Entraînement, entraînement, entraînement. Nos équipes de canonniers seront meilleures que celles de nos rivaux."
 fire4: "Attendre la Dernière Seconde"
 fire4_desc: "Nos hommes retiendront leur feu jusqu'au tout dernier moment pour infliger un maximum de dégâts à l'ennemi."
 fire5: "Feu Défensif"
 fire5_desc: "Nos forteresses sont bien équipées pour un feu défensif durable."
 fire6: "Appui-Feu Concentré"
 fire6_desc: "Grâce à un appui-feu concentré, nous pourrons soutenir encore mieux nos régiments de première ligne."
 fire7: "Généraux de Tir"
 fire7_desc: "La formation de nos généraux sera axée sur le combat à distance."
 zentra0: "§G***§W Idées Centralistes §G***§W"
 zentra0_desc: "Notre État est gouverné de manière centralisée."

 zentra4: "Intégration Accrue"
 zentra4_desc: "Pour bâtir une nation prospère, nous devons restreindre l'autonomie de nos sujets."
 zentra5: "Administration Fiscale Centrale"
 zentra5_desc: "La fondation d'un système fiscal centralisé rendra notre perception des impôts moins vulnérable à la corruption et à la fraude."
 zentra7: "Gouvernement Méritocratique"
 zentra7_desc: "Un système méritocratique augmentera l'efficacité de la gouvernance de notre État."
 dezentra0: "§G***§W Idées de Décentralisation §G***§W"
 dezentra0_desc: "Notre État est gouverné de manière décentralisée."
 dezentra2: "Administration Décentralisée"
 dezentra2_desc: "En raison de l'étendue de notre territoire, nous devons travailler de manière décentralisée pour gouverner."
 dezentra3: "Autonomie Renforcée"
 dezentra3_desc: "Nous devrions reconnaître la force des autorités locales et les mettre à profit."
 dezentra4: "Centres Culturels"
 dezentra4_desc: "Nous ne nous concentrerons pas sur un seul centre culturel, mais sur plusieurs."
 dezentra6: "Croissance Démographique Modérée"
 dezentra6_desc: "Nous n'atteindrons pas une forte croissance démographique dans certaines régions, mais cette croissance sera plus saine."
 dezentra7: "Commerce Local"
 dezentra7_desc: "Parfois, le commerce local dans une province peut être très profitable en soi. Nous nous en souviendrons."
 horde0: "Idées de Horde"
 horde0_desc: "Nous sommes une horde !"
 horde1: "Bandes de Pillards"
 horde1_desc: "Il est de notoriété publique que nous vivons pour raser les terres que nous conquérons."
 horde2: "Élevage de Chevaux"
 horde2_desc: "Nous excellons dans l'élevage de nos chevaux."
 horde3: "Mémoire Ancestrale"
 horde3_desc: "Nous nous souviendrons toujours de nos grandes victoires et défaites du passé."
 horde4: "Tradition Guerrière"
 horde4_desc: "Nous sommes habitués à nous battre pour ce qui nous appartient."
 horde5: "Assemblées de Clans"
 horde5_desc: "Les assemblées de clans sont très importantes pour maintenir tout le monde satisfait et discipliné."
 horde6: "Territoire de la Horde"
 horde6_desc: "Ce n'est pas parce que nous sommes nomades que nous ne pouvons pas gouverner un vaste royaume comme Gengis Khan l'a fait jadis. \nRéduction du malus de développement pour les provinces légitimées : §G-50 %§W"
 horde7: "États Tributaires"
 horde7_desc: "Nos États tributaires nous paieront quand nous l'exigerons."
 foreign_embassies: "Ambassades Étrangères"
 foreign_embassies_desc: "La diplomatie est un art délicat consistant à équilibrer plusieurs parties simultanément. Si nous entretenons des ambassades dans d'autres pays qui nous rendent compte régulièrement, nous disposerons des informations nécessaires pour peser nos options."
 diplomatic_corps_2: "Guerres de Succession"
 diplomatic_corps_2_desc: "Notre pays est habitué aux guerres de succession. Nous sommes toujours prêts à faire valoir les prétentions de notre famille."
 tolerance_idea_2: "Tolérance"
 tolerance_idea_2_desc: "Adopter une attitude plus tolérante envers les religions minoritaires de notre pays augmentera considérablement notre unité religieuse."
 cultural_ties_2: "Liens Culturels"
 cultural_ties_2_desc: "Différentes cultures ont différentes coutumes et, pour quelque raison, tendent à résister aux tentatives venues d'en haut de modifier lesdites coutumes. Nous pouvons transformer cette faiblesse en force en intégrant les dirigeants locaux dans notre système de gouvernement et en leur faisant appliquer notre volonté d'une manière qui leur soit acceptable."
 merchant_marine_2: "Marine Marchande"
 merchant_marine_2_desc: "Que chaque navire marchand arbore fièrement notre pavillon de commerce et sache que notre marine sera toujours là pour le protéger si nécessaire."
 grand_navy_2: "Grande Marine"
 grand_navy_2_desc: "Nous permet de créer l'une des flottes les plus grandes et les plus puissantes que le monde ait jamais connues."

 spion5: "Manipulation des Guerres"
 spion5_desc: "Il est rare qu'une guerre soit menée autour d'un conflit « juste » entre le bien et le mal. Cependant, quelques paroles miellées et un porte-parole compétent peuvent présenter les guerres sous un jour qui nous soit favorable."
 expan2: "Guerres d'Outre-Mer"
 expan2_desc: "Si nous voulons bâtir un vaste empire colonial, nous devons neutraliser les puissances rivales, tant mondiales que locales."
 expan5: "Intégration de Masse"
 expan5_desc: "Lorsque nous intégrons de vastes territoires dans notre royaume, nous devons veiller à ne pas épuiser trop de ressources gouvernementales."
 expan6: "Frères Coloniaux"
 expan6_desc: "Si nous voulons maintenir notre emprise sur nos colonies densément peuplées, nous devons les assimiler au point qu'elles deviennent des provinces d'État."
 expan7: "Répression Coloniale"
 expan7_desc: "L'expérience nous a appris à gérer les révoltes croissantes. Notre expertise est telle que nous pouvons réprimer ces rébellions avec des ressources limitées."
 dynasty0: "Idées Dynastiques"
 dynasty0_bonus: "Dynastie Accomplie"
 dynastie4: "Attaque Surprise"
 dynastie4_desc: "Notre jeu diplomatique est d'un tel niveau que nos ennemis ne s'attendent pas à notre attaque, même s'ils savent qu'elle viendra. Cela nous donnera un avantage précoce."
 aristo0: "Idées Théocratiques"
 aristo0_bonus: "Théocratie Accomplie"
 aristo1: "Célébrer leurs Chutes"
 aristo1_desc: "Nos fêtes religieuses maintiendront toujours notre moral à un niveau élevé."
 aristo2: "Assaut Divin"
 aristo2_desc: "Avec le droit divin de notre côté, nous ne pouvons pas perdre."
 aristo3: "Suprématie Religieuse"
 aristo3_desc: "Nous prouverons la suprématie de notre religion. Nous aurons plus de facilité à convertir les autres, car ils devront accepter notre supériorité."
 aristo6: "Guerre Sainte"
 aristo6_desc: "Dans une guerre sainte, nous n'avons pas à être modestes dans nos exigences."
 aristo7: "Justification Divine"
 aristo7_desc: "Nous pouvons justifier même les revendications les plus ridicules par notre religion."
 konigreich0: "Ambition Impériale"
 konigreich0_desc: "Notre pays aspire à devenir un empire."
 konigreich1: "Fête des Moissons"
 konigreich1_desc: "Lors de notre fête annuelle des moissons, nous pouvons montrer au peuple notre gratitude et notre bonté. Nous nourrirons les pauvres et montrerons notre générosité. \n§GDécision§W pour gagner du prestige en investissant des points de monarque."
 konigreich2: "Terres de la Couronne"
 konigreich2_desc: "Les terres de la Couronne sont essentielles à notre règne. Nous devons veiller à ce que les terres que nous contrôlons directement soient aussi prospères que possible et puissent maintenir une force capable de tenir nos vassaux en respect."
 konigreich3: "Centre du Pouvoir"
 konigreich3_desc: "La capitale doit être la cité la plus attrayante du royaume, non seulement parce que le gouvernement y réside, mais parce qu'elle reflétera la richesse de notre nation."
 konigreich4: "Décret Royal"
 konigreich4_desc: "En promulguant des décrets royaux, nous pouvons nous assurer que le royaume aura autant d'innovation que nous le souhaitons. Le peuple, loyal à la Couronne, nous suivra dans nos voies."
 konigreich5: "Marine Royale"
 konigreich5_desc: "La marine de notre nation doit être représentative de notre grandeur et de notre gloire."
 konigreich6: "Armurerie Royale"
 konigreich6_desc: "L'armurerie royale est si vaste que nous pouvons renforcer nos troupes avec ses armes chaque fois que nécessaire."
 konigreich7: "Acquisition de Nouveaux Vassaux"
 konigreich7_desc: "De par notre rang royal, nous sommes aptes à régner sur les duchés qui nous sont inférieurs par la volonté divine. \n§GCasus Belli§W pour vassaliser vos voisins de moins de 150 de développement"
 maritim1: "Nation de Navigateurs"
 maritim1_desc: "Nous sommes un pays de navigateurs, intrépides sur les océans, avides de découvrir de nouvelles terres."
 maritim2: "Guerre Commerciale"
 maritim2_desc: "En tant que pays impliqué dans plusieurs guerres commerciales, nous savons comment affamer un fort depuis la mer."
 maritim3: "Grande Marine"
 maritim3_desc: "Nous permet de créer l'une des flottes les plus grandes et les plus puissantes que le monde ait jamais connues."
 maritim4: "Essor du Commerce Naval"
 maritim4_desc: "Grâce à notre immense flotte marchande, nous n'avons aucune difficulté à recruter de nouveaux marins."
 maritim5: "Abondance d'Amiraux"
 maritim5_desc: "Avec tant de capitaines compétents dans notre flotte, il ne sera assurément pas difficile de trouver un amiral capable."
 maritim6: "Maîtres Charpentiers"
 maritim6_desc: "Nos charpentiers navals peuvent accomplir en moitié moins de temps des travaux qui prennent des mois à d'autres."
 maritim7: "Combats d'Abordage"
 maritim7_desc: "Nos marins sont habitués à aborder les navires ennemis. Cela les rend également fort capables sur la terre ferme."
